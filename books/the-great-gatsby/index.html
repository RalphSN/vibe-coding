<!doctype html>
<html lang="zh-Hant-TW" data-book-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大亨小傳 The Great Gatsby</title>
<meta name="description" content="翻頁閱讀《大亨小傳》（The Great Gatsby）英文原文全文，F. Scott Fitzgerald 1925 年初版，Standard Ebooks 校訂本。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<script>
  /* 在第一次繪製前套用主題，避免深色模式閃白（和書櫃首頁共用同一個 key） */
  try {
    const savedTheme = window.localStorage.getItem('vibe-coding-home.theme.v1');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  } catch (err) {
    console.warn('無法讀取主題偏好，改用系統設定：', err);
  }
</script>
<link rel="stylesheet" href="../reader/reader.css">
</head>
<body style="--accent:#1d2c4c">

<header class="nav">
  <button class="icon-btn" id="menu-btn" type="button" aria-label="目錄與設定" aria-controls="drawer" aria-expanded="false">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <a class="icon-btn" href="../../index.html" aria-label="回書櫃">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.2 10 3.5l7 5.7M5 8v8.5h10V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <h1 class="nav-title"><strong>The Great Gatsby</strong><span id="nav-chapter"></span></h1>
  <div class="nav-tools">
    <div class="segmented font-size" role="group" aria-label="字級">
      <button type="button" data-font-step="-1" aria-label="字級縮小">小</button>
      <button type="button" data-font-step="1" aria-label="字級放大">大</button>
    </div>
    <div class="segmented" role="group" aria-label="配色">
      <button type="button" data-theme-choice="auto">自動</button>
      <button type="button" data-theme-choice="light">淺色</button>
      <button type="button" data-theme-choice="dark">深色</button>
    </div>
  </div>
</header>

<main class="stage" id="stage" aria-label="書頁">
  <div class="book" id="book" aria-hidden="true">
    <div class="page left" id="page-left"></div>
    <div class="page right" id="page-right"></div>
    <div class="leaf" id="leaf" hidden>
      <div class="page front"></div>
      <div class="page back"></div>
    </div>
    <div class="cover" id="cover" hidden>
      <div class="cover-front cloth">
        <div class="title-slip"><span>The Great Gatsby</span></div>
        <div class="cover-meta"><b>F. Scott Fitzgerald</b><span>1925</span></div>
      </div>
      <div class="cover-inside cloth"><div class="page"></div></div>
    </div>
    <div class="page measure" id="measure" style="visibility:hidden;left:0"><div class="page-inner"><div class="window"><div class="flow"></div></div></div></div>
  </div>
  <span class="stage-hint" id="stage-hint" hidden>點一下直接翻開</span>
</main>

<nav class="bar" aria-label="翻頁">
  <button class="icon-btn" id="first-btn" type="button" aria-label="回到最前頁" title="回到最前頁">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4.5v11M14.5 4.5 9 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="icon-btn" id="prev-btn" type="button" aria-label="上一頁">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <input type="range" id="page-range" min="1" max="1" value="1" aria-label="本回頁碼">
  <span class="status" id="status"></span>
  <button class="icon-btn" id="next-btn" type="button" aria-label="下一頁">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="icon-btn" id="resume-btn" type="button" aria-label="回到閱讀進度" title="回到閱讀進度">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5h8v13l-4-3-4 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="目錄與設定" aria-hidden="true" tabindex="-1">
  <div class="drawer-head">
    <div><h2>The Great Gatsby</h2><p>大亨小傳 · F. Scott Fitzgerald 著</p></div>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="關閉目錄">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-settings">
    <label>字級
      <span class="segmented font-size" role="group" aria-label="字級">
        <button type="button" data-font-step="-1" aria-label="字級縮小">小</button>
        <button type="button" data-font-step="1" aria-label="字級放大">大</button>
      </span>
    </label>
    <label>配色
      <span class="segmented" role="group" aria-label="配色">
        <button type="button" data-theme-choice="auto">自動</button>
        <button type="button" data-theme-choice="light">淺色</button>
        <button type="button" data-theme-choice="dark">深色</button>
      </span>
    </label>
  </div>
  <div class="progress-line"><span id="progress-text"></span><div class="meter"><span id="progress-meter"></span></div></div>
  <ol class="toc" id="toc" aria-label="回目"></ol>
</aside>

<p class="sr-only" id="live" aria-live="polite"></p>
<article class="sr-only" id="sr-text"></article>

<script>
  window.BOOK = {
    id: 'the-great-gatsby',
    lang: 'en',
    unit: '章',
    title: 'The Great Gatsby',
    authorLines: ['F. Scott Fitzgerald'],
    edition: '1925 年出版的英文原文，九章全文。採用 Standard Ebooks 校訂本，底本是 Faded Page 的電子文本（2018）與 Internet Archive 的掃描本；用字以這個校訂本為準，例如 neighbour 這類英式拼法。',
    source: { url: 'https://standardebooks.org/ebooks/f-scott-fitzgerald/the-great-gatsby', label: 'Standard Ebooks《The Great Gatsby》' },
    license: '原文已進入公有領域；Standard Ebooks 的校訂與排版以 CC0 釋出。',
    chapterCount: 9,
    textPath: 'text/',
    progressKey: 'the-great-gatsby.v1',
    stateKey: 'the-great-gatsby-reader.v1',
  };
</script>
<script src="../reader/reader.js"></script>
<script src="toc.js"></script>
</body>
</html>
