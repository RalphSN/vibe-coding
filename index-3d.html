/* ---------- 動畫時間軸：只在有東西在動時跑 requestAnimationFrame ---------- */
function cubicBezier(x1, y1, x2, y2) {
  const sample = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t;
  const slope = (a, b, t) => 3 * a * (1 - t) * (1 - t) + 6 * (b - a) * (1 - t) * t + 3 * (1 - b) * t * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i += 1) {
      const err = sample(x1, x2, t) - x;
      if (Math.abs(err) < 1e-6) break;
      const d = slope(x1, x2, t);
      if (Math.abs(d) < 1e-6) break;
      t -= err / d;
    }
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 20 && Math.abs(sample(x1, x2, t) - x) > 1e-6; i += 1) {
      t = (lo + hi) / 2;
      if (sample(x1, x2, t) < x) lo = t; else hi = t;
    }
    return sample(y1, y2, t);
  };
}
const EASE_OUT = cubicBezier(0.16, 1, 0.3, 1);
const EASE_IN_OUT = cubicBezier(0.45, 0, 0.2, 1);
const LINEAR = (t) => t;

const tweens = new Set();
const frameHooks = new Set(); // 每格都要跑、回傳 true 代表還在動
let rafId = 0;
let lastFrame = 0;

/** 跑一段動畫，update(eased, raw) 每格呼叫；回傳完成的 Promise */
function tween({ duration, delay = 0, easing = LINEAR, update }) {
  return new Promise((resolve) => {
    const start = performance.now() + delay / RATE;
    const item = { start, duration: Math.max(1, duration / RATE), easing, update, resolve };
    update(easing(0), 0);
    tweens.add(item);
    kick();
  });
}

function kick() {
  if (!rafId) rafId = requestAnimationFrame(frame);
}

function frame(now) {
  rafId = 0;
  const dt = Math.min(64, now - (lastFrame || now));
  lastFrame = now;
  let active = false;
  tweens.forEach((item) => {
    const raw = Math.min(1, Math.max(0, (now - item.start) / item.duration));
    item.update(item.easing(raw), raw);
    if (raw >= 1) {
      tweens.delete(item);
      item.resolve();
    } else {
      active = true;
    }
  });
  frameHooks.forEach((hook) => { if (hook(dt)) active = true; });
  if (shelf) shelf.render();
  if (stage) stage.render();
  if (active) kick();
  else lastFrame = 0;
}

const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 材質貼圖：全部用 canvas 畫，書背與封面的燙金另外畫一張金屬度遮罩 ---------- */
let THREE;
let RoomEnvironment;
let RoundedBoxGeometry;
let RectAreaLightUniformsLib;
const iconImages = {};

function svgImage(svg, color) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('圖示載入失敗'));
    const markup = svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" ').replace(/currentColor/g, color);
    img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(markup)}`;
  });
}

async function loadIcons() {
  await Promise.all(Object.entries(ICONS).map(async ([key, svg]) => {
    iconImages[key] = { foil: await svgImage(svg, FOIL), mask: await svgImage(svg, '#ffffff') };
  }));
}

function makeCanvas(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(2, Math.round(width));
  canvas.height = Math.max(2, Math.round(height));
  return canvas;
}

function canvasTexture(canvas, { srgb = true, repeat = false } = {}) {
  const texture = new THREE.CanvasTexture(canvas);
  if (srgb) texture.colorSpace = THREE.SRGBColorSpace;
  if (repeat) texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = maxAnisotropy;
  texture.needsUpdate = true;
  return texture;
}

/* 布紋：水平白 4.5%、垂直黑 6%，1px 線、3px 間距（單位是畫面 px，k 是貼圖解析度倍率） */
function paintLinen(ctx, width, height, k) {
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.045)';
  for (let y = 0; y < height; y += 3 * k) ctx.fillRect(0, y, width, k);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  for (let x = 0; x < width; x += 3 * k) ctx.fillRect(x, 0, k, height);
  // 一點點不規則的纖維，近看才不會像網格
  for (let i = 0; i < (width * height) / (90 * k * k); i += 1) {
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255, 255, 255, 0.035)' : 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(Math.random() * width, Math.random() * height, (2 + Math.random() * 6) * k, k * 0.6);
  }
  ctx.restore();
}

function clothCanvas(color) {
  const k = 4;
  const canvas = makeCanvas(96 * k, 96 * k);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  paintLinen(ctx, canvas.width, canvas.height, k);
  return canvas;
}

function linenBumpCanvas() {
  const k = 4;
  const canvas = makeCanvas(96 * k, 96 * k);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#a8a8a8';
  for (let y = 0; y < canvas.height; y += 3 * k) ctx.fillRect(0, y, canvas.width, k);
  ctx.fillStyle = 'rgba(40, 40, 40, 0.5)';
  for (let x = 0; x < canvas.width; x += 3 * k) ctx.fillRect(x, 0, k, canvas.height);
  return canvas;
}

/* 燙金與金屬度遮罩：G 是粗糙度、B 是金屬度（three.js 的 roughnessMap / metalnessMap） */
const MASK_BASE = 'rgb(0, 225, 0)';
const MASK_FOIL = 'rgb(0, 110, 0)'; // 燙金：粗糙度低一點但不是金屬，顏色維持 #efe2bf
/* 凹凸貼圖：灰 50% 是書布平面，燙金是壓下去的（較暗），壓條是凸起的 */
const BUMP_BASE = '#808080';
const BUMP_DEBOSS = '#4a4a4a';

function isUpright(ch) {
  return /[×⺀-鿿豈-﫿＀-￯　-〿]/.test(ch);
}

/** 直排書名拆段：中日文字直立，英數連成一段轉 90° */
function verticalRuns(text) {
  const runs = [];
  for (const ch of text) {
    const upright = isUpright(ch);
    const last = runs[runs.length - 1];
    if (!upright && last && !last.upright) last.text += ch;
    else runs.push({ upright, text: ch });
  }
  return runs;
}

/** 直排書名的總長（px），字距 0.14em，和 CSS letter-spacing 一樣每個字後面都加 */
function verticalLength(ctx, text, size) {
  ctx.font = `600 ${size}px ${FONT}`;
  const spacing = size * 0.14;
  return verticalRuns(text).reduce((sum, run) => {
    if (run.upright) return sum + [...run.text].length * (size + spacing);
    return sum + [...run.text].reduce((s, ch) => s + ctx.measureText(ch).width + spacing, 0);
  }, 0);
}

function drawVertical(ctx, text, cx, top, size) {
  ctx.font = `600 ${size}px ${FONT}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  const spacing = size * 0.14;
  let y = top;
  verticalRuns(text).forEach((run) => {
    if (run.upright) {
      [...run.text].forEach((ch) => {
        ctx.fillText(ch, cx, y + size / 2);
        y += size + spacing;
      });
      return;
    }
    [...run.text].forEach((ch) => {
      const w = ctx.measureText(ch).width;
      ctx.save();
      ctx.translate(cx, y + w / 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
      y += w + spacing;
    });
  });
}

/** 書名放不下標籤時等比縮小字級，下限 11px（和 2D 版的 fitSpineTitles 一樣） */
function fitSpineTitle(text, available) {
  const ctx = makeCanvas(2, 2).getContext('2d');
  const length = verticalLength(ctx, text, SPINE_TITLE_PX);
  if (length <= available) return SPINE_TITLE_PX;
  return Math.max(SPINE_TITLE_MIN_PX, Math.floor(SPINE_TITLE_PX * (available / length) * 10) / 10);
}

/* 書背的版面（畫面 px），和 2D 版 .spine 的 grid 一樣：壓條／圖示／書名標籤／底部數字／壓條 */
function spineLayout(w, h) {
  return { bandTop: 8, icon: 27, labelTop: 59, labelBottom: h - 55, foot: h - 36, bandBottom: h - 17 };
}

/** 畫書背。mask=true 時畫金屬度遮罩，只畫燙金的部分 */
function paintSpine(ctx, site, w, h, k, titleSize, mode) {
  const { done } = siteStats(site);
  const L = spineLayout(w, h);
  const mask = mode !== 'color';
  const bump = mode === 'bump';
  const line = bump ? BUMP_DEBOSS : MASK_FOIL;
  const foil = mode === 'mask' ? MASK_FOIL : bump ? BUMP_DEBOSS : FOIL;
  ctx.save();
  ctx.scale(k, k);
  if (mask) {
    ctx.fillStyle = bump ? BUMP_BASE : MASK_BASE;
    ctx.fillRect(0, 0, w, h);
    if (bump) paintLinen(ctx, w, h, 1);
  } else {
    ctx.fillStyle = site.color;
    ctx.fillRect(0, 0, w, h);
    paintLinen(ctx, w, h, 1);
    // 書脊本身是圓弧幾何，光影由 3D 算；這裡只補兩側與書板相接處的磨損暗邊
    const arc = ctx.createLinearGradient(0, 0, w, 0);
    [[0, 'rgba(0,0,0,0.3)'], [0.05, 'rgba(0,0,0,0.06)'], [0.2, 'rgba(255,255,255,0.05)'], [0.8, 'rgba(0,0,0,0)'], [0.95, 'rgba(0,0,0,0.08)'], [1, 'rgba(0,0,0,0.3)']]
      .forEach(([o, c]) => arc.addColorStop(o, c));
    ctx.fillStyle = arc;
    ctx.fillRect(0, 0, w, h);
  }

  // 壓條：凸起的橫紋加兩道燙金細線
  [L.bandTop, L.bandBottom].forEach((y) => {
    if (!mask) {
      const band = ctx.createLinearGradient(0, y, 0, y + 9);
      band.addColorStop(0, 'rgba(0,0,0,0.28)');
      band.addColorStop(0.45, 'rgba(255,255,255,0.16)');
      band.addColorStop(1, 'rgba(0,0,0,0.3)');
      ctx.fillStyle = band;
      ctx.fillRect(0, y, w, 9);
    }
    if (bump) {
      // 壓條是凸起的：中間亮、兩側暗
      const ridge = ctx.createLinearGradient(0, y, 0, y + 9);
      ridge.addColorStop(0, '#707070');
      ridge.addColorStop(0.5, '#c8c8c8');
      ridge.addColorStop(1, '#707070');
      ctx.fillStyle = ridge;
      ctx.fillRect(0, y, w, 9);
    }
    ctx.fillStyle = mask ? line : 'rgba(239, 226, 191, 0.55)';
    ctx.fillRect(0, y, w, 1);
    ctx.fillRect(0, y + 8, w, 1);
  });

  // 圖示
  const icon = iconImages[site.icon];
  if (icon) {
    if (!mask) {
      ctx.globalAlpha = 0.45;
      ctx.filter = 'brightness(0)';
      ctx.drawImage(icon.foil, w / 2 - 11, L.icon - 1, 22, 22);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
    }
    if (bump) ctx.filter = 'brightness(0.35)';
    ctx.drawImage(mask ? icon.mask : icon.foil, w / 2 - 11, L.icon, 22, 22);
    ctx.filter = 'none';
  }

  // 書名標籤：深色皮標＋燙金細框
  const labelW = Math.ceil(titleSize * 1.2) + 8;
  const lx = Math.round(w / 2 - labelW / 2);
  const labelH = L.labelBottom - L.labelTop;
  if (!mask) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.26)';
    ctx.fillRect(lx, L.labelTop, labelW, labelH);
    const inner = ctx.createLinearGradient(0, L.labelTop, 0, L.labelTop + 4);
    inner.addColorStop(0, 'rgba(0,0,0,0.4)');
    inner.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = inner;
    ctx.fillRect(lx, L.labelTop, labelW, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(lx, L.labelBottom, labelW, 1);
  }
  if (bump) {
    ctx.fillStyle = '#727272'; // 皮標比書布低一點
    ctx.fillRect(lx, L.labelTop, labelW, labelH);
  }
  ctx.strokeStyle = mask ? line : 'rgba(239, 226, 191, 0.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(lx + 0.5, L.labelTop + 0.5, labelW - 1, labelH - 1);

  // 書名：浮雕陰影＋燙金
  ctx.save();
  ctx.beginPath();
  ctx.rect(lx, L.labelTop, labelW, labelH);
  ctx.clip();
  const titleTop = L.labelTop + 10;
  if (!mask) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    drawVertical(ctx, siteText(site).spineTitle, w / 2, titleTop - 1, titleSize);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    drawVertical(ctx, siteText(site).spineTitle, w / 2, titleTop + 1, titleSize);
  }
  ctx.fillStyle = foil;
  drawVertical(ctx, siteText(site).spineTitle, w / 2, titleTop, titleSize);
  ctx.restore();

  // 底部數字
  // 完成與製作中統一格式：可讀單元／總單元
  const foot = `${site.readyLessons}/${site.lessons}`;
  ctx.font = `400 11px ${MONO}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (!mask) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(foot, w / 2, L.foot - 1);
  }
  ctx.fillStyle = foil;
  ctx.fillText(foot, w / 2, L.foot);

  // 閱讀進度：右側一條燙金細線，從下往上
  const trackTop = 26;
  const trackH = h - 52;
  if (!mask) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w - 8, trackTop, 2, trackH);
  }
  const fill = trackH * (done / site.lessons);
  if (fill > 0) {
    ctx.fillStyle = foil;
    ctx.fillRect(w - 8, trackTop + trackH - fill, 2, fill);
  }
  ctx.restore();
}

function spineTextures(site, w, h) {
  const k = Math.min(4, 2048 / h);
  const L = spineLayout(w, h);
  const titleSize = fitSpineTitle(siteText(site).spineTitle, L.labelBottom - L.labelTop - 20);
  const color = makeCanvas(w * k, h * k);
  const mask = makeCanvas(w * k, h * k);
  const bump = makeCanvas(w * k, h * k);
  paintSpine(color.getContext('2d'), site, w, h, k, titleSize, 'color');
  paintSpine(mask.getContext('2d'), site, w, h, k, titleSize, 'mask');
  paintSpine(bump.getContext('2d'), site, w, h, k, titleSize, 'bump');
  return { map: canvasTexture(color), orm: canvasTexture(mask, { srgb: false }), bump: canvasTexture(bump, { srgb: false }), titleSize };
}

/* 封面、扉頁、內頁都在 300×400 的「設計尺寸」上排版，再依實際比例縮放 */
const PAGE_RES = 1024;

function wrapPhrases(ctx, phrases, maxWidth) {
  const lines = [];
  let line = '';
  phrases.forEach((phrase) => {
    const next = line ? `${line} ${phrase}` : phrase;
    if (line && ctx.measureText(next).width > maxWidth) {
      lines.push(line);
      line = phrase;
    } else {
      line = next;
    }
  });
  if (line) lines.push(line);
  return lines;
}

/** 中文可以在任何字之間換行，英文單字不拆 */
function wrapText(ctx, text, maxWidth) {
  const tokens = text.match(/[A-Za-z0-9.\-]+|\s+|./gu) || [];
  const lines = [];
  let line = '';
  tokens.forEach((token) => {
    const next = line + token;
    if (line && ctx.measureText(next).width > maxWidth && !/^\s+$/.test(token)) {
      // 標點不放行首，掛在上一行行尾
      if (/^[，。、：；）」]$/.test(token)) {
        lines.push(next);
        line = '';
      } else {
        lines.push(line.trimEnd());
        line = token;
      }
    } else {
      line = next;
    }
  });
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function paintCloth(ctx, color, width, height, k) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, width, height);
  paintLinen(ctx, width, height, k);
  // 斜向的柔和高光
  const sheen = ctx.createLinearGradient(0, 0, width, height);
  sheen.addColorStop(0, 'rgba(255,255,255,0.1)');
  sheen.addColorStop(0.45, 'rgba(255,255,255,0)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.16)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0, 0, width, height);
}

function paintPaper(ctx, x, y, width, height) {
  // 微黃的舊紙：中間亮、四周略深，像存放多年的書頁
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, width, height);
  const vignette = ctx.createRadialGradient(x + width / 2, y + height * 0.45, Math.min(width, height) * 0.25, x + width / 2, y + height / 2, Math.max(width, height) * 0.75);
  vignette.addColorStop(0, 'rgba(255, 250, 238, 0.35)');
  vignette.addColorStop(1, 'rgba(150, 115, 60, 0.16)');
  ctx.fillStyle = vignette;
  ctx.fillRect(x, y, width, height);
  // 紙纖維與零星的斑點；固定亂數種子，重畫（例如讀取條）時紋路不會每格跳動
  let seed = 12345;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < (width * height) / 1200; i += 1) {
    ctx.fillStyle = rand() < 0.55 ? 'rgba(120, 95, 50, 0.04)' : 'rgba(255, 252, 240, 0.3)';
    ctx.fillRect(x + rand() * width, y + rand() * height, 1 + rand() * 4, 1);
  }
  for (let i = 0; i < (width * height) / 90000; i += 1) {
    ctx.fillStyle = `rgba(150, 105, 50, ${0.04 + rand() * 0.05})`;
    ctx.beginPath();
    ctx.arc(x + rand() * width, y + rand() * height, 1 + rand() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function toRoman(n) {
  const table = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  let out = '';
  table.forEach(([v, s]) => { while (n >= v) { out += s; n -= v; } });
  return out;
}

/** 古典分隔飾：兩側細線、中間菱形與小圓點 */
function drawOrnament(ctx, cx, cy, width, u, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 0.7 * u;
  const gap = 9 * u;
  ctx.beginPath();
  ctx.moveTo(cx - width / 2, cy); ctx.lineTo(cx - gap, cy);
  ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + width / 2, cy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy - 4 * u); ctx.lineTo(cx + 4 * u, cy); ctx.lineTo(cx, cy + 4 * u); ctx.lineTo(cx - 4 * u, cy);
  ctx.closePath();
  ctx.fill();
  [-1, 1].forEach((side) => {
    ctx.beginPath();
    ctx.arc(cx + side * 6.5 * u, cy, 1.1 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + side * width / 2, cy, 1.3 * u, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

/** 字距（canvas 的 letterSpacing 不是每個瀏覽器都有，自己排） */
function fillSpaced(ctx, text, x, y, spacing, align = 'center') {
  const chars = [...text];
  const widths = chars.map((ch) => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const saved = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach((ch, i) => { ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
  ctx.textAlign = saved;
}

/** 封面內側：書布底＋內縮的蝴蝶頁（書脊在右邊），蝴蝶頁印古典的四瓣花格紋 */
function paintCoverInside(canvas, site, rim) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const u = W / 300;
  paintCloth(ctx, site.color, W, H, u);
  const x = rim;
  const y = rim;
  const pw = W - rim;
  const ph = H - rim * 2;
  ctx.fillStyle = PAPER_2;
  ctx.fillRect(x, y, pw, ph);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, pw, ph);
  ctx.clip();
  const step = 22 * u;
  ctx.fillStyle = hexAlpha(site.color, 0.2);
  ctx.strokeStyle = hexAlpha(site.color, 0.14);
  ctx.lineWidth = 0.6 * u;
  for (let row = 0, dy = y; dy < y + ph + step; dy += step, row += 1) {
    for (let dx = x + (row % 2 ? step / 2 : 0); dx < x + pw + step; dx += step) {
      // 四瓣花
      for (let k = 0; k < 4; k += 1) {
        const a = (Math.PI / 2) * k;
        ctx.beginPath();
        ctx.ellipse(dx + Math.cos(a) * 2.6 * u, dy + Math.sin(a) * 2.6 * u, 2.4 * u, 1.3 * u, a, 0, Math.PI * 2);
        ctx.fill();
      }
      // 花與花之間的菱形格線
      ctx.beginPath();
      ctx.moveTo(dx + step / 2, dy); ctx.lineTo(dx, dy + step / 2);
      ctx.stroke();
    }
  }
  ctx.restore();
  paintGutter(ctx, x, y, pw, ph, 'right', u);
}

function hexAlpha(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

/** 扉頁正面：古典書名頁，雙線框、書名、花飾與出版年 */
function paintLeafFront(canvas, site) {
  const text = siteText(site);
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const u = W / 290;
  paintPaper(ctx, 0, 0, W, H);
  paintGutter(ctx, 0, 0, W, H, 'left', u);
  const m = 22 * u;
  ctx.strokeStyle = 'rgba(42, 33, 24, 0.55)';
  ctx.lineWidth = 1.1 * u;
  ctx.strokeRect(m, m, W - m * 2, H - m * 2);
  ctx.lineWidth = 0.5 * u;
  ctx.strokeRect(m + 4 * u, m + 4 * u, W - m * 2 - 8 * u, H - m * 2 - 8 * u);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = INK_2;
  ctx.font = `400 ${9 * u}px ${SERIF}`;
  fillSpaced(ctx, t('brand'), W / 2, m + 34 * u, 6 * u);
  drawOrnament(ctx, W / 2, m + 48 * u, 60 * u, u, 'rgba(42, 33, 24, 0.45)');

  ctx.fillStyle = INK;
  ctx.font = `700 ${21 * u}px ${SERIF}`;
  const lines = wrapPhrases(ctx, text.titlePhrases, W - 80 * u);
  const lineH = 31 * u;
  const top = H * 0.42 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((line, i) => ctx.fillText(line, W / 2, top + i * lineH));
  drawOrnament(ctx, W / 2, top + lines.length * lineH - 4 * u, 120 * u, u, hexAlpha(site.color, 0.85));

  ctx.fillStyle = INK_2;
  ctx.font = `400 ${10 * u}px ${SERIF}`;
  fillSpaced(ctx, toRoman(Number(site.updated.slice(0, 4)) || 2026), W / 2, H - m - 46 * u, 4 * u);
  ctx.font = `400 ${9 * u}px ${SERIF}`;
  fillSpaced(ctx, t('imprint'), W / 2, H - m - 28 * u, 2 * u);
}

/** 扉頁背面（攤開後的左頁，書脊在右邊）：版權頁風格，加一枚朱色印章 */
function paintLeafBack(canvas, site) {
  const { done } = siteStats(site);
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const u = W / 290;
  paintPaper(ctx, 0, 0, W, H);
  paintGutter(ctx, 0, 0, W, H, 'right', u);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const cx = W / 2 - 6 * u;
  drawOrnament(ctx, cx, H * 0.62, 70 * u, u, 'rgba(42, 33, 24, 0.4)');
  ctx.fillStyle = INK_2;
  ctx.font = `400 ${10.5 * u}px ${SERIF}`;
  ctx.fillText(t('colophon', site.modules, site.lessons), cx, H * 0.62 + 24 * u);
  ctx.font = `400 ${9 * u}px ${SERIF}`;
  ctx.fillText(`© ${site.updated.slice(0, 4)} ${t('brand')}`, cx, H * 0.62 + 42 * u);

  // 印章：方形朱紅框，字壓在裡面，略微傾斜、邊緣不勻
  const stamp = t('stamp', done, site.lessons);
  ctx.font = `600 ${11 * u}px ${SERIF}`;
  const sw = ctx.measureText(stamp).width + 22 * u;
  const sh = 30 * u;
  ctx.save();
  ctx.translate(cx, H * 0.62 + 82 * u);
  ctx.rotate(-0.05);
  ctx.globalAlpha = 0.82;
  ctx.strokeStyle = '#a3322a';
  ctx.lineWidth = 2 * u;
  ctx.strokeRect(-sw / 2, -sh / 2, sw, sh);
  ctx.lineWidth = 0.7 * u;
  ctx.strokeRect(-sw / 2 + 3 * u, -sh / 2 + 3 * u, sw - 6 * u, sh - 6 * u);
  ctx.fillStyle = '#a3322a';
  ctx.textBaseline = 'middle';
  ctx.fillText(stamp, 0, 0.5 * u);
  // 印泥不勻：挖掉幾個小點
  ctx.globalCompositeOperation = 'destination-out';
  let seed = 7;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 40; i += 1) {
    ctx.beginPath();
    ctx.arc((rand() - 0.5) * sw, (rand() - 0.5) * sh, rand() * 1.2 * u, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/** 右頁：書眉、卷名、書名、首字放大的簡介、讀取條與頁碼（progress 0–1） */
function paintRightPage(canvas, site, progress) {
  const text = siteText(site);
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const u = W / 290;
  paintPaper(ctx, 0, 0, W, H);
  paintGutter(ctx, 0, 0, W, H, 'left', u);
  const pad = 30 * u;
  const cx = W / 2 + 4 * u;
  ctx.textBaseline = 'alphabetic';

  // 書眉＋細線
  ctx.fillStyle = INK_2;
  ctx.font = `400 ${8.5 * u}px ${SERIF}`;
  fillSpaced(ctx, t('runningHead'), cx, pad + 4 * u, 3 * u);
  ctx.fillStyle = 'rgba(42, 33, 24, 0.3)';
  ctx.fillRect(pad, pad + 11 * u, W - pad * 2, 0.6 * u);

  // 卷名與書名
  ctx.textAlign = 'center';
  ctx.fillStyle = hexAlpha(site.color, 0.9);
  ctx.font = `600 ${10 * u}px ${SERIF}`;
  fillSpaced(ctx, t('chapter'), cx, pad + 42 * u, 5 * u);
  ctx.fillStyle = INK;
  ctx.font = `700 ${18 * u}px ${SERIF}`;
  let y = pad + 70 * u;
  wrapPhrases(ctx, text.titlePhrases, W - pad * 2).forEach((line) => { ctx.fillText(line, cx, y); y += 26 * u; });
  drawOrnament(ctx, cx, y - 6 * u, 90 * u, u, 'rgba(42, 33, 24, 0.45)');
  y += 22 * u;

  // 簡介：首字放大（drop cap），前兩行讓出位置
  const bodySize = 11.5 * u;
  const lineH = bodySize * 1.85;
  const chars = [...text.desc];
  const first = chars[0];
  const rest = chars.slice(1).join('');
  ctx.font = `700 ${lineH * 1.75}px ${SERIF}`;
  const capW = ctx.measureText(first).width + 6 * u;
  ctx.textAlign = 'left';
  ctx.fillStyle = site.color;
  ctx.fillText(first, pad, y + lineH * 0.82);
  ctx.fillStyle = INK;
  ctx.font = `400 ${bodySize}px ${SERIF}`;
  const full = W - pad * 2;
  const lines = [];
  let remaining = rest;
  while (remaining.length && lines.length < 8) {
    const width = lines.length < 2 ? full - capW : full;
    const wrapped = wrapText(ctx, remaining, width);
    const line = wrapped[0] || '';
    lines.push({ line, indent: lines.length < 2 ? capW : 0 });
    remaining = remaining.slice(line.length).replace(/^\s+/, '');
    if (!line.length) break;
  }
  lines.forEach(({ line, indent }, i) => ctx.fillText(line, pad + indent, y + i * lineH));

  // 讀取條：兩端帶小圓點的細線
  ctx.textAlign = 'center';
  ctx.fillStyle = INK_2;
  ctx.font = `italic 400 ${10 * u}px ${SERIF}`;
  ctx.fillText(t('opening'), cx, H - pad - 34 * u);
  const barY = H - pad - 24 * u;
  ctx.fillStyle = 'rgba(42, 33, 24, 0.15)';
  ctx.fillRect(pad + 10 * u, barY, W - pad * 2 - 20 * u, 1.2 * u);
  if (progress > 0) {
    ctx.fillStyle = site.color;
    ctx.fillRect(pad + 10 * u, barY - 0.4 * u, (W - pad * 2 - 20 * u) * progress, 2 * u);
  }
  ctx.fillStyle = 'rgba(42, 33, 24, 0.4)';
  [pad + 6 * u, W - pad - 6 * u].forEach((bx) => { ctx.beginPath(); ctx.arc(bx, barY + 0.6 * u, 1.4 * u, 0, Math.PI * 2); ctx.fill(); });

  // 頁碼
  ctx.fillStyle = INK_2;
  ctx.font = `400 ${9 * u}px ${SERIF}`;
  ctx.fillText('— i —', cx, H - pad + 2 * u);
}


/** 書溝：靠書脊那側的內陰影。side 是書脊在哪一側 */
function paintGutter(ctx, x, y, width, height, side, u) {
  const size = 14 * u;
  const g = side === 'left'
    ? ctx.createLinearGradient(x, 0, x + size * 2, 0)
    : ctx.createLinearGradient(x + width, 0, x + width - size * 2, 0);
  g.addColorStop(0, 'rgba(60, 45, 20, 0.28)');
  g.addColorStop(0.35, 'rgba(60, 45, 20, 0.08)');
  g.addColorStop(1, 'rgba(60, 45, 20, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(side === 'left' ? x : x + width - size * 2, y, size * 2, height);
}

function pageCanvas(aspect) {
  return makeCanvas(PAGE_RES * aspect, PAGE_RES);
}

/** 封面正面。mode：color 顏色、mask 燙金金屬度遮罩、bump 凹凸（書槽與燙金壓痕） */
function paintCover(canvas, site, mode) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const u = W / 300; // 設計尺寸 300 寬
  const mask = mode !== 'color';
  const bump = mode === 'bump';
  const line = bump ? BUMP_DEBOSS : MASK_FOIL;
  const foil = mode === 'mask' ? MASK_FOIL : bump ? BUMP_DEBOSS : FOIL;
  if (mask) {
    ctx.fillStyle = bump ? BUMP_BASE : MASK_BASE;
    ctx.fillRect(0, 0, W, H);
    if (bump) {
      paintLinen(ctx, W, H, u);
      // 書槽（joint）：封面靠書脊處壓下去的一道溝，翻開時封面從這裡彎
      const groove = ctx.createLinearGradient(W * 0.035, 0, W * 0.075, 0);
      groove.addColorStop(0, BUMP_BASE);
      groove.addColorStop(0.35, '#2a2a2a');
      groove.addColorStop(0.65, '#3a3a3a');
      groove.addColorStop(1, BUMP_BASE);
      ctx.fillStyle = groove;
      ctx.fillRect(W * 0.035, 0, W * 0.04, H);
    }
  } else {
    paintCloth(ctx, site.color, W, H, u);
    // 靠書脊的折痕
    const crease = ctx.createLinearGradient(W * 0.05, 0, W * 0.075, 0);
    crease.addColorStop(0, 'rgba(0,0,0,0)');
    crease.addColorStop(0.45, 'rgba(0,0,0,0.3)');
    crease.addColorStop(0.55, 'rgba(255,255,255,0.12)');
    crease.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = crease;
    ctx.fillRect(W * 0.05, 0, W * 0.025, H);
  }
  // 燙金外框
  const inset = W * 0.05;
  ctx.strokeStyle = mask ? line : 'rgba(239, 226, 191, 0.55)';
  ctx.lineWidth = 1.2 * u;
  ctx.strokeRect(inset + W * 0.04, inset, W - inset * 2 - W * 0.04, H - inset * 2);
  ctx.lineWidth = 0.6 * u;
  ctx.strokeRect(inset + W * 0.04 + 4 * u, inset + 4 * u, W - inset * 2 - W * 0.04 - 8 * u, H - inset * 2 - 8 * u);

  const padX = inset + W * 0.04 + 18 * u;
  const icon = iconImages[site.icon];
  if (icon) {
    if (bump) ctx.filter = 'brightness(0.3)';
    ctx.drawImage(mask ? icon.mask : icon.foil, padX, inset + 18 * u, 30 * u, 30 * u);
    ctx.filter = 'none';
  }
  ctx.fillStyle = foil;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'right';
  ctx.font = `500 ${12 * u}px ${MONO}`;
  ctx.fillText(`${site.lessons} 單元`, W - inset - 18 * u, inset + 38 * u);

  // 書名：按詞組換行，靠左下
  const titleSize = 30 * u;
  ctx.font = `700 ${titleSize}px ${FONT}`;
  ctx.textAlign = 'left';
  const maxWidth = W - padX - inset - 18 * u;
  const lines = wrapPhrases(ctx, siteText(site).titlePhrases, maxWidth);
  const lineH = titleSize * 1.25;
  const bottom = H - inset - 46 * u;
  lines.forEach((line, i) => {
    const y = bottom - (lines.length - 1 - i) * lineH;
    if (!mask) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillText(line, padX, y - u);
    }
    ctx.fillStyle = foil;
    ctx.fillText(line, padX, y);
  });
  // 端點星 · 年月：不換行，放不下就縮小，下限 8px
  let small = 11 * u;
  const tag = `${t('brand')} · ${site.updated}`;
  ctx.font = `500 ${small}px ${MONO}`;
  while (ctx.measureText(tag).width > maxWidth && small > 8 * u) {
    small -= 0.5 * u;
    ctx.font = `500 ${small}px ${MONO}`;
  }
  ctx.fillStyle = mask ? line : 'rgba(239, 226, 191, 0.8)';
  ctx.fillText(tag, padX, H - inset - 22 * u);
}






/** 書口與上下書頂的紙頁紋：細線疊在紙色上。vertical 決定線的方向 */
function pageEdgeCanvas(vertical) {
  const canvas = makeCanvas(vertical ? 256 : 8, vertical ? 8 : 256);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PAPER_2;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 256; i += 2) {
    ctx.fillStyle = `rgba(150, 130, 95, ${0.12 + Math.random() * 0.12})`;
    if (vertical) ctx.fillRect(i, 0, 1, canvas.height);
    else ctx.fillRect(0, i, canvas.width, 1);
  }
  return canvas;
}

/* ---------- 3D 書 ---------- */
let maxAnisotropy = 8;
let linenBump;
let pageEdgeX;
let pageEdgeY;

/**
 * 建一本 3D 書。本地座標：x 是封面寬（書脊在 -x）、y 是書高、z 是厚度（封面在 +z）。
 * 單位是書櫃上的畫面 px；書轉 90° 時書脊朝向鏡頭，寬度剛好等於書背寬。
 */
function makeBook(site, spineW, spineH) {
  const W = spineH / COVER_RATIO;
  const H = spineH;
  const D = spineW;
  const t = Math.min(3, Math.max(1.6, D * 0.05)); // 書板厚
  const rim = H * (5 / 400); // 書板比書頁多出來的「書耳」（squares）
  const pageW = W - t - rim;
  const pageH = H - rim * 2;
  // 圓背：書脊往外拱，書口相對往內凹，和精裝書「起脊」後的形狀一樣
  const bulge = Math.min(D * 0.16, 9);
  const disposables = [];
  const keep = (x) => { disposables.push(x); return x; };

  /** 沿 z（書的厚度方向）把頂點往 -x 推成拋物線，做出圓背與內凹的書口 */
  const roundBack = (geometry, amount) => {
    const pos = geometry.attributes.position;
    for (let i = 0; i < pos.count; i += 1) {
      const z = pos.getZ(i) / (D / 2);
      pos.setX(i, pos.getX(i) - amount * (1 - Math.min(1, z * z)));
    }
    geometry.computeVertexNormals();
    return geometry;
  };

  const clothTex = keep(canvasTexture(clothCanvas(site.color), { repeat: true }));
  clothTex.repeat.set(W / 96, H / 96);
  const clothBump = linenBump.clone();
  keep(clothBump).repeat.set(W / 96, H / 96);
  // 書布：sheen 讓布面在斜光下有絨絨的反光，和真的裱布一樣
  const glowColor = new THREE.Color(site.color).lerp(new THREE.Color('#ffffff'), 0.55);
  const clothParams = { emissive: glowColor, emissiveIntensity: 0, sheen: 0.7, sheenRoughness: 0.75, sheenColor: new THREE.Color(site.color).lerp(new THREE.Color('#ffffff'), 0.45), roughness: 0.86, metalness: 0 };
  const cloth = keep(new THREE.MeshPhysicalMaterial({ ...clothParams, map: clothTex, bumpMap: clothBump, bumpScale: 0.8 }));
  const paper = keep(new THREE.MeshStandardMaterial({ color: PAPER, roughness: 0.95 }));
  const edgeX = keep(new THREE.MeshStandardMaterial({ map: pageEdgeX, roughness: 0.92 }));
  const edgeY = keep(new THREE.MeshStandardMaterial({ map: pageEdgeY, roughness: 0.92 }));

  const spine = spineTextures(site, spineW, spineH);
  keep(spine.map); keep(spine.orm); keep(spine.bump);
  const spineMat = keep(new THREE.MeshPhysicalMaterial({ ...clothParams, map: spine.map, roughnessMap: spine.orm, metalnessMap: spine.orm, roughness: 1, metalness: 1, bumpMap: spine.bump, bumpScale: 1.6 }));

  const coverAspect = (W - t) / H;
  const coverColor = pageCanvas(coverAspect);
  const coverMask = pageCanvas(coverAspect);
  const coverBump = pageCanvas(coverAspect);
  paintCover(coverColor, site, 'color');
  paintCover(coverMask, site, 'mask');
  paintCover(coverBump, site, 'bump');
  const coverOrm = keep(canvasTexture(coverMask, { srgb: false }));
  const coverMat = keep(new THREE.MeshPhysicalMaterial({ ...clothParams, map: keep(canvasTexture(coverColor)), roughnessMap: coverOrm, metalnessMap: coverOrm, roughness: 1, metalness: 1, bumpMap: keep(canvasTexture(coverBump, { srgb: false })), bumpScale: 2 }));
  const insideCanvas = pageCanvas(coverAspect);
  paintCoverInside(insideCanvas, site, (rim / H) * PAGE_RES);
  const insideMat = keep(new THREE.MeshStandardMaterial({ map: keep(canvasTexture(insideCanvas)), roughness: 0.9 }));

  const pageAspect = pageW / pageH;
  const leafFrontCanvas = pageCanvas(pageAspect);
  const leafBackCanvas = pageCanvas(pageAspect);
  const rightCanvas = pageCanvas(pageAspect);
  paintLeafFront(leafFrontCanvas, site);
  paintLeafBack(leafBackCanvas, site);
  paintRightPage(rightCanvas, site, 0);
  const rightTex = keep(canvasTexture(rightCanvas));
  const leafFrontMat = keep(new THREE.MeshStandardMaterial({ map: keep(canvasTexture(leafFrontCanvas)), roughness: 0.95, side: THREE.FrontSide }));
  const leafBackMat = keep(new THREE.MeshStandardMaterial({ map: keep(canvasTexture(leafBackCanvas)), roughness: 0.95, side: THREE.BackSide }));
  const rightMat = keep(new THREE.MeshStandardMaterial({ map: rightTex, roughness: 0.95 }));

  const mesh = (geometry, materials) => {
    const m = new THREE.Mesh(keep(geometry), materials);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  };

  const group = new THREE.Group();
  group.rotation.order = 'YXZ';

  // 封底：書口兩角圓弧、邊緣倒圓的書板
  const corner = rim * 2.4;
  const back = mesh(splitByNormalZ(roundedBoard(W - t, H, t, corner)), cloth);
  back.position.set(t / 2, 0, -D / 2 + t / 2);
  group.add(back);

  // 書脊：一片沿厚度方向拱起的弧形書板，-x 面貼書背圖
  const spineGeo = roundBack(new THREE.BoxGeometry(t, H, D, 1, 1, 24), bulge);
  const spineMesh = mesh(spineGeo, [cloth, spineMat, cloth, cloth, cloth, cloth]);
  spineMesh.position.set(-W / 2 + t / 2, 0, 0);
  group.add(spineMesh);

  // 書頁：跟著書脊一起彎，書口自然內凹；頂面是右頁
  // 書頁頂面比封面內側低 PAGE_GAP，扉頁夾在中間，各層之間都留空隙，避免深度互搶（z-fighting）造成閃爍
  const PAGE_GAP = 1;
  const blockGeo = roundBack(new THREE.BoxGeometry(pageW, pageH, D - t * 2 - PAGE_GAP, 12, 1, 16), bulge * 0.85);
  const block = mesh(blockGeo, [edgeX, paper, edgeY, edgeY, rightMat, paper]);
  block.position.set(-W / 2 + t + pageW / 2, 0, -PAGE_GAP / 2);
  group.add(block);

  // 堵頭布（headband）：書頁上下靠書脊處的雙色細條
  const headbandMat = keep(new THREE.MeshStandardMaterial({ map: headbandTexture(site.color), roughness: 0.6 }));
  [1, -1].forEach((sign) => {
    const geo = roundBack(new THREE.CylinderGeometry(1.1, 1.1, D - t * 2.4, 8, 12).rotateX(Math.PI / 2), bulge * 0.85);
    const band = mesh(geo, headbandMat);
    band.position.set(-W / 2 + t + 1.2, sign * (pageH / 2 + 0.2), 0);
    group.add(band);
  });

  // 右頁的布底：和書頁頂面幾乎同高，攤開時右頁四周才看得到和左頁一樣寬的布邊
  const base = mesh(new THREE.BoxGeometry(W - t, H, 0.3), cloth);
  base.position.set(t / 2, 0, D / 2 - t - PAGE_GAP - 0.8);
  group.add(base);

  // 扉頁：會彎的紙。正反兩面各一個網格，共用同一份頂點
  const SEG = 40;
  const leafZ = D / 2 - t - PAGE_GAP / 2;
  const leafPivot = new THREE.Group();
  leafPivot.position.set(-W / 2 + t, 0, leafZ);
  const leafGeo = keep(new THREE.PlaneGeometry(pageW, pageH, SEG, 6).translate(pageW / 2, 0, 0));
  const leafBackGeo = keep(new THREE.BufferGeometry());
  leafBackGeo.setIndex(leafGeo.index);
  leafBackGeo.setAttribute('position', leafGeo.attributes.position);
  leafBackGeo.setAttribute('normal', leafGeo.attributes.normal);
  const flippedUv = leafGeo.attributes.uv.clone();
  for (let i = 0; i < flippedUv.count; i += 1) flippedUv.setX(i, 1 - flippedUv.getX(i));
  leafBackGeo.setAttribute('uv', flippedUv);
  const leafFront = new THREE.Mesh(leafGeo, leafFrontMat);
  const leafBack = new THREE.Mesh(leafBackGeo, leafBackMat);
  leafFront.castShadow = true;
  leafFront.receiveShadow = leafBack.receiveShadow = true;
  leafFront.frustumCulled = leafBack.frustumCulled = false;
  leafPivot.add(leafFront, leafBack);
  group.add(leafPivot);
  const leafRest = Float32Array.from(leafGeo.attributes.position.array);

  /**
   * 紙張翻頁：靠書脊的地方先轉，越往外越慢跟上，紙在中途自然彎成弧形；
   * 加上一點因重量往下垂的弧度。p = 0 平放在右邊，p = 1 平放在左邊（正好 -180°）。
   */
  function bendLeaf(p, limit = Math.PI) {
    const pos = leafGeo.attributes.position;
    const cols = SEG + 1;
    const step = pageW / SEG;
    const lag = 0.55;
    const xs = new Float32Array(cols);
    const zs = new Float32Array(cols);
    let x = 0;
    let z = 0;
    const sag = Math.sin(Math.PI * p);
    for (let i = 0; i < cols; i += 1) {
      xs[i] = x;
      zs[i] = z;
      const s = (i + 0.5) / SEG;
      const local = Math.min(1, Math.max(0, p * (1 + lag) - lag * s));
      let angle = Math.PI * (local * local * (3 - 2 * local));
      // 紙的重量：立起來的時候外緣往後垂一點
      angle += sag * 0.35 * s * s;
      // 不能超過封面已經翻到的角度，否則紙會穿過還沒平放的封面
      angle = Math.min(Math.PI, limit, angle);
      x += Math.cos(angle) * step;
      z += Math.sin(angle) * step;
    }
    for (let i = 0; i < pos.count; i += 1) {
      const col = Math.round((leafRest[i * 3] / pageW) * SEG);
      pos.setXYZ(i, xs[col], leafRest[i * 3 + 1], zs[col]);
    }
    pos.needsUpdate = true;
    leafGeo.computeVertexNormals();
    leafGeo.computeBoundingSphere();
  }

  // 封面：以書脊內側為軸，翻開後和右頁對稱
  const coverPivot = new THREE.Group();
  coverPivot.position.set(-W / 2 + t, 0, D / 2 - t / 2);
  // 圓角書板只有一組材質；依法向量把正面、內側分成不同群組
  const cover = mesh(splitByNormalZ(roundedBoard(W - t, H, t, corner)), [cloth, coverMat, insideMat]);
  cover.position.x = (W - t) / 2;
  coverPivot.add(cover);
  group.add(coverPivot);

  return {
    site,
    group,
    coverPivot,
    leafPivot,
    W, H, D, t, leafZ,
    titleSize: spine.titleSize,
    bendLeaf,
    /** 停留時書本身微微發亮（0–1） */
    setGlow(v) {
      [cloth, spineMat, coverMat].forEach((m) => { m.emissiveIntensity = v * 0.045; });
    },
    setProgress(progress) {
      paintRightPage(rightCanvas, site, progress);
      rightTex.needsUpdate = true;
    },
    dispose() { disposables.forEach((x) => x.dispose()); },
  };
}

/**
 * 把一個沒有材質群組的幾何依法向量分三組：0 其他面、1 朝 +z（封面正面）、2 朝 -z（封面內側）。
 * 正面與內側的 UV 依頂點位置重算成 0–1，貼圖才會蓋滿整片書板。
 */
function splitByNormalZ(source) {
  const geometry = source.index ? source.toNonIndexed() : source;
  const pos = geometry.attributes.position;
  const normal = geometry.attributes.normal;
  geometry.computeBoundingBox();
  const { min, max } = geometry.boundingBox;
  const uv = geometry.attributes.uv;
  const groups = [[], [], []];
  for (let f = 0; f < pos.count / 3; f += 1) {
    let nz = 0;
    for (let k = 0; k < 3; k += 1) nz += normal.getZ(f * 3 + k);
    nz /= 3;
    groups[nz > 0.7 ? 1 : nz < -0.7 ? 2 : 0].push(f);
  }
  const order = [...groups[0], ...groups[1], ...groups[2]];
  const out = new THREE.BufferGeometry();
  const copy = (attr) => {
    const arr = new Float32Array(order.length * 3 * attr.itemSize);
    order.forEach((f, n) => {
      for (let k = 0; k < 3; k += 1) {
        for (let c = 0; c < attr.itemSize; c += 1) arr[(n * 3 + k) * attr.itemSize + c] = attr.array[(f * 3 + k) * attr.itemSize + c];
      }
    });
    return new THREE.BufferAttribute(arr, attr.itemSize);
  };
  out.setAttribute('position', copy(pos));
  out.setAttribute('normal', copy(normal));
  const newUv = copy(uv);
  const p = out.attributes.position;
  const n = out.attributes.normal;
  for (let i = 0; i < p.count; i += 1) {
    const u = (p.getX(i) - min.x) / (max.x - min.x);
    const v = (p.getY(i) - min.y) / (max.y - min.y);
    // 內側從背面看，u 要反過來，書脊才會在右邊
    if (n.getZ(i) > 0.7) newUv.setXY(i, u, v);
    else if (n.getZ(i) < -0.7) newUv.setXY(i, 1 - u, v);
  }
  out.setAttribute('uv', newUv);
  let start = 0;
  groups.forEach((g, index) => {
    out.addGroup(start * 3, g.length * 3, index);
    start += g.length;
  });
  source.dispose();
  if (geometry !== source) geometry.dispose();
  return out;
}

/**
 * 圓角書板：在 x–y 平面畫出書口兩角帶圓弧的外形（靠書脊的兩角保持直角），擠出厚度並倒圓邊緣。
 * x 從 -width/2 到 width/2、z 置中。
 */
function roundedBoard(width, height, thick, radius) {
  const bevel = Math.min(thick * 0.42, 1.1);
  const x0 = bevel;
  const x1 = width - bevel;
  const y0 = -height / 2 + bevel;
  const y1 = height / 2 - bevel;
  const r = Math.max(0.5, radius - bevel);
  const shape = new THREE.Shape();
  shape.moveTo(x0, y0);
  shape.lineTo(x1 - r, y0);
  shape.quadraticCurveTo(x1, y0, x1, y0 + r);
  shape.lineTo(x1, y1 - r);
  shape.quadraticCurveTo(x1, y1, x1 - r, y1);
  shape.lineTo(x0, y1);
  shape.lineTo(x0, y0);
  const depth = Math.max(0.2, thick - bevel * 2);
  const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 10 });
  geometry.translate(-width / 2, 0, -depth / 2);
  geometry.computeVertexNormals();
  return geometry;
}

/** 堵頭布：斜紋的雙色絲線 */
function headbandTexture(color) {
  const canvas = makeCanvas(64, 16);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = PAPER_2;
  ctx.fillRect(0, 0, 64, 16);
  for (let x = 0; x < 64; x += 8) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 4, 0); ctx.lineTo(x + 8, 16); ctx.lineTo(x + 4, 16);
    ctx.fill();
  }
  const texture = canvasTexture(canvas, { repeat: true });
  texture.repeat.set(1, 6);
  return texture;
}

/* ---------- 鏡頭：畫面 px 一比一對應 z = 0 的平面，眼睛位置可以任意移動 ----------
   世界座標 (x, -y, 0) 就是畫面上的 (x, y)。改眼睛位置只會改變有深度的東西怎麼透視，
   書背（z = 0）永遠留在 DOM 連結的位置。 */
function setOffAxisCamera(camera, eyeX, eyeY, distance, viewW, viewH) {
  // 場景都在 z = ±600 以內：near／far 夾緊，深度精度才夠，鏡頭拉遠時也不會 z-fighting
  const near = Math.max(10, distance - 700);
  const far = distance + 1200;
  const f = near / distance;
  camera.position.set(eyeX, -eyeY, distance);
  camera.near = near;
  camera.far = far;
  camera.projectionMatrix.makePerspective(-eyeX * f, (viewW - eyeX) * f, eyeY * f, (eyeY - viewH) * f, near, far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  camera.updateMatrixWorld(true);
}

function addLights(scene, centerX, centerY, span) {
  const hemi = new THREE.HemisphereLight(0xffffff, 0x8c8c94, 0.3);
  scene.add(hemi);
  // 主光從左上前方來，影子落在右下
  const key = new THREE.DirectionalLight(0xfff8f0, 1.15);
  key.position.set(centerX - span * 0.25, centerY + span * 0.45, span * 1.3);
  key.target.position.set(centerX, centerY, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const r = span * 0.9;
  Object.assign(key.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 10, far: span * 4 });
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.6;
  key.shadow.radius = 10;
  key.shadow.blurSamples = 16;
  scene.add(key, key.target);
  // 右側補光，讓暗面不死黑
  const fill = new THREE.DirectionalLight(0xe6edff, 0.25);
  fill.position.set(centerX + span, centerY + span * 0.2, span * 0.6);
  fill.target.position.set(centerX, centerY, 0);
  scene.add(fill, fill.target);
  return { hemi, key, fill };
}

/* 環境光貼圖是 render target，不能跨 WebGL context 共用，每個 renderer 各做一張 */
const envTextures = new WeakMap();
function environmentTexture(renderer) {
  if (!envTextures.has(renderer)) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    envTextures.set(renderer, pmrem.fromScene(new RoomEnvironment(), 0.04).texture);
    pmrem.dispose();
  }
  return envTextures.get(renderer);
}

/* ---------- 3D 書櫃 ---------- */
const FRAME = { cap: 14, side: 12 }; // 鋁框：上方燈槽高度、左右立柱寬度（畫面 px）
let shelf = null;

const CASE_THEME = {
  // 書櫃的材質參考 Apple Store 的陳列架：霧面牆、陽極鋁框、淺橡木層板、上方內嵌的暖白燈條
  light: { back: ['#d6cebf', '#cfc6b6', '#c6bcab'], alu: '#b9b5ad', wood: '#9c7a55', ceramic: '#ddd5c7', led: 1.5, hemi: 0.26, key: 0.8, env: 0.42, ao: 0.28 },
  dark: { back: ['#211e1b', '#1b1916', '#151311'], alu: '#4a4740', wood: '#5a3e2a', ceramic: '#3a3631', led: 3.4, hemi: 0.2, key: 0.7, env: 0.3, ao: 0.6 },
};

function createShelf() {
  const bookcase = document.getElementById('bookcase');
  const canvas = document.createElement('canvas');
  canvas.className = 'shelf-canvas';
  canvas.setAttribute('aria-hidden', 'true');
  bookcase.prepend(canvas);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.environment = environmentTexture(renderer);
  const camera = new THREE.PerspectiveCamera();
  const caseGroup = new THREE.Group();
  scene.add(caseGroup);

  const backCanvas = makeCanvas(512, 256);
  const backTex = canvasTexture(backCanvas);
  const backMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.95 });
  const wallMat = new THREE.MeshStandardMaterial({ roughness: 0.95 });
  const aluMat = new THREE.MeshPhysicalMaterial({ metalness: 1, roughness: 0.42, clearcoat: 0.3, clearcoatRoughness: 0.5 });
  const woodCanvas = makeCanvas(2048, 128);
  const woodTex = canvasTexture(woodCanvas);
  const woodMat = new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.62, clearcoat: 0.35, clearcoatRoughness: 0.55 });
  const ledMat = new THREE.MeshBasicMaterial({ color: '#f6e2bf' });
  const underShadowTex = shadowBlobTexture();
  const underShadowMat = new THREE.MeshBasicMaterial({ map: underShadowTex, transparent: true, depthWrite: false, opacity: 0.55 });
  const woodSeed = Math.random();
  const feltMat = new THREE.MeshStandardMaterial({ color: '#2b2b2e', roughness: 1 });
  const grooveMat = new THREE.MeshStandardMaterial({ color: '#55555b', metalness: 0.6, roughness: 0.6 });
  const polishMat = new THREE.MeshPhysicalMaterial({ metalness: 1, roughness: 0.18, color: '#f2f2f5' });
  const foilMat = new THREE.MeshStandardMaterial({ color: FOIL, roughness: 0.45 });
  const ceramicMat = new THREE.MeshPhysicalMaterial({ roughness: 0.6, clearcoat: 0.25, clearcoatRoughness: 0.6 });
  const stemMat = new THREE.MeshStandardMaterial({ color: '#8a7a5c', roughness: 0.9 });

  let lights = null;
  const books = new Map();
  const state = new Map(); // id → { lift, liftTarget, tiltX, tiltY, tiltXTarget, tiltYTarget }
  let layout = null;
  let activeId = null;

  function paintCaseTextures() {
    const theme = CASE_THEME[isDarkTheme() ? 'dark' : 'light'];
    const ctx = backCanvas.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, backCanvas.height);
    g.addColorStop(0, theme.back[0]);
    g.addColorStop(0.6, theme.back[1]);
    g.addColorStop(1, theme.back[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, backCanvas.width, backCanvas.height);
    // 牆角的環境遮蔽：上方燈槽底下與兩側鋁框旁邊稍暗
    const sx = backCanvas.width / Math.max(1, layout ? layout.width : 1000);
    const sy = backCanvas.height / Math.max(1, layout ? layout.boardTop : 360);
    const edge = (x0, y0, x1, y1, alpha) => {
      const s = ctx.createLinearGradient(x0, y0, x1, y1);
      s.addColorStop(0, `rgba(0,0,0,${alpha})`);
      s.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = s;
      ctx.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0) || backCanvas.width, Math.abs(y1 - y0) || backCanvas.height);
    };
    edge(0, FRAME.cap * sy, 0, (FRAME.cap + 14) * sy, theme.ao * 0.6);
    edge(FRAME.side * sx, 0, (FRAME.side + 18) * sx, 0, theme.ao);
    edge(backCanvas.width - FRAME.side * sx, 0, backCanvas.width - (FRAME.side + 18) * sx, 0, theme.ao);
    edge(0, backCanvas.height, 0, backCanvas.height - 22 * sy, theme.ao * 0.7);
    // 每塊上層層板底下、下一層燈條附近的牆面略暗，層板上方貼著書底的地方也暗一點
    (layout ? layout.boardTops : []).forEach((top, i, all) => {
      if (i < all.length - 1) edge(0, (top + 20) * sy, 0, (top + 34) * sy, theme.ao * 0.5);
      edge(0, top * sy, 0, (top - 18) * sy, theme.ao * 0.45);
    });
    backTex.needsUpdate = true;

    // 橡木：沿長邊的木紋，用固定亂數種子，換主題時紋路不變
    const w = woodCanvas.getContext('2d');
    w.fillStyle = theme.wood;
    w.fillRect(0, 0, woodCanvas.width, woodCanvas.height);
    let seed = woodSeed * 1e6;
    const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let i = 0; i < 70; i += 1) {
      const y0 = rand() * woodCanvas.height;
      const amp = 2 + rand() * 6;
      const freq = 0.002 + rand() * 0.006;
      const phase = rand() * 10;
      w.strokeStyle = rand() < 0.6 ? `rgba(90, 55, 25, ${0.05 + rand() * 0.12})` : `rgba(255, 240, 215, ${0.04 + rand() * 0.08})`;
      w.lineWidth = 0.6 + rand() * 2.2;
      w.beginPath();
      for (let x = 0; x <= woodCanvas.width; x += 16) {
        const y = y0 + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 3.7) * amp * 0.25;
        if (x === 0) w.moveTo(x, y); else w.lineTo(x, y);
      }
      w.stroke();
    }
    for (let i = 0; i < 1400; i += 1) {
      w.fillStyle = `rgba(70, 40, 15, ${rand() * 0.08})`;
      w.fillRect(rand() * woodCanvas.width, rand() * woodCanvas.height, 1 + rand() * 8, 1);
    }
    woodTex.needsUpdate = true;

    aluMat.color.set(theme.alu);
    ceramicMat.color.set(theme.ceramic);
    polishMat.color.set(theme === CASE_THEME.dark ? '#a8a8b0' : '#f2f2f5');
    wallMat.color.set(theme.back[1]);
    if (lights) {
      lights.hemi.intensity = theme.hemi;
      lights.key.intensity = theme.key;
      lights.strips.forEach((strip) => { strip.intensity = theme.led; });
    }
    scene.environmentIntensity = theme.env;
  }

  function clearCase() {
    while (caseGroup.children.length) {
      const child = caseGroup.children.pop();
      child.traverse((node) => { if (node.geometry) node.geometry.dispose(); });
      // 每次重建都會新做的材質（擺飾的書布、光暈）要一起釋放；共用材質留著
      [].concat(child.material || []).forEach((mat) => {
        if (!mat.userData.owned) return;
        if (mat.map) mat.map.dispose();
        mat.dispose();
      });
    }
    if (lights) {
      scene.remove(lights.hemi, lights.key, lights.key.target, lights.fill, lights.fill.target, ...lights.strips);
      lights.key.shadow.dispose();
      lights = null;
    }
  }

  function addMesh(geometry, material, x, y, z, { cast = true, receive = true } = {}) {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = cast;
    mesh.receiveShadow = receive;
    caseGroup.add(mesh);
    return mesh;
  }

  /** 依 DOM 排版重建整座書櫃：背板、鋁框、每一層的層板與燈條、書擋、擺飾、書 */
  function build() {
    const caseRect = bookcase.getBoundingClientRect();
    const width = caseRect.width;
    const height = caseRect.height + 24;
    const rel = (rect) => ({ left: rect.left - caseRect.left, top: rect.top - caseRect.top, width: rect.width, height: rect.height });
    const rows = [...bookcase.querySelectorAll('.shelf-row')].map((row) => ({
      row,
      boardTop: row.querySelector('.board').getBoundingClientRect().top - caseRect.top,
    }));
    const boardTopOf = (el) => rows.find((r) => r.row.contains(el)).boardTop;
    const bottomTop = rows[rows.length - 1].boardTop;

    renderer.setSize(width, height, false);
    clearCase();
    books.forEach((book) => { scene.remove(book.group); book.dispose(); });
    books.clear();

    const links = [...bookcase.querySelectorAll('.book')];
    const tallest = Math.max(240, ...links.map((a) => a.getBoundingClientRect().height));
    const depth = tallest / COVER_RATIO + 26; // 書櫃深度：最大的書再留一點空隙

    // 背板：尺寸反推透視，投影後剛好蓋滿書櫃，貼圖上的陰影才會落在邊緣
    // 眼睛在最下層，上面幾層離眼睛很遠；鏡頭跟著書櫃高度拉遠，上層層板底面才不會露太多
    const camDist = Math.max(SHELF_CAMERA_DISTANCE, bottomTop * 10);
    const m = camDist / (camDist + depth);
    const unproject = (s, eye) => eye + (s - eye) / m;
    const bx0 = unproject(0, width / 2);
    const bx1 = unproject(width, width / 2);
    const by0 = unproject(0, bottomTop);
    const by1 = bottomTop + 6;
    addMesh(new THREE.PlaneGeometry(bx1 - bx0, by1 - by0), backMat, (bx0 + bx1) / 2, -(by0 + by1) / 2, -depth, { cast: false });

    // 櫃體內側：和背板同樣的霧面材質，燈條會把它們照亮
    const fullH = bottomTop + 20;
    const ceiling = addMesh(new THREE.PlaneGeometry(width, depth), wallMat, width / 2, -FRAME.cap, -depth / 2, { cast: false });
    ceiling.rotation.x = Math.PI / 2;
    [[FRAME.side, Math.PI / 2], [width - FRAME.side, -Math.PI / 2]].forEach(([x, rot]) => {
      const wall = addMesh(new THREE.PlaneGeometry(depth, bottomTop), wallMat, x, -bottomTop / 2, -depth / 2, { cast: false });
      wall.rotation.y = rot;
    });
    // 陽極鋁前框：上方燈槽與左右立柱，細、圓角
    const frameDepth = 10;
    addMesh(new RoundedBoxGeometry(width, FRAME.cap, frameDepth, 3, 3), aluMat, width / 2, -FRAME.cap / 2, 0);
    [FRAME.side / 2, width - FRAME.side / 2].forEach((x) => {
      addMesh(new RoundedBoxGeometry(FRAME.side, fullH, frameDepth, 3, 3.5), aluMat, x, -fullH / 2, 0);
    });

    const innerW = width - FRAME.side * 2;
    const lightYs = [];
    rows.forEach(({ boardTop }, i) => {
      // 淺橡木層板：前緣倒圓角，比鋁框稍微突出；兩端嵌進立柱的鋁製托架
      addMesh(new RoundedBoxGeometry(innerW, 20, depth + 14, 4, 5), woodMat, width / 2, -(boardTop + 10), -depth / 2 + 7);
      [FRAME.side + 3, width - FRAME.side - 3].forEach((x) => {
        addMesh(new RoundedBoxGeometry(6, 4, depth * 0.8, 2, 1.5), aluMat, x, -(boardTop + 22), -depth * 0.45);
      });
      // 每層上方一條暖白燈條：第一層在燈槽下，其他層在上一層層板的底面
      const lightY = i === 0 ? FRAME.cap : rows[i - 1].boardTop + 20;
      lightYs.push(lightY);
      addMesh(new THREE.BoxGeometry(innerW - 8, 1.6, 4), ledMat, width / 2, -lightY - 0.6, -depth * 0.35, { cast: false, receive: false });
    });
    // 最下層層板投在牆上的柔和影子（canvas 往下多留的 24px）
    const under = addMesh(new THREE.PlaneGeometry(width * 0.98, 30), underShadowMat, width / 2, -(bottomTop + 26), -2, { cast: false, receive: false });
    under.renderOrder = -1;

    bookcase.querySelectorAll('[data-bookend]').forEach((end) => addBookend(rel(end.getBoundingClientRect()), boardTopOf(end), depth));
    bookcase.querySelectorAll('[data-prop="stack"]').forEach((el, i) => addStack(rel(el.getBoundingClientRect()), boardTopOf(el), depth, i));
    bookcase.querySelectorAll('[data-prop="vase"]').forEach((el, i) => addVase(rel(el.getBoundingClientRect()), boardTopOf(el), depth, i));

    // 書：書背貼齊 DOM 連結的位置，底部站在層板上；背後一片停留時才亮的光暈
    links.forEach((link) => {
      const site = findSite(link);
      const r = rel(link.getBoundingClientRect());
      const boardTop = boardTopOf(link);
      const book = makeBook(site, r.width, r.height);
      book.base = new THREE.Vector3(r.left + r.width / 2, -(boardTop - r.height / 2), -book.W / 2);
      book.group.position.copy(book.base);
      book.group.rotation.set(0, Math.PI / 2, 0);
      scene.add(book.group);
      const halo = addMesh(new THREE.PlaneGeometry(r.width + HALO_PAD * 2, r.height + HALO_PAD * 2), new THREE.MeshBasicMaterial({
        userData: { owned: true }, map: haloTexture(r.width, r.height), color: new THREE.Color(isDarkTheme() ? '#ffe7bf' : '#f3c98a'), transparent: true, opacity: 0, depthWrite: false,
      }), book.base.x, book.base.y, -1, { cast: false, receive: false });
      book.halo = halo;
      books.set(site.id, book);
      if (!state.has(site.id)) state.set(site.id, { lift: 0, liftTarget: 0, tiltX: 0, tiltY: 0, tiltXTarget: 0, tiltYTarget: 0, glow: 0, glowTarget: 0, dragX: 0, dragY: 0, dragXTarget: 0, dragYTarget: 0 });
    });

    lights = addLights(scene, width / 2, -bottomTop / 2, Math.max(width, bottomTop) * 1.1);
    lights.strips = lightYs.map((y) => {
      const strip = new THREE.RectAreaLight('#ffeedd', 3, innerW - 8, depth * 0.6);
      strip.position.set(width / 2, -y - 1, -depth * 0.5);
      strip.lookAt(width / 2, -y - 1000, -depth * 0.5);
      scene.add(strip);
      return strip;
    });
    // 眼睛和最下層層板頂面同高：所有書的書頂都在眼睛之上，永遠看不到，符合正視圖
    layout = { width, height, camDist, eyeX: width / 2, eyeY: bottomTop, boardTop: bottomTop, boardTops: rows.map((r) => r.boardTop) };
    paintCaseTextures();
    setOffAxisCamera(camera, layout.eyeX, layout.eyeY, camDist, width, height);
    bookcase.classList.add('is-3d');
    syncBooks();
    kick();
  }

  /** 書擋：圓角鋁製 L 形，正面刻一道細線，底下墊深色絨布 */
  function addBookend(r, boardTop, depth) {
    const d = depth * 0.55;
    const z = -depth * 0.3;
    const plateH = r.height;
    addMesh(new THREE.BoxGeometry(r.width - 4, 1.4, d - 6), feltMat, r.left + r.width / 2, -(boardTop - 0.7), z, { cast: false });
    addMesh(new RoundedBoxGeometry(r.width - 2, 3, d, 3, 1.3), aluMat, r.left + 1 + (r.width - 2) / 2, -(boardTop - 1.4 - 1.5), z);
    addMesh(new RoundedBoxGeometry(8, plateH - 1.4, d, 4, 3), aluMat, r.left + 6, -(boardTop - 1.4 - (plateH - 1.4) / 2), z);
    // 前緣刻線與頂端的拋光倒角
    addMesh(new THREE.BoxGeometry(1.1, plateH * 0.62, 0.6), grooveMat, r.left + 6, -(boardTop - plateH * 0.45), z + d / 2 + 0.05, { cast: false });
    addMesh(new RoundedBoxGeometry(8.4, 2, d + 0.4, 2, 0.9), polishMat, r.left + 6, -(boardTop - plateH + 1), z, { cast: false });
  }

  /** 橫躺的一疊書：素面布書，書背朝前，兩道燙金細線 */
  function addStack(r, boardTop, depth, index) {
    const colors = [['#6b2c2f', '#3d4345', '#a6936e'], ['#4a3f5d', '#664429', '#3f5e4b']][index % 2];
    const heights = [14, 11, 13];
    let y = boardTop;
    heights.forEach((h, i) => {
      const w = r.width * [0.98, 0.86, 0.92][i];
      const d = depth * [0.7, 0.62, 0.66][i];
      const x = r.left + w / 2 + [0, 6, 2][i];
      const mat = new THREE.MeshPhysicalMaterial({ userData: { owned: true }, color: colors[i], roughness: 0.85, sheen: 0.6, sheenRoughness: 0.8, sheenColor: new THREE.Color(colors[i]).lerp(new THREE.Color('#ffffff'), 0.4) });
      const book = addMesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(2.2, h / 3)), mat, x, -(y - h / 2), -d / 2 - 4);
      book.rotation.y = [0.02, -0.035, 0.015][i];
      [-1, 1].forEach((side) => {
        addMesh(new THREE.BoxGeometry(0.8, h * 0.62, 0.4), foilMat, x + side * w * 0.38, -(y - h / 2), -4 + 0.3, { cast: false });
      });
      y -= h;
    });
  }

  /** 霧面陶瓶，插幾枝乾燥的細枝 */
  function addVase(r, boardTop, depth, index) {
    const H = r.height * 0.62;
    const R = r.width / 2;
    const profile = [[0, 0], [0.62, 0], [0.8, 0.04], [0.96, 0.24], [1, 0.42], [0.9, 0.62], [0.58, 0.8], [0.42, 0.9], [0.46, 0.98], [0.4, 1]]
      .map(([x, y]) => new THREE.Vector2(x * R, y * H));
    const cx = r.left + r.width / 2;
    const z = -depth * 0.42;
    const vase = addMesh(new THREE.LatheGeometry(profile, 48), ceramicMat, cx, -boardTop, z);
    vase.geometry.computeVertexNormals();
    // 細枝：從瓶口往上散開，越往上越細
    const stems = index % 2 ? [[-0.18, 1.0], [0.1, 0.86], [0.28, 0.7]] : [[-0.25, 0.8], [0.06, 1.0], [0.22, 0.9]];
    stems.forEach(([lean, len]) => {
      const L = (r.height - H) * len + H * 0.3;
      const geo = new THREE.CylinderGeometry(0.5, 1, L, 6);
      geo.translate(0, L / 2, 0);
      const stem = addMesh(geo, stemMat, cx, -(boardTop - H * 0.75), z, { receive: false });
      stem.rotation.z = lean;
      stem.rotation.x = lean * 0.4;
      // 枝上的小葉片
      for (let k = 0; k < 4; k += 1) {
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(2.2, 8, 6).scale(1, 0.4, 0.6), stemMat);
        const s = 0.45 + k * 0.15;
        leaf.position.set((k % 2 ? 3 : -3), L * s, 0);
        leaf.rotation.z = k % 2 ? -0.6 : 0.6;
        leaf.castShadow = true;
        stem.add(leaf);
      }
    });
  }

  function syncBooks() {
    books.forEach((book, id) => {
      if (book.detached || book.pulling) return;
      const s = state.get(id);
      // 拖曳：書跟著游標被拉出來一點（往前、往上），拉得越遠越往前
      const pull = Math.min(1, Math.hypot(s.dragX, s.dragY) / PULL_DISTANCE);
      book.group.position.set(
        book.base.x + s.dragX * 0.3,
        book.base.y + s.lift - s.dragY * 0.3 + pull * 18,
        book.base.z + s.lift * 0.6 + pull * 70,
      );
      book.group.rotation.set(s.tiltX - s.dragY * 0.0012, Math.PI / 2 + s.tiltY + s.dragX * 0.0016, 0);
      // 光暈只是提醒：暖白、低透明度，淡入快、淡出慢（Material 的 hover 狀態層建議 150–300ms、低不透明度）
      const dark = isDarkTheme();
      book.halo.position.set(book.group.position.x, book.group.position.y, -1);
      book.halo.material.opacity = s.glow * (dark ? 0.22 : 0.3);
      book.halo.material.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
      book.halo.material.color.set(dark ? '#ffe7bf' : '#f3c98a');
      book.setGlow(s.glow);
    });
  }

  // 抬起與傾斜用阻尼趨近目標值，滑鼠移開後自然落回
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  frameHooks.add((dt) => {
    let moving = false;
    const k = reduceMotion() ? 1 : 1 - Math.exp(-dt / 90);
    const reduce = reduceMotion();
    state.forEach((s) => {
      ['lift', 'tiltX', 'tiltY', 'glow', 'dragX', 'dragY'].forEach((key) => {
        const target = s[`${key}Target`];
        const diff = target - s[key];
        if (Math.abs(diff) < (key === 'lift' || key.startsWith('drag') ? 0.01 : 0.0005)) { s[key] = target; return; }
        let rate = k;
        // 光暈淡入約 200ms、淡出約 300ms；拖曳時緊跟游標，放開後彈回
        if (key === 'glow' && !reduce) rate = 1 - Math.exp(-dt / (diff > 0 ? 65 : 100));
        if (key.startsWith('drag') && !reduce) rate = 1 - Math.exp(-dt / (s.dragging ? 28 : 110));
        s[key] += diff * rate;
        moving = true;
      });
    });
    syncBooks();
    return moving;
  });

  return {
    build,
    books,
    get layout() { return layout; },
    canvas,
    renderer,
    applyTheme() { paintCaseTextures(); kick(); },
    setActive(id) {
      activeId = id;
      state.forEach((s, key) => {
        s.liftTarget = key === activeId ? HOVER_LIFT : 0;
        s.glowTarget = key === activeId ? 1 : 0;
      });
      kick();
    },
    /** 抓住書拖曳（畫面 px 位移）；end=true 時放開，書彈回原位 */
    setDrag(id, dx, dy, end = false) {
      const s = state.get(id);
      if (!s) return;
      s.dragging = !end;
      s.dragXTarget = end ? 0 : dx;
      s.dragYTarget = end ? 0 : dy;
      kick();
    },
    setTilt(id, x, y) {
      const s = state.get(id);
      if (!s) return;
      s.tiltYTarget = x * 0.14; // 跟著游標微微轉頭
      s.tiltXTarget = y * 0.05;
      kick();
    },
    /** 把書從書櫃拿走（交給舞台），回傳它在書櫃 canvas 裡的世界座標 */
    detach(id) {
      const book = books.get(id);
      book.detached = true;
      book.halo.material.opacity = 0;
      book.setGlow(0);
      scene.remove(book.group);
      kick();
      return book;
    },
    render() { if (layout) renderer.render(scene, camera); },
  };
}

/* ---------- 開書：抽出 → 空中從書背轉到封面 → 翻開封面與扉頁 → 跳轉 ---------- */
let isOpening = false;
let stage = null;

/** 停留時書後的光暈：中心是和書一樣大的圓角矩形，往外 PAD px 平滑淡出（逐像素算，不靠 ctx.filter） */
const HALO_PAD = 30;
function haloTexture(w, h) {
  const cw = Math.round(w + HALO_PAD * 2);
  const ch = Math.round(h + HALO_PAD * 2);
  const canvas = makeCanvas(cw, ch);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(cw, ch);
  const radius = 6;
  for (let y = 0; y < ch; y += 1) {
    for (let x = 0; x < cw; x += 1) {
      const qx = Math.max(Math.abs(x - cw / 2) - (w / 2 - radius), 0);
      const qy = Math.max(Math.abs(y - ch / 2) - (h / 2 - radius), 0);
      const dist = Math.hypot(qx, qy) - radius;
      const a = dist <= 0 ? 1 : Math.max(0, 1 - dist / HALO_PAD);
      const i = (y * cw + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = Math.round(255 * a * a * a); // 三次方衰減，邊緣更柔
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvasTexture(canvas);
}

function shadowBlobTexture() {
  const canvas = makeCanvas(256, 64);
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(128, 32, 0, 128, 32, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.55)');
  g.addColorStop(0.5, 'rgba(0,0,0,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.save();
  ctx.scale(1, 0.25);
  ctx.fillRect(0, 0, 256, 256);
  ctx.restore();
  return canvasTexture(canvas);
}

function createStage(book) {
  const root = document.createElement('div');
  root.className = 'stage';
  root.setAttribute('aria-hidden', 'true');
  root.innerHTML = `<div class="stage-backdrop"></div><canvas></canvas><span class="stage-skip">${escapeHtml(t('skip'))}</span>`;
  document.body.append(root);
  const canvas = root.querySelector('canvas');
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap; // VSM 遇到很薄的紙會漏光、拖出殘影
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(vw, vh, false);

  const scene = new THREE.Scene();
  scene.environment = environmentTexture(renderer);
  const theme = CASE_THEME[isDarkTheme() ? 'dark' : 'light'];
  scene.environmentIntensity = theme.env;
  const lights = addLights(scene, vw / 2, -vh / 2, Math.max(vw, vh) * 0.8);
  lights.hemi.intensity = theme.hemi;
  lights.key.intensity = theme.key;
  const camera = new THREE.PerspectiveCamera();

  // 桌面影子：書底下的一團柔和橢圓
  const blobTex = shadowBlobTexture();
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0 }));
  scene.add(blob);
  scene.add(book.group);

  return {
    root,
    canvas,
    scene,
    camera,
    blob,
    vw,
    vh,
    render() { renderer.render(scene, camera); },
    dispose() {
      environmentTexture(renderer).dispose();
      renderer.dispose();
      blobTex.dispose();
      blob.geometry.dispose();
      blob.material.dispose();
      root.remove();
    },
  };
}

async function openBook(link, site) {
  isOpening = true;
  const book = shelf.books.get(site.id);
  const g = book.group;
  const caseCanvasRect = shelf.canvas.getBoundingClientRect();
  const { eyeX, eyeY, camDist } = shelf.layout;

  // 1. 先把書從書櫃往前、往上抽出來
  shelf.setActive(site.id);
  shelf.setTilt(site.id, 0, 0);
  book.pulling = true; // 之後由動畫接手位置，書櫃的停留／拖曳不再改它
  const from = g.position.clone();
  const fromRot = g.rotation.clone();
  await tween({
    duration: 380,
    easing: EASE_OUT,
    update: (e) => {
      g.position.set(from.x, lerp(from.y, book.base.y + 36, e), lerp(from.z, book.base.z + 40, e));
      g.rotation.set(lerp(fromRot.x, 0, e), lerp(fromRot.y, Math.PI / 2, e), 0);
      g.scale.setScalar(lerp(1, 1.06, e));
    },
  });

  // 2. 交接：同一個物件、同一套鏡頭換算，搬到全螢幕 canvas，位置換成視窗座標，畫面不跳
  shelf.detach(site.id);
  const start = g.position.clone().add(new THREE.Vector3(caseCanvasRect.left, -caseCanvasRect.top, 0));
  g.position.copy(start);
  stage = createStage(book);
  const { vw, vh, camera, blob } = stage;
  const startEye = { x: caseCanvasRect.left + eyeX, y: caseCanvasRect.top + eyeY };
  setOffAxisCamera(camera, startEye.x, startEye.y, camDist, vw, vh);
  stage.root.addEventListener('click', () => { window.location.href = link.href; });
  stage.render();

  const H = Math.min(COVER_MAX_HEIGHT, vh - 120, ((vw - 48) / 2) * COVER_RATIO);
  const sEnd = H / book.H;
  const sStart = 1.06;
  const end = new THREE.Vector3(vw / 2, -vh / 2, 0);
  const mid = new THREE.Vector3((start.x + end.x) / 2, Math.max(start.y, end.y) + 40, 60);
  const ctrl = mid.clone().multiplyScalar(2).sub(start.clone().add(end).multiplyScalar(0.5)); // 二次貝茲曲線剛好經過 mid
  const Wend = book.W * sEnd;
  const Dend = book.D * sEnd;
  blob.position.set(end.x, end.y - H / 2 - 6, -Dend);
  blob.scale.set(Wend * 1.25, 34, 1);

  // 3. 空中轉身：書背轉開、封面轉向你，途中帶一點傾斜；鏡頭同時移到畫面中央
  const backdrop = stage.root.querySelector('.stage-backdrop');
  const rotations = [[0, Math.PI / 2, 0], [10, 48, -4].map((d) => (d * Math.PI) / 180), [0, 0, 0]];
  const rotAt = (e) => {
    const [a, b, i] = e < 0.5 ? [rotations[0], rotations[1], e / 0.5] : [rotations[1], rotations[2], (e - 0.5) / 0.5];
    return a.map((v, n) => lerp(v, b[n], i));
  };
  await Promise.all([
    tween({ duration: 500, update: (e) => { backdrop.style.opacity = String(e); } }),
    tween({
      duration: 1000,
      easing: EASE_IN_OUT,
      update: (e) => {
        const p = (a, c, b) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * c + e * e * b;
        g.position.set(p(start.x, ctrl.x, end.x), p(start.y, ctrl.y, end.y), p(start.z, ctrl.z, end.z));
        const [rx, ry, rz] = rotAt(e);
        g.rotation.set(rx, ry, rz);
        g.scale.setScalar(lerp(sStart, sEnd, e));
        setOffAxisCamera(camera, lerp(startEye.x, vw / 2, e), lerp(startEye.y, vh / 2, e), lerp(camDist, STAGE_CAMERA_DISTANCE, e), vw, vh);
        blob.material.opacity = e * 0.85;
        blob.scale.x = Wend * 1.25 * lerp(0.3, 1, e);
      },
    }),
  ]);

  // 4. 翻開封面，再翻一張扉頁；整本書往右移，讓書溝在畫面正中央。
  //    兩段動作用同一條時間軸計算（openPose），每格先算封面角度，再用它限制扉頁，保證扉頁不會穿過封面
  const shift = (book.W / 2 - book.t) * sEnd;
  const leafLift = book.D / 2 + 0.8;
  const COVER_MS = 900;
  const LEAF_DELAY = 320;
  const LEAF_MS = 1100;
  const OPEN_MS = LEAF_DELAY + LEAF_MS;
  const openPose = (ms) => {
    const c = EASE_IN_OUT(Math.min(1, ms / COVER_MS));
    g.position.x = end.x + shift * c;
    blob.position.x = end.x + shift * c * 0.5;
    blob.scale.x = Wend * 1.25 * lerp(1, 1.9, c);
    book.coverPivot.rotation.y = -Math.PI * c;
    const l = EASE_IN_OUT(Math.min(1, Math.max(0, (ms - LEAF_DELAY) / LEAF_MS)));
    // 扉頁先墊高到封面內側之上，再開始翻
    book.leafPivot.position.z = lerp(book.leafZ, leafLift, Math.min(1, l * 3));
    book.bendLeaf(l, Math.PI * c - 0.04 * (1 - c));
  };
  await tween({ duration: OPEN_MS, update: (_, raw) => openPose(raw * OPEN_MS) });

  // 5. 讀取條跑完就跳轉
  await tween({ duration: 450, easing: EASE_OUT, update: (e) => book.setProgress(e) });
  window.location.href = link.href;
}

function resetOpening() {
  tweens.clear();
  if (stage) {
    stage.dispose();
    stage = null;
  }
  isOpening = false;
}

let suppressClick = false;

function startOpen(link, site) {
  if (isOpening) return;
  hideCard();
  openBook(link, site).catch((err) => {
    console.warn(`開書動畫失敗，直接前往「${link.href}」：`, err);
    window.location.href = link.href;
  });
}

function setupOpening() {
  const rows = document.getElementById('rows');
  rows.addEventListener('click', (event) => {
    const link = event.target.closest('.book');
    if (!link) return;
    // 剛拖曳過的那一下不算點擊
    if (suppressClick) {
      suppressClick = false;
      event.preventDefault();
      return;
    }
    // 開新分頁、新視窗的修飾鍵點擊交給瀏覽器
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
    const site = findSite(link);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!site || reduceMotion || !shelf || !shelf.books.has(site.id)) return;
    event.preventDefault();
    startOpen(link, site);
  });

  // 抓住書往外拖：沒放開就跟著游標被拉出來，拖到 PULL_DISTANCE 直接打開；中途放開就彈回去。
  // 只給滑鼠與觸控筆；手指拖曳留給捲動頁面，點一下照樣打開
  rows.addEventListener('pointerdown', (event) => {
    const link = event.target.closest('.book');
    if (!link || event.button !== 0 || event.pointerType === 'touch') return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const site = findSite(link);
    if (!site || !shelf || !shelf.books.has(site.id) || isOpening) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const startX = event.clientX;
    const startY = event.clientY;
    let dragging = false;
    const move = (e) => {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) < 6) return;
      if (!dragging) {
        dragging = true;
        document.documentElement.classList.add('is-grabbing');
        hideCard();
      }
      shelf.setDrag(site.id, dx, dy);
      if (Math.hypot(dx, dy) >= PULL_DISTANCE) {
        finish();
        suppressClick = true;
        startOpen(link, site);
      }
    };
    const finish = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      document.documentElement.classList.remove('is-grabbing');
    };
    const up = () => {
      finish();
      if (!dragging) return; // 沒拖動：交給 click 打開
      suppressClick = true;
      shelf.setDrag(site.id, 0, 0, true);
      window.setTimeout(() => { suppressClick = false; }, 0);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ---------- 啟動 ---------- */
setupLangSwitch();
renderShelfDom();
setupInspector();
setupOpening();
setupThemeSwitch();

async function start3d() {
  try {
    THREE = await import('three');
    [{ RoomEnvironment }, { RoundedBoxGeometry }, { RectAreaLightUniformsLib }] = await Promise.all([
      import('three/addons/environments/RoomEnvironment.js'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/lights/RectAreaLightUniformsLib.js'),
    ]);
    RectAreaLightUniformsLib.init();
    // 內頁用的明體要先載好再畫貼圖；Google Fonts 依字元分包，把會用到的字一起交給 load()
    const glyphs = [...new Set(JSON.stringify([STRINGS, SITES.map((s) => s.text)]) + '0123456789—·©/ MDCLXVI')].join('');
    await Promise.all([
      document.fonts.ready,
      loadIcons(),
      ...['400', '600', '700'].map((w) => document.fonts.load(`${w} 16px "Noto Serif TC"`, glyphs).catch(() => [])),
    ]);
    linenBump = canvasTexture(linenBumpCanvas(), { srgb: false, repeat: true });
    pageEdgeX = canvasTexture(pageEdgeCanvas(true));
    pageEdgeY = canvasTexture(pageEdgeCanvas(false));
    shelf = createShelf();
    shelf.build();
  } catch (err) {
    console.warn('three.js 書櫃無法啟動，改用簡易書背：', err);
    shelf = null;
  }
  // 3D 準備好（或失敗改用簡易書背）才收掉載入動畫
  const bookcase = document.getElementById('bookcase');
  bookcase.classList.remove('is-loading');
  bookcase.removeAttribute('aria-busy');
}

await start3d();

let resizeTimer = 0;
window.addEventListener('resize', () => {
  window.clearTimeout(resizeTimer);
  resizeTimer = window.setTimeout(() => {
    if (isOpening) return;
    // 寬度變了，每層放得下的書也會變，先重新分層再重建 3D
    renderShelfDom();
    if (shelf) shelf.build();
  }, 120);
});

// 從課程按返回時（bfcache），收掉打開到一半的書並更新進度
window.addEventListener('pageshow', (event) => {
  if (!event.persisted) return;
  resetOpening();
  renderShelfDom();
  if (shelf) shelf.build();
});
</script>
