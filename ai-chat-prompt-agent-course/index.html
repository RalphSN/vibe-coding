<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 對話 × Prompt × Agent 實戰課</title>
<meta name="description" content="從跟 AI 對話、寫 prompt，到操作 AI Agent、CLI 與 harness 的互動式課程。內容更新至 2026 年 10 月。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* ==========================================================================
   1. 設計 token（規格見 design-system.md）
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #FFFDF5;
  --surface: #FFFFFF;
  --ink: #0A0A0A;
  --ink-muted: #454545;
  --on-color: #0A0A0A;
  --link: #1747C9;
  --focus: #0047FF;
  --code-bg: #111111;
  --code-ink: #F2F0E6;

  --primary: #FFD60A;
  --accent: #FF7AB6;
  --success: #3DDC84;
  --warning: #FFA62B;
  --danger: #FF5A5A;
  --info: #5AA9FF;
  --highlight: #FFF08A;
  --danger-soft: #FFD3D3;

  --m0: #FFD60A; --m1: #FF8FAB; --m2: #5AA9FF; --m3: #7CE577;
  --m4: #FFA94D; --m5: #B9A3FF; --m6: #4FE0E0; --m7: #FF7A6B;
  --m8: #B5F04A; --m9: #FFB8F0; --m10: #FF5A5A; --m11: #D9D2BC;

  --font-display: "Archivo Black", "Noto Sans TC", system-ui, sans-serif;
  --font-ui: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-display: clamp(2.25rem, 5vw + 1rem, 4.5rem);
  --fs-h1: clamp(1.875rem, 3vw + 1rem, 3rem);
  --fs-h2: clamp(1.375rem, 1.5vw + 1rem, 2rem);
  --fs-h3: 1.25rem;
  --fs-body: 1.0625rem;
  --fs-small: 0.9375rem;
  --fs-label: 0.8125rem;
  --fs-code: 0.9375rem;
  --measure: 42rem;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;

  --bw-sm: 3px;
  --bw-lg: 4px;
  --shadow-off: 6px;
  --shadow-off-sm: 4px;
  --radius: 0;

  --dur-micro: 120ms;
  --dur-comp: 240ms;
  --dur-page: 360ms;
  --ease-snap: cubic-bezier(.34, 1.56, .64, 1);
  --ease-mech: cubic-bezier(.2, .9, .3, 1);
  --ease-step: steps(4, end);

  --topbar-h: 64px;
  --sidebar-w: 18rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151515;
    --surface: #202020;
    --ink: #FFFDF5;
    --ink-muted: #C9C5B8;
    --link: #8FB4FF;
    --focus: #FFD60A;
    --code-bg: #0A0A0A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151515;
  --surface: #202020;
  --ink: #FFFDF5;
  --ink-muted: #C9C5B8;
  --link: #8FB4FF;
  --focus: #FFD60A;
  --code-bg: #0A0A0A;
}

/* ==========================================================================
   2. 基礎
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + var(--sp-4)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.8;
  overflow-wrap: break-word;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 900; }
p { margin: 0 0 var(--sp-4); }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 2px; }
a:hover { text-decoration-thickness: 3px; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
ul, ol { padding-left: 1.4em; margin: 0 0 var(--sp-4); }
li + li { margin-top: var(--sp-1); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
code, kbd, pre { font-family: var(--font-mono); }
:not(pre) > code {
  font-size: .9em;
  background: var(--highlight);
  color: var(--on-color);
  border: 2px solid var(--on-color);
  padding: 0 .3em;
  overflow-wrap: anywhere;
}
kbd {
  display: inline-block;
  min-width: 1.8em;
  padding: 0 .4em;
  font-size: .85em;
  line-height: 1.6;
  text-align: center;
  background: var(--surface);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
mark { background: var(--highlight); color: var(--on-color); padding: 0 .15em; }

.skip-link {
  position: absolute; left: var(--sp-4); top: -100px; z-index: 100;
  padding: var(--sp-2) var(--sp-4);
  background: var(--primary); color: var(--on-color);
  border: var(--bw-sm) solid var(--on-color);
  font-weight: 700;
}
.skip-link:focus { top: var(--sp-2); }

/* ==========================================================================
   3. 貼紙標籤、徽章
   ========================================================================== */
.label {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-label);
  letter-spacing: .06em; text-transform: uppercase; line-height: 1.2;
  padding: var(--sp-1) var(--sp-2);
  background: var(--chip, var(--primary)); color: var(--on-color);
  border: var(--bw-sm) solid var(--on-color);
}
.label.tilt { transform: rotate(-2deg); }
.label.tilt-r { transform: rotate(1.5deg); }

.status {
  display: inline-block; flex: none;
  width: 18px; height: 18px;
  border: var(--bw-sm) solid var(--ink);
  background: var(--surface);
}
.status[data-state="visited"] { background: linear-gradient(to top, var(--primary) 50%, var(--surface) 50%); }
.status[data-state="done"] { background: var(--success); position: relative; }
.status[data-state="done"]::after {
  content: ""; position: absolute; left: 3px; top: -1px; width: 5px; height: 10px;
  border: solid var(--on-color); border-width: 0 3px 3px 0; transform: rotate(45deg);
}

/* ==========================================================================
   4. 可按壓元件（陰影用偽元素，只對 transform 做動畫）
   ========================================================================== */
.nb-press {
  --off: var(--shadow-off-sm);
  --face: var(--surface);
  --face-ink: var(--ink);
  --edge: var(--ink);
  position: relative;
  isolation: isolate;
  background: transparent;
  border: 0;
  color: var(--face-ink);
  transition: transform var(--dur-micro) var(--ease-mech);
}
.nb-press::before,
.nb-press::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
}
.nb-press::before {
  z-index: -2;
  background: var(--edge);
  transform: translate(var(--off), var(--off));
  transition: transform var(--dur-micro) var(--ease-mech);
}
.nb-press::after {
  z-index: -1;
  background: var(--face);
  border: var(--bw-sm) solid var(--edge);
}
.nb-press:hover:not(:disabled) { transform: translate(-2px, -2px); }
.nb-press:hover:not(:disabled)::before { transform: translate(calc(var(--off) + 2px), calc(var(--off) + 2px)); }
.nb-press:active:not(:disabled) { transform: translate(var(--off), var(--off)); }
.nb-press:active:not(:disabled)::before { transform: translate(0, 0); }
.nb-press.nb-press:disabled { cursor: not-allowed; --face-ink: var(--ink-muted); }
.nb-press:disabled::before { display: none; }
.nb-press:disabled::after {
  background: repeating-linear-gradient(-45deg, var(--surface) 0 6px, var(--bg) 6px 12px);
  border-style: dashed;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 44px;
  padding: var(--sp-2) var(--sp-4);
  font-family: var(--font-ui); font-weight: 700; font-size: 1rem; line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { --face: var(--primary); --face-ink: var(--on-color); }
.btn.success { --face: var(--success); --face-ink: var(--on-color); }
.btn.danger { --face: var(--danger); --face-ink: var(--on-color); }
.btn.small { min-height: 36px; padding: var(--sp-1) var(--sp-3); font-size: var(--fs-small); }
.btn.icon { width: 44px; padding: 0; font-size: 1.25rem; }
.btn.big { --off: var(--shadow-off); min-height: 56px; padding: var(--sp-3) var(--sp-5); font-size: 1.125rem; }
a.btn { color: var(--face-ink); }

.card {
  position: relative;
  background: var(--surface);
  border: var(--bw-lg) solid var(--ink);
  box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink);
  padding: var(--sp-5);
}

/* ==========================================================================
   5. 版面：頂部列、側邊選單、主內容、頁尾
   ========================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: var(--topbar-h);
  padding: var(--sp-2) var(--sp-4);
  background: var(--bg);
  border-bottom: var(--bw-lg) solid var(--ink);
}
.brand {
  display: flex; align-items: baseline; gap: .25em; flex-wrap: wrap;
  font-family: var(--font-display); font-size: 1.05rem; line-height: 1.1;
  color: var(--ink); text-decoration: none;
  flex: none;
}
.brand .x { color: var(--ink); background: var(--primary); color: var(--on-color); padding: 0 .2em; border: 2px solid var(--on-color); }
.brand .brand-long { display: none; }
.topbar .spacer { flex: 1; }
.top-progress {
  display: none; align-items: center; gap: var(--sp-2);
  font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-small);
}

.progress {
  display: inline-block; vertical-align: middle;
  position: relative; overflow: hidden;
  height: 16px; min-width: 96px;
  background: var(--surface);
  border: var(--bw-sm) solid var(--ink);
}
.progress > span {
  position: absolute; inset: 0;
  background: var(--fill, var(--primary));
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
  transition: transform var(--dur-comp) var(--ease-snap);
}
.progress.thin { height: 10px; min-width: 0; }

.layout { display: block; overflow-x: clip; }
.sidebar {
  position: fixed; z-index: 60;
  top: 0; bottom: 0; left: 0;
  width: min(86vw, 22rem);
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg);
  border-right: var(--bw-lg) solid var(--ink);
  transform: translateX(-105%);
  visibility: hidden;
  transition: transform var(--dur-comp) var(--ease-mech), visibility 0s linear var(--dur-comp);
}
.sidebar.open { transform: none; visibility: visible; transition: transform var(--dur-comp) var(--ease-snap); }
.sidebar-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg);
  border-bottom: var(--bw-sm) solid var(--ink);
}
.scrim {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(10, 10, 10, .55);
}
.scrim[hidden] { display: none; }

.nav { padding: var(--sp-3) var(--sp-3) var(--sp-7); }
.nav-overall { margin: 0 var(--sp-1) var(--sp-4); font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-small); }
.nav-overall .progress { display: block; margin-top: var(--sp-1); }
.nav-module + .nav-module { margin-top: var(--sp-2); }
.nav-module-btn {
  display: flex; align-items: center; gap: var(--sp-2);
  width: 100%; min-height: 44px;
  padding: var(--sp-2);
  text-align: left; cursor: pointer;
  background: var(--surface);
  border: var(--bw-sm) solid var(--ink);
  font-weight: 700; line-height: 1.3;
}
.nav-module-btn .num {
  flex: none; display: grid; place-items: center;
  width: 30px; height: 30px;
  font-family: var(--font-ui); font-weight: 700;
  background: var(--chip); color: var(--on-color);
  border: 2px solid var(--on-color);
}
.nav-module-btn .t { flex: 1; min-width: 0; }
.nav-module-btn .count { font-family: var(--font-ui); font-size: var(--fs-label); color: var(--ink-muted); }
.nav-module-btn .caret { transition: transform var(--dur-comp) var(--ease-snap); }
.nav-module-btn[aria-expanded="true"] .caret { transform: rotate(90deg); }
.nav-lessons { list-style: none; margin: 0; padding: var(--sp-1) 0 var(--sp-1) var(--sp-3); border-left: var(--bw-sm) solid var(--ink); margin-left: var(--sp-4); }
.nav-lessons[hidden] { display: none; }
.nav-lessons li { margin: 0; }
.nav-link {
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 40px;
  padding: var(--sp-1) var(--sp-2);
  color: var(--ink); text-decoration: none;
  font-size: var(--fs-small); line-height: 1.4;
}
.nav-link:hover { background: var(--surface); text-decoration: underline; }
.nav-link .lid { font-family: var(--font-ui); font-weight: 700; flex: none; min-width: 2.4em; }
.nav-link[aria-current="page"] {
  background: var(--primary); color: var(--on-color);
  outline: var(--bw-sm) solid var(--on-color); outline-offset: -3px;
  font-weight: 700;
}
.nav-link .suggest { margin-left: auto; }

main {
  display: block;
  min-width: 0;
  padding: var(--sp-5) var(--sp-4) var(--sp-8);
}
main:focus { outline: none; }
.content { max-width: var(--measure); margin: 0 auto; }
.wide { max-width: 72rem; margin: 0 auto; }

.toc { display: none; }

.site-footer {
  border-top: var(--bw-lg) solid var(--ink);
  padding: var(--sp-6) var(--sp-4) var(--sp-7);
  background: var(--surface);
  font-size: var(--fs-small);
}
.site-footer .inner { max-width: 72rem; margin: 0 auto; display: grid; gap: var(--sp-4); }
.updated-stamp { justify-self: start; }
.ref-list { columns: 1; column-gap: var(--sp-6); margin-top: var(--sp-3); }
.ref-list li { break-inside: avoid; }

@media (min-width: 768px) {
  .brand .brand-long { display: inline; }
  .brand .brand-short { display: none; }
  .top-progress { display: flex; }
  main { padding: var(--sp-6) var(--sp-6) var(--sp-9); }
  .ref-list { columns: 2; }
}

@media (min-width: 1280px) {
  .menu-btn, .sidebar-close { display: none !important; }
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 14rem;
    align-items: start;
  }
  .sidebar {
    position: sticky; top: var(--topbar-h);
    height: calc(100vh - var(--topbar-h));
    width: auto;
    transform: none; visibility: visible;
    border-right: var(--bw-lg) solid var(--ink);
    transition: none;
  }
  .sidebar-head { display: none; }
  .scrim { display: none !important; }
  .toc {
    display: block;
    position: sticky; top: calc(var(--topbar-h) + var(--sp-6));
    padding: 0 var(--sp-4) 0 0;
    font-size: var(--fs-small);
  }
  .toc ol { list-style: none; padding: 0; margin: var(--sp-2) 0 0; border-left: var(--bw-sm) solid var(--ink); }
  .toc a { display: block; padding: var(--sp-1) var(--sp-3); color: var(--ink); text-decoration: none; line-height: 1.4; }
  .toc a:hover { text-decoration: underline; }
  .toc a.active { background: var(--primary); color: var(--on-color); font-weight: 700; }
  .ref-list { columns: 3; }
}

/* ==========================================================================
   6. 首頁、模組頁、單元頁
   ========================================================================== */
.hero { position: relative; padding: var(--sp-5) 0 var(--sp-7); }
.hero h1 { font-family: var(--font-display); font-size: var(--fs-display); line-height: 1.05; letter-spacing: -.01em; }
.hero h1 .hl { display: inline-block; background: var(--primary); color: var(--on-color); padding: 0 .15em; border: var(--bw-lg) solid var(--on-color); transform: rotate(-1.5deg); }
.hero h1 .hl2 { display: inline-block; background: var(--accent); color: var(--on-color); padding: 0 .15em; border: var(--bw-lg) solid var(--on-color); transform: rotate(1deg); }
.hero .lead { max-width: 36rem; margin-top: var(--sp-5); font-size: 1.125rem; }
.hero .actions { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin-top: var(--sp-5); }
.hero .stickers { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }

.section-title { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-7) 0 var(--sp-5); font-size: var(--fs-h2); }

.module-grid { display: grid; gap: var(--sp-5); grid-template-columns: 1fr; }
@media (min-width: 768px) { .module-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .module-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.module-card {
  --off: var(--shadow-off);
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-5);
  color: var(--ink); text-decoration: none;
}
.module-card::after { border-width: var(--bw-lg); }
.module-card .top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.module-card .big-num {
  font-family: var(--font-display); font-size: 2.5rem; line-height: 1;
  background: var(--chip); color: var(--on-color);
  border: var(--bw-sm) solid var(--on-color);
  padding: var(--sp-1) var(--sp-3);
  transform: rotate(-3deg);
}
.module-card h3 { font-size: var(--fs-h3); }
.module-card p { margin: 0; color: var(--ink-muted); font-size: var(--fs-small); line-height: 1.6; }
.module-card .meta { display: flex; align-items: center; gap: var(--sp-3); margin-top: auto; font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-small); }
.module-card .meta .progress { flex: 1; }
.module-card.is-here { --face: var(--highlight); --face-ink: var(--on-color); }
.module-card.is-here p { color: var(--on-color); }
.here-tag { --chip: var(--accent); }

.lesson-head { position: relative; padding-bottom: var(--sp-5); margin-bottom: var(--sp-6); border-bottom: var(--bw-lg) solid var(--ink); }
.lesson-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-4); font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-small); }
.lesson-meta .progress { width: 120px; }
.lesson-head h1 { font-size: var(--fs-h1); line-height: 1.15; }
.lesson-head h1:focus { outline: none; }
.lesson-head .lid-big {
  display: inline-block; margin-bottom: var(--sp-3);
  font-family: var(--font-display); font-size: 1.5rem; line-height: 1;
  background: var(--chip); color: var(--on-color);
  border: var(--bw-lg) solid var(--on-color);
  padding: var(--sp-2) var(--sp-3);
  transform: rotate(-2deg);
}

.lsec { margin: var(--sp-7) 0; scroll-margin-top: calc(var(--topbar-h) + var(--sp-4)); }
.lsec > .label { margin-bottom: var(--sp-4); }
.lsec h2 { font-size: var(--fs-h2); margin-bottom: var(--sp-4); }
.goals { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--sp-3); counter-reset: g; }
.goals li { counter-increment: g; display: flex; gap: var(--sp-3); align-items: flex-start; margin: 0; padding: var(--sp-3) var(--sp-4); background: var(--surface); border: var(--bw-sm) solid var(--ink); font-weight: 500; }
.goals li::before { content: counter(g); flex: none; display: grid; place-items: center; width: 30px; height: 30px; font-family: var(--font-display); background: var(--chip); color: var(--on-color); border: 2px solid var(--on-color); }

.lesson-nav { display: grid; gap: var(--sp-4); grid-template-columns: 1fr; margin-top: var(--sp-7); }
@media (min-width: 768px) { .lesson-nav { grid-template-columns: 1fr 1fr; } }
.lesson-nav a { --off: var(--shadow-off); display: block; padding: var(--sp-4); color: var(--ink); text-decoration: none; }
.lesson-nav a .dir { font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-label); letter-spacing: .06em; }
.lesson-nav a .ttl { display: block; font-weight: 700; margin-top: var(--sp-1); line-height: 1.4; }
.lesson-nav .next { text-align: right; --face: var(--primary); --face-ink: var(--on-color); }
@media (min-width: 768px) { .lesson-nav .next:only-child { grid-column: 2; } }

.done-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4); margin-top: var(--sp-7); padding: var(--sp-5); background: var(--surface); border: var(--bw-lg) solid var(--ink); }
.stamp {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-family: var(--font-display); font-size: 1.25rem;
  padding: var(--sp-2) var(--sp-4);
  color: var(--on-color); background: var(--success);
  border: var(--bw-lg) solid var(--on-color);
  transform: rotate(-6deg);
}
.stamp.animate { animation: stamp-in 420ms var(--ease-step) both; }
@keyframes stamp-in {
  from { opacity: 0; transform: scale(2.2) rotate(-18deg); }
  to { opacity: 1; transform: scale(1) rotate(-6deg); }
}

.placeholder { padding: var(--sp-6); text-align: center; background: repeating-linear-gradient(-45deg, var(--surface) 0 10px, var(--bg) 10px 20px); border: var(--bw-lg) dashed var(--ink); }

/* 換課轉場、卡片落定 */
.view-enter { animation: view-in var(--dur-page) var(--ease-mech) backwards; }
@keyframes view-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.drop-in { animation: drop-in var(--dur-comp) var(--ease-snap) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes drop-in { from { opacity: 0; transform: translate(-10px, -14px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }

/* ==========================================================================
   7. 共用元件
   ========================================================================== */
.linklike { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; cursor: pointer; }

/* 內文區塊 */
.blocks > * + * { margin-top: var(--sp-4); }
.blocks > p { margin-bottom: 0; }
.blocks ul, .blocks ol { margin-bottom: 0; }
.figure { margin: 0; padding: var(--sp-4); background: var(--surface); border: var(--bw-lg) solid var(--ink); box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink); }
.figure svg { display: block; width: 100%; height: auto; }
.figure figcaption { margin-top: var(--sp-3); font-size: var(--fs-small); color: var(--ink-muted); }
.figure svg .fill-ink { fill: var(--ink); }
.figure svg .stroke-ink { stroke: var(--ink); }
.figure svg .fill-surface { fill: var(--surface); }
.figure svg .fill-bg { fill: var(--bg); }
.figure svg text { fill: var(--ink); font-family: var(--font-body); }
.figure svg .on-color, .figure svg .on-color text { fill: var(--on-color); }

/* 提示框 */
.callout {
  --cb: var(--info);
  position: relative;
  padding: var(--sp-4) var(--sp-4) var(--sp-4) calc(var(--sp-4) + 12px);
  background: var(--surface);
  border: var(--bw-lg) solid var(--ink);
}
.callout::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--cb); border-right: var(--bw-sm) solid var(--ink); }
.callout > .label { --chip: var(--cb); margin-bottom: var(--sp-3); }
.callout > .body > :last-child { margin-bottom: 0; }
.callout.analogy { --cb: var(--info); }
.callout.limit { --cb: var(--warning); }
.callout.define { --cb: var(--info); }
.callout.mistake { --cb: var(--danger); }
.callout.keypoints { --cb: var(--primary); }
.callout.legacy { --cb: var(--m11); }
.callout.unverified { --cb: var(--warning); border-style: dashed; }
.callout.tip { --cb: var(--success); }
.callout.danger { --cb: var(--danger); }

.pair { display: grid; gap: var(--sp-5); }
@media (min-width: 768px) {
  .pair { grid-template-columns: 1fr 1fr; align-items: start; }
  .pair > :nth-child(2) { margin-top: var(--sp-6); }
}

/* 正式定義 */
.defs { display: grid; gap: var(--sp-3); margin: 0; }
.defs > div { padding: var(--sp-3) var(--sp-4); background: var(--surface); border: var(--bw-sm) solid var(--ink); }
.defs dt { font-weight: 900; }
.defs dt .en { font-family: var(--font-ui); font-weight: 500; color: var(--ink-muted); margin-left: var(--sp-2); }
.defs dd { margin: var(--sp-1) 0 0; }

/* Prompt 對照器 */
.compare { border: var(--bw-lg) solid var(--ink); background: var(--surface); box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink); }
.compare + .compare { margin-top: var(--sp-6); }
.compare-title { padding: var(--sp-3) var(--sp-4); border-bottom: var(--bw-lg) solid var(--ink); font-weight: 900; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.compare-grid { display: grid; }
.compare-side { padding: var(--sp-4); min-width: 0; }
.compare-side + .compare-side { border-top: var(--bw-lg) solid var(--ink); }
.compare-side .side-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.compare-side.bad .label { --chip: var(--danger); }
.compare-side.good .label { --chip: var(--success); }
.prompt-text {
  margin: 0;
  padding: var(--sp-3) var(--sp-4);
  font-family: var(--font-body); font-size: var(--fs-small); line-height: 1.75;
  white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--bg);
  border: 2px solid var(--ink);
}
.compare-side.bad .prompt-text { border-style: dashed; }
.prompt-text .ctx { display: block; font-family: var(--font-ui); font-size: var(--fs-label); font-weight: 700; letter-spacing: .06em; color: var(--ink-muted); }
mark.diff { position: relative; background: var(--highlight); color: var(--on-color); padding: 0 .15em; border-bottom: 2px solid var(--on-color); }
mark.diff::after { content: attr(data-n); display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; margin-left: .2em; font-family: var(--font-ui); font-weight: 700; font-size: .7em; vertical-align: super; background: var(--on-color); color: var(--highlight); }
.compare-side.bad mark.diff { background: var(--danger-soft); }
.why { padding: var(--sp-4); border-top: var(--bw-lg) solid var(--ink); background: var(--bg); }
.why ol { list-style: none; padding: 0; margin: var(--sp-2) 0 0; display: grid; gap: var(--sp-2); }
.why li { display: flex; gap: var(--sp-3); margin: 0; }
.why li .n { flex: none; display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; font-family: var(--font-ui); font-weight: 700; font-size: .85em; background: var(--ink); color: var(--bg); }
@media (min-width: 768px) {
  .compare.side-by-side .compare-grid { grid-template-columns: 1fr 1fr; }
  .compare.side-by-side .compare-side + .compare-side { border-top: 0; border-left: var(--bw-lg) solid var(--ink); }
}

/* 換你補完 */
.tryit { padding: var(--sp-4); background: var(--surface); border: var(--bw-lg) dashed var(--ink); }
.tryit > .label { --chip: var(--accent); margin-bottom: var(--sp-3); }
.blank { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--ink); }

/* 常見錯誤 */
.mistakes { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--sp-4); counter-reset: mk; }
.mistakes > li { counter-increment: mk; margin: 0; background: var(--surface); border: var(--bw-sm) solid var(--ink); }
.mistakes .row { display: grid; grid-template-columns: 5.5em 1fr; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); }
.mistakes .row + .row { border-top: 2px solid var(--ink); }
.mistakes .k { font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-label); letter-spacing: .04em; align-self: start; padding: 2px var(--sp-2); border: 2px solid var(--on-color); color: var(--on-color); text-align: center; }
.mistakes .k.wrong { background: var(--danger); }
.mistakes .k.why { background: var(--warning); }
.mistakes .k.right { background: var(--success); }
@media (max-width: 420px) { .mistakes .row { grid-template-columns: 1fr; gap: var(--sp-1); } .mistakes .k { justify-self: start; } }

/* 揭曉答案 */
details.reveal { border: var(--bw-sm) solid var(--ink); background: var(--surface); }
details.reveal > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 44px; padding: var(--sp-2) var(--sp-4);
  font-family: var(--font-ui); font-weight: 700;
  background: var(--primary); color: var(--on-color);
}
details.reveal > summary::-webkit-details-marker { display: none; }
details.reveal > summary::before { content: "▸"; display: inline-block; transition: transform var(--dur-comp) var(--ease-snap); }
details.reveal[open] > summary::before { transform: rotate(90deg); }
details.reveal[open] > summary { border-bottom: var(--bw-sm) solid var(--ink); }
details.reveal > .reveal-body { padding: var(--sp-4); }
details.reveal[open] > .reveal-body { animation: reveal-in var(--dur-comp) var(--ease-snap) backwards; }
details.reveal > .reveal-body > :last-child { margin-bottom: 0; }
@keyframes reveal-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* 測驗 */
.quiz-list { display: grid; gap: var(--sp-5); }
.quiz { padding: var(--sp-4); background: var(--surface); border: var(--bw-lg) solid var(--ink); }
.quiz-head { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.quiz-head .lv { --chip: var(--m11); }
.quiz-head .lv[data-lv="回想"] { --chip: var(--info); }
.quiz-head .lv[data-lv="應用"] { --chip: var(--warning); }
.quiz-head .lv[data-lv="遷移"] { --chip: var(--accent); }
.quiz-q { font-weight: 700; margin-bottom: var(--sp-3); }
.quiz fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.quiz legend { padding: 0; font-weight: 700; margin-bottom: var(--sp-3); }
.opts { display: grid; gap: var(--sp-2); }
.opt { position: relative; display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-2) var(--sp-3); min-height: 44px; border: var(--bw-sm) solid var(--ink); background: var(--bg); cursor: pointer; line-height: 1.6; }
.opt input { flex: none; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--ink); }
.opt:hover { background: var(--highlight); color: var(--on-color); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt .mark { margin-left: auto; font-family: var(--font-ui); font-weight: 700; flex: none; }
.quiz.answered .opt { cursor: default; }
.quiz.answered .opt:hover { background: var(--bg); color: inherit; }
.opt.is-correct, .quiz.answered .opt.is-correct:hover { background: var(--success); color: var(--on-color); }
.opt.is-wrong, .quiz.answered .opt.is-wrong:hover { background: var(--danger); color: var(--on-color); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; margin-top: var(--sp-4); }
.quiz-feedback { margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4); border: var(--bw-sm) solid var(--ink); background: var(--bg); }
.quiz-feedback .verdict { font-family: var(--font-ui); font-weight: 700; }
.quiz-feedback > :last-child { margin-bottom: 0; }
.review-from { --chip: var(--m11); }

/* 程式碼區塊 */
.code { border: var(--bw-lg) solid var(--ink); background: var(--code-bg); box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink); min-width: 0; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3); background: var(--surface); border-bottom: var(--bw-lg) solid var(--ink); }
.code-head .lang { font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-label); letter-spacing: .06em; text-transform: uppercase; }
.code-head .ttl { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.code pre { margin: 0; padding: var(--sp-4); overflow-x: auto; color: var(--code-ink); font-size: var(--fs-code); line-height: 1.65; tab-size: 2; }
.code pre code { font-family: var(--font-mono); background: none; border: 0; padding: 0; color: inherit; white-space: pre; }
.copy-btn.copied { --face: var(--success); --face-ink: var(--on-color); }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-section { color: #FF8FAB; }
.hljs-string, .hljs-attr-value, .hljs-template-string, .hljs-regexp { color: #B5F04A; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: #FFD60A; }
.hljs-comment, .hljs-quote, .hljs-meta { color: #A3A3A3; font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title { color: #4FE0E0; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params, .hljs-property, .hljs-name, .hljs-tag { color: #FFA94D; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* 表格 */
.table-wrap { overflow-x: auto; border: var(--bw-lg) solid var(--ink); background: var(--surface); }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: var(--fs-small); line-height: 1.6; }
.table-wrap th, .table-wrap td { padding: var(--sp-2) var(--sp-3); border: 2px solid var(--ink); text-align: left; vertical-align: top; min-width: 7em; }
.table-wrap tr > :first-child { border-left: 0; }
.table-wrap tr > :last-child { border-right: 0; }
.table-wrap thead th { background: var(--chip, var(--primary)); color: var(--on-color); border-top: 0; font-family: var(--font-ui); }
.table-wrap tbody tr:last-child > * { border-bottom: 0; }
.table-wrap caption { caption-side: top; text-align: left; padding: var(--sp-2) var(--sp-3); font-weight: 700; border-bottom: 2px solid var(--ink); }

/* 分頁 */
.tabs { min-width: 0; }
.tablist { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: -4px; position: relative; z-index: 1; }
.tab {
  min-height: 44px; padding: var(--sp-2) var(--sp-4);
  font-family: var(--font-ui); font-weight: 700;
  background: var(--surface); color: var(--ink);
  border: var(--bw-sm) solid var(--ink);
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--primary); color: var(--on-color); border-bottom-color: var(--primary); border-color: var(--on-color); border-bottom-width: 7px; margin-bottom: -4px; }
.tabpanel { padding: var(--sp-4); border: var(--bw-lg) solid var(--ink); background: var(--surface); }
.tabpanel[hidden] { display: none; }
.tabpanel:not([hidden]) { animation: reveal-in var(--dur-comp) var(--ease-snap) backwards; }

/* 舊做法 → 新做法 */
.legacy-grid { display: grid; gap: var(--sp-2); }
.legacy-row { display: grid; grid-template-columns: 1fr; gap: var(--sp-2); }
.legacy-row > div { padding: var(--sp-2) var(--sp-3); border: 2px solid var(--ink); background: var(--bg); }
.legacy-row .old { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-muted); }
.legacy-row .arrow { display: none; }
@media (min-width: 768px) { .legacy-row { grid-template-columns: 1fr auto 1fr; align-items: center; } .legacy-row .arrow { display: block; border: 0; background: none; padding: 0; font-weight: 900; } }

/* 術語與 tooltip */
.term {
  display: inline; padding: 0; margin: 0;
  background: none; border: 0;
  color: inherit; font: inherit; line-height: inherit;
  border-bottom: 2px dashed currentColor;
  cursor: help;
}
.term:hover, .term[aria-expanded="true"] { background: var(--highlight); color: var(--on-color); }
.tooltip {
  position: fixed; z-index: 90;
  max-width: min(20rem, calc(100vw - 32px));
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface); color: var(--ink);
  border: var(--bw-sm) solid var(--ink);
  box-shadow: var(--shadow-off-sm) var(--shadow-off-sm) 0 var(--ink);
  font-size: var(--fs-small); line-height: 1.6;
  pointer-events: none;
}
.tooltip[hidden] { display: none; }
.tooltip:not([hidden]) { animation: tip-in var(--dur-comp) var(--ease-snap) backwards; }
@keyframes tip-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tooltip .tt-term { font-weight: 900; display: block; }
.tooltip .tt-en { font-family: var(--font-ui); color: var(--ink-muted); }

/* 搜尋 */
.search { position: relative; min-width: 0; flex: 1 1 auto; max-width: 18rem; }
.search input {
  width: 100%; min-height: 44px;
  padding: var(--sp-2) var(--sp-3) var(--sp-2) 2.2em;
  background: var(--surface); color: var(--ink);
  border: var(--bw-sm) solid var(--ink);
  font-size: 1rem;
}
.search input::placeholder { color: var(--ink-muted); opacity: 1; }
.search .ico { position: absolute; left: .7em; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search .hint { position: absolute; right: .6em; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search input:focus + .hint, .search input:not(:placeholder-shown) + .hint { display: none; }
.search-results {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 70;
  width: min(26rem, calc(100vw - 32px));
  max-height: min(70vh, 32rem); overflow-y: auto;
  margin: 0; padding: 0; list-style: none;
  background: var(--surface);
  border: var(--bw-lg) solid var(--ink);
  box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink);
}
.search-results[hidden] { display: none; }
.search-results .grp { padding: var(--sp-1) var(--sp-3); font-family: var(--font-ui); font-weight: 700; font-size: var(--fs-label); letter-spacing: .06em; background: var(--bg); border-bottom: 2px solid var(--ink); }
.search-results [role="option"] { margin: 0; padding: var(--sp-2) var(--sp-3); border-bottom: 2px solid var(--ink); cursor: pointer; line-height: 1.5; }
.search-results [role="option"] small { display: block; color: var(--ink-muted); }
.search-results [role="option"][aria-selected="true"] { background: var(--primary); color: var(--on-color); }
.search-results [role="option"][aria-selected="true"] small { color: var(--on-color); }
.search-results .empty { padding: var(--sp-3); }
@media (max-width: 767px) { .search .hint { display: none; } .search input { padding-right: var(--sp-2); } }

/* Prompt 組裝器 */
.builder { display: grid; gap: var(--sp-5); }
.builder-presets { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.builder-fields { display: grid; gap: var(--sp-3); }
.bfield { border: var(--bw-sm) solid var(--ink); background: var(--surface); }
.bfield-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-bottom: 2px solid var(--ink); background: var(--bg); }
.bfield-head label { display: flex; align-items: center; gap: var(--sp-2); font-weight: 700; cursor: pointer; min-height: 32px; }
.bfield-head input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ink); }
.bfield-head .tag { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-label); color: var(--ink-muted); }
.bfield textarea { display: block; width: 100%; min-height: 4.5em; padding: var(--sp-2) var(--sp-3); border: 0; background: var(--surface); color: var(--ink); resize: vertical; line-height: 1.6; }
.bfield textarea:focus-visible { outline-offset: -3px; }
.bfield.off textarea { opacity: .45; }
.bfield .help { padding: 0 var(--sp-3) var(--sp-2); font-size: var(--fs-label); color: var(--ink-muted); line-height: 1.5; }
.builder-out { position: relative; }
.builder-status { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.builder-status .label.missing { --chip: var(--surface); color: var(--ink); border-style: dashed; border-color: var(--ink); }
.builder-status .label.ok { --chip: var(--success); }
@media (min-width: 1280px) { .builder.two-col { grid-template-columns: 1fr 1fr; align-items: start; } .builder.two-col .builder-out { position: sticky; top: calc(var(--topbar-h) + var(--sp-4)); } }

/* 檢查清單 */
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--sp-2); }
.checklist li { margin: 0; }
.checklist label { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-2) var(--sp-3); min-height: 44px; border: var(--bw-sm) solid var(--ink); background: var(--surface); cursor: pointer; line-height: 1.6; }
.checklist input { flex: none; width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ink); }
.checklist label:has(input:checked) { background: var(--success); color: var(--on-color); }
.checklist label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

.ref-h { margin: var(--sp-7) 0 var(--sp-4); scroll-margin-top: calc(var(--topbar-h) + var(--sp-4)); }

/* Agent loop 動畫 */
.loop { display: grid; gap: var(--sp-5); }
@media (min-width: 768px) { .loop { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
.loop-node rect, .loop-done rect { fill: var(--surface); }
.loop-node text, .loop-done text { fill: var(--ink); }
.loop-node.is-active rect { fill: var(--primary); }
.loop-done.is-active rect { fill: var(--success); }
.loop-node.is-active text, .loop-done.is-active text { fill: var(--on-color); }
.loop-node, .loop-done { transform-box: fill-box; transform-origin: center; transition: transform var(--dur-comp) var(--ease-snap); }

<script>
/* ==========================================================================
   App
   ========================================================================== */
(() => {
'use strict';

const STORAGE_KEY = 'ai-chat-prompt-agent-course.v1';
const READ_CHARS_PER_MIN = 300;
const MINUTES_PER_QUESTION = 0.75;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 進度儲存：所有讀寫包在 try/catch，失敗時退回記憶體 ---------- */
const Store = (() => {
  const fallback = { done: {}, visited: {}, quiz: {}, level: null, theme: null, openModules: {} };
  let state = structuredCloneSafe(fallback);
  let isPersistent = true;

  function structuredCloneSafe(obj) { return JSON.parse(JSON.stringify(obj)); }

  function load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) state = Object.assign(structuredCloneSafe(fallback), JSON.parse(raw));
    } catch (err) {
      isPersistent = false;
      console.warn('進度無法從 localStorage 讀取，改用暫存模式：', err);
    }
  }
  function save() {
    if (!isPersistent) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      isPersistent = false;
      console.warn('進度無法寫入 localStorage，改用暫存模式：', err);
    }
  }
  load();
  return {
    get: () => state,
    persistent: () => isPersistent,
    update(fn) { fn(state); save(); },
    reset() { state = structuredCloneSafe(fallback); save(); },
  };
})();

function lessonState(id) {
  const s = Store.get();
  if (s.done[id]) return 'done';
  if (s.visited[id]) return 'visited';
  return 'new';
}
function moduleProgress(mod) {
  const done = mod.lessons.filter((l) => Store.get().done[l.id]).length;
  return { done, total: mod.lessons.length };
}
function overallProgress() {
  const done = LESSONS.filter((l) => Store.get().done[l.id]).length;
  return { done, total: LESSONS.length };
}
const STATE_TEXT = { new: '未讀', visited: '讀到一半', done: '已完成' };

/* ---------- 文字處理：先跳脫，再套用輕量標記 ---------- */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/**
 * 內文標記：**粗體**、==螢光==、`程式碼`、{kbd:按鍵}、[[術語]] 或 [[術語|顯示文字]]、[文字](網址)
 * 內容一律先跳脫，因此資料中的 HTML 不會被執行。
 */
function md(str) {
  let out = esc(str);
  const codes = [];
  out = out.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  out = out.replace(/\{kbd:([^}]+)\}/g, '<kbd>$1</kbd>');
  out = out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, key, label) => termButton(key, label));
  out = out.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[Number(i)]}</code>`);
  return out;
}
/* 術語按鈕：tooltip 在元件區實作；這裡先輸出結構 */
function termButton(key, label) {
  const term = GLOSSARY[key];
  const text = label || key;
  if (!term) return `<span class="term-missing" title="術語表沒有這個詞">${text}</span>`;
  return `<button type="button" class="term" data-term="${esc(key)}">${text}</button>`;
}

/* ---------- 閱讀時間：中文每分鐘 300 字，練習每題另計 ---------- */
function collectText(value) {
  if (value == null) return '';
  if (typeof value === 'string') return value;
  if (Array.isArray(value)) return value.map(collectText).join('');
  if (typeof value === 'object') {
    return Object.entries(value).filter(([k]) => k !== 'svg' && k !== 'props').map(([, v]) => collectText(v)).join('');
  }
  return '';
}
function readingMinutes(lesson) {
  const c = lesson.content;
  if (!c) return null;
  if (c.minutes) return c.minutes;
  const text = collectText({ ...c, practice: null, review: null, sources: null }).replace(/<[^>]+>/g, '').replace(/\s+/g, '');
  const questions = (c.practice || []).length + (c.review || []).length;
  return Math.max(3, Math.round(text.length / READ_CHARS_PER_MIN + questions * MINUTES_PER_QUESTION));
}

/* ---------- 主題切換：跟隨系統 → 淺色 → 深色 ---------- */
const THEME_ORDER = [null, 'light', 'dark'];
const THEME_LABEL = { null: '跟隨系統', light: '淺色', dark: '深色' };
function applyTheme() {
  const theme = Store.get().theme;
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
  const btn = $('#theme-btn');
  btn.setAttribute('aria-label', `切換深淺色（目前：${THEME_LABEL[theme]}）`);
  btn.title = `目前：${THEME_LABEL[theme]}`;
}
function cycleTheme() {
  Store.update((s) => {
    const i = THEME_ORDER.indexOf(s.theme);
    s.theme = THEME_ORDER[(i + 1) % THEME_ORDER.length];
  });
  applyTheme();
  announce(`已切換為${THEME_LABEL[Store.get().theme]}`);
}

function announce(msg) {
  const live = $('#live');
  live.textContent = '';
  window.setTimeout(() => { live.textContent = msg; }, 30);
}

/* ---------- 側邊選單 ---------- */
let currentLessonId = null;

function renderNav() {
  const s = Store.get();
  const overall = overallProgress();
  const suggested = s.level != null ? LEVEL_START[s.level] : null;
  const html = [`
    <div class="nav-overall">全站進度 ${overall.done} / ${overall.total}
      <span class="progress thin" style="--p:${overall.done / overall.total}"><span></span></span>
    </div>`];
  COURSES.forEach((mod) => {
    const { done, total } = moduleProgress(mod);
    const containsCurrent = mod.lessons.some((l) => l.id === currentLessonId);
    const isOpen = containsCurrent || !!s.openModules[mod.id];
    html.push(`
      <div class="nav-module">
        <button class="nav-module-btn" type="button" aria-expanded="${isOpen}" aria-controls="nav-m${mod.id}" data-module="${mod.id}" style="--chip:var(--m${mod.id})">
          <span class="num">${mod.id}</span>
          <span class="t">${esc(mod.title)}</span>
          <span class="count">${done}/${total}</span>
          <span class="caret" aria-hidden="true">▸</span>
        </button>
        <ul class="nav-lessons" id="nav-m${mod.id}" ${isOpen ? '' : 'hidden'}>
          ${mod.lessons.map((l) => {
            const st = lessonState(l.id);
            const current = l.id === currentLessonId ? ' aria-current="page"' : '';
            const sug = suggested === l.id ? '<span class="label suggest" style="--chip:var(--accent)">建議起點</span>' : '';
            return `<li><a class="nav-link" href="#/l/${l.id}"${current}>
              <span class="status" data-state="${st}" role="img" aria-label="${STATE_TEXT[st]}"></span>
              <span class="lid">${l.id}</span><span>${esc(l.title)}</span>${sug}</a></li>`;
          }).join('')}
        </ul>
      </div>`);
  });
  $('#nav').innerHTML = html.join('');
}

function updateTopProgress() {
  const { done, total } = overallProgress();
  $('#top-progress-fill').parentElement.style.setProperty('--p', done / total);
  $('#top-progress-text').textContent = `${done} / ${total}`;
}

const Drawer = (() => {
  const sidebar = () => $('#sidebar');
  const isDesktop = () => window.matchMedia('(min-width: 1280px)').matches;
  let lastFocus = null;
  function open() {
    if (isDesktop()) return;
    lastFocus = document.activeElement;
    sidebar().classList.add('open');
    $('#scrim').hidden = false;
    $('.menu-btn').setAttribute('aria-expanded', 'true');
    const current = $('.nav-link[aria-current="page"]', sidebar()) || $('.sidebar-close');
    window.setTimeout(() => current.focus(), 50);
  }
  function close(restoreFocus = true) {
    if (!sidebar().classList.contains('open')) return;
    sidebar().classList.remove('open');
    $('#scrim').hidden = true;
    $('.menu-btn').setAttribute('aria-expanded', 'false');
    if (restoreFocus && lastFocus) lastFocus.focus();
  }
  function trap(e) {
    if (e.key !== 'Tab' || !sidebar().classList.contains('open')) return;
    const focusables = $$('button, a[href]', sidebar()).filter((el) => el.offsetParent !== null);
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  return { open, close, trap, isOpen: () => sidebar().classList.contains('open') };
})();

/* ---------- 路由 ---------- */
const LEVEL_START = { 1: '1-1', 2: '2-1', 3: '4-1', 4: '6-1' };

function parseRoute() {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] === 'l' && LESSON_BY_ID[parts[1]]) return { name: 'lesson', id: parts[1] };
  if (parts[0] === 'm' && COURSES[Number(parts[1])]) return { name: 'module', id: Number(parts[1]) };
  if (parts[0] === 'styleguide') return { name: 'styleguide' };
  if (parts[0] === 'references') return { name: 'references' };
  if (parts.length === 0) return { name: 'home' };
  return { name: 'notfound', raw: hash };
}

const Views = {};

function render() {
  const route = parseRoute();
  currentLessonId = route.name === 'lesson' ? route.id : null;
  const main = $('#main');
  const view = Views[route.name] || Views.notfound;
  main.innerHTML = view(route);
  $('#toc').innerHTML = route.name === 'lesson' ? renderToc(route.id) : '';
  if (!prefersReducedMotion()) {
    main.classList.remove('view-enter');
    void main.offsetWidth;
    main.classList.add('view-enter');
  }
  if (route.name === 'lesson') {
    Store.update((s) => { s.visited[route.id] = true; });
    document.title = `${route.id} ${LESSON_BY_ID[route.id].title}｜AI 對話 × Prompt × Agent 實戰課`;
  } else {
    document.title = 'AI 對話 × Prompt × Agent 實戰課';
  }
  renderNav();
  updateTopProgress();
  Drawer.close(false);
  hydrate(main);
  focusHeading(main);
}

function focusHeading(main) {
  const h1 = $('h1', main);
  if (!h1) return;
  h1.setAttribute('tabindex', '-1');
  if (window.scrollY > 0) window.scrollTo(0, 0);
  h1.focus({ preventScroll: true });
}

/* 每次渲染後啟用互動元件（元件區會往 Hydrators 加入函式） */
const Hydrators = [];
function hydrate(root) { Hydrators.forEach((fn) => fn(root)); }

/* ---------- 首頁 ---------- */
Views.home = () => {
  const s = Store.get();
  const overall = overallProgress();
  const resume = LESSONS.find((l) => s.visited[l.id] && !s.done[l.id]) || LESSONS.find((l) => !s.done[l.id]);
  const hereModule = resume ? resume.moduleId : null;
  const start = s.level != null ? LEVEL_START[s.level] : '0-1';
  const resumeBtn = overall.done > 0 || Object.keys(s.visited).length > 0
    ? `<a class="btn big primary nb-press" href="#/l/${resume ? resume.id : '0-1'}">從上次的地方繼續：${resume ? resume.id : '0-1'}</a>`
    : `<a class="btn big primary nb-press" href="#/l/${start}">從 ${start} 開始</a>`;
  return `
  <div class="wide">
    <section class="hero">
      <div class="stickers">
        <span class="label tilt" style="--chip:var(--accent)">${LESSONS.length} 個單元</span>
        <span class="label tilt-r" style="--chip:var(--success)">每單元 5–12 分鐘</span>
        <span class="label tilt" style="--chip:var(--info)">內容更新至 ${SITE.updated}</span>
      </div>
      <h1>從<span class="hl">跟 AI 說話</span><br>到<span class="hl2">讓 AI 動手</span></h1>
      <p class="lead">這門課從 LLM 的運作方式講起，一路到寫 prompt、設計 context、操作 AI agent 與 Claude Code。每個單元都有比喻、壞 prompt 與好 prompt 的對照，以及先思考再看答案的練習。</p>
      <div class="actions">
        ${resumeBtn}
        <a class="btn big nb-press" href="#/l/0-2">做能力自我評估</a>
      </div>
    </section>

    <h2 class="section-title"><span class="label" style="--chip:var(--primary)">學習地圖</span>12 個模組</h2>
    <div class="module-grid">
      ${COURSES.map((mod, i) => {
        const { done, total } = moduleProgress(mod);
        const isHere = mod.id === hereModule;
        return `<a class="module-card nb-press drop-in${isHere ? ' is-here' : ''}" href="#/m/${mod.id}" style="--chip:var(--m${mod.id});--i:${Math.min(i, 5)}">
          <span class="top"><span class="big-num">${String(mod.id).padStart(2, '0')}</span>
            ${isHere ? '<span class="label here-tag tilt-r">你在這裡</span>' : ''}</span>
          <h3>${esc(mod.title)}</h3>
          <p>${esc(mod.desc)}</p>
          <span class="meta"><span class="progress thin" style="--p:${done / total};--fill:var(--m${mod.id})"><span></span></span>${done} / ${total}</span>
        </a>`;
      }).join('')}
    </div>

    <h2 class="section-title"><span class="label" style="--chip:var(--m2)">怎麼用</span>本站的使用方式</h2>
    <div class="content" style="margin:0">
      <ul>
        <li>每個單元的結構都一樣：3 件事 → 暖身回顧 → 比喻 → 心智模型 → 定義 → 範例 → 常見錯誤 → 練習 → 三個重點。</li>
        <li>練習的答案預設隱藏，先想一想再按「看答案」。</li>
        <li>鍵盤：<kbd>←</kbd> <kbd>→</kbd> 切換上一課與下一課，<kbd>/</kbd> 搜尋。</li>
        <li>進度存在這台電腦的瀏覽器裡${Store.persistent() ? '' : '（目前瀏覽器不允許儲存，關閉分頁後進度會消失）'}。</li>
      </ul>
    </div>
  </div>`;
};

/* ---------- 模組頁 ---------- */
Views.module = ({ id }) => {
  const mod = COURSES[id];
  const { done, total } = moduleProgress(mod);
  const minutes = mod.lessons.map(readingMinutes).filter(Boolean).reduce((a, b) => a + b, 0);
  return `
  <div class="content">
    <header class="lesson-head" style="--chip:var(--m${mod.id})">
      <span class="lid-big">模組 ${mod.id}</span>

    <ol class="goals" style="--chip:var(--m${mod.id})">
      ${mod.lessons.map((l) => {
        const st = lessonState(l.id);
        const min = readingMinutes(l);
        return `<li><a href="#/l/${l.id}" style="flex:1;color:inherit">${l.id}　${esc(l.title)}</a>
          <span style="font-family:var(--font-ui);font-size:var(--fs-small);white-space:nowrap">${min ? `${min} 分` : ''}</span>
          <span class="status" data-state="${st}" role="img" aria-label="${STATE_TEXT[st]}"></span></li>`;
      }).join('')}
    </ol>
    <div class="lesson-nav"><a class="next nb-press" href="#/l/${mod.lessons[0].id}"><span class="dir">開始</span><span class="ttl">${mod.lessons[0].id} ${esc(mod.lessons[0].title)}</span></a></div>
  </div>`;
};

/* ---------- 單元頁 ---------- */
const SECTION_DEFS = [
  ['goals', '這課你會學到 3 件事'],
  ['review', '暖身回顧'],
  ['analogy', '比喻'],
  ['model', '心智模型'],
  ['define', '正式定義'],
  ['examples', '範例'],
  ['mistakes', '常見錯誤'],
  ['practice', '練習'],
  ['keypoints', '三個重點'],
];

/* 單元各段的渲染函式由元件區提供；這裡是退回用的簡單版本 */
const Sections = {
  goals: (c) => `<ol class="goals">${c.goals.map((g) => `<li>${md(g)}</li>`).join('')}</ol>`,
};

function lessonSections(lesson) {
  const c = lesson.content;
  return SECTION_DEFS.filter(([key]) => {
    if (c.layout === 'reference') return false;
    const v = c[key];
    return v != null && (!Array.isArray(v) || v.length > 0);
  });
}

function renderToc(id) {
  const lesson = LESSON_BY_ID[id];
  if (!lesson.content) return '';
  const secs = lesson.content.layout === 'reference'
    ? (lesson.content.blocks || []).filter((b) => b.type === 'heading').map((b) => [b.id, b.text])
    : lessonSections(lesson);
  if (!secs.length) return '';
  return `<span class="label" style="--chip:var(--m${lesson.moduleId})">本課段落</span>
    <ol>${secs.map(([key, label]) => `<li><a href="#/l/${id}" data-scroll="sec-${key}">${esc(label)}</a></li>`).join('')}</ol>`;
}

Views.lesson = ({ id }) => {
  const lesson = LESSON_BY_ID[id];
  const mod = COURSES[lesson.moduleId];
  const pos = LESSONS.indexOf(lesson);
  const prev = LESSONS[pos - 1];
  const next = LESSONS[pos + 1];
  const min = readingMinutes(lesson);
  const modP = moduleProgress(mod);
  const c = lesson.content;
  const isDone = !!Store.get().done[id];

  let body;
  if (!c) {
    body = `<div class="placeholder"><span class="label" style="--chip:var(--warning)">製作中</span><p style="margin-top:var(--sp-3)">這個單元的內容還在製作。</p></div>`;
  } else if (c.layout === 'reference') {
    body = (Sections.reference ? Sections.reference(c, lesson) : '');
  } else {
    body = lessonSections(lesson).map(([key, label]) => {
      const fn = Sections[key];
      const inner = fn ? fn(c, lesson) : '';
      return `<section class="lsec" id="sec-${key}" aria-labelledby="h-${key}">
        <h2 id="h-${key}"><span class="label" style="--chip:var(--m${mod.id})">${esc(label)}</span></h2>
        ${inner}
      </section>`;
    }).join('');
  }

  const sources = c && c.sources && Sections.sources ? Sections.sources(c) : '';

  return `
  <article class="content" style="--chip:var(--m${mod.id})">
    <header class="lesson-head">
      <div class="lesson-meta">
        <a class="label" href="#/m/${mod.id}" style="text-decoration:none">模組 ${mod.id}・${esc(mod.short)}</a>
        <span>單元 ${lesson.index + 1} / ${mod.lessons.length}</span>
        <span class="progress" style="--p:${(modP.done) / modP.total};--fill:var(--m${mod.id})" role="progressbar" aria-label="本模組進度" aria-valuemin="0" aria-valuemax="${modP.total}" aria-valuenow="${modP.done}"><span></span></span>
        ${min ? `<span>閱讀時間：約 ${min} 分鐘</span>` : ''}
      </div>
      <span class="lid-big">${lesson.id}</span>
      <h1>${esc(lesson.title)}</h1>
    </header>
    ${body}
    ${sources}
    ${c ? `<div class="done-row" id="done-row">
      ${isDone
        ? `<span class="stamp">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
        : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完、做完練習後按一下。</span>`}
    </div>` : ''}
    <nav class="lesson-nav" aria-label="上一課與下一課">
      ${prev ? `<a class="prev nb-press" href="#/l/${prev.id}" rel="prev"><span class="dir">← 上一課</span><span class="ttl">${prev.id} ${esc(prev.title)}</span></a>` : ''}
      ${next ? `<a class="next nb-press" href="#/l/${next.id}" rel="next"><span class="dir">下一課 →</span><span class="ttl">${next.id} ${esc(next.title)}</span></a>` : ''}
    </nav>
  </article>`;
};

Views.notfound = (route) => `
  <div class="content">
    <h1>找不到這個頁面</h1>
    <p>網址「${esc(route.raw || '')}」沒有對應的頁面。</p>
    <a class="btn primary nb-press" href="#/">回到首頁</a>
  </div>`;

/* ---------- 頁尾：更新標示與參考資料列表 ---------- */
function renderFooter() {
  const list = Object.entries(SOURCES)
    .map(([key, s]) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`)
    .join('');
  $('#footer').innerHTML = `
    <span class="label updated-stamp tilt" style="--chip:var(--primary)">內容更新至 ${SITE.updated}</span>
    <p style="margin:0">課程中的工具指令與功能名稱，皆於 ${SITE.verifiedOn} 對照官方文件查證；標示「⚠️ 未確認」的項目請以官方最新文件為準。</p>
    <details class="footer-refs">
      <summary>參考資料列表（${Object.keys(SOURCES).length} 筆）</summary>
      <ol class="ref-list">${list}</ol>
    </details>
    <p style="margin:0"><a href="#/references">參考資料完整頁</a>・<a href="#/styleguide">元件樣式表</a>・<button type="button" class="linklike" data-action="reset">重置學習進度</button></p>`;
}

Views.references = () => `
  <div class="content">
    <header class="lesson-head"><span class="lid-big" style="--chip:var(--m11)">參考</span><h1>參考資料</h1></header>
    <p>以下來源皆於 ${SITE.verifiedOn} 查證。</p>
    <ol>${Object.values(SOURCES).map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.note ? `<br><small>${esc(s.note)}</small>` : ''}</li>`).join('')}</ol>
  </div>`;

/* ---------- 全域事件 ---------- */
function onClick(e) {
  const moduleBtn = e.target.closest('.nav-module-btn');
  if (moduleBtn) {
    const id = moduleBtn.dataset.module;
    const list = document.getElementById(`nav-m${id}`);
    const willOpen = list.hidden;
    list.hidden = !willOpen;
    moduleBtn.setAttribute('aria-expanded', String(willOpen));
    Store.update((s) => { s.openModules[id] = willOpen; });
    return;
  }
  const scrollLink = e.target.closest('[data-scroll]');
  if (scrollLink) {
    e.preventDefault();
    const target = document.getElementById(scrollLink.dataset.scroll);
    if (target) {
      target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      const heading = $('h2', target) || target;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const { action: name, id } = action.dataset;
  if (name === 'done') markDone(id, true);
  if (name === 'undone') markDone(id, false);
  if (name === 'reset' && window.confirm('確定要清除所有學習進度與測驗紀錄嗎？')) {
    Store.reset();
    applyTheme();
    render();
    announce('學習進度已清除');
  }
}

function markDone(id, isDone) {
  Store.update((s) => { if (isDone) s.done[id] = true; else delete s.done[id]; });
  const row = $('#done-row');
  if (row) {
    row.innerHTML = isDone
      ? `<span class="stamp animate">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
      : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完、做完練習後按一下。</span>`;
    const focusTarget = $('button', row);
    if (focusTarget) focusTarget.focus();
  }
  renderNav();
  updateTopProgress();
  announce(isDone ? `${id} 已標記為完成` : `${id} 已改回未完成`);
}

function isTyping(el) {
  return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function onKeydown(e) {
  if (e.key === 'Escape' && Drawer.isOpen()) { Drawer.close(); return; }
  Drawer.trap(e);
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || isTyping(document.activeElement)) return;
  if (document.activeElement && document.activeElement.closest('[role="tablist"], .loop-controls, [role="listbox"]')) return;
  const route = parseRoute();
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && route.name === 'lesson') {
    const pos = LESSONS.findIndex((l) => l.id === route.id);
    const target = LESSONS[pos + (e.key === 'ArrowRight' ? 1 : -1)];
    if (target) { e.preventDefault(); window.location.hash = `#/l/${target.id}`; }
  }
}

/* 對外開放給元件區使用 */
window.App = { $, $$, esc, md, Store, Sections, Views, Hydrators, announce, render, renderNav, updateTopProgress, prefersReducedMotion, LEVEL_START, isTyping, readingMinutes };

document.addEventListener('click', onClick);
document.addEventListener('keydown', onKeydown);
$('.menu-btn').addEventListener('click', () => Drawer.open());
$('.sidebar-close').addEventListener('click', () => Drawer.close());
$('#scrim').addEventListener('click', () => Drawer.close());
$('#theme-btn').addEventListener('click', cycleTheme);
window.addEventListener('hashchange', render);

/* 元件區載入後再進行第一次渲染 */
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  renderFooter();
  render();
});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/powershell.min.js" integrity="sha512-I2sYcyooqG4MUbNURH1azVlcuwqA4uxCFT9tLOXIhrvwrosPpNrE0Zz0AYdjRaGPacIrJTwnTut5CzB6VNc6Hw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script>
/* ==========================================================================
   共用元件
   ========================================================================== */
(() => {
'use strict';
const { $, $$, esc, md, Store, Sections, Views, Hydrators, announce, prefersReducedMotion, isTyping } = window.App;

let uidCounter = 0;
const uid = (prefix = 'u') => `${prefix}${++uidCounter}`;
const COPY_TEXT = new Map();
const LANG_ALIAS = { text: 'plaintext', prompt: 'plaintext', toml: 'ini', jsonc: 'json', sh: 'bash', zsh: 'bash', shell: 'bash' };
const LANG_LABEL = { plaintext: 'TEXT', bash: 'BASH', json: 'JSON', python: 'PYTHON', typescript: 'TYPESCRIPT', markdown: 'MARKDOWN', yaml: 'YAML', xml: 'XML', ini: 'TOML', powershell: 'POWERSHELL' };

/* 單元內容裡定義的術語，自動加進術語表 */
LESSONS.forEach((lesson) => {
  const defs = lesson.content && lesson.content.define;
  if (!defs) return;
  defs.forEach((d) => {
    if (!GLOSSARY[d.term]) GLOSSARY[d.term] = { en: d.en, def: d.def, lesson: lesson.id };
    else if (!GLOSSARY[d.term].lesson) GLOSSARY[d.term].lesson = lesson.id;
  });
});

/* ---------- 區塊渲染 ---------- */
function renderBlocks(blocks) {
  if (blocks == null) return '';
  const list = Array.isArray(blocks) ? blocks : [blocks];
  return list.map(renderBlock).join('');
}

function renderBlock(b) {
  if (typeof b === 'string') return `<p>${md(b)}</p>`;
  switch (b.type) {
    case 'list': {
      const tag = b.ordered ? 'ol' : 'ul';
      return `<${tag}>${b.items.map((i) => `<li>${md(i)}</li>`).join('')}</${tag}>`;
    }
    case 'code': return codeBlock(b);
    case 'table': return tableBlock(b);
    case 'callout': return `<div class="callout ${esc(b.variant || 'tip')}"><span class="label">${md(b.title || '')}</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'unverified': return `<div class="callout unverified"><span class="label">⚠️ 截至 2026-10 查證狀態：未確認</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'legacy': return legacyBlock(b);
    case 'svg': return `<figure class="figure">${b.svg}${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure>`;
    case 'compare': return compareBlock(b);
    case 'tabs': return tabsBlock(b);
    case 'reveal': return `<details class="reveal"><summary>${esc(b.summary || '展開')}</summary><div class="reveal-body blocks">${renderBlocks(b.body)}</div></details>`;
    case 'quiz': return quizList(b.items, b.key || uid('qz'));
    case 'widget': return renderWidget(b);
    case 'heading': return `<h2 class="ref-h" id="sec-${esc(b.id)}"><span class="label">${esc(b.text)}</span></h2>`;
    case 'tryit': return tryitBlock(b);
    default:
      console.error('未知的區塊類型：', b);
      return '';
  }
}

function codeBlock({ lang = 'text', code, title }) {
  const resolved = LANG_ALIAS[lang] || lang;
  const id = uid('code');
  COPY_TEXT.set(id, code);
  return `<div class="code">
    <div class="code-head"><span class="lang">${esc(LANG_LABEL[resolved] || resolved)}</span><span class="ttl">${esc(title || '')}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${title ? ` ${esc(title)}` : '程式碼'}">複製</button></div>
    <pre tabindex="0" aria-label="${esc(title || '程式碼')}"><code class="language-${esc(resolved)}">${esc(code)}</code></pre>
  </div>`;
}

function tableBlock({ head, rows, caption }) {
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption || '表格')}"><table>
    ${caption ? `<caption>${md(caption)}</caption>` : ''}
    <thead><tr>${head.map((h) => `<th scope="col">${md(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => (i === 0 ? `<th scope="row">${md(cell)}</th>` : `<td>${md(cell)}</td>`)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function legacyBlock({ title, rows, note }) {
  return `<div class="callout legacy"><span class="label">${esc(title || '舊做法 → 現在的做法')}</span><div class="body">
    <div class="legacy-grid">${rows.map(([oldWay, newWay]) => `<div class="legacy-row"><div class="old">${md(oldWay)}</div><div class="arrow" aria-hidden="true">→</div><div class="new"><span class="visually-hidden">現在：</span>${md(newWay)}</div></div>`).join('')}</div>
    ${note ? `<p style="margin-top:var(--sp-3)">${md(note)}</p>` : ''}
  </div></div>`;
}

/* ---------- Prompt 對照器 ---------- */
const DIFF_RE = /\{\{(\d+):([\s\S]+?)\}\}/g;
function promptHtml(text) { return esc(text).replace(DIFF_RE, '<mark class="diff" data-n="$1">$2</mark>'); }
function promptPlain(text) { return text.replace(DIFF_RE, '$2'); }

function compareSide(kind, label, text, ctx, result) {
  const id = uid('cmp');
  COPY_TEXT.set(id, promptPlain(text));
  return `<div class="compare-side ${kind}">
    <div class="side-head"><span class="label">${esc(label)}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${esc(label)}的 prompt">複製</button></div>
    <pre class="prompt-text">${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${promptHtml(text)}</pre>
    ${result ? `<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)"><strong>${kind === 'bad' ? '可能的結果' : '得到的結果'}：</strong>${md(result)}</p>` : ''}
  </div>`;
}

function compareBlock(b) {
  return `<div class="compare side-by-side">
    ${b.title ? `<div class="compare-title"><span class="label">Prompt 對照</span>${md(b.title)}</div>` : ''}
    <div class="compare-grid">
      ${compareSide('bad', b.badLabel || '✗ 壞 prompt', b.bad, b.badCtx, b.badResult)}
      ${compareSide('good', b.goodLabel || '✓ 好 prompt', b.good, b.goodCtx, b.goodResult)}
    </div>
    ${b.why && b.why.length ? `<div class="why"><strong>為什麼有效</strong><ol>${b.why.map((w, i) => `<li><span class="n">${i + 1}</span><span>${md(w)}</span></li>`).join('')}</ol></div>` : ''}
  </div>`;
}

function tryitBlock(t) {
  return `<div class="tryit"><span class="label">換你補完</span>
    <div class="blocks">${renderBlocks(t.q)}</div>
    ${t.draft ? `<pre class="prompt-text" style="margin-top:var(--sp-3)">${esc(t.draft).replace(/____/g, '<span class="blank" aria-label="空格">　</span>')}</pre>` : ''}
    <details class="reveal" style="margin-top:var(--sp-4)"><summary>我寫好了，看參考答案</summary><div class="reveal-body blocks">${renderBlocks(t.answer)}</div></details>
  </div>`;
}

/* ---------- 分頁 ---------- */
function tabsBlock({ tabs, label }) {
  const base = uid('tabs');
  return `<div class="tabs">
    <div class="tablist" role="tablist" aria-label="${esc(label || '分頁')}">
      ${tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="${base}-t${i}" aria-controls="${base}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(t.label)}</button>`).join('')}
    </div>
    ${tabs.map((t, i) => `<div class="tabpanel blocks" role="tabpanel" id="${base}-p${i}" aria-labelledby="${base}-t${i}" tabindex="0" ${i === 0 ? '' : 'hidden'}>${renderBlocks(t.blocks)}</div>`).join('')}
  </div>`;
}
function selectTab(tab) {
  const list = tab.closest('[role="tablist"]');
  $$('[role="tab"]', list).forEach((t) => {
    const selected = t === tab;
    t.setAttribute('aria-selected', String(selected));
    t.tabIndex = selected ? 0 : -1;
    document.getElementById(t.getAttribute('aria-controls')).hidden = !selected;
  });
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) selectTab(tab);
});
document.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]'));
  const i = tabs.indexOf(tab);
  const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const next = tabs[(moves[e.key] + tabs.length) % tabs.length];
  selectTab(next);
  next.focus();
});

/* ---------- 測驗 ---------- */
function quizList(items, keyBase, opts = {}) {
  return `<div class="quiz-list">${items.map((item, i) => quizItem(item, `${keyBase}:${i}`, opts)).join('')}</div>`;
}

function quizHead(item) {
  const parts = [];
  if (item.level) parts.push(`<span class="label lv" data-lv="${esc(item.level)}">${esc(item.level)}</span>`);
  if (item.from && LESSON_BY_ID[item.from]) parts.push(`<a class="label review-from" href="#/l/${item.from}" style="text-decoration:none">回顧 ${esc(item.from)}</a>`);
  return parts.length ? `<div class="quiz-head">${parts.join('')}</div>` : '';
}

function quizItem(item, key) {
  if (item.type === 'mc') {
    return `<form class="quiz" data-quiz="${esc(key)}" novalidate>
      ${quizHead(item)}
      <fieldset><legend>${md(item.q)}</legend>
        <div class="opts">${item.options.map((o, i) => `<label class="opt"><input type="radio" name="${esc(key)}" value="${i}"><span>${md(o)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div>
      </fieldset>
      <div class="quiz-actions"><button type="submit" class="btn primary nb-press">送出答案</button><button type="button" class="btn small nb-press" data-quiz-reset hidden>重做這題</button></div>
      <div class="quiz-feedback" hidden></div>
    </form>`;
  }
  return `<div class="quiz" data-reveal="${esc(key)}">
    ${quizHead(item)}
    <div class="quiz-q blocks">${renderBlocks(item.q)}</div>
    <details class="reveal"><summary>我想好了，看答案</summary><div class="reveal-body blocks">${renderBlocks(item.answer)}</div></details>
  </div>`;
}

/* 題目資料要從 key 找回來：key 的格式是 <lessonId>:<段落>:<題號> */
function findQuizItem(key) {
  const [lessonId, section, idx] = key.split(':');
  const lesson = LESSON_BY_ID[lessonId];
  if (!lesson || !lesson.content) return QUIZ_REGISTRY.get(key) || null;
  const items = lesson.content[section];
  return Array.isArray(items) ? items[Number(idx)] : (QUIZ_REGISTRY.get(key) || null);
}
const QUIZ_REGISTRY = new Map();

function showQuizResult(form, item, choice) {
  const correct = choice === item.answer;
  form.classList.add('answered');
  $$('.opt', form).forEach((opt, i) => {
    const input = $('input', opt);
    input.checked = i === choice;
    input.disabled = true;
    opt.classList.toggle('is-correct', i === item.answer);
    opt.classList.toggle('is-wrong', i === choice && !correct);
    $('.mark', opt).textContent = i === item.answer ? '✓ 正確' : (i === choice ? '✗ 你的選擇' : '');
  });
  const fb = $('.quiz-feedback', form);
  const wrongNote = !correct && item.whyWrong && item.whyWrong[choice] ? `<p><strong>你選的選項錯在：</strong>${md(item.whyWrong[choice])}</p>` : '';
  fb.innerHTML = `<p class="verdict">${correct ? '✓ 答對了' : '✗ 再想想：正確答案已標示'}</p>${wrongNote}<div class="blocks">${renderBlocks(item.explain)}</div>`;
  fb.hidden = false;
  $('[type="submit"]', form).hidden = true;
  $('[data-quiz-reset]', form).hidden = false;
  return correct;
}

function resetQuiz(form) {
  form.classList.remove('answered');
  $$('.opt', form).forEach((opt) => {
    const input = $('input', opt);
    input.checked = false; input.disabled = false;
    opt.classList.remove('is-correct', 'is-wrong');
    $('.mark', opt).textContent = '';
  });
  $('.quiz-feedback', form).hidden = true;
  $('[type="submit"]', form).hidden = false;
  $('[data-quiz-reset]', form).hidden = true;
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form.quiz');
  if (!form) return;
  e.preventDefault();
  const key = form.dataset.quiz;
  const item = findQuizItem(key);
  const picked = $('input:checked', form);
  const fb = $('.quiz-feedback', form);
  if (!item) { console.error('找不到測驗題目：', key); return; }
  if (!picked) {
    fb.innerHTML = '<p class="verdict">先選一個答案再送出。</p>';
    fb.hidden = false;
    $('input', form).focus();
    return;
  }

/* ---------- 複製 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    console.warn('Clipboard API 失敗，改用備援方式：', err);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  ta.remove();
  return ok;
}
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = COPY_TEXT.get(btn.dataset.copy) ?? (btn.dataset.copyText || '');
  const ok = await copyText(text);
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = ok ? '已複製 ✓' : '請按 Ctrl/Cmd + C';
  btn.classList.toggle('copied', ok);
  announce(ok ? '已複製到剪貼簿' : '複製失敗，請手動選取文字後按 Ctrl 或 Cmd 加 C');
  window.clearTimeout(Number(btn.dataset.timer));
  btn.dataset.timer = String(window.setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500));
});

/* ---------- 術語 tooltip ---------- */
const Tooltip = (() => {
  const el = document.createElement('div');
  el.className = 'tooltip';
  el.id = 'term-tooltip';
  el.setAttribute('role', 'tooltip');
  el.hidden = true;
  document.body.appendChild(el);
  let anchor = null;
  let pinned = false;

  function show(btn, pin = false) {
    const key = btn.dataset.term;
    const term = GLOSSARY[key];
    if (!term) return;
    if (anchor && anchor !== btn) anchor.setAttribute('aria-expanded', 'false');
    anchor = btn;
    pinned = pin;
    el.innerHTML = `<span class="tt-term">${esc(key)}${term.en ? ` <span class="tt-en">${esc(term.en)}</span>` : ''}</span>${md(term.def)}${term.lesson ? `<br><small>在 ${esc(term.lesson)} 有完整說明</small>` : ''}`;
    el.hidden = false;
    btn.setAttribute('aria-describedby', el.id);
    btn.setAttribute('aria-expanded', 'true');
    position(btn);
  }
  function hide() {
    if (!anchor) return;
    anchor.removeAttribute('aria-describedby');
    anchor.setAttribute('aria-expanded', 'false');
    anchor = null; pinned = false;
    el.hidden = true;
  }
  function position(btn) {
    const r = btn.getBoundingClientRect();
    const gap = 10;
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
    let top = r.bottom + gap;
    if (top + h > window.innerHeight - 16) top = r.top - h - gap;
    el.style.left = `${left}px`;
    el.style.top = `${Math.max(16, top)}px`;
  }
  document.addEventListener('mouseover', (e) => { const b = e.target.closest('.term'); if (b && !pinned) show(b); });
  document.addEventListener('mouseout', (e) => { const b = e.target.closest('.term'); if (b && b === anchor && !pinned) hide(); });
  document.addEventListener('focusin', (e) => { const b = e.target.closest('.term'); if (b) show(b); else if (anchor && !pinned) hide(); });
  document.addEventListener('focusout', (e) => { if (e.target === anchor && !pinned) hide(); });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.term');
    if (b) { if (anchor === b && pinned) hide(); else show(b, true); return; }
    if (pinned) hide();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && anchor) { const a = anchor; hide(); a.focus(); } });
  window.addEventListener('scroll', () => { if (anchor) position(anchor); }, { passive: true });
  window.addEventListener('hashchange', hide);
  return { show, hide };
})();
