const Search = (() => {
  $('#search-slot').outerHTML = `
    <div class="search" role="search">
      <label for="site-search" class="visually-hidden">搜尋課程標題與術語</label>
      <svg class="ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="2.5"/></svg>
      <input id="site-search" type="search" placeholder="搜尋" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <kbd class="hint" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" hidden></div>
    </div>`;
  const input = $('#site-search');
  const box = $('#search-results');
  let results = [];
  let active = -1;

  const norm = (s) => String(s || '').toLowerCase();
  function index() {
    const items = LESSONS.map((l) => ({
      kind: '課程', title: `${l.id} ${l.title}`, sub: COURSES[l.moduleId].title,
      hay: norm(`${l.id} ${l.title} ${COURSES[l.moduleId].title}`), href: `#/l/${l.id}`,
    }));
    Object.entries(GLOSSARY).forEach(([key, t]) => items.push({
      kind: '術語', title: `${key}${t.en ? `（${t.en}）` : ''}`, sub: t.def.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => l || k).replace(/[`*=]/g, ''),
      hay: norm(`${key} ${t.en} ${t.def}`), href: t.lesson ? `#/l/${t.lesson}` : null, termKey: key, rank: 1,
    }));
    return items;
  }
  let INDEX = null;

  function run() {
    INDEX = INDEX || index();
    const q = norm(input.value.trim());
    if (!q) { close(); return; }
    const words = q.split(/\s+/);
    results = INDEX.filter((it) => words.every((w) => it.hay.includes(w)))
      .sort((a, b) => Number(!norm(a.title).includes(words[0])) - Number(!norm(b.title).includes(words[0])))
      .slice(0, 12);
    active = results.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.innerHTML = results.length
      ? results.map((r, i) => `<div role="option" id="sr-${i}" aria-selected="${i === active}" data-i="${i}">
          <span class="label" style="--chip:${r.kind === '課程' ? 'var(--info)' : 'var(--accent)'};font-size:.7rem;padding:0 4px">${r.kind}</span>
          ${esc(r.title)}<small>${esc(r.sub.length > 70 ? `${r.sub.slice(0, 70)}…` : r.sub)}</small></div>`).join('')
      : '<div class="empty">找不到符合的課程或術語。</div>';
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`);
    else input.removeAttribute('aria-activedescendant');
    const act = $(`#sr-${active}`, box);
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function close() {
    box.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function go(i) {
    const r = results[i];
    if (!r) return;
    if (r.href) {
      window.location.hash = r.href.slice(1);
      input.value = '';
      close();
    } else {
      announce(`${r.title}：${r.sub}`);
    }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', () => { if (input.value.trim()) run(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; draw(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (!box.hidden) close(); else input.blur(); }
  });
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => { const opt = e.target.closest('[role="option"]'); if (opt) go(Number(opt.dataset.i)); });
  input.addEventListener('blur', () => window.setTimeout(close, 100));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTyping(document.activeElement) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
  return { input };
})();

function assemble(values, enabled, useXml) {
  const parts = [];
  const on = (k) => enabled[k] && values[k] && values[k].trim();
  if (on('role')) parts.push(useXml ? `（系統提示詞）\n${values.role.trim()}` : `# 角色\n${values.role.trim()}`);
  BUILDER_FIELDS.filter((f) => f.key !== 'role').forEach((f) => {
    if (!on(f.key)) return;
    const v = values[f.key].trim();
    parts.push(useXml ? `<${f.tag}>\n${v}\n</${f.tag}>` : `# ${f.name}\n${v}`);
  });
  return parts.join('\n\n');
}

  },
  hydrate(el, props) {
    const form = $('form', el);
    const result = $('.assess-result', form);
    const level = Store.get().level;
    if (level) showResult(level, null);

    function showResult(lv, detail) {
      const info = props.levels[lv];
      const start = window.App.LEVEL_START[lv];
      result.innerHTML = `<div class="callout keypoints" style="margin-top:var(--sp-5)"><span class="label">你的結果：Lv${lv} ${esc(info.name)}</span><div class="body blocks">
        ${detail ? `<p>答對 ${detail.score} / ${props.questions.length} 題。</p>` : '<p>這是你上次的評估結果。</p>'}
        <p>${md(info.desc)}</p>
        <p><a class="btn primary nb-press" href="#/l/${start}">從 ${start} 開始</a></p>
        <p style="font-size:var(--fs-small)">側邊選單已標示「建議起點」。跳級的人也建議讀模組 10（安全與界線）。</p></div></div>`;
      result.hidden = false;
    }
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const answers = props.questions.map((q, i) => {
        const picked = $(`input[name="${el.dataset.wid}-q${i}"]:checked`, form);
        return picked ? Number(picked.value) : null;
      });
      const missing = answers.filter((a) => a === null).length;
      if (missing) {
        $('[data-assess-msg]', form).textContent = `還有 ${missing} 題沒作答。`;
        return;
      }
      $('[data-assess-msg]', form).textContent = '';
      let score = 0;
      props.questions.forEach((q, i) => {
        const ok = answers[i] === q.answer;
        if (ok) score += 1;
        $$('.quiz', form)[i].querySelectorAll('.opt').forEach((opt, j) => {
          opt.classList.toggle('is-correct', j === q.answer);
          opt.classList.toggle('is-wrong', j === answers[i] && !ok);
          opt.querySelector('.mark').textContent = j === q.answer ? '✓' : (j === answers[i] ? '✗' : '');
        });
      });
      const lv = props.thresholds.findIndex((t) => score <= t) + 1 || props.thresholds.length + 1;
      Store.update((s) => { s.level = lv; });
      showResult(lv, { score });
      window.App.renderNav();
      result.focus();
      announce(`評估完成：Lv${lv}`);
    });
  },
};

/* Agent loop 動畫：依官方「修好失敗的測試」範例逐步播放 */
const LOOP_NODES = {
  observe: { label: '觀察', x: 160, y: 14 },
  think: { label: '思考', x: 290, y: 112 },
  tool: { label: '呼叫工具', x: 160, y: 210 },
  result: { label: '取得結果', x: 30, y: 112 },
};
const LOOP_STEPS = [
  { node: 'observe', title: '收到任務', log: '使用者：「修好失敗的測試」' },
  { node: 'think', title: '決定先蒐集情境', log: '先跑一次測試，看哪些失敗' },
  { node: 'tool', title: '呼叫工具', log: 'Bash：`npm test`' },
  { node: 'result', title: '取得結果', log: '2 個測試失敗：「空購物車的總額應為 0」' },
  { node: 'observe', title: '觀察結果', log: '錯誤指向 `src/cart.ts` 的 `total()`' },
  { node: 'think', title: '決定下一步', log: '要先讀程式，不能憑空猜' },
  { node: 'tool', title: '呼叫工具', log: 'Read：`src/cart.ts`' },
  { node: 'result', title: '取得結果', log: '`total()` 遇到空陣列時回傳 `undefined`' },
  { node: 'think', title: '決定修法', log: '空陣列時回傳 0' },
  { node: 'tool', title: '呼叫工具', log: 'Edit：修改 `src/cart.ts`' },
  { node: 'result', title: '取得結果', log: '檔案已修改' },
  { node: 'think', title: '要驗證，不是宣告完成', log: '再跑一次測試確認' },
  { node: 'tool', title: '呼叫工具', log: 'Bash：`npm test`' },
  { node: 'result', title: '取得結果', log: '24 個測試全部通過' },
  { node: 'done', title: '完成條件達成，結束迴圈', log: '回報：修改了 `total()`，附上測試結果' },
];
const LOOP_INTERVAL_MS = 1600;

Widgets.loop = {
  render() {
    const nodeSvg = Object.entries(LOOP_NODES).map(([key, n]) => `
      <g class="loop-node" data-node="${key}">
        <rect x="${n.x}" y="${n.y}" width="120" height="56" class="stroke-ink" stroke-width="4"/>
        <text x="${n.x + 60}" y="${n.y + 35}" text-anchor="middle" font-size="18" font-weight="900">${n.label}</text>
      </g>`).join('');
    return `<div class="loop">
      <figure class="figure loop-figure">
        <svg viewBox="0 0 440 290" role="img" aria-label="agent loop 圖：觀察、思考、呼叫工具、取得結果四個節點依順時針循環，完成條件達成時離開迴圈">
          <g class="stroke-ink loop-arrows" stroke-width="4" fill="none">
            <path class="loop-arrow" data-arrow="observe" d="M282 54 Q340 60 348 108"/>
            <path class="loop-arrow" data-arrow="think" d="M348 170 Q340 228 282 236"/>
            <path class="loop-arrow" data-arrow="tool" d="M158 236 Q100 228 92 170"/>
            <path class="loop-arrow" data-arrow="result" d="M92 108 Q100 60 158 54"/>
          </g>
          <g class="fill-ink"><path d="M340 100 L349 112 L356 99Z"/><path d="M290 228 L278 237 L291 244Z"/><path d="M100 178 L91 166 L84 179Z"/><path d="M150 46 L162 54 L149 61Z"/></g>
          ${nodeSvg}
          <text x="220" y="146" text-anchor="middle" font-size="14" font-weight="700">agent loop</text>
          <g class="loop-done" data-node="done"><rect x="300" y="236" width="130" height="44" class="stroke-ink" stroke-width="3" stroke-dasharray="6 4"/><text x="365" y="264" text-anchor="middle" font-size="15" font-weight="900">完成 ✓</text></g>
        </svg>
      </figure>
      <div class="loop-panel">
        <div class="loop-controls" role="group" aria-label="動畫控制">
          <button type="button" class="btn small nb-press" data-loop="prev" aria-label="上一步">← 上一步</button>
          <button type="button" class="btn small primary nb-press" data-loop="play">▶ 播放</button>
          <button type="button" class="btn small nb-press" data-loop="next" aria-label="下一步">下一步 →</button>
          <button type="button" class="btn small nb-press" data-loop="reset">重設</button>
        </div>
        <p class="loop-status" aria-live="polite"></p>
        <ol class="loop-log"></ol>
      </div>
    </div>`;
  },
  hydrate(el) {
    let step = 0;
    let timer = null;
    const playBtn = $('[data-loop="play"]', el);
    const status = $('.loop-status', el);
    const log = $('.loop-log', el);
    const reduced = prefersReducedMotion();
    if (reduced) {
      playBtn.disabled = true;
      playBtn.textContent = '自動播放已關閉';
      playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一步」逐步觀看';
    }

    function draw() {
      const s = LOOP_STEPS[step];
      $$('.loop-node, .loop-done', el).forEach((n) => n.classList.toggle('is-active', n.dataset.node === s.node));
      $$('.loop-arrow', el).forEach((a) => a.classList.toggle('is-active', a.dataset.arrow === s.node));
      status.innerHTML = `<strong>步驟 ${step + 1} / ${LOOP_STEPS.length}・${esc(s.title)}</strong>：${md(s.log)}`;
      log.innerHTML = LOOP_STEPS.slice(0, step + 1).map((x, i) => `<li class="${i === step ? 'is-current' : ''}"><span class="label" style="--chip:${x.node === 'done' ? 'var(--success)' : 'var(--m5)'}">${esc(x.node === 'done' ? '完成' : LOOP_NODES[x.node].label)}</span> ${md(x.log)}</li>`).join('');
      log.scrollTop = log.scrollHeight;
      $('[data-loop="prev"]', el).disabled = step === 0;
      $('[data-loop="next"]', el).disabled = step === LOOP_STEPS.length - 1;
    }
    function stop() {
      window.clearInterval(timer);
      timer = null;
      if (!reduced) playBtn.textContent = '▶ 播放';
    }
    function go(delta) {
      step = Math.min(Math.max(step + delta, 0), LOOP_STEPS.length - 1);
      draw();
    }
    function play() {
      if (timer) { stop(); return; }
      if (step === LOOP_STEPS.length - 1) step = 0;
      playBtn.textContent = '❚❚ 暫停';
      draw();
      timer = window.setInterval(() => {
        if (step >= LOOP_STEPS.length - 1 || !document.body.contains(el)) { stop(); return; }
        go(1);
      }, LOOP_INTERVAL_MS);
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-loop]');
      if (!b) return;
      const action = b.dataset.loop;
      if (action === 'play') play();
      else { stop(); if (action === 'prev') go(-1); if (action === 'next') go(1); if (action === 'reset') { step = 0; draw(); } }
    });
    el.addEventListener('keydown', (e) => {
      if (!e.target.closest('.loop-controls')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(-1); }
    });
    window.addEventListener('hashchange', stop, { once: true });
    draw();
  },
};
