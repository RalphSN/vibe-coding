  <text x="420" y="140" text-anchor="middle" font-size="14" class="on-color">方點：異號 → 乘積為負</text>
  <text x="420" y="172" text-anchor="middle" font-size="14" class="on-color">一個閾值（0）就分開</text>
  <text x="420" y="222" text-anchor="middle" font-size="14">特徵換對了，直線就夠用</text>
</svg>`, caption: '虛線是兩個特徵的 0。圓點和方點交錯在對角，任何直線都只能切對一半。' },

        ] },
      ],
    },
    mistakes: [
      { wrong: '以為分類模型只輸出「是或否」。', why: '大部分分類模型先輸出機率，再用閾值決定。', right: '保留機率，閾值依需求調整（模組 6）。' },
      { wrong: '以為一定找得到完美分開的邊界。', why: '真實資料常常重疊。', right: '目標是錯得少，而且錯在比較能接受的地方。' },

  '4-2': {
    goals: [
      '說出 sigmoid 做什麼',

    analogy: {

      limit: ['真實的機率不一定剛好是 S 形；sigmoid 是一個好算、好微分的假設。模型輸出的「機率」也不一定校準得好（說 90% 時不一定真的九成對）。'],
    },
