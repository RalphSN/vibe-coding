/** 中英文交界的斷點要補回空格，例如「Claude Code|與 Cowork」→「Claude Code 與 Cowork」 */
function needsSpaceBetween(left, right) {
  const latinEnd = /[A-Za-z0-9.)]$/;
  const latinStart = /^[A-Za-z0-9(`]/;
  const hanEnd = /\p{Script=Han}$/u;
  const hanStart = /^\p{Script=Han}/u;
  return (latinEnd.test(left) && hanStart.test(right)) || (hanEnd.test(left) && latinStart.test(right));
}
function splitPhrases(text) { return String(text).split('|'); }
/** 去掉 | 斷點的純文字：給 <title>、搜尋、aria-label 用 */
function plainTitle(text) {
  return splitPhrases(text).reduce((out, phrase) => (out && needsSpaceBetween(out, phrase) ? `${out} ${phrase}` : out + phrase), '');
}

    LESSONS.push(lesson);
    LESSON_BY_ID[id] = lesson;
    return lesson;
  });
});

/** 由各模組的資料區塊呼叫，把內容掛到對應的單元上 */
function defineLessons(map) {

  });
}

}
