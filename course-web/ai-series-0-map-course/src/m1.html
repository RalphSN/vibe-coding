/* 1-2：手動調一個參數，看「評分」怎麼變（房子資料是示意） */
const HOUSES = [
  { size: 20, price: 980 },
  { size: 30, price: 1530 },
  { size: 40, price: 1990 },
];
const MAX_PRICE_SHOWN = 3200;
function houseFit(v) {
  const rows = HOUSES.map((h) => {
    const predicted = h.size * v.w;
    return { label: `${h.size} 坪（實際 ${h.price} 萬）`, value: `預測 ${predicted} 萬`, ratio: predicted / MAX_PRICE_SHOWN, gap: Math.abs(predicted - h.price) };
  });
  const meanGap = Math.round(rows.reduce((sum, r) => sum + r.gap, 0) / rows.length);
  return {
    rows: [...rows, { label: '評分：平均差幾萬', value: `${meanGap} 萬`, ratio: meanGap / 1000 }],
    note: `每坪參數 **${v.w} 萬** 時，三間房子平均差 **${meanGap} 萬**。訓練做的事，就是自動找出讓這個數字最小的參數；真實模型一次調的是幾百萬到上兆個參數。`,
  };
}

/* 1-3：全連接網路的參數量（輸入 28×28 灰階圖、輸出 10 類） */
const INPUT_SIZE = 784;
const OUTPUT_SIZE = 10;
function paramCount(v) {
  const first = INPUT_SIZE * v.width + v.width;
  const middle = (v.layers - 1) * (v.width * v.width + v.width);
  const last = v.width * OUTPUT_SIZE + OUTPUT_SIZE;
  const total = first + middle + last;
  const fmt = (n) => n.toLocaleString('en-US');
  return {
    rows: [
      { label: '第一層（像素 → 隱藏層）', value: fmt(first), ratio: first / total },
      { label: `中間 ${v.layers - 1} 層`, value: fmt(middle), ratio: middle / total },
      { label: '輸出層（→ 10 個數字）', value: fmt(last), ratio: last / total },
      { label: '合計', value: fmt(total), ratio: 1 },
    ],
    note: `${v.layers} 層隱藏層、每層 ${v.width} 個神經元，一共 **${fmt(total)}** 個參數。寬度加倍時中間層的參數約變 4 倍（寬 × 寬）；AlexNet 約 6,000 萬、GPT-3 有 1,750 億。`,
  };
}
