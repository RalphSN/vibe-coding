/* 3-1：每一層大約要花的時間（示意的經驗值，不是研究數字） */
const HOURS_PER_TOPIC = { l1: 2, l2: 15, l3: 40 };
function depthBudget(v) {
  const l1 = v.l1 * HOURS_PER_TOPIC.l1;
  const l2 = v.l2 * HOURS_PER_TOPIC.l2;
  const l3 = v.l3 * HOURS_PER_TOPIC.l3;
  const total = l1 + l2 + l3;
  const weeks = Math.ceil(total / v.hours);
  const max = Math.max(l1, l2, l3, 1);
  return {
    rows: [
      { label: `${v.l1} 個主題到 L1`, value: `${l1} 小時`, ratio: l1 / max },
      { label: `${v.l2} 個主題到 L2`, value: `${l2} 小時`, ratio: l2 / max },
      { label: `${v.l3} 個主題到 L3`, value: `${l3} 小時`, ratio: l3 / max },
    ],
    note: `合計約 **${total} 小時**，每週 ${v.hours} 小時要 **${weeks} 週**。每個主題的時數是示意：L1 約 ${HOURS_PER_TOPIC.l1}、L2 約 ${HOURS_PER_TOPIC.l2}、L3 約 ${HOURS_PER_TOPIC.l3} 小時。多一個 L3，常常比多十個 L1 還花時間。`,
  };
}

/* 3-3：三條路線各要幾週（課數取自七卷的單元數） */
const ROUTE_LESSONS = [
  { name: 'A 應用開發（序章＋第一部）', lessons: 14 + 39 },
  { name: 'B 懂原理（序章＋第三、四、二部）', lessons: 14 + 24 + 25 + 28 },
  { name: 'C 研究與硬體（B＋第五部）', lessons: 14 + 24 + 25 + 28 + 18 },
];
function routeWeeks(v) {
  const perWeek = v.minutes * v.days;
  const rows = ROUTE_LESSONS.map((r) => {
    const weeks = Math.ceil((r.lessons * v.perLesson) / perWeek);
    return { label: `${r.name}・${r.lessons} 課`, value: `約 ${weeks} 週`, weeks };
  });
  const most = rows[rows.length - 1].weeks;
  return {
    rows: rows.map((r) => ({ label: r.label, value: r.value, ratio: r.weeks / most })),
    note: `每天 ${v.minutes} 分鐘、每週 ${v.days} 天、每課 ${v.perLesson} 分鐘：路線 A 約 **${rows[0].weeks} 週**、C 約 **${rows[2].weeks} 週**。這還沒算動手做專案的時間，L2 的主題要再加。`,
  };
}
