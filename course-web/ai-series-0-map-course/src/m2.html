/* 2-3：CPU 與 GPU 做同一批乘加的示意時間（數字是示意，不是任何真實晶片的規格） */
const CPU_CORES = 16;
const GPU_CORES = 10000;
const MS_PER_ROUND = 1;
function parallelDemo(v) {
  const ops = v.ops * 1000;
  const cpuMs = Math.ceil(ops / CPU_CORES) * MS_PER_ROUND;
  const gpuMs = Math.ceil(ops / GPU_CORES) * MS_PER_ROUND * v.gpuSlow;
  const worst = Math.max(cpuMs, gpuMs);
  const fmt = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(1)} 秒` : `${ms} 毫秒`);
  return {
    rows: [
      { label: `CPU（${CPU_CORES} 個強核心）`, value: fmt(cpuMs), ratio: cpuMs / worst },
      { label: `GPU（${GPU_CORES.toLocaleString('en-US')} 個小核心）`, value: fmt(gpuMs), ratio: gpuMs / worst },
    ],
    note: `一共 **${ops.toLocaleString('en-US')}** 個互相獨立的乘加。GPU 每個核心比較慢（第二根拉桿），但數量多太多，總時間仍然短很多。數字是**示意**。`,
  };
}
