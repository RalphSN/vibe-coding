const DEBTS_DEMO = [
  { n: '分期', b: 30000, r: 0.06, min: 1500 },
  { n: '卡債', b: 120000, r: 0.15, min: 3000 },
  { n: '信貸', b: 250000, r: 0.09, min: 5190 },
];
function payoffPlan(order, extra) {
  const debts = DEBTS_DEMO.map((d) => ({ ...d }));
  const budget = debts.reduce((s, d) => s + d.min, 0) + extra;
  let month = 0; let interest = 0; const done = {};
  while (debts.some((d) => d.b > 0.5) && month < 600) {
    month += 1;
    debts.forEach((d) => { if (d.b > 0) { const i = (d.b * d.r) / 12; interest += i; d.b += i; } });
    let left = budget;
    debts.forEach((d) => { if (d.b > 0) { const p = Math.min(d.min, d.b); d.b -= p; left -= p; } });
    // 繳完所有最低後，剩下的錢依策略集中還一筆；已還清那筆的最低金額自動滾到下一筆
    debts.filter((d) => d.b > 0).sort(order).forEach((d) => { if (left > 0) { const p = Math.min(left, d.b); d.b -= p; left -= p; } });
    debts.forEach((d) => { if (d.b <= 0.5 && !done[d.n]) { done[d.n] = month; d.b = 0; } });
  }
  return { month, interest, done };
}
