<script>
/* ==========================================================================
   模組 4：債務的本質
   ========================================================================== */
defineTerms({
  '本金': { en: 'principal', def: '借來的那筆錢本身，不含利息。', example: '借 30 萬，本金就是 30 萬。', lesson: '4-1' },
  '年利率': { en: 'annual interest rate', def: '一年要付多少比例的利息；銀行報價通常是名目年利率。', example: '年利率 8%：借 100 元一年利息約 8 元。', lesson: '4-1' },
  '總費用年百分率': { en: 'APR (total cost)', def: '把利息加上開辦費、帳管費等所有費用，換算成一個年百分率；比較貸款時看這個，而不是廣告上的最低利率。', example: '利率 2.88%，加上費用後總費用年百分率可能超過 4%。', lesson: '4-1' },
  '本息平均攤還': { en: 'amortizing loan', def: '每期繳一樣的金額，前期大多是利息、後期大多是本金；房貸、信貸最常見的還法。', example: '30 萬、8%、5 年：每月約 6,083 元。', lesson: '4-1' },
  '槓桿': { en: 'leverage', def: '用借來的錢放大能動用的資金；賺的時候放大獲利，賠的時候也放大虧損。', example: '自備 200 萬、貸款 800 萬買 1,000 萬的房子。', lesson: '4-2' },
  '消費性債務': { en: 'consumer debt', def: '為了消費（而不是取得資產或提升收入能力）而借的錢。', example: '用信用卡分期買手機、旅遊刷卡未繳清。', lesson: '4-2' },
  '最低應繳金額': { en: 'minimum payment', def: '信用卡帳單上「至少要繳」的金額；只繳這個不算逾期，但沒繳的部分會產生循環利息。', example: '一般消費 2.5 萬，最低應繳約 2,500 元起。', lesson: '4-3' },
  '預借現金': { en: 'cash advance', def: '用信用卡直接借出現金；通常要付手續費，而且從借出當天就開始計息、沒有免息期。', example: '每筆一定比例加上固定金額的手續費。', lesson: '4-3' },
  '違約金': { en: 'late fee', def: '沒有在期限內繳足最低應繳金額時，銀行收的費用；和循環利息分開計算。', example: '最多連收 3 期，上限 300、400、500 元。', lesson: '4-3' },
  '聯徵': { en: 'JCIC credit report', def: '財團法人金融聯合徵信中心的信用報告；銀行審核貸款與信用卡時會查詢。', example: '個人信用評分 200～800 分。', lesson: '4-4' },
  '額度使用率': { en: 'credit utilization', def: '信用卡已使用的金額佔總額度的比例。', example: '總額度 10 萬、已刷 6 萬 → 60%。', lesson: '4-4' },
});

const LOAN_PAY = (P, annual, years) => { const r = annual / 12; const n = years * 12; return r === 0 ? P / n : (P * r) / (1 - (1 + r) ** -n); };

defineLessons({
  '4-1': {
    goals: [
      '分辨單利、複利與本息平均攤還',
      '用總費用年百分率比較不同的貸款',
      '算出一筆貸款的月付與總利息',
    ],
    analogy: {
      text: ['借錢就像租東西：租車要付租金，借錢要付的「租金」就是利息。租金用「每年多少 %」來報價，就是[[年利率]]。', '但租車行還可能收清潔費、保險費、手續費；比較時要看「全部加起來每年多少」，而不是只看廣告上的日租價。借錢也一樣，要看[[總費用年百分率]]。'],
      limit: ['租車到期把車還回去就結束；借錢除了還[[本金]]，利息還可能「利上加利」，所以時間越長，差距越大。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 260" role="img" aria-label="本息平均攤還的月付組成：每期金額一樣，前期大部分是利息、本金很少；隨時間利息部分越來越少，本金部分越來越多">
        <line x1="50" y1="210" x2="530" y2="210" class="stroke-ink" stroke-width="2"/>
        ${Array.from({ length: 10 }, (_, i) => { const interestH = 120 * (1 - i / 10) ** 1.4 + 8; return `<rect x="${60 + i * 46}" y="${50}" width="38" height="${160 - interestH}" style="fill:var(--m2)" class="stroke-ink" stroke-width="2"/><rect x="${60 + i * 46}" y="${210 - interestH}" width="38" height="${interestH}" style="fill:var(--m4)" class="stroke-ink" stroke-width="2"/>`; }).join('')}
        <text x="60" y="36" font-size="14" font-weight="900">每期繳一樣多</text>
        <rect x="330" y="20" width="16" height="16" style="fill:var(--m2)" class="stroke-ink" stroke-width="2"/><text x="352" y="33" font-size="13">本金</text>
        <rect x="410" y="20" width="16" height="16" style="fill:var(--m4)" class="stroke-ink" stroke-width="2"/><text x="432" y="33" font-size="13">利息</text>
        <text x="290" y="236" text-anchor="middle" font-size="13">第 1 期 → 最後一期</text>
      </svg>`,
      caption: '示意比例。利息是「剩餘本金 × 月利率」，前期剩餘本金大，所以利息佔大部分；提前還款最省利息的時間也是前期。',
    },
    define: [
      { term: '年利率', en: 'annual interest rate', def: '一年的利息比例。', example: '8%。' },

      { term: '本息平均攤還', en: 'amortizing loan', def: '每期繳一樣、利息遞減。', example: '房貸、信貸。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'simple-compound', text: '單利與複利' },
        '單利只對本金算利息；複利則會把已經產生的利息加回本金，下一期連利息也要算利息。存錢時複利是朋友，借錢時是敵人。信用卡循環利息就是按日、對未繳餘額計息，沒有繳的利息會滾進下一期的餘額（4-3）。',
        { type: 'table', head: ['', '公式', '借 10 萬、年利率 15%、3 年不還'], rows: [
          ['單利', '本金 × 利率 × 年數', '利息 4.5 萬'],
          ['每年複利', '本金 ×（1 ＋ 利率）^年數 − 本金', '利息約 5.2 萬'],
          ['72 法則', '72 ÷ 年利率 ≈ 翻倍年數', '約 4.8 年翻倍（精確是 5 年）'],
        ], caption: '72 法則是心算工具：利率越高越不準，但足以感受「15% 的債大約 5 年就會滾成兩倍」。' },
        { type: 'heading', id: 'amortize', text: '月付怎麼算' },
        '本息平均攤還的月付公式是：月付 ＝ 本金 × r ÷ (1 − (1 ＋ r)^−n)，其中 r 是月利率（年利率 ÷ 12），n 是總期數。不需要背，下面的試算就是用這個公式。',
        { type: 'widget', name: 'knobs', props: { title: '貸款試算：月付與總利息（本息平均攤還，實際計算）', sliders: [
          { id: 'p', label: '借款金額', min: 10000, max: 10000000, step: 10000, value: 300000, unit: '元' },
          { id: 'rate', label: '年利率', min: 0, max: 16, step: 0.1, value: 8, unit: '%' },
          { id: 'years', label: '期數（年）', min: 1, max: 40, step: 1, value: 5, unit: '年' },
          { id: 'fee', label: '開辦費等一次性費用', min: 0, max: 20000, step: 500, value: 0, unit: '元' },
        ], compute: (v) => {
          const m = LOAN_PAY(v.p, v.rate / 100, v.years);
          const total = m * v.years * 12;
          const interest = total - v.p;
          return { rows: [
            { label: '每月還款', value: `${Math.round(m).toLocaleString()} 元`, ratio: Math.min(1, m / 60000) },
            { label: '總利息', value: `${Math.round(interest).toLocaleString()} 元`, ratio: Math.min(1, interest / v.p) },
            { label: '總共要付（含費用）', value: `${Math.round(total + v.fee).toLocaleString()} 元`, ratio: Math.min(1, (total + v.fee) / (v.p * 2)) },
            { label: '利息加費用佔本金', value: `${(((interest + v.fee) / v.p) * 100).toFixed(1)}%`, ratio: Math.min(1, (interest + v.fee) / v.p) },
          ], note: '30 萬、8%、5 年：每月約 6,083 元，總利息約 6.5 萬。同樣 30 萬改成 15%：月付約 7,137 元，總利息約 12.8 萬，接近兩倍。' };
        } } },
        { type: 'heading', id: 'apr', text: '比較貸款：看總費用年百分率' },

        { type: 'callout', variant: 'tip', title: '差在哪裡', body: ["只比較同一個指標：總費用年百分率（銀行依法要揭露）。","也要看提前清償違約金：打算提早還的人，這條很重要。"] },
        { type: 'heading', id: 'nominal-real', text: '名目利率與實質利率' },
        '3-2 提過存款的實質利率；借款也一樣：名目利率 2.3% 的房貸，在通膨 2% 左右的時期，實質負擔接近 0。這是低利房貸常被稱為「好債」的原因之一，但只在通膨持續、你的收入也跟著成長時才成立。',
        { type: 'heading', id: 'rate-parts', text: '深入：利率是怎麼組成的' },
        '任何一筆借款的利率，可以拆成兩部分：沒有風險時的資金成本，加上「借給你」的風險貼水。前者大致跟著央行政策利率與市場利率走；後者看的是你還不出來的可能性，以及借款有沒有擔保品。',
        { type: 'svg', svg: `<svg viewBox="0 0 560 240" role="img" aria-label="利率的組成：每一種借款的利率都是基準利率加上風險貼水；房貸有房子擔保、風險貼水最小；信貸沒有擔保、風險貼水較大；信用卡循環無擔保且使用者風險較高、貼水最大">
          ${[['房貸', 0.25, 'm2'], ['信貸', 0.6, 'm3'], ['卡債', 1, 'm4']].map(([t, r, c], i) => `<rect x="${60 + i * 160}" y="${200 - 50}" width="110" height="50" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/><rect x="${60 + i * 160}" y="${150 - 120 * r}" width="110" height="${120 * r}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${115 + i * 160}" y="230" text-anchor="middle" font-size="15" font-weight="900">${t}</text>`).join('')}
          <text x="40" y="180" text-anchor="end" font-size="12">基準</text>
          <text x="280" y="20" text-anchor="middle" font-size="14" font-weight="900">上：風險貼水　下：基準利率（示意）</text>
        </svg>`, caption: '信用卡循環利率高，不是因為銀行比較貪心，而是無擔保、使用者違約風險高、還有營運成本。這也代表：你的信用越好，能拿到的貼水越小（4-4）。' },
        { type: 'heading', id: 'daily', text: '深入：按日計息' },
        '信用卡循環利息與很多貸款都是按日計算：年利率 ÷ 365 × 天數 × 餘額。所以「早幾天還」也有意義，尤其是卡債：每提早一天，就少一天的利息。也因為按日計息，月中多還一筆，比月底才還省一點。',
      ],
    },
    mistakes: [

      { wrong: '以為每期的本金和利息比例都一樣。', why: '前期利息佔大部分。', right: '提前還款越早做，省下的利息越多。' },

    keypoints: [
      '比較貸款看總費用年百分率，不看廣告最低利率。',

      '72 ÷ 利率 ≈ 翻倍年數，借錢時也適用。',
