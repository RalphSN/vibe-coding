        { type: 'table', head: ['算進必要支出', '不算'], rows: [

          ['保費、貸款與卡債的每月最低還款', '加碼還款、投資扣款'],

        { type: 'heading', id: 'months', text: '要存幾個月：看收入有多容易中斷' },
        '3–6 個月是最常見的建議，但它不是固定數字，而是依「收入多容易中斷、中斷後多久能恢復、有沒有人跟你一起扛」調整。',
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="預備金月數的光譜：雙薪且工作穩定約 3 個月，單一收入或有扶養約 6 個月，接案、業務、自營或產業波動大約 9 到 12 個月">
          <line x1="40" y1="110" x2="520" y2="110" class="stroke-ink" stroke-width="4"/>

          <text x="40" y="200" font-size="13">收入越穩定、越多人分擔 ←</text>
          <text x="520" y="200" text-anchor="end" font-size="13">→ 收入越不穩、越難找到下一份</text>
        </svg>`, caption: '其他會往右移的因素：產業景氣循環明顯、年紀較大找工作較慢、有慢性病或家人需要照顧、沒有足夠的保險（第二部）。' },
        { type: 'widget', name: 'knobs', props: { title: '我的預備金目標（實際計算，月數是經驗法則）', sliders: [

          { id: 'stable', label: '收入穩定度（1 很不穩、3 很穩）', min: 1, max: 3, step: 1, value: 2 },
          { id: 'deps', label: '需要扶養的人數', min: 0, max: 5, step: 1, value: 0 },
          { id: 'have', label: '目前可動用的存款', min: 0, max: 1500000, step: 10000, value: 60000, unit: '元' },
        ], compute: (v) => {
          let months = { 1: 9, 2: 6, 3: 4 }[v.stable];

          months = Math.max(3, Math.min(12, months));
          const target = months * v.ess;
          const covered = v.have / v.ess;

            { label: '建議月數', value: `${months} 個月`, ratio: months / 12 },
            { label: '目標金額', value: `${target.toLocaleString()} 元`, ratio: Math.min(1, target / 1200000) },

            { label: '還差', value: `${Math.max(0, target - v.have).toLocaleString()} 元`, ratio: Math.min(1, Math.max(0, target - v.have) / target) },

        { type: 'table', head: ['安全網', '能處理', '不能處理'], rows: [
          ['緊急預備金', '各種短期意外：失業、維修、醫療自付額', '長期失能、重大疾病的龐大支出'],
          ['就業保險失業給付', '符合資格的非自願失業', '自願離職、接案者、等待期；金額通常低於原本收入'],
          ['商業保險（第二部）', '低機率、高損失：重病、失能、身故', '小額、常發生的支出（自己付比較划算）'],
        ], caption: '失業給付的條件與金額以勞動部最新規定為準。它是「部分」替代收入，預備金要補上差額與等待期間。' },
        { type: 'heading', id: 'probability', text: '深入：為什麼「不太會發生」還是要準備' },
        '一年內失業、大病、車禍的機率，單看每一項都不高。但預備金要防的是「這些事件裡至少發生一件」，而且時間拉長到十年、二十年，至少遇到一次的機率會變得很高。預備金的設計目標，不是讓你在每一個意外裡都毫髮無傷，而是讓任何一個意外都不至於演變成長期的債務。',
      ],
    },
    mistakes: [

      { wrong: '把信用卡額度當成預備金。', why: '那是借錢，而且利率可能是 15%。', right: '預備金必須是自己的現金。' },
    ],
    keypoints: [
      '預備金防的是「被迫在最差時間點做決定」。',

    sources: ['mol-unemployment', 'cfpb-savings', 'banking-act-47-1', 'fsc-moneywise'],

  '3-2': {
    goals: [
      '用安全、流動、報酬三個條件挑預備金的存放處',

    analogy: {
      text: ['滅火器要放在廚房門口，不是鎖在倉庫的保險箱裡，也不是拿去換成一幅「會增值」的畫。它唯一的工作是：需要的時候，馬上拿得到、一定能用。', '預備金的存放處也只看三件事，而且有先後順序：先安全（不會虧損）、再流動（幾天內拿得到）、最後才是報酬。三者不可能同時最好。'],
      limit: ['滅火器放著不會變少；錢放著會被通膨慢慢吃掉。所以在安全與流動的前提下，報酬還是值得顧一下，只是不能本末倒置。'],

        { type: 'heading', id: 'real', text: '通膨會吃掉預備金嗎？' },
        '會，而且要坦然接受。主計總處公布 2026 年 9 月消費者物價指數（CPI）年增 2.73%，前三季平均約 1.94%。定存 1.7% 左右，[[實質利率]]大約是 −1% 到 0%：預備金的購買力每年會縮水一點點。這是預備金的「保費」，換來的是需要時一定拿得到。',

          return { rows: [
            { label: '一年後帳戶裡的錢', value: `${Math.round(nominal).toLocaleString()} 元`, ratio: Math.min(1, nominal / 1050000) },

          ], note: '預設 20 萬、利率 1.7%、通膨 2.7%：一年後購買力約少 1,950 元。對照 3-1：若因為沒有預備金而背上 20 萬卡債，一年利息可能是 3 萬。' };
        } } },
        { type: 'heading', id: 'ladder', text: '分層存放：前段活存、後段定存' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="預備金分兩層：第一層一個月放活存隨時可用，第二層其餘月份放定存或定存梯，到期日錯開">
