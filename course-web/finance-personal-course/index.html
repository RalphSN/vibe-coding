<script>
/* ==========================================================================
   App：狀態、路由、版面
   ========================================================================== */
(() => {
'use strict';

const STORAGE_KEY = 'finance-personal-course.v1';
const PREFS_KEY = 'finance-personal-course.prefs.v1';
const READ_CHARS_PER_MIN = 300;
const MINUTES_PER_QUESTION = 0.75;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- localStorage 讀寫：包 try/catch，失敗時退回記憶體 ---------- */
function createStore(key, fallback) {
  const clone = (obj) => JSON.parse(JSON.stringify(obj));
  let state = clone(fallback);
  let isPersistent = true;
  try {
    const raw = window.localStorage.getItem(key);
    if (raw) state = Object.assign(clone(fallback), JSON.parse(raw));
  } catch (err) {
    isPersistent = false;
    console.warn(`無法從 localStorage 讀取「${key}」，改用暫存模式：`, err);
  }
  function save() {
    if (!isPersistent) return;
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch (err) {
      isPersistent = false;
      console.warn(`無法寫入 localStorage「${key}」，改用暫存模式：`, err);
    }
  }
  return {
    get: () => state,
    persistent: () => isPersistent,
    update(fn) { fn(state); save(); },
    reset() { state = clone(fallback); save(); },
  };
}
const Store = createStore(STORAGE_KEY, { done: {}, visited: {}, quiz: {}, openModules: {} });
const Prefs = createStore(PREFS_KEY, { fontScale: null, sidebarWidth: null, theme: null });

function lessonState(id) {
  const s = Store.get();
  if (s.done[id]) return 'done';
  if (s.visited[id]) return 'visited';
  return 'new';
}
function moduleProgress(mod) {
  const done = mod.lessons.filter((l) => Store.get().done[l.id]).length;
  return { done, total: mod.lessons.length };
}
function overallProgress() {
  const done = LESSONS.filter((l) => Store.get().done[l.id]).length;
  return { done, total: LESSONS.length };
}
const STATE_TEXT = { new: '未讀', visited: '讀到一半', done: '已完成' };

/* ---------- 文字處理：先跳脫，再套用輕量標記 ---------- */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/**
 * 內文標記：**粗體**、==螢光==、`程式碼`、{kbd:按鍵}、[[術語]] 或 [[術語|顯示文字]]、[文字](網址)
 * 內容一律先跳脫，因此資料中的 HTML 不會被執行。
 */
function md(str) {
  let out = esc(str);
  const codes = [];
  out = out.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  out = out.replace(/\{kbd:([^}]+)\}/g, '<kbd>$1</kbd>');
  out = out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, key, label) => termButton(key, label));
  out = out.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 站內連結只接受 hash 路由（例如 #/system），同一個分頁開啟
  out = out.replace(/\[([^\]]+)\]\((#\/[a-z0-9/-]*)\)/g, '<a href="$2">$1</a>');
  out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[Number(i)]}</code>`);
  return out;
}
/* 術語按鈕：key 經過 esc() 後才進來，查表時還原 */
function termButton(escapedKey, label) {
  const key = escapedKey.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  const term = GLOSSARY[key];
  const text = label || escapedKey;
  if (!term) return `<span class="term-missing" title="術語表沒有這個詞">${text}</span>`;
  return `<button type="button" class="term" data-term="${escapedKey}" aria-expanded="false" aria-controls="term-pop">${text}</button>`;
}

/* ---------- 詞組斷行（line-breaking.md 2.1） ---------- */
const wordSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null;
const HAN = /\p{Script=Han}/u;
/* 只包中文詞：英文單字包了 nowrap 反而會在窄容器溢出 */
// 標題裡連續的英文詞（auto mode、GitHub Actions）用不換行空白黏在一起，避免專有名詞被拆成兩行。
// 超過 14 個字元的（managed settings）不黏：手機上比容器還寬時，寧可在空白處換行，也不要從單字中間斷開
const LATIN_RUN = /[A-Za-z0-9.]+(?: [A-Za-z0-9.]+)+/g;
const MAX_GLUED_LATIN = 14;
function wrapWordsHtml(rawText) {
  const text = rawText.replace(LATIN_RUN, (run) => (run.length <= MAX_GLUED_LATIN ? run.replace(/ /g, ' ') : run));
  if (!wordSegmenter) return esc(text);
  return [...wordSegmenter.segment(text)]
    .map(({ segment, isWordLike }) => (isWordLike && HAN.test(segment) ? `<span class="word">${esc(segment)}</span>` : esc(segment)))
    .join('');
}
function renderPhrases(text) {
  const phrases = splitPhrases(text);
  // 空格放在詞組之間（inline-block 外面），才不會被行首行尾吃掉
  return phrases.map((phrase, i) => `${i > 0 && needsSpaceBetween(phrases[i - 1], phrase) ? ' ' : ''}<span class="phrase">${wrapWordsHtml(phrase)}</span>`).join('');
}

/* ---------- 閱讀時間：中文每分鐘 300 字，練習每題另計 ---------- */
function collectText(value) {
  if (value == null) return '';
  if (typeof value === 'string') return value;
  if (Array.isArray(value)) return value.map(collectText).join('');
  if (typeof value === 'object') {
    return Object.entries(value).filter(([k]) => k !== 'svg' && k !== 'props' && k !== 'why').map(([, v]) => collectText(v)).join('');
  }
  return '';
}
function readingMinutes(lesson) {
  const c = lesson.content;
  if (!c) return null;
  if (c.minutes) return c.minutes;
  const text = collectText({ ...c, practice: null, review: null, sources: null }).replace(/<[^>]+>/g, '').replace(/\s+/g, '');
  const questions = (c.practice || []).length + (c.review || []).length;
  return Math.max(3, Math.round(text.length / READ_CHARS_PER_MIN + questions * MINUTES_PER_QUESTION));
}

/* ---------- 主題切換：跟隨系統 → 淺色 → 深色 ---------- */
const THEME_ORDER = [null, 'light', 'dark'];
const THEME_LABEL = { null: '跟隨系統', light: '淺色', dark: '深色' };
function applyTheme() {
  const theme = Prefs.get().theme;
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
  const btn = $('#theme-btn');
  btn.setAttribute('aria-label', `切換深淺色（目前：${THEME_LABEL[theme]}）`);
  btn.title = `目前：${THEME_LABEL[theme]}`;
}
function cycleTheme() {
  Prefs.update((p) => {
    const i = THEME_ORDER.indexOf(p.theme);
    p.theme = THEME_ORDER[(i + 1) % THEME_ORDER.length];
  });
  applyTheme();
  announce(`已切換為${THEME_LABEL[Prefs.get().theme]}`);
}

function announce(msg) {
  const live = $('#live');
  live.textContent = '';
  window.setTimeout(() => { live.textContent = msg; }, 30);
}

/* ---------- 字級：6 段，存在 Prefs，載入時由 <head> 的 script 先套用 ---------- */
const FONT_STEPS = [0.875, 1, 1.125, 1.25, 1.375, 1.5];
function currentFontScale() { return Prefs.get().fontScale || 1; }
function syncTopbarHeight() {
  const height = Math.ceil($('.topbar').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--topbar-h', `${height}px`);
}
const LARGE_TEXT_SCALE = 1.375;
function applyFontScale(scale, shouldAnnounce) {
  document.documentElement.style.setProperty('--font-scale', String(scale));
  document.documentElement.toggleAttribute('data-large-text', scale >= LARGE_TEXT_SCALE);
  const i = FONT_STEPS.indexOf(scale);
  $$('[data-font-pct]').forEach((el) => { el.textContent = `${Math.round(scale * 100)}%`; });
  $$('[data-font="down"]').forEach((b) => { b.disabled = i <= 0; });
  $$('[data-font="up"]').forEach((b) => { b.disabled = i >= FONT_STEPS.length - 1; });
  if (shouldAnnounce) announce(`字級 ${Math.round(scale * 100)}%`);
  Resizer.applyPreferred();
  syncTopbarHeight();
  scheduleFit();
}
function changeFont(action) {
  const i = FONT_STEPS.indexOf(currentFontScale());
  let next = 1;
  if (action === 'up') next = FONT_STEPS[Math.min(FONT_STEPS.length - 1, i + 1)];
  if (action === 'down') next = FONT_STEPS[Math.max(0, i - 1)];
  Prefs.update((p) => { p.fontScale = next === 1 ? null : next; });
  applyFontScale(next, true);
}

/* ---------- 設定選單（手機版字級） ---------- */
const Settings = (() => {
  const btn = $('#settings-btn');
  const menu = $('#settings-menu');
  function set(open) {
    menu.dataset.open = String(open);
    btn.setAttribute('aria-expanded', String(open));
  }
  btn.addEventListener('click', () => set(menu.dataset.open !== 'true'));
  document.addEventListener('click', (e) => { if (!e.target.closest('.settings')) set(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && menu.dataset.open === 'true') { set(false); btn.focus(); }
  });
  return { close: () => set(false) };
})();

/* ---------- 系列選單：頂部列下拉（≥ 768px）與側欄清單（< 768px）用同一份資料 ---------- */
const Series = (() => {
  const btn = $('#series-btn');
  const menu = $('#series-menu');
  const listHtml = `<ol class="series-list">${SERIES.volumes.map((v) => {
    const inner = `<span class="vol">${esc(v.vol)}</span><span class="ttl">${esc(v.title)}</span>`;
    if (v.id === SERIES.current) return `<li><a class="series-item" href="#/" aria-current="page">${inner}</a></li>`;
    if (v.href) return `<li><a class="series-item" href="${esc(v.href)}">${inner}</a></li>`;
    return `<li><span class="series-item is-soon">${inner}<span class="soon">製作中</span></span></li>`;
  }).join('')}</ol>`;
  menu.innerHTML = `<span class="label" style="--chip:var(--m2)">${esc(SERIES.name)}・${SERIES.volumes.length} 卷</span>${listHtml}`;
  const here = SERIES.volumes.find((v) => v.id === SERIES.current);
  $('#sidebar-series').innerHTML = `<details class="reveal"><summary>${esc(SERIES.name)}・${SERIES.volumes.length} 卷（目前：${esc(here.vol)}）</summary><div class="reveal-body">${listHtml}</div></details>`;
  function set(open) {
    menu.dataset.open = String(open);
    btn.setAttribute('aria-expanded', String(open));
  }
  btn.addEventListener('click', () => set(menu.dataset.open !== 'true'));
  menu.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.series')) set(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && menu.dataset.open === 'true') { set(false); btn.focus(); }
  });
  return { close: () => set(false) };
})();

/* ---------- 可拖曳寬度的側欄（components.md 第 1 節） ---------- */
const SIDEBAR_WIDTH = { min: 224, max: 480, step: 16, fallback: 288 };
const Resizer = (() => {
  const root = document.documentElement;
  const handle = $('.sidebar-resizer');
  const maxWidth = () => Math.min(SIDEBAR_WIDTH.max, Math.round(window.innerWidth * 0.4));
  function apply(px) {
    const width = Math.round(Math.min(maxWidth(), Math.max(SIDEBAR_WIDTH.min, px)));
    root.style.setProperty('--sidebar-w', `${width}px`);
    handle.setAttribute('aria-valuenow', String(width));
    handle.setAttribute('aria-valuemax', String(maxWidth()));
    return width;
  }
  // 使用者沒拖過把手時，預設寬度跟著字級放大，150% 字級時目錄標題才不會被擠到斷字
  const defaultWidth = () => Math.round(SIDEBAR_WIDTH.fallback * currentFontScale());
  function save(width) { Prefs.update((p) => { p.sidebarWidth = width === defaultWidth() ? null : width; }); }
  handle.addEventListener('pointerdown', (event) => {
    handle.setPointerCapture(event.pointerId);
    root.classList.add('is-resizing');
  });
  handle.addEventListener('pointermove', (event) => {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    // 側欄貼齊視窗左緣，所以指標的 x 座標就是新寬度
    apply(event.clientX);
  });
  handle.addEventListener('lostpointercapture', () => {
    root.classList.remove('is-resizing');
    save(parseInt(handle.getAttribute('aria-valuenow'), 10));
    scheduleFit();
  });
  handle.addEventListener('dblclick', () => { save(apply(defaultWidth())); scheduleFit(); });
  handle.addEventListener('keydown', (event) => {
    const current = parseInt(handle.getAttribute('aria-valuenow'), 10);
    const next = {
      ArrowLeft: current - SIDEBAR_WIDTH.step,
      ArrowRight: current + SIDEBAR_WIDTH.step,
      Home: SIDEBAR_WIDTH.min,
      End: maxWidth(),
    }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    save(apply(next));
    announce(`目錄寬度 ${handle.getAttribute('aria-valuenow')} 像素`);
    scheduleFit();
  });
  const applyPreferred = () => apply(Prefs.get().sidebarWidth || defaultWidth());
  applyPreferred();
  // 用偏好值重算，而不是目前的值：視窗暫時縮小時被夾到最小值，放大後才回得去
  window.addEventListener('resize', applyPreferred);
  return { apply, applyPreferred };
})();

/* ---------- 孤行處理：動態縮小字級（line-breaking.md 2.5） ---------- */
const FIT = { minScale: 0.8, step: 0.05, shortChars: 2 };
// 首頁 hero 與 section-title 混有貼紙方塊，行高不一，會被誤判成多行，所以不列入
const FIT_TARGETS = '.lesson-head h1, .card-title, .lesson-nav .ttl';
function measureLines(element) {
  const chars = [];
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    for (let i = 0; i < node.length; i += 1) {
      if (!node.data[i].trim()) continue;
      const range = document.createRange();
      range.setStart(node, i);
      range.setEnd(node, i + 1);
      const rect = range.getClientRects()[0];
      if (rect) chars.push({ ch: node.data[i], top: rect.top, height: rect.height });
    }
  }
  const lines = [];
  chars.forEach((c) => {
    const last = lines[lines.length - 1];
    if (!last || c.top - last.top > c.height / 2) lines.push({ top: c.top, text: c.ch });
    else last.text += c.ch;
  });
  return lines.map((l) => l.text);
}
// 1–2 個字，或沒有任何文字（只有編號、符號）的行算孤行
const isShortLine = (line) => line.length <= FIT.shortChars || !/\p{L}/u.test(line);
function hasShortLine(element) {
  const lines = measureLines(element);
  return lines.length > 1 && lines.some(isShortLine);
}
function fitShortText(element) {
  if (!element.offsetParent && element.tagName !== 'H1') return;
  let scale = 1;
  element.style.setProperty('--fit', '1');
  while (hasShortLine(element) && scale - FIT.step >= FIT.minScale - 1e-6) {
    scale = Math.round((scale - FIT.step) * 100) / 100;
    element.style.setProperty('--fit', String(scale));
  }
  if (hasShortLine(element)) {
    console.warn('縮到字級下限仍有孤行，請改寫標題或調整 | 斷點：', element.textContent.trim());
  }
}
let fitFrame = 0;
function fitAll() { $$(FIT_TARGETS).forEach(fitShortText); }
function scheduleFit() {
  window.cancelAnimationFrame(fitFrame);
  fitFrame = window.requestAnimationFrame(fitAll);
}

const Drawer = (() => {
  const sidebar = () => $('#sidebar');
  const isDesktop = () => window.matchMedia('(min-width: 1280px)').matches;
  let lastFocus = null;
  function open() {
    if (isDesktop()) return;
    lastFocus = document.activeElement;
    sidebar().classList.add('open');
    $('#scrim').dataset.open = 'true';
    $('.menu-btn').setAttribute('aria-expanded', 'true');
    const current = $('.nav-link[aria-current="page"]', sidebar()) || $('.sidebar-close');
    window.setTimeout(() => current.focus(), 50);
  }
  function close(restoreFocus = true) {
    if (!sidebar().classList.contains('open')) return;
    sidebar().classList.remove('open');
    $('#scrim').dataset.open = 'false';
    $('.menu-btn').setAttribute('aria-expanded', 'false');
    if (restoreFocus && lastFocus) lastFocus.focus();
  }
  function trap(e) {
    if (e.key !== 'Tab' || !sidebar().classList.contains('open')) return;
    const focusables = $$('button, a[href]', sidebar()).filter((el) => el.offsetParent !== null && !el.closest('.collapse[data-open="false"]'));
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  return { open, close, trap, isOpen: () => sidebar().classList.contains('open') };
})();

/* ---------- 路由 ---------- */
function parseRoute() {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] === 'l' && LESSON_BY_ID[parts[1]]) return { name: 'lesson', id: parts[1] };
  if (parts[0] === 'm' && COURSES[Number(parts[1])]) return { name: 'module', id: Number(parts[1]) };
  if (parts[0] === 'styleguide') return { name: 'styleguide' };
  if (parts[0] === 'references') return { name: 'references' };
  if (parts.length === 0) return { name: 'home' };
  return { name: 'notfound', raw: hash };
}

const Views = {};

function render() {
  const route = parseRoute();
  currentLessonId = route.name === 'lesson' ? route.id : null;
  const main = $('#main');
  const view = Views[route.name] || Views.notfound;
  main.innerHTML = view(route);
  $('#toc').innerHTML = route.name === 'lesson' ? renderToc(route.id) : '';
  // 沒有本課目錄的頁面（首頁、模組頁），不保留右側空欄
  $('.layout').classList.toggle('no-toc', !$('#toc').innerHTML.trim());
  if (!prefersReducedMotion()) {
    main.classList.remove('view-enter');
    void main.offsetWidth;
    main.classList.add('view-enter');
  }
  if (route.name === 'lesson') {
    Store.update((s) => { s.visited[route.id] = true; });
    document.title = `${route.id} ${LESSON_BY_ID[route.id].plain}｜${SITE.name}`;
  } else if (route.name === 'module') {
    document.title = `模組 ${route.id} ${plainTitle(COURSES[route.id].title)}｜${SITE.name}`;
  } else {
    document.title = SITE.name;
  }
  renderNav();
  updateTopProgress();
  Drawer.close(false);
  hydrate(main);
  focusHeading(main);
  scheduleFit();
}

function focusHeading(main) {
  const h1 = $('h1', main);
  if (!h1) return;
  h1.setAttribute('tabindex', '-1');
  if (window.scrollY > 0) window.scrollTo(0, 0);
  h1.focus({ preventScroll: true });
}

  }
  const fontBtn = e.target.closest('[data-font]');
  if (fontBtn) { changeFont(fontBtn.dataset.font); return; }
  const scrollLink = e.target.closest('[data-scroll]');
  if (scrollLink) {
    e.preventDefault();
    const target = document.getElementById(scrollLink.dataset.scroll);
    if (target) {
      target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      const heading = $('h2', target) || target;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const { action: name, id } = action.dataset;
  if (name === 'done') markDone(id, true);
  if (name === 'undone') markDone(id, false);
  if (name === 'reset' && window.confirm('確定要清除所有學習進度嗎？字級與目錄寬度不會被清除。')) {
    Store.reset();
    render();
    announce('學習進度已清除');
  }
}

function markDone(id, isDone) {
  Store.update((s) => { if (isDone) s.done[id] = true; else delete s.done[id]; });
  const row = $('#done-row');
  if (row) {
    row.innerHTML = isDone
      ? `<span class="stamp animate">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
      : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完後按一下。</span>`;
    const focusTarget = $('button', row);
    if (focusTarget) focusTarget.focus();
  }
  renderNav();
  updateTopProgress();
  announce(isDone ? `${id} 已標記為完成` : `${id} 已改回未完成`);
}

function isTyping(el) {
  return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function onKeydown(e) {
  if (e.key === 'Escape' && Drawer.isOpen()) { Drawer.close(); return; }
  Drawer.trap(e);
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || isTyping(document.activeElement)) return;
  if (document.activeElement && document.activeElement.closest('[role="tablist"], .tw-controls, .anat-input, .fs-side, [role="listbox"], [role="separator"], input[type="range"], [role="radiogroup"]')) return;
  const route = parseRoute();
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && route.name === 'lesson') {
    const pos = LESSONS.findIndex((l) => l.id === route.id);
    const target = LESSONS[pos + (e.key === 'ArrowRight' ? 1 : -1)];
    if (target) { e.preventDefault(); window.location.hash = `#/l/${target.id}`; }
  }
}

/* 對外開放給元件區使用 */
window.App = { $, $$, esc, md, createStore, Store, Prefs, Sections, Views, Hydrators, announce, render, renderNav, updateTopProgress, prefersReducedMotion, isTyping, readingMinutes, renderPhrases, scheduleFit, fitAll, measureLines, currentLessonId: () => currentLessonId };

document.addEventListener('click', onClick);
document.addEventListener('keydown', onKeydown);
$('.menu-btn').addEventListener('click', () => Drawer.open());
$('.sidebar-close').addEventListener('click', () => Drawer.close());
$('#scrim').addEventListener('click', () => Drawer.close());
$('#theme-btn').addEventListener('click', cycleTheme);
$$('.theme-side-btn').forEach((b) => b.addEventListener('click', cycleTheme));
window.addEventListener('hashchange', render);
// 換課動畫結束就拿掉 class：留著的 transform 會讓 main 變成 fixed 元素的定位基準
$('#main').addEventListener('animationend', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('view-enter'); });

/* 元件區載入後再進行第一次渲染 */
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  applyFontScale(currentFontScale(), false);
  renderFooter();
  render();
  new ResizeObserver(scheduleFit).observe($('#main'));
  // 頂部列的實際高度會隨斷點、字級改變，量出來寫回 --topbar-h，讓側欄、把手、捲動定位都貼齊它的底線
  syncTopbarHeight();
  window.addEventListener('resize', syncTopbarHeight);
  new ResizeObserver(syncTopbarHeight).observe($('.topbar'), { box: 'border-box' }); // padding 在不同斷點會變，要看外框高度
  if (document.fonts) document.fonts.ready.then(scheduleFit);
});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/powershell.min.js" integrity="sha512-I2sYcyooqG4MUbNURH1azVlcuwqA4uxCFT9tLOXIhrvwrosPpNrE0Zz0AYdjRaGPacIrJTwnTut5CzB6VNc6Hw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script>
/* ==========================================================================
   共用元件
   ========================================================================== */
(() => {
'use strict';
const { $, $$, esc, md, createStore, Store, Sections, Views, Hydrators, announce, prefersReducedMotion, isTyping, renderPhrases } = window.App;

let uidCounter = 0;
const uid = (prefix = 'u') => `${prefix}${++uidCounter}`;
const COPY_TEXT = new Map();
const LANG_ALIAS = { cmd: 'plaintext', bat: 'plaintext', pwsh: 'powershell', text: 'plaintext', prompt: 'plaintext', toml: 'ini', jsonc: 'json', sh: 'bash', zsh: 'bash', shell: 'bash', yml: 'yaml', md: 'markdown', js: 'javascript', ts: 'typescript', ps1: 'powershell', py: 'python' };
const LANG_LABEL = { plaintext: 'TEXT', bash: 'BASH', json: 'JSON', python: 'PYTHON', typescript: 'TYPESCRIPT', javascript: 'JAVASCRIPT', markdown: 'MARKDOWN', yaml: 'YAML', xml: 'XML', ini: 'TOML', powershell: 'POWERSHELL', sql: 'SQL', dockerfile: 'DOCKERFILE' };

/* 單元內容裡定義的術語，自動加進術語表 */
LESSONS.forEach((lesson) => {
  const defs = lesson.content && lesson.content.define;
  if (!defs) return;
  defs.forEach((d) => {
    if (!GLOSSARY[d.term]) GLOSSARY[d.term] = { en: d.en, def: d.def, example: d.example, lesson: lesson.id };
    else if (!GLOSSARY[d.term].lesson) GLOSSARY[d.term].lesson = lesson.id;
  });
});

/* ---------- 區塊渲染 ---------- */
function renderBlocks(blocks) {
  if (blocks == null) return '';
  const list = Array.isArray(blocks) ? blocks : [blocks];
  return list.map(renderBlock).join('');
}

function renderBlock(b) {
  if (typeof b === 'string') return `<p>${md(b)}</p>`;
  switch (b.type) {
    case 'list': {
      const tag = b.ordered ? 'ol' : 'ul';
      return `<${tag}>${b.items.map((i) => `<li>${md(i)}</li>`).join('')}</${tag}>`;
    }
    case 'code': return codeBlock(b);
    case 'table': return tableBlock(b);
    case 'callout': return `<div class="callout ${esc(b.variant || 'tip')}"><span class="label">${md(b.title || '')}</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'unverified': return `<div class="callout unverified"><span class="label">截至 2026-10 查證狀態：未確認</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'timely': return `<div class="callout timely"><span class="label">時效提醒</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'legacy': return legacyBlock(b);
    case 'svg': return `<figure class="figure">${b.svg}<button type="button" class="btn small nb-press fig-zoom" data-fig-zoom>放大看</button>${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure>`;
    case 'compare': return compareBlock(b);
    case 'tabs': return tabsBlock(b);
    case 'reveal': return `<details class="reveal"><summary>${esc(b.summary || '展開')}</summary><div class="reveal-body blocks">${renderBlocks(b.body)}</div></details>`;
    case 'quiz': return quizList(b.items, b.key || uid('qz'));
    case 'widget': return renderWidget(b);
    case 'heading': return `<h2 class="ref-h" id="sec-${esc(b.id)}"><span class="label">${esc(b.text)}</span></h2>`;
    case 'tryit': return tryitBlock(b);
    default:
      console.error('未知的區塊類型：', b);
      return '';
  }
}

function codeBlock({ lang = 'text', code, title, label }) {
  const resolved = LANG_ALIAS[lang] || lang;
  const id = uid('code');
  COPY_TEXT.set(id, code);
  return `<div class="code">
    <div class="code-head"><span class="lang">${esc(label || (lang === 'cmd' || lang === 'bat' ? 'CMD' : lang === 'zsh' ? 'ZSH' : LANG_LABEL[resolved] || resolved))}</span><span class="ttl">${esc(title || '')}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${title ? ` ${esc(title)}` : '程式碼'}">複製</button></div>
    <pre tabindex="0" aria-label="${esc(title || '程式碼')}"><code class="language-${esc(resolved)}">${esc(code)}</code></pre>
  </div>`;
}

function tableBlock({ head, rows, caption }) {
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption || '表格')}"><table>
    ${caption ? `<caption>${md(caption)}</caption>` : ''}
    <thead><tr>${head.map((h) => `<th scope="col">${md(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => (i === 0 ? `<th scope="row">${md(cell)}</th>` : `<td>${md(cell)}</td>`)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function legacyBlock({ title, rows, note }) {
  return `<div class="callout legacy"><span class="label">${esc(title || '舊做法 → 現在的做法')}</span><div class="body">
    <div class="legacy-grid">${rows.map(([oldWay, newWay]) => `<div class="legacy-row"><div class="old">${md(oldWay)}</div><div class="arrow" aria-hidden="true">→</div><div class="new"><span class="visually-hidden">現在：</span>${md(newWay)}</div></div>`).join('')}</div>
    ${note ? `<p style="margin-top:var(--sp-3)">${md(note)}</p>` : ''}
  </div></div>`;
}

/* ---------- 對照器：prompt、設定檔、指令都適用 ---------- */
const DIFF_RE = /\{\{(\d+):([\s\S]+?)\}\}/g;
function promptHtml(text) { return esc(text).replace(DIFF_RE, '<mark class="diff" data-n="$1">$2</mark>'); }
function promptPlain(text) { return text.replace(DIFF_RE, '$2'); }

function compareSide(kind, label, text, ctx, result, isCode) {
  const id = uid('cmp');
  COPY_TEXT.set(id, promptPlain(text));
  return `<div class="compare-side ${kind}">
    <div class="side-head"><span class="label">${esc(label)}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${esc(label)}">複製</button></div>
    <pre class="prompt-text${isCode ? ' is-code' : ''}">${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${promptHtml(text)}</pre>
    ${result ? `<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)"><strong>${kind === 'bad' ? '可能的結果' : '得到的結果'}：</strong>${md(result)}</p>` : ''}
  </div>`;
}

function compareBlock(b) {
  return `<div class="compare side-by-side">
    ${b.title ? `<div class="compare-title"><span class="label">${esc(b.kind || '對照')}</span>${md(b.title)}</div>` : ''}
    <div class="compare-grid">
      ${compareSide('bad', b.badLabel || '✗ 壞做法', b.bad, b.badCtx, b.badResult, b.code)}
      ${compareSide('good', b.goodLabel || '✓ 好做法', b.good, b.goodCtx, b.goodResult, b.code)}
    </div>
    ${b.why && b.why.length ? `<div class="why"><strong>差在哪裡</strong><ol>${b.why.map((w, i) => `<li><span class="n">${i + 1}</span><span>${md(w)}</span></li>`).join('')}</ol></div>` : ''}
  </div>`;
}

function tryitBlock(t) {
  return `<div class="tryit"><span class="label">換你補完</span>
    <div class="blocks">${renderBlocks(t.q)}</div>
    ${t.draft ? `<pre class="prompt-text${t.code ? ' is-code' : ''}" style="margin-top:var(--sp-3)">${esc(t.draft).replace(/____/g, '<span class="blank" aria-label="空格">　</span>')}</pre>` : ''}
    <details class="reveal" style="margin-top:var(--sp-4)"><summary>我寫好了，看參考答案</summary><div class="reveal-body blocks">${renderBlocks(t.answer)}</div></details>
  </div>`;
}

/* ---------- 分頁：舊面板淡出後，新面板淡入 ---------- */
function tabsBlock({ tabs, label }) {
  const base = uid('tabs');
  return `<div class="tabs">
    <div class="tablist" role="tablist" aria-label="${esc(label || '分頁')}">
      ${tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="${base}-t${i}" aria-controls="${base}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(t.label)}</button>`).join('')}
    </div>
    ${tabs.map((t, i) => `<div class="tabpanel blocks" role="tabpanel" id="${base}-p${i}" aria-labelledby="${base}-t${i}" tabindex="0" ${i === 0 ? '' : 'hidden'}>${renderBlocks(t.blocks)}</div>`).join('')}
  </div>`;
}
const TAB_LEAVE_MS = 120;
function selectTab(tab) {
  if (tab.getAttribute('aria-selected') === 'true') return;
  const list = tab.closest('[role="tablist"]');
  const tabs = $$('[role="tab"]', list);
  const oldTab = tabs.find((t) => t.getAttribute('aria-selected') === 'true');
  tabs.forEach((t) => {
    const selected = t === tab;
    t.setAttribute('aria-selected', String(selected));
    t.tabIndex = selected ? 0 : -1;
  });
  const newPanel = document.getElementById(tab.getAttribute('aria-controls'));
  const oldPanel = oldTab ? document.getElementById(oldTab.getAttribute('aria-controls')) : null;
  const swap = () => {
    if (oldPanel) { oldPanel.hidden = true; oldPanel.classList.remove('is-leaving'); }
    newPanel.hidden = false;
  };
  if (!oldPanel || prefersReducedMotion()) { swap(); return; }
  oldPanel.classList.add('is-leaving');
  window.setTimeout(swap, TAB_LEAVE_MS);
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) selectTab(tab);
});
document.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]'));
  const i = tabs.indexOf(tab);
  const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const next = tabs[(moves[e.key] + tabs.length) % tabs.length];
  selectTab(next);
  next.focus();
});

/* ---------- 測驗：每個選項都有解析，選項依 key 固定打亂 ---------- */
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 同一題每次載入順序一樣，存下來的答案才對得上；不同題順序不同 */
function shuffledOrder(n, key) {
  const order = Array.from({ length: n }, (_, i) => i);
  let seed = hashString(key) || 1;
  for (let i = n - 1; i > 0; i -= 1) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = seed % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

function quizList(items, keyBase) {
  return `<div class="quiz-list">${items.map((item, i) => quizItem(item, `${keyBase}:${i}`)).join('')}</div>`;
}

function quizHead(item) {
  const parts = [];
  if (item.level) parts.push(`<span class="label lv" data-lv="${esc(item.level)}">${esc(item.level)}</span>`);
  if (item.from && LESSON_BY_ID[item.from]) parts.push(`<a class="label review-from" href="#/l/${item.from}">回顧 ${esc(item.from)}</a>`);
  return parts.length ? `<div class="quiz-head">${parts.join('')}</div>` : '';
}

function quizItem(item, key) {
  if (item.type === 'mc') {
    QUIZ_REGISTRY.set(key, item);
    const order = shuffledOrder(item.options.length, key);
    return `<form class="quiz" data-quiz="${esc(key)}" novalidate>
      ${quizHead(item)}
      <fieldset><legend>${md(item.q)}</legend>
        <div class="opts">${order.map((oi) => `<label class="opt" data-oi="${oi}"><input type="radio" name="${esc(key)}" value="${oi}"><span>${md(item.options[oi].text)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div>
      </fieldset>
      <div class="quiz-actions"><button type="submit" class="btn primary nb-press">送出答案</button><button type="button" class="btn small nb-press" data-quiz-reset hidden>重做這題</button></div>
      <div class="quiz-feedback" hidden></div>
    </form>`;
  }
  return `<div class="quiz" data-reveal="${esc(key)}">
    ${quizHead(item)}
    <div class="quiz-q blocks">${renderBlocks(item.q)}</div>
    <details class="reveal"><summary>我想好了，看答案</summary><div class="reveal-body blocks">${renderBlocks(item.answer)}</div></details>
  </div>`;
}

const QUIZ_REGISTRY = new Map();
const correctIndex = (item) => item.options.findIndex((o) => o.correct);

function showQuizResult(form, item, choice) {
  const answer = correctIndex(item);
  const isCorrect = choice === answer;
  form.classList.add('answered');
  const displayOrder = $$('.opt', form).map((opt) => Number(opt.dataset.oi));
  $$('.opt', form).forEach((opt) => {
    const oi = Number(opt.dataset.oi);
    const input = $('input', opt);
    input.checked = oi === choice;
    input.disabled = true;
    opt.classList.toggle('is-correct', oi === answer);
    opt.classList.toggle('is-wrong', oi === choice && !isCorrect);
    $('.mark', opt).textContent = oi === answer ? '✓ 正確' : (oi === choice ? '✗ 你的選擇' : '');
  });
  // 選中的解析放最上面，其他依畫面順序
  const explainOrder = [choice, ...displayOrder.filter((oi) => oi !== choice)];
  const items = explainOrder.map((oi) => {
    const o = item.options[oi];
    const tag = oi === answer
      ? '<span class="label" style="--chip:var(--success)">✓ 正確答案</span>'
      : '<span class="label" style="--chip:var(--danger)">✗ 錯誤選項</span>';
    const picked = oi === choice ? '<span class="label" style="--chip:var(--highlight)">你選的</span>' : '';
    return `<li class="${oi === choice ? 'is-picked' : ''}">${tag}${picked}<span class="opt-text">${md(o.text)}</span>${md(o.why || '')}</li>`;
  }).join('');
  const fb = $('.quiz-feedback', form);
  fb.innerHTML = `<p class="verdict">${isCorrect ? '✓ 答對了' : '✗ 答錯了，正確答案已標示'}</p><ol class="explain-list">${items}</ol>`;
  fb.hidden = false;
  $('[type="submit"]', form).hidden = true;
  $('[data-quiz-reset]', form).hidden = false;
  return isCorrect;
}

function resetQuiz(form) {
  form.classList.remove('answered');
  $$('.opt', form).forEach((opt) => {
    const input = $('input', opt);
    input.checked = false; input.disabled = false;
    opt.classList.remove('is-correct', 'is-wrong');
    $('.mark', opt).textContent = '';
  });
  $('.quiz-feedback', form).hidden = true;
  $('[type="submit"]', form).hidden = false;
  $('[data-quiz-reset]', form).hidden = true;
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form.quiz');
  if (!form) return;
  e.preventDefault();
  const key = form.dataset.quiz;
  const item = QUIZ_REGISTRY.get(key);
  const picked = $('input:checked', form);
  const fb = $('.quiz-feedback', form);
  if (!item) { console.error('找不到測驗題目：', key); return; }
  if (!picked) {
    fb.innerHTML = '<p class="verdict">先選一個答案再送出。</p>';
    fb.hidden = false;
    $('input', form).focus();
    return;
  }
  const choice = Number(picked.value);
  const isCorrect = showQuizResult(form, item, choice);
  Store.update((s) => { s.quiz[key] = { choice, correct: isCorrect }; });
  announce(isCorrect ? '答對了' : '答錯了，正確答案已標示');
  fb.setAttribute('tabindex', '-1');
  fb.focus({ preventScroll: false });
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-quiz-reset]');
  if (!btn) return;
  const form = btn.closest('form.quiz');
  resetQuiz(form);
  Store.update((s) => { delete s.quiz[form.dataset.quiz]; });
  $('input', form).focus();
});
document.addEventListener('toggle', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-reveal]');
  if (wrap && e.target.open) Store.update((s) => { s.quiz[wrap.dataset.reveal] = { viewed: true }; });
}, true);

Hydrators.push((root) => {
  $$('form.quiz', root).forEach((form) => {
    const saved = Store.get().quiz[form.dataset.quiz];
    const item = QUIZ_REGISTRY.get(form.dataset.quiz);
    if (saved && item && typeof saved.choice === 'number') showQuizResult(form, item, saved.choice);
  });
});

/* ---------- 複製 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    console.warn('Clipboard API 失敗，改用備援方式：', err);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { console.warn('execCommand 複製失敗：', err); ok = false; }
  ta.remove();
  return ok;
}
const COPY_RESET_MS = 1500;
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = COPY_TEXT.get(btn.dataset.copy) ?? (btn.dataset.copyText || '');
  const ok = await copyText(text);
  const original = btn.dataset.label || btn.textContent;

/* ---------- 術語 popup（WCAG 1.4.13：可 hover、可關閉、持續） ---------- */
const TermPop = (() => {
  const SHOW_DELAY_MS = 150;
  const HIDE_GRACE_MS = 100;
  const GAP = 10;
  const EDGE = 16;
  const el = document.createElement('div');
  el.className = 'term-pop';
  el.id = 'term-pop';
  el.dataset.open = 'false';
  let anchor = null;
  let pinned = false;
  let showTimer = 0;
  let hideTimer = 0;

  function content(key, term) {
    const current = window.App.currentLessonId();
    const link = term.lesson && term.lesson !== current
      ? `<a class="tt-link" href="#/l/${esc(term.lesson)}">在 ${esc(term.lesson)} 學到 →</a>` : '';
    return { html: `<span class="tt-term">${esc(key)}</span>${term.en ? `<span class="tt-en">${esc(term.en)}</span>` : ''}<span class="tt-def">${md(term.def)}</span>${term.example ? `<span class="tt-ex"><strong>例子：</strong>${md(term.example)}</span>` : ''}${link}`, hasLink: !!link };
  }
  function show(btn, pin = false) {
    window.clearTimeout(hideTimer);
    const key = btn.dataset.term.replace(/&amp;/g, '&');
    const term = GLOSSARY[key];
    if (!term) return;
    if (anchor && anchor !== btn) release(anchor);
    anchor = btn;
    pinned = pin;
    const { html, hasLink } = content(key, term);
    el.innerHTML = html;
    // 有連結時是非模態 popover，要能 Tab 進去；沒有連結時是 tooltip
    if (hasLink) { el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${key} 的說明`); btn.removeAttribute('aria-describedby'); }
    else { el.setAttribute('role', 'tooltip'); el.removeAttribute('aria-label'); btn.setAttribute('aria-describedby', el.id); }
    if (el.previousElementSibling !== btn) btn.after(el);
    btn.setAttribute('aria-expanded', 'true');
    position(btn);
    el.dataset.open = 'true';
  }
  function release(btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.removeAttribute('aria-describedby');
  }
  function hide() {
    window.clearTimeout(showTimer);
    if (!anchor) return;
    release(anchor);
    anchor = null; pinned = false;
    el.dataset.open = 'false';
  }
  function scheduleHide() {
    window.clearTimeout(showTimer);
    if (pinned) return;
    window.clearTimeout(hideTimer);
    hideTimer = window.setTimeout(hide, HIDE_GRACE_MS);
  }
  function position(btn) {
    const r = btn.getClientRects()[0] || btn.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const left = Math.max(EDGE, Math.min(Math.max(EDGE, r.left), window.innerWidth - w - EDGE));
    let top = r.bottom + GAP;
    if (top + h > window.innerHeight - EDGE) top = r.top - h - GAP;
    top = Math.max(EDGE, top);
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    // popup 插在術語旁邊（讓 Tab 能進到裡面的連結）；祖先若有 transform（例如換課動畫），
    // fixed 會改以那個祖先為基準，所以量一次實際位置，把差距補回來
    const actual = el.getBoundingClientRect();
    if (Math.abs(actual.left - left) > 1 || Math.abs(actual.top - top) > 1) {
      el.style.left = `${left * 2 - actual.left}px`;
      el.style.top = `${top * 2 - actual.top}px`;
    }
  }

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (!b || pinned) return;
    window.clearTimeout(hideTimer);
    window.clearTimeout(showTimer);
    showTimer = window.setTimeout(() => show(b), anchor ? 0 : SHOW_DELAY_MS);
  });
  document.addEventListener('mouseout', (e) => {
    const from = e.target.closest('.term, .term-pop');
    if (!from) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.term, .term-pop');
    if (to === anchor || to === el) return;
    scheduleHide();
  });
  document.addEventListener('focusin', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (b) show(b, pinned && anchor === b);
    else if (anchor && !pinned) hide();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.term-pop')) return;
    const b = e.target.closest('.term');
    if (b) { if (anchor === b && pinned) hide(); else show(b, true); return; }
    if (anchor) hide();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && anchor) { const a = anchor; hide(); a.focus(); }
  });
  window.addEventListener('scroll', () => { if (anchor) position(anchor); }, { passive: true });
  window.addEventListener('resize', () => { if (anchor) position(anchor); });
  window.addEventListener('hashchange', hide);
  return { show, hide };
})();

(() => {
  $('#search-slot').outerHTML = `
    <div class="search" role="search">
      <label for="site-search" class="visually-hidden">搜尋課程標題與術語</label>
      <svg class="ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="2.5"/></svg>

      <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" data-open="false"></div>
    </div>`;
  const input = $('#site-search');
  const box = $('#search-results');
  const MAX_RESULTS = 12;
  const SUB_MAX = 70;
  let results = [];
  let active = -1;

  const norm = (s) => String(s || '').toLowerCase();
  function buildIndex() {
    const items = LESSONS.map((l) => ({
      kind: '課程', title: `${l.id} ${l.plain}`, sub: plainTitle(COURSES[l.moduleId].title),
      hay: norm(`${l.id} ${l.plain} ${plainTitle(COURSES[l.moduleId].title)}`), href: `#/l/${l.id}`,
    }));
    Object.entries(GLOSSARY).forEach(([key, t]) => items.push({
      kind: '術語', title: `${key}${t.en ? `（${t.en}）` : ''}`, sub: t.def.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => l || k).replace(/[`*=]/g, ''),
      hay: norm(`${key} ${t.en} ${t.def}`), href: t.lesson ? `#/l/${t.lesson}` : null,
    }));
    return items;
  }
  let INDEX = null;

  function run() {
    INDEX = INDEX || buildIndex();
    const q = norm(input.value.trim());
    if (!q) { close(); return; }
    const words = q.split(/\s+/);
    results = INDEX.filter((it) => words.every((w) => it.hay.includes(w)))
      .sort((a, b) => Number(!norm(a.title).includes(words[0])) - Number(!norm(b.title).includes(words[0])))
      .slice(0, MAX_RESULTS);
    active = results.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.innerHTML = results.length
      ? results.map((r, i) => `<div role="option" id="sr-${i}" aria-selected="${i === active}" data-i="${i}">
          <span class="label" style="--chip:${r.kind === '課程' ? 'var(--info)' : 'var(--accent)'};font-size:.7rem;padding:0 4px">${r.kind}</span>
          ${esc(r.title)}<small>${esc(r.sub.length > SUB_MAX ? `${r.sub.slice(0, SUB_MAX)}…` : r.sub)}</small></div>`).join('')
      : '<div class="empty">找不到符合的課程或術語。</div>';
    box.dataset.open = 'true';
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`);
    else input.removeAttribute('aria-activedescendant');
    const act = $(`#sr-${active}`, box);
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function close() {
    box.dataset.open = 'false';
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function go(i) {
    const r = results[i];
    if (!r) return;
    if (r.href) {
      window.location.hash = r.href.slice(1);
      input.value = '';
      close();
    } else {
      announce(`${r.title}：${r.sub}`);
    }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', () => { if (input.value.trim()) run(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; draw(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (box.dataset.open === 'true') close(); else input.blur(); }
  });
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => { const opt = e.target.closest('[role="option"]'); if (opt) go(Number(opt.dataset.i)); });
  input.addEventListener('blur', () => window.setTimeout(close, 100));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTyping(document.activeElement) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
})();

/* ---------- 共用：逐步播放控制（上一步、播放／暫停、下一步、重設） ---------- */
const STEP_MS = 2400;
function stepperControls(label) {
  return `<div class="tw-controls" role="group" aria-label="${esc(label || '動畫控制')}">
    <button type="button" class="btn small nb-press" data-step="prev">← 上一步</button>
    <button type="button" class="btn small primary nb-press" data-step="play">▶ 播放</button>
    <button type="button" class="btn small nb-press" data-step="next">下一步 →</button>
    <button type="button" class="btn small nb-press" data-step="reset">重設</button>
  </div>`;
}
function makeStepper(el, count, draw, { interval = STEP_MS, start = 0 } = {}) {
  let step = start;
  let timer = null;
  const playBtn = $('[data-step="play"]', el);
  const reduced = prefersReducedMotion();
  if (reduced) {
    playBtn.disabled = true;
    playBtn.textContent = '自動播放已關閉';
    playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一步」逐步觀看';
  }
  function sync() {
    $('[data-step="prev"]', el).disabled = step <= 0;
    $('[data-step="next"]', el).disabled = step >= count - 1;
  }
  function stop() {
    window.clearInterval(timer);
    timer = null;
    if (!reduced) playBtn.textContent = '▶ 播放';
  }
  function go(to, animate = true) {
    step = Math.min(Math.max(to, 0), count - 1);
    draw(step, animate && !reduced);
    sync();
  }
  function play() {
    if (timer) { stop(); return; }
    if (step >= count - 1) go(0);
    playBtn.textContent = '❚❚ 暫停';
    timer = window.setInterval(() => {
      if (step >= count - 1 || !document.body.contains(el)) { stop(); return; }
      go(step + 1);
    }, interval);
  }
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b || !el.contains(b)) return;
    const a = b.dataset.step;
    if (a === 'play') { play(); return; }
    stop();
    if (a === 'prev') go(step - 1);
    if (a === 'next') go(step + 1);
    if (a === 'reset') go(0, false);
  });
  el.addEventListener('keydown', (e) => {
    if (!e.target.closest('.tw-controls')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(step + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(step - 1); }
  });
  window.addEventListener('hashchange', stop, { once: true });
  go(start, false);
  return { go, stop };
}

/* ---------- tokenmeter：把文字切成「像 token 的片段」 ---------- */
// 示意用的切法，不是任何模型真正的 tokenizer：英數每 4 個字元左右一段、中文每 1 字一段、標點各自一段。
// 真正的數字一律用 count_tokens 量（1-4）。
const LATIN_PIECE = 4;
function pseudoTokens(text) {
  const out = [];
  const re = /(\s+)|([A-Za-z]+)|(\d+)|([\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}])|(.)/gu;
  let m;
  while ((m = re.exec(text))) {
    const [all, space, word, digits] = m;
    if (space) { if (out.length) out[out.length - 1] += ' '; continue; }
    const run = word || digits;
    if (run) { for (let i = 0; i < run.length; i += LATIN_PIECE) out.push(run.slice(i, i + LATIN_PIECE)); continue; }
    out.push(all);
  }
  return out;
}
Widgets.tokenmeter = {
  render(props, id) {
    return `<div class="jw tk">
      <div class="jw-head"><span class="label" style="--chip:var(--m1)">token 示意切法</span><span class="grow">輸入文字，看它大概被切成幾段</span></div>

      <label for="${id}-in">文字</label>

      <p class="tk-sum" aria-live="polite"></p>
      <p class="jw-note">${md('這是**示意**的切法，不是任何模型真正的 tokenizer。同一段文字在不同模型的 token 數不一樣；要算錢時用 API 的 `count_tokens` 量。')}</p>

      const chars = [...input.value].length;

/* ---------- costcalc：每月要花多少錢 ---------- */
// props: { model, requestsPerDay, input, output, prefix, hitRate, batch, show: ['cache','batch','storage'] }
const DAYS_PER_MONTH = 30;
// 數量級差很多的值（請求數、token 數）用對數刻度：拉桿位置 0–LOG_STEPS 對應 min–max 的等比數列
const LOG_STEPS = 1000;
const COST_SLIDERS = [
  { key: 'requestsPerDay', label: '每天請求數', min: 10, max: 1000000, log: true, unit: '次' },
  { key: 'input', label: '每次輸入 token', min: 100, max: 500000, log: true, unit: 'token' },
  { key: 'output', label: '每次輸出 token', min: 50, max: 32000, log: true, unit: 'token' },
];
const CACHE_SLIDERS = [
  { key: 'prefix', label: '其中固定不變的前綴', min: 0, max: 100, step: 5, unit: '% 的輸入' },
  { key: 'hitRate', label: '快取命中率', min: 0, max: 100, step: 5, unit: '%' },
];
/* 對數刻度的整數取到 2 位有效數字，數字比較好讀 */
function roundNice(value) {
  if (value < 100) return Math.round(value);
  const magnitude = 10 ** (Math.floor(Math.log10(value)) - 1);
  return Math.round(value / magnitude) * magnitude;
}
const toSlider = (s, value) => (s.log ? Math.round((Math.log(value / s.min) / Math.log(s.max / s.min)) * LOG_STEPS) : value);
const fromSlider = (s, pos) => (s.log ? roundNice(s.min * (s.max / s.min) ** (pos / LOG_STEPS)) : pos);
function sliderRow(id, s, value) {
  return `<div class="lv-row">
    <label for="${id}-${s.key}">${esc(s.label)}：<output data-out="${s.key}">${formatTokens(value)}</output> ${esc(s.unit)}</label>
    <input type="range" id="${id}-${s.key}" data-cc="${s.key}" min="${s.log ? 0 : s.min}" max="${s.log ? LOG_STEPS : s.max}" step="${s.log ? 1 : s.step}" value="${toSlider(s, value)}">
  </div>`;
}
Widgets.costcalc = {
  render(props, id) {
    const v = { requestsPerDay: 1000, input: 2000, output: 500, prefix: 0, hitRate: 0, ...props };
    const show = props.show || [];
    return `<div class="jw cc">
      <div class="jw-head"><span class="label" style="--chip:var(--m4)">成本計算器</span><span class="grow">價格查證於 ${esc(SITE.verifiedOn)}</span></div>
      ${chipGroup('模型', Object.entries(MODEL_PRICES).map(([k, p]) => [k, p.name]), 'data-cc-model', v.model || 'claude-opus-5-5')}
      <div class="lv-sliders">
        ${COST_SLIDERS.map((s) => sliderRow(id, s, v[s.key])).join('')}
        ${show.includes('cache') ? CACHE_SLIDERS.map((s) => sliderRow(id, s, v[s.key])).join('') : ''}
      </div>
      ${show.includes('batch') ? `<label class="rq-check"><input type="checkbox" data-cc-batch ${v.batch ? 'checked' : ''}>用 Batch API（非即時，輸入輸出都 5 折）</label>` : ''}
      <div class="cc-bars" aria-hidden="true"></div>
      <div class="cc-out" aria-live="polite"></div>
    </div>`;
  },
  hydrate(el, props) {
    const v = { requestsPerDay: 1000, input: 2000, output: 500, prefix: 0, hitRate: 0, batch: false, model: 'claude-opus-5-5', ...props };
    function draw() {
      const prefix = Math.round((v.input * v.prefix) / 100);
      const p = priceFor(v.model, v.input);
      const hit = v.hitRate / 100;
      const discount = v.batch ? BATCH_DISCOUNT : 1;
      const parts = {
        fresh: ((v.input - prefix) * p.input) / TOKENS_PER_MILLION,
        cacheRead: (prefix * hit * p.cacheRead) / TOKENS_PER_MILLION,
        cacheWrite: (prefix * (1 - hit) * p.input * CACHE_WRITE_5M_MULTIPLIER) / TOKENS_PER_MILLION,
        output: (v.output * p.output) / TOKENS_PER_MILLION,
      };
      // 沒開快取時，前綴照一般輸入價計
      if (!(props.show || []).includes('cache')) { parts.fresh = (v.input * p.input) / TOKENS_PER_MILLION; parts.cacheRead = 0; parts.cacheWrite = 0; }
      Object.keys(parts).forEach((k) => { parts[k] *= discount; });
      const perRequest = Object.values(parts).reduce((a, b) => a + b, 0);
      const perMonth = perRequest * v.requestsPerDay * DAYS_PER_MONTH;
      const rows = [['輸入（一般）', parts.fresh, 'var(--m2)'], ['快取寫入', parts.cacheWrite, 'var(--m5)'], ['快取讀取', parts.cacheRead, 'var(--m3)'], ['輸出', parts.output, 'var(--m7)']].filter((r) => r[1] > 0);
      $('.cc-bars', el).innerHTML = `<div class="cc-stack">${rows.map(([label, value, color]) => `<span style="--w:${(value / perRequest) * 100}%;--c:${color}" title="${esc(label)}"></span>`).join('')}</div>
        <div class="cc-legend">${rows.map(([label, value, color]) => `<span><i style="--c:${color}"></i>${esc(label)} ${Math.round((value / perRequest) * 100)}%</span>`).join('')}</div>`;
      $('.cc-out', el).innerHTML = `<div class="cc-big"><span>每次請求</span><strong>${formatUsd(perRequest)}</strong></div>
        <div class="cc-big"><span>每月（${DAYS_PER_MONTH} 天）</span><strong>${formatUsd(perMonth)}</strong></div>
        ${p.long && v.input > HAIKU_LONG_PROMPT_TOKENS ? '<p class="jw-note">輸入超過 10 萬 token，Haiku 5.5 整個請求改用較高的價格。</p>' : ''}`;
      Object.keys(v).forEach((k) => { const out = $(`[data-out="${k}"]`, el); if (out) out.textContent = formatTokens(v[k]); });
    }
    el.addEventListener('input', (e) => {
      const s = e.target.closest('[data-cc]');
      if (!s) return;
      const def = [...COST_SLIDERS, ...CACHE_SLIDERS].find((x) => x.key === s.dataset.cc);
      v[s.dataset.cc] = fromSlider(def, Number(s.value));
      draw();
    });
    el.addEventListener('change', (e) => { if (e.target.closest('[data-cc-batch]')) { v.batch = e.target.checked; draw(); } });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cc-model]');
      if (!b) return;
      v.model = b.dataset.ccModel;
      pressOnly(el, 'data-cc-model', v.model);
      draw();
    });
    draw();
  },
};

/* ---------- ssestream：串流回應，原始 SSE 與畫面同步（真的有資料逐筆流過，所以用動畫） ---------- */
// props: { text, chunks?, view: 'raw'|'compare'|'ui', abortable, failAt, ttft, gap, inputTokens, title }
const SSE_DEFAULT_TTFT_MS = 700;
const SSE_DEFAULT_GAP_MS = 110;
const SSE_CHUNK_CHARS = 3;
function splitChunks(text) {
  const out = [];
  let buf = '';
  [...text].forEach((ch) => {
    buf += ch;
    if (buf.length >= SSE_CHUNK_CHARS || /[，。！？、\n]/.test(ch)) { out.push(buf); buf = ''; }
  });
  if (buf) out.push(buf);
  return out;
}
function sseEvents(props, chunks) {
  const inputTokens = props.inputTokens || 42;
  const outputTokens = chunks.length;
  const ev = (event, data) => ({ event, data: JSON.stringify(data) });
  return [
    ev('message_start', { type: 'message_start', message: { id: 'msg_01Demo', type: 'message', role: 'assistant', model: 'claude-opus-5-5', content: [], usage: { input_tokens: inputTokens, output_tokens: 1 } } }),
    ev('content_block_start', { type: 'content_block_start', index: 0, content_block: { type: 'text', text: '' } }),
    ev('ping', { type: 'ping' }),
    ...chunks.map((t) => ({ ...ev('content_block_delta', { type: 'content_block_delta', index: 0, delta: { type: 'text_delta', text: t } }), text: t })),
    ev('content_block_stop', { type: 'content_block_stop', index: 0 }),
    ev('message_delta', { type: 'message_delta', delta: { stop_reason: 'end_turn', stop_sequence: null }, usage: { output_tokens: outputTokens } }),
    ev('message_stop', { type: 'message_stop' }),
  ];
}
Widgets.ssestream = {
  render(props) {
    const view = props.view || 'raw';
    const screen = (cls, label) => `<div class="ss-pane ${cls}"><div class="ss-pane-head"><span>${esc(label)}</span><span class="ss-time" data-time></span></div><div class="ss-screen" aria-live="off"></div></div>`;
    return `<div class="jw ss" data-view="${view}">
      <div class="jw-head"><span class="label" style="--chip:var(--m2)">串流播放器</span><span class="grow">${esc(props.title || '一個回應，一行一行送過來')}</span></div>
      <div class="tw-controls" role="group" aria-label="串流控制">
        <button type="button" class="btn small primary nb-press" data-ss="play">▶ 送出請求</button>
        <button type="button" class="btn small nb-press" data-ss="step">下一個事件</button>
        ${props.abortable ? '<button type="button" class="btn small danger nb-press" data-ss="stop" disabled>■ 停止生成</button>' : ''}
        <button type="button" class="btn small nb-press" data-ss="reset">重設</button>
      </div>
      <div class="ss-panes">
        ${view === 'compare' ? `${screen('ss-ui', '串流：邊產生邊顯示')}${screen('ss-whole', '不串流：全部好了才顯示')}` : ''}
        ${view === 'raw' ? `<div class="ss-pane ss-raw-pane"><div class="ss-pane-head"><span>原始 SSE（text/event-stream）</span><span class="ss-count" data-count></span></div><pre class="ss-raw" tabindex="0" aria-label="原始事件"></pre></div>${screen('ss-ui', '使用者看到的畫面')}` : ''}
        ${view === 'ui' ? screen('ss-ui', '使用者看到的畫面') : ''}
      </div>
      <p class="tw-note ss-status" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el, props) {
    const chunks = props.chunks || splitChunks(props.text);
    const events = sseEvents(props, chunks);
    const ttft = props.ttft || SSE_DEFAULT_TTFT_MS;
    const gap = props.gap || SSE_DEFAULT_GAP_MS;
    const ui = $('.ss-ui .ss-screen', el);
    const whole = $('.ss-whole .ss-screen', el);
    const raw = $('.ss-raw', el);
    const status = $('.ss-status', el);
    const playBtn = $('[data-ss="play"]', el);
    const stopBtn = $('[data-ss="stop"]', el);
    const reduced = prefersReducedMotion();
    let i = 0;
    let timer = null;
    let clock = 0;
    let firstAt = null;
    let ended = false;
    let shown = '';
    // 事件在虛擬時間軸上的時刻：第一個 delta 之前等 ttft，之後每個 delta 間隔 gap
    const firstDelta = events.findIndex((e) => e.event === 'content_block_delta');
    const timeOf = (k) => (k < firstDelta ? Math.round((ttft * k) / firstDelta) : ttft + (k - firstDelta) * gap);
    const seconds = (ms) => `${(ms / 1000).toFixed(1)} 秒`;
    if (reduced) { playBtn.disabled = true; playBtn.textContent = '自動播放已關閉'; playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一個事件」逐步觀看'; }
    function setTime(sel, text) { const t = $(`${sel} [data-time]`, el); if (t) t.textContent = text; }
    function finish(kind) {
      window.clearTimeout(timer);
      timer = null;
      ended = true;
      if (stopBtn) stopBtn.disabled = true;
      $('[data-ss="step"]', el).disabled = true;
      playBtn.disabled = reduced;
      if (!reduced) playBtn.textContent = '▶ 再送一次';
      ui.classList.remove('is-typing');
      if (kind === 'done') {
        status.innerHTML = md(`完成：第一個字在 **${seconds(firstAt ?? ttft)}** 出現，全部在 **${seconds(clock)}** 收完。\`stop_reason\` 是 \`end_turn\`。`);
        if (whole) { whole.textContent = shown; setTime('.ss-whole', `${seconds(clock)} 才出現`); }
      } else if (kind === 'stopped') {
        status.innerHTML = md(`你在 **${seconds(clock)}** 按了停止：畫面停在已收到的 ${shown.length} 個字。伺服器已經產生的部分照樣計費；沒有收到 \`message_delta\`，所以拿不到 \`stop_reason\`。`);
        ui.insertAdjacentHTML('beforeend', '<span class="ss-flag">已停止</span>');
      } else {
        status.innerHTML = md(`連線在 **${seconds(clock)}** 中斷：收到一半的文字還在畫面上，但沒有 \`message_stop\`。程式要能分辨「正常結束」和「被切斷」，並讓使用者重試。`);
        ui.insertAdjacentHTML('beforeend', '<span class="ss-flag is-bad">連線中斷</span>');
      }
    }
    function emit() {
      const e = events[i];
      clock = timeOf(i);
      if (raw) {
        raw.insertAdjacentHTML('beforeend', `<span class="ss-line${e.text ? ' is-delta' : ''}"><span class="k">event:</span> ${esc(e.event)}\n<span class="k">data:</span> ${esc(e.data)}\n\n</span>`);
        raw.scrollTop = raw.scrollHeight;
        const c = $('[data-count]', el);
        if (c) c.textContent = `第 ${i + 1} / ${events.length} 個事件`;
      }
      if (e.text) {
        if (firstAt == null) firstAt = clock;
        shown += e.text;
        ui.textContent = shown;
        ui.classList.add('is-typing');
      }
      setTime('.ss-ui', firstAt == null ? `等待中 ${seconds(clock)}` : `第一個字 ${seconds(firstAt)}`);
      if (whole && !ended) { whole.innerHTML = '<span class="ss-wait">等待完整回應…</span>'; setTime('.ss-whole', `等待中 ${seconds(clock)}`); }
      status.innerHTML = md(`收到 \`${e.event}\`${e.text ? `：多了「${e.text.replace(/\n/g, '↵')}」` : ''}`);
      i += 1;
      if (props.failAt != null && i > firstDelta + props.failAt && e.text) { finish('failed'); return false; }
      if (i >= events.length) { finish('done'); return false; }
      return true;
    }
    function tick() {
      if (!document.body.contains(el)) return;
      if (!emit()) return;
      timer = window.setTimeout(tick, Math.max(16, timeOf(i) - timeOf(i - 1)));
    }
    function reset() {
      window.clearTimeout(timer);
      timer = null;
      i = 0; clock = 0; firstAt = null; ended = false; shown = '';
      ui.textContent = ''; ui.classList.remove('is-typing');
      if (raw) raw.textContent = '';
      if (whole) whole.textContent = '';
      $$('[data-time], [data-count]', el).forEach((t) => { t.textContent = ''; });
      $('[data-ss="step"]', el).disabled = false;
      if (stopBtn) stopBtn.disabled = true;
      playBtn.disabled = reduced;
      if (!reduced) playBtn.textContent = '▶ 送出請求';
      status.textContent = '按「送出請求」開始；也可以按「下一個事件」一次看一個。';
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ss]');
      if (!b) return;
      const action = b.dataset.ss;
      if (action === 'reset') { reset(); return; }
      if (action === 'stop') { if (!ended && i > 0) finish('stopped'); return; }
      if (ended) reset();
      if (action === 'play') {
        playBtn.disabled = true;
        if (stopBtn) stopBtn.disabled = false;
        $('[data-ss="step"]', el).disabled = true;
        timer = window.setTimeout(tick, 0);
      }
      if (action === 'step') { if (stopBtn) stopBtn.disabled = false; emit(); }
    });
    window.addEventListener('hashchange', () => window.clearTimeout(timer), { once: true });
    reset();
  },
};

/* ---------- schemacheck：模型輸出的 JSON 對得上 schema 嗎 ---------- */
// props: { schema: { name, fields: [{ name, type: 'string'|'number'|'integer'|'boolean'|'array'|'object', required, enum, items }] }, presets: [{ label, json, note }] }
function typeOfJson(v) {
  if (Array.isArray(v)) return 'array';
  if (v === null) return 'null';
  if (Number.isInteger(v)) return 'integer';
  return typeof v;
}
function checkAgainstSchema(obj, schema) {
  const issues = [];
  if (typeOfJson(obj) !== 'object') return [`最外層要是物件（object），收到的是 ${typeOfJson(obj)}`];
  schema.fields.forEach((f) => {
    if (!(f.name in obj)) { if (f.required) issues.push(`缺少必填欄位 \`${f.name}\``); return; }
    const v = obj[f.name];
    const t = typeOfJson(v);
    const isOk = f.type === 'number' ? (t === 'number' || t === 'integer') : t === f.type;
    if (!isOk) { issues.push(`\`${f.name}\` 應該是 ${f.type}，收到 ${t}（${JSON.stringify(v)}）`); return; }
    if (f.enum && !f.enum.includes(v)) issues.push(`\`${f.name}\` 只能是 ${f.enum.map((x) => JSON.stringify(x)).join('、')}，收到 ${JSON.stringify(v)}`);
    if (f.type === 'array' && f.items) v.forEach((x, k) => { if (typeOfJson(x) !== f.items) issues.push(`\`${f.name}[${k}]\` 應該是 ${f.items}`); });
  });
  Object.keys(obj).filter((k) => !schema.fields.some((f) => f.name === k)).forEach((k) => issues.push(`多了 schema 沒有的欄位 \`${k}\`（additionalProperties: false）`));
  return issues;
}
Widgets.schemacheck = {
  render(props, id) {
    const s = props.schema;
    return `<div class="jw sc">
      <div class="jw-head"><span class="label" style="--chip:var(--m3)">schema 檢查器</span><span class="grow">改改看模型的輸出，看哪裡過不了</span></div>
      <div class="sc-grid">
        <div class="sc-schema"><span class="sc-cap">schema：${esc(s.name || '輸出格式')}</span>
          <ul>${s.fields.map((f) => `<li><code>${esc(f.name)}</code> <span class="sc-type">${esc(f.type)}${f.items ? `&lt;${esc(f.items)}&gt;` : ''}${f.enum ? `：${esc(f.enum.join(' | '))}` : ''}</span>${f.required ? '<span class="rq-req">必填</span>' : ''}</li>`).join('')}</ul>
        </div>
        <div class="sc-edit">
          ${props.presets ? chipGroup('模型輸出範例', props.presets.map((p, i) => [String(i), p.label]), 'data-sc-preset', '0') : ''}
          <label for="${id}-in">模型的輸出</label>
          <textarea class="fb-input mono sc-in" id="${id}-in" rows="7" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="sc-result" aria-live="polite"></div>
    </div>`;
  },
  hydrate(el, props) {
    const input = $('.sc-in', el);
    const out = $('.sc-result', el);
    function draw(note) {
      let issues;
      try {
        issues = checkAgainstSchema(JSON.parse(input.value), props.schema);
      } catch (err) {
        issues = [`不是合法的 JSON：${err.message}`];
      }
      out.className = `sc-result ${issues.length ? 'is-bad' : 'is-ok'}`;
      out.innerHTML = (issues.length
        ? `<strong>✗ 驗證失敗（${issues.length} 項）</strong><ul>${issues.map((x) => `<li>${md(x)}</li>`).join('')}</ul>`
        : '<strong>✓ 通過：可以安心交給後面的程式</strong>') + (note ? `<p class="jw-note">${md(note)}</p>` : '');
    }
    function load(i) { const p = props.presets[i]; input.value = p.json; pressOnly(el, 'data-sc-preset', i); draw(p.note); }
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-sc-preset]'); if (b) load(Number(b.dataset.scPreset)); });
    input.addEventListener('input', () => { pressOnly(el, 'data-sc-preset', -1); draw(); });
    if (props.presets) load(0); else draw();
  },
};

/* ---------- toolloop：工具迴圈逐步走過（使用者自己按下一步） ---------- */
// props: { lanes: [名稱 ×3], steps: [{ from, to, label, msg?, note }], alt?: { label, steps }, mainLabel }
// from／to 是 lanes 的索引；from === to 代表在那一方內部做事
const TL_LANE_COLORS = ['var(--m0)', 'var(--m2)', 'var(--m4)'];
function toolloopBody(lanes) {
  return `${stepperControls('工具迴圈控制')}
    <div class="tl-grid">
      <div class="tl-lanes" style="--n:${lanes.length}"><span></span>${lanes.map((l, i) => `<span class="tl-lane" style="--c:${TL_LANE_COLORS[i]}">${esc(l)}</span>`).join('')}</div>

}
Widgets.toolloop = {

    // 換情境時換掉整個內層節點，舊的事件監聽跟著舊節點一起丟掉
    function mount(mode) {

/* ---------- vecplot：二維向量平面，拖動查詢點看相似度 ---------- */
// props: { points: [{ label, x, y, group? }], query: { label, x, y }, k, metrics?: ['cosine','dot','euclid'], filters?: [{ id, label }] }
// 座標在 -1～1 之間；真正的 embedding 有上千維，這裡只畫兩維示意
const VP_SIZE = 400;
const VP_CENTER = VP_SIZE / 2;
const VP_SCALE = 165;
const METRIC_TEXT = { cosine: 'cosine 相似度', dot: '點積', euclid: '歐氏距離' };
const toPx = (v) => VP_CENTER + v * VP_SCALE;
const toPy = (v) => VP_CENTER - v * VP_SCALE;
function vecScore(metric, a, b) {
  const dot = a.x * b.x + a.y * b.y;
  if (metric === 'dot') return dot;
  if (metric === 'euclid') return Math.hypot(a.x - b.x, a.y - b.y);
  const norm = Math.hypot(a.x, a.y) * Math.hypot(b.x, b.y);
  return norm ? dot / norm : 0;
}
Widgets.vecplot = {
  render(props) {
    const metrics = props.metrics || ['cosine'];
    return `<div class="jw vp">
      <div class="jw-head"><span class="label" style="--chip:var(--m5)">向量平面</span><span class="grow">黃色的「問」是查詢「${esc(props.query.label)}」：拖動它，或按 Tab 選到它再用方向鍵移動</span></div>
      ${metrics.length > 1 ? chipGroup('相似度算法', metrics.map((m) => [m, METRIC_TEXT[m]]), 'data-vp-metric', metrics[0]) : ''}
      ${props.filters ? `<div class="jw-row" role="group" aria-label="只搜尋這一類">${props.filters.map((f) => `<button type="button" class="btn small nb-press" data-vp-filter="${esc(f.id)}" aria-pressed="false">只看${esc(f.label)}</button>`).join('')}</div>` : ''}
      <div class="vp-grid">
        <svg class="vp-svg" viewBox="0 0 ${VP_SIZE} ${VP_SIZE}" role="img" aria-label="二維向量平面：每個點是一段文字，查詢點可以拖動">
          <line class="vp-axis" x1="0" y1="${VP_CENTER}" x2="${VP_SIZE}" y2="${VP_CENTER}"/><line class="vp-axis" x1="${VP_CENTER}" y1="0" x2="${VP_CENTER}" y2="${VP_SIZE}"/>
          <g class="vp-links"></g><g class="vp-points"></g>
          <g class="vp-query" tabindex="0" role="slider" aria-label="查詢點「${esc(props.query.label)}」的位置" aria-valuetext=""><line class="vp-qline" x1="${VP_CENTER}" y1="${VP_CENTER}"/><circle r="15"/><text class="vp-qlabel" font-size="16" text-anchor="middle">問</text></g>
        </svg>
        <div class="vp-side"><span class="sc-cap">最接近的 ${props.k || 3} 筆</span><ol class="vp-list" aria-live="polite"></ol></div>
      </div>
    </div>`;
  },
  hydrate(el, props) {
    const svg = $('.vp-svg', el);
    const q = { ...props.query };
    const k = props.k || 3;
    let metric = (props.metrics || ['cosine'])[0];
    let filter = null;
    const qg = $('.vp-query', el);
    function draw() {
      const pool = props.points.filter((p) => !filter || p.group === filter);
      const ranked = pool.map((p) => ({ ...p, s: vecScore(metric, q, p) })).sort((a, b) => (metric === 'euclid' ? a.s - b.s : b.s - a.s));
      const top = new Set(ranked.slice(0, k).map((p) => p.label));
      $('.vp-points', el).innerHTML = props.points.map((p) => {
        const dim = filter && p.group !== filter;
        return `<g class="vp-pt${top.has(p.label) ? ' is-top' : ''}${dim ? ' is-dim' : ''}"><circle cx="${toPx(p.x).toFixed(1)}" cy="${toPy(p.y).toFixed(1)}" r="8"/><text x="${(toPx(p.x) + (p.x > 0.55 ? -12 : 12)).toFixed(1)}" y="${(toPy(p.y) + 5).toFixed(1)}" font-size="15" text-anchor="${p.x > 0.55 ? 'end' : 'start'}">${esc(p.label)}</text></g>`;
      }).join('');
      $('.vp-links', el).innerHTML = metric === 'euclid'
        ? ranked.slice(0, k).map((p) => `<line class="vp-link" x1="${toPx(q.x).toFixed(1)}" y1="${toPy(q.y).toFixed(1)}" x2="${toPx(p.x).toFixed(1)}" y2="${toPy(p.y).toFixed(1)}"/>`).join('')
        : ranked.slice(0, k).map((p) => `<line class="vp-link" x1="${VP_CENTER}" y1="${VP_CENTER}" x2="${toPx(p.x).toFixed(1)}" y2="${toPy(p.y).toFixed(1)}"/>`).join('');
      $('circle', qg).setAttribute('cx', toPx(q.x).toFixed(1));
      $('circle', qg).setAttribute('cy', toPy(q.y).toFixed(1));
      const qline = $('.vp-qline', qg);
      qline.setAttribute('x2', toPx(q.x).toFixed(1));
      qline.setAttribute('y2', toPy(q.y).toFixed(1));
      qline.style.display = metric === 'euclid' ? 'none' : '';
      const label = $('.vp-qlabel', qg);
      label.setAttribute('x', toPx(q.x).toFixed(1));
      label.setAttribute('y', (toPy(q.y) + 6).toFixed(1));
      qg.setAttribute('aria-valuetext', `x ${q.x.toFixed(2)}，y ${q.y.toFixed(2)}`);
      $('.vp-list', el).innerHTML = ranked.slice(0, k).map((p) => `<li><strong>${esc(p.label)}</strong><span class="mono">${METRIC_TEXT[metric]} ${p.s.toFixed(2)}</span></li>`).join('');
    }
    function moveTo(clientX, clientY) {
      const r = svg.getBoundingClientRect();
      const x = ((clientX - r.left) / r.width) * VP_SIZE;
      const y = ((clientY - r.top) / r.height) * VP_SIZE;
      q.x = Math.max(-1, Math.min(1, (x - VP_CENTER) / VP_SCALE));
      q.y = Math.max(-1, Math.min(1, (VP_CENTER - y) / VP_SCALE));
      draw();
    }
    qg.addEventListener('pointerdown', (e) => { qg.setPointerCapture(e.pointerId); e.preventDefault(); });
    qg.addEventListener('pointermove', (e) => { if (qg.hasPointerCapture(e.pointerId)) moveTo(e.clientX, e.clientY); });
    svg.addEventListener('click', (e) => { if (!e.target.closest('.vp-query')) moveTo(e.clientX, e.clientY); });
    const KEY_STEP = 0.05;
    qg.addEventListener('keydown', (e) => {
      const d = { ArrowLeft: [-KEY_STEP, 0], ArrowRight: [KEY_STEP, 0], ArrowUp: [0, KEY_STEP], ArrowDown: [0, -KEY_STEP] }[e.key];
      if (!d) return;
      e.preventDefault();
      q.x = Math.max(-1, Math.min(1, q.x + d[0]));
      q.y = Math.max(-1, Math.min(1, q.y + d[1]));
      draw();
    });
    el.addEventListener('click', (e) => {
      const m = e.target.closest('[data-vp-metric]');
      if (m) { metric = m.dataset.vpMetric; pressOnly(el, 'data-vp-metric', metric); draw(); }
      const f = e.target.closest('[data-vp-filter]');
      if (f) { filter = filter === f.dataset.vpFilter ? null : f.dataset.vpFilter; pressOnly(el, 'data-vp-filter', filter); draw(); }
    });
    draw();
  },
};

/* ---------- chunker：切塊大小與重疊 ---------- */
// props: { doc: [{ h, p }], question, answer }；answer 必須是 doc 裡某段文字的子字串
Widgets.chunker = {
  render(props, id) {
    return `<div class="jw ck">
      <div class="jw-head"><span class="label" style="--chip:var(--m6)">切塊器</span><span class="grow">問題：${esc(props.question)}</span></div>
      ${chipGroup('切法', [['fixed', '固定長度'], ['heading', '依標題分段']], 'data-ck-mode', 'fixed')}
      <div class="lv-sliders">
        <div class="lv-row"><label for="${id}-size">每塊最多：<output data-ck-out="size"></output> 字</label><input type="range" id="${id}-size" data-ck="size" min="40" max="400" step="10" value="${props.size || 120}"></div>
        <div class="lv-row"><label for="${id}-ov">重疊：<output data-ck-out="overlap"></output> 字</label><input type="range" id="${id}-ov" data-ck="overlap" min="0" max="80" step="5" value="${props.overlap || 0}"></div>
      </div>
      <p class="tw-note ck-sum" aria-live="polite"></p>
      <ol class="ck-list"></ol>
    </div>`;
  },
  hydrate(el, props) {
    const v = { size: props.size || 120, overlap: props.overlap || 0, mode: 'fixed' };
    const full = props.doc.map((s) => `${s.h ? `${s.h}\n` : ''}${s.p}`).join('\n\n');
    const ansStart = full.indexOf(props.answer);
    const ansEnd = ansStart + props.answer.length;
    function fixedChunks(text, offset) {
      const out = [];
      const stride = Math.max(10, v.size - v.overlap);
      for (let s = 0; s < text.length; s += stride) {
        out.push({ start: offset + s, end: offset + Math.min(text.length, s + v.size) });
        if (s + v.size >= text.length) break;
      }
      return out;
    }
    function chunks() {
      if (v.mode === 'fixed') return fixedChunks(full, 0);
      let offset = 0;
      return props.doc.flatMap((s) => {
        const text = `${s.h ? `${s.h}\n` : ''}${s.p}`;
        const list = text.length <= v.size ? [{ start: offset, end: offset + text.length }] : fixedChunks(text, offset);
        offset += text.length + 2;
        return list;
      });
    }
    function draw() {
      const list = chunks();
      const holders = list.map((c, i) => ({ ...c, i })).filter((c) => c.start < ansEnd && c.end > ansStart);
      const whole = holders.find((c) => c.start <= ansStart && c.end >= ansEnd);
      $('.ck-list', el).innerHTML = list.map((c, i) => {
        const text = full.slice(c.start, c.end);
        const a = Math.max(ansStart, c.start) - c.start;
        const b = Math.min(ansEnd, c.end) - c.start;
        const hasAns = b > a;
        const body = hasAns ? `${esc(text.slice(0, a))}<mark>${esc(text.slice(a, b))}</mark>${esc(text.slice(b))}` : esc(text);
        return `<li class="ck-item${whole && whole.i === i ? ' is-hit' : hasAns ? ' is-part' : ''}"><span class="ck-n">#${i + 1}・${text.length} 字</span><div class="ck-text">${body}</div></li>`;
      }).join('');
      $('.ck-sum', el).innerHTML = whole
        ? md(`共 **${list.length}** 塊。答案完整落在 **#${whole.i + 1}**，檢索到這一塊就答得出來。`)
        : md(`共 **${list.length}** 塊。答案被切在 **${holders.map((c) => `#${c.i + 1}`).join('、')}**：只檢索到其中一塊，模型拿到的是半句話。試試加大重疊或改成依標題切。`);
      $('[data-ck-out="size"]', el).textContent = v.size;
      $('[data-ck-out="overlap"]', el).textContent = v.overlap;
      $('[data-ck="overlap"]', el).disabled = false;
    }
    el.addEventListener('input', (e) => { const s = e.target.closest('[data-ck]'); if (s) { v[s.dataset.ck] = Number(s.value); draw(); } });
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-ck-mode]'); if (b) { v.mode = b.dataset.ckMode; pressOnly(el, 'data-ck-mode', v.mode); draw(); } });
    draw();
  },
};
