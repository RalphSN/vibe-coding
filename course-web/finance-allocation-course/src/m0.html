<script>

defineTerms({

  '股債比': { en: 'stock-bond ratio', def: '組合中股票與債券（含現金）的比例，是資產配置最核心的一個數字。', example: '60／40。', lesson: '1-1' },
  '再平衡': { en: 'rebalancing', def: '比例因漲跌偏離目標時，買賣調整回原本的配置。', example: '股票漲到 75%，賣一些買債券回到 70%。', lesson: '3-1' },
  '總持有成本': { en: 'total cost of ownership', def: '持有一項投資的所有成本加總：內扣費用、交易手續費、稅、匯費、銷售費等。', example: '內扣 0.2% ＋ 交易 0.1% ＋ 稅。', lesson: '4-1' },
});

defineLessons({
  '0-1': {
    goals: [
      '說出執行投資的六個步驟',
      '理解資產配置為什麼決定大部分的波動',
      '知道哪些步驟值得花時間、哪些不值得',
    ],
    analogy: {
      text: ['第三部像是學會了營養學：知道蛋白質、碳水、脂肪各有什麼作用。第四部是開菜單：每一餐吃多少比例、多久採買一次、怎麼在預算內買到、吃進去之後身體怎麼吸收（稅）。', '很多人花大量時間挑「哪一種食材最好」（哪一檔基金），卻沒有決定比例。其實比例（[[資產配置]]）決定了大部分的結果：一個股票 90% 的組合和一個股票 30% 的組合，不管挑的是哪幾檔，表現都會差很多。'],

    },
    model: {
      svg: `<svg viewBox="0 0 560 280" role="img" aria-label="執行投資的六個步驟與花時間的比例：配置最值得花時間想清楚；投入與再平衡設好規則後自動化；費用與稅一次做好選擇；提領在接近退休時規劃">

        <text x="280" y="270" text-anchor="middle" font-size="13">高度表示值得花多少心思（示意）</text>
      </svg>`,
      caption: '配置想清楚之後，其餘步驟多半是設定一次、每年檢查一次，不需要每天盯。',
    },
    define: [
      { term: '資產配置', en: 'asset allocation', def: '各資產類別的比例。', example: '股 70／債 30。' },
      { term: '再平衡', en: 'rebalancing', def: '調回目標比例。', example: '賣高買低。' },
      { term: '總持有成本', en: 'TCO', def: '所有成本加總。', example: '內扣＋交易＋稅。' },

    examples: {
      blocks: [
        { type: 'heading', id: 'allocation-matters', text: '配置決定波動' },
        '第三部 3-1 說過，股票的年波動大約在 15–25%，高品質債券小得多。所以一個組合的波動，主要由股票佔多少決定。下面用簡化的假設，看不同股票比例在「普通的一年」與「很差的一年」大概會是什麼樣子。',
        { type: 'widget', name: 'knobs', props: { title: '股票比例與組合的起伏（簡化假設：股票平均 7%、波動 18%，債券平均 2.5%、波動 5%，相關係數 0.1）', sliders: [

          { id: 'amt', label: '投資金額', min: 100000, max: 20000000, step: 100000, value: 1000000, unit: '元' },
        ], compute: (v) => {
          const w = v.s / 100;
          const mu = w * 7 + (1 - w) * 2.5;
          const sd = Math.sqrt((w * 18) ** 2 + ((1 - w) * 5) ** 2 + 2 * w * (1 - w) * 0.1 * 18 * 5);
          const bad = mu - 2 * sd;
          return { rows: [
            { label: '平均年報酬（假設）', value: `${mu.toFixed(1)}%`, ratio: mu / 7 },
            { label: '年波動度', value: `${sd.toFixed(1)}%`, ratio: sd / 18 },
            { label: '很差的一年（約 −2 個標準差）', value: `${bad.toFixed(1)}%，約 ${Math.round(v.amt * bad / 100).toLocaleString()} 元`, ratio: Math.min(1, Math.abs(Math.min(0, bad)) / 40) },
          ], note: '預設股票 60%：平均約 5.2%、波動約 11%，很差的一年約 −17%。這些數字是假設，用來比較不同比例的「相對」差異，不是預測；真實市場的極端年份可能更差。' };

        { type: 'table', head: ['步驟', '要決定什麼', '多久做一次', '在這一卷'], rows: [

          ['投入', '單筆或分批、每月多少', '設定自動扣款', '模組 2'],
          ['再平衡', '多久檢查、偏離多少才調', '每年一次', '模組 3'],
          ['費用', '用哪些工具、在哪裡買', '一次選好，每年看一次', '模組 4'],
          ['稅', '股利計稅方式、二代健保、海外所得', '每年報稅時', '模組 5'],
          ['提領', '要存多少、怎麼提領', '接近退休時', '模組 6'],
        ] },
        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="可控與不可控：市場報酬不可控；配置、投入金額、費用、稅、行為都可控；把時間花在可控的事">
          <rect x="20" y="30" width="200" height="150" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/>
          <text x="120" y="80" text-anchor="middle" font-size="16" font-weight="900" class="on-color">不可控</text>
          <text x="120" y="112" text-anchor="middle" font-size="13" class="on-color">市場報酬</text>
          <text x="120" y="138" text-anchor="middle" font-size="13" class="on-color">利率、通膨</text>
          <rect x="240" y="30" width="300" height="150" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/>
          <text x="390" y="70" text-anchor="middle" font-size="16" font-weight="900" class="on-color">可控</text>
          ${['配置比例、投入金額', '費用、稅', '再平衡紀律、自己的行為'].map((t, i) => `<text x="390" y="${102 + i * 26}" text-anchor="middle" font-size="13" class="on-color">${t}</text>`).join('')}
          <text x="280" y="210" text-anchor="middle" font-size="13">這一卷的每一課，都在處理右邊那一格</text>
        </svg>`, caption: '第三部講「為什麼」，這一卷講「怎麼做」；第六部講「為什麼明明知道卻做不到」。' },
        { type: 'heading', id: 'simple', text: '深入：簡單通常比較好' },
        '一個好的執行計畫，往往比想像中簡單：兩到三檔涵蓋面廣的低成本指數基金、一個固定的股債比、每月自動投入、每年檢查一次。複雜的組合（很多檔基金、頻繁調整、追逐主題）不但增加費用與稅，更增加「做錯事」的機會。這一卷的每一個工具，都是在幫這個簡單的計畫補上細節，而不是讓它變複雜。',
        { type: 'heading', id: 'order', text: '深入：為什麼是這個順序' },
        { type: 'table', head: ['步驟', '如果跳過或順序錯了'], rows: [
          ['先配置', '沒有比例，就不知道該買什麼、什麼時候再平衡'],
          ['再投入', '沒有自動投入，計畫只停在紙上'],
          ['再平衡', '比例漂移，風險在不知不覺中升高'],
          ['費用', '每年多付 1%，三十年下來可能少掉四分之一以上'],
          ['稅', '稅後才是你真正拿到的；同樣的總報酬，稅後可能差很多'],
          ['提領', '接近退休時沒有計畫，可能在大跌時被迫賣出'],
        ], caption: '六個步驟彼此依賴：前一步決定了後一步的條件。' },
        '這一卷沒有任何一課在預測市場。所有工具都在處理「同樣的市場報酬下，你能留下多少」：配置控制風險、自動化控制行為、費用與稅控制漏損、提領控制最後的使用方式。',
      ],
    },
    mistakes: [
      { wrong: '花大量時間挑基金，卻沒決定股債比。', why: '比例決定了大部分的波動。', right: '先決定配置，再挑工具。' },
      { wrong: '想要每一步都做到最佳化。', why: '複雜會增加成本與犯錯機會。', right: '簡單、低成本、自動化。' },
      { wrong: '把時間花在預測市場。', why: '市場報酬不可控。', right: '把心力放在配置、費用、稅與行為。' },
    ],
    keypoints: [
      '六步驟：配置、投入、再平衡、費用、稅、提領。',
      '股票比例決定組合大部分的波動。',
      '把時間花在可控的事，計畫越簡單越好。',
    ],
    sources: ['ubs-2026', 'vanguard-rebal'],
  },
});
</script>
