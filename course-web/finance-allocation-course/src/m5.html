<script>
/* ==========================================================================
   模組 5：台灣的稅與二代健保
   ========================================================================== */
defineTerms({
  '綜合所得淨額': { en: 'net taxable income', def: '所得總額減去免稅額、扣除額之後，真正用來套稅率的金額。', example: '年薪 80 萬的單身者，淨額約 33.6 萬。', lesson: '5-1' },
  '累進稅率': { en: 'progressive tax', def: '所得分段課稅，越高的那一段稅率越高；不是全部所得都套最高的稅率。', example: '61 萬以下 5%，超過的部分才 12%。', lesson: '5-1' },
  '邊際稅率': { en: 'marginal tax rate', def: '「多賺的下一塊錢」要繳的稅率，也就是你所在的最高級距。', example: '淨額 100 萬 → 邊際稅率 12%。', lesson: '5-1' },
  '可抵減稅額': { en: 'tax credit', def: '直接從應納稅額中扣掉的金額；比扣除額（從所得中扣）更直接。', example: '股利 × 8.5%，每戶上限 8 萬。', lesson: '5-2' },
  '補充保費': { en: 'supplementary premium', def: '二代健保針對薪資以外的所得（股利、利息、租金等）額外收取的健保費，由給付單位扣繳。', example: '單筆股利 2 萬元以上扣 2.11%。', lesson: '5-3' },
  '最低稅負制': { en: 'alternative minimum tax', def: '把一般所得稅不課或少課的項目（例如一定金額以上的海外所得）加回來，計算「至少要繳」的基本稅額，和一般所得稅比較取高者。', example: '基本所得額超過 750 萬的部分課 20%。', lesson: '5-4' },
  '預扣稅': { en: 'withholding tax', def: '所得支付時，由支付方先扣下並繳給政府的稅。', example: '美股現金股利對台灣投資人預扣 30%。', lesson: '5-4' },
});

/* 115 年度綜合所得稅級距（財政部 2025-11-27 公告，2027 年 5 月申報適用） */
const TAX_BRACKETS = [[610000, 0.05], [1380000, 0.12], [2770000, 0.2], [5190000, 0.3], [Infinity, 0.4]];
function incomeTax(net) {
  let tax = 0; let floor = 0;
  TAX_BRACKETS.forEach(([cap, rate]) => { if (net > floor) tax += (Math.min(net, cap) - floor) * rate; floor = cap; });
  return tax;
}
function marginalRate(net) { const hit = TAX_BRACKETS.find(([cap]) => net <= cap); return hit ? hit[1] : 0.4; }

defineLessons({
  '5-1': {
    goals: [
      '從年收入一路算到應納稅額',
      '分辨邊際稅率與平均稅率',
      '知道投資收入會進到哪一層',
    ],
    analogy: {
      text: ['台灣的所得稅像是一個分層的水桶：先裝滿最底層（5%）、滿了才流到上一層（12%）、再上一層（20%）……每一層的水各自用自己的稅率計算。這就是[[累進稅率]]。', '所以「加薪會跳級距、反而拿更少」是誤解：只有超過門檻的那一段用較高的稅率。真正重要的是兩個數字：[[邊際稅率]]（下一塊錢的稅率）決定投資收入要繳多少；平均稅率（總稅額 ÷ 所得）才是你實際的稅負。'],
      limit: ['水桶的比喻只描述稅率結構；實際的稅額還受免稅額、各種扣除額、特別扣除額與分開計稅的項目影響。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 290" role="img" aria-label="115 年度綜合所得稅級距：淨額 61 萬以下 5%，61 到 138 萬 12%，138 到 277 萬 20%，277 到 519 萬 30%，超過 519 萬 40%；每一段只對落在該段的所得課稅">
        ${[['61 萬以下', '5%', 'm0', 40], ['61–138 萬', '12%', 'm1', 70], ['138–277 萬', '20%', 'm2', 100], ['277–519 萬', '30%', 'm3', 130], ['519 萬以上', '40%', 'm4', 160]].map(([a, b, c, h], i) => `<rect x="${30 + i * 102}" y="${230 - h}" width="94" height="${h}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${77 + i * 102}" y="${222 - h}" text-anchor="middle" font-size="16" font-weight="900">${b}</text><text x="${77 + i * 102}" y="252" text-anchor="middle" font-size="12">${a}</text>`).join('')}
        <text x="280" y="278" text-anchor="middle" font-size="13">綜合所得淨額的分段（115 年度，2027 年 5 月申報適用）</text>
      </svg>`,
      caption: '114 年度（2026 年 5 月申報）的 5% 級距上限是 59 萬；因為物價累計上漲超過 3%，115 年度起調高。',
    },
    define: [
      { term: '綜合所得淨額', en: 'net income', def: '套稅率的金額。', example: '33.6 萬。' },
      { term: '累進稅率', en: 'progressive', def: '分段課稅。', example: '5%→12%。' },
      { term: '邊際稅率', en: 'marginal', def: '下一塊錢的稅率。', example: '12%。' },
    ],
    examples: {
      blocks: [
        { type: 'table', head: ['項目（115 年度）', '金額', '說明'], rows: [
          ['免稅額', '每人 10.1 萬（70 歲以上 15.15 萬）', '本人、配偶、受扶養親屬各一份'],
          ['標準扣除額', '單身 13.6 萬、有配偶 27.2 萬', '與列舉扣除額擇一'],
          ['薪資所得特別扣除額', '每人最高 22.7 萬', '有薪資所得者'],
          ['儲蓄投資特別扣除額', '全戶存款利息等合計最高 27 萬', '股利不適用'],
        ], caption: '依財政部 2025 年 11 月公告的 115 年度數字（媒體報導）；另有身心障礙、幼兒學前、長照、租金等特別扣除額，條件以財政部說明為準。' },
        { type: 'widget', name: 'knobs', props: { title: '綜合所得稅試算（115 年度，簡化：一位有薪資者、標準扣除額，實際計算）', sliders: [
          { id: 'salary', label: '年薪資', min: 0, max: 5000000, step: 10000, value: 800000, unit: '元' },
          { id: 'other', label: '其他所得（租金、超過 27 萬的利息等）', min: 0, max: 3000000, step: 10000, value: 0, unit: '元' },
          { id: 'married', label: '有配偶合併申報（0 否、1 是）', min: 0, max: 1, step: 1, value: 0 },
          { id: 'deps', label: '受扶養親屬人數', min: 0, max: 6, step: 1, value: 0, unit: '人' },
        ], compute: (v) => {
          const people = 1 + v.married + v.deps;
          const gross = v.salary + v.other;
          const deduction = 101000 * people + (v.married ? 272000 : 136000) + Math.min(v.salary, 227000);
          const net = Math.max(0, gross - deduction);
          const tax = incomeTax(net);
          return { rows: [
            { label: '免稅額＋扣除額', value: `${deduction.toLocaleString()} 元`, ratio: Math.min(1, deduction / Math.max(1, gross)) },
            { label: '綜合所得淨額', value: `${Math.round(net).toLocaleString()} 元`, ratio: Math.min(1, net / 5000000) },
            { label: '應納稅額', value: `${Math.round(tax).toLocaleString()} 元`, ratio: Math.min(1, tax / 1000000) },
            { label: '邊際稅率／平均稅率（對總所得）', value: `${(marginalRate(net) * 100).toFixed(0)}%／${gross ? ((tax / gross) * 100).toFixed(1) : 0}%`, ratio: marginalRate(net) / 0.4 },
          ], note: '預設：單身、年薪 80 萬，淨額 33.6 萬，稅額約 1.68 萬，平均稅率約 2.1%、邊際稅率 5%。這是簡化試算，實際以財政部報稅系統為準。' };
        } } },
        { type: 'heading', id: 'investment', text: '投資收入怎麼課稅（台灣個人）' },
        { type: 'table', head: ['收入', '怎麼課', '在這一卷'], rows: [
          ['國內存款利息', '併入綜所稅；全戶 27 萬以內可用儲蓄投資特別扣除額扣除', '本課'],
          ['國內股利', '合併計稅＋8.5% 抵減，或 28% 分開計稅；另有二代健保', '5-2、5-3'],
          ['上市股票、ETF 買賣價差', '證券交易所得目前停徵；賣出時有證交稅', '模組 4'],
          ['海外所得', '全戶達 100 萬才計入最低稅負的基本所得額', '5-4'],

        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="邊際稅率的用途：同樣多 10 萬元的股利或利息，邊際稅率 5% 的人多繳約 5,000 元，邊際稅率 30% 的人多繳約 3 萬元">
          ${[['邊際 5%', 5, 'm0'], ['邊際 12%', 12, 'm1'], ['邊際 20%', 20, 'm2'], ['邊際 30%', 30, 'm3'], ['邊際 40%', 40, 'm4']].map(([t, r, c], i) => `<rect x="${30 + i * 102}" y="${180 - r * 3.5}" width="94" height="${r * 3.5}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${77 + i * 102}" y="${172 - r * 3.5}" text-anchor="middle" font-size="13" font-weight="900">${(r * 1000).toLocaleString()} 元</text><text x="${77 + i * 102}" y="200" text-anchor="middle" font-size="12">${t}</text>`).join('')}
          <text x="280" y="20" text-anchor="middle" font-size="13" font-weight="900">多 10 萬元併入綜所稅的收入，要多繳多少（不含抵減）</text>
        </svg>`, caption: '判斷投資收入的稅負時，看的是邊際稅率，不是平均稅率。' },
        { type: 'heading', id: 'household', text: '深入：申報方式也會影響稅' },
        '夫妻合併申報時，可以選擇把其中一方的薪資所得分開計算稅額；股利也有合併或分開兩種方式（下一課）。申報系統通常會自動試算幾種組合、選出稅額最低的方式，但了解原理有兩個用處：一是評估投資收入會落在哪一個邊際稅率，二是檢查系統帶入的資料（例如股利、利息）是否完整。',
        { type: 'table', head: ['常被忽略的項目', '要檢查什麼'], rows: [
          ['利息所得', '全戶合計是否超過 27 萬的儲蓄投資特別扣除額'],
          ['股利', '是否有不在國稅局資料裡的境外配息'],
          ['勞退自提', '扣繳憑單的薪資是否已扣除自提金額'],
          ['租金特別扣除額', '租屋者是否符合條件'],
        ] },
      ],
    },
    mistakes: [
      { wrong: '以為跳到下一級距，全部所得都用高稅率。', why: '累進稅率只對超過的那一段用高稅率。', right: '分段計算。' },
      { wrong: '用平均稅率判斷投資收入的稅。', why: '多出來的收入適用的是邊際稅率。', right: '看邊際稅率。' },
      { wrong: '用舊年度的級距試算。', why: '級距與扣除額會隨物價調整。', right: '確認是哪一個所得年度。' },
    ],
    keypoints: [
      '115 年度級距：61、138、277、519 萬，5% 到 40%。',
      '邊際稅率決定投資收入的稅負。',
      '利息 27 萬內可扣除；上市股票價差目前停徵。',
    ],
    sources: ['tax-115', 'savings-27', 'labor-pension-6'],
  },

  '5-2': {
    goals: [
      '算出股利合併計稅與分開計稅的稅額',
      '知道 94 萬與邊際稅率兩個判斷點',
      '理解「配息越多越好」在稅上的代價',
    ],
    analogy: {
      text: ['國內股利有兩種計稅方式，像是兩種計價方案：合併計稅是「併入所得，但每 100 元股利給你 8.5 元折價券」（[[可抵減稅額]]，每戶上限 8 萬）；分開計稅是「股利單獨用 28% 的單一稅率」。', '所得不高的人，股利併入後的稅率低，還有 8.5% 折價券，可能不但不用繳、還能退稅；所得很高的人，邊際稅率 40%，用 28% 單獨計算反而便宜。申報時系統可以幫你試算，但先理解原理，才知道配息對自己的真正成本。'],
      limit: ['兩種方案只是股利所得稅；股利還有二代健保補充保費（下一課），不受計稅方式影響。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 270" role="img" aria-label="股利的兩種計稅方式：合併計稅把股利併入綜合所得，依級距課稅後再減去股利乘以 8.5% 的可抵減稅額，每戶上限 8 萬；分開計稅以 28% 單一稅率計算，與其他所得分開">
        <rect x="20" y="30" width="250" height="200" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/>
        <text x="145" y="64" text-anchor="middle" font-size="17" font-weight="900" class="on-color">合併計稅</text>
        <text x="145" y="100" text-anchor="middle" font-size="13" class="on-color">股利併入綜合所得</text>
        <text x="145" y="128" text-anchor="middle" font-size="13" class="on-color">依級距計稅</text>
        <text x="145" y="156" text-anchor="middle" font-size="13" class="on-color">− 股利 × 8.5%（上限 8 萬）</text>

        <rect x="290" y="30" width="250" height="200" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/>
        <text x="415" y="64" text-anchor="middle" font-size="17" font-weight="900" class="on-color">分開計稅</text>
        <text x="415" y="100" text-anchor="middle" font-size="13" class="on-color">其他所得照常計稅</text>
        <text x="415" y="128" text-anchor="middle" font-size="13" class="on-color">＋ 股利 × 28%</text>
        <text x="415" y="194" text-anchor="middle" font-size="12" class="on-color">適合邊際稅率很高的人</text>
        <text x="280" y="258" text-anchor="middle" font-size="13">8 萬 ÷ 8.5% ≈ 94 萬：股利在這以下可全額抵減</text>
      </svg>`,
      caption: '依財政部的說明：適用稅率 20% 以下通常合併計稅有利，30% 以上可能分開計稅有利；實際要依個人試算。',
    },
    define: [
      { term: '可抵減稅額', en: 'tax credit', def: '直接從稅額扣掉。', example: '8.5%、上限 8 萬。' },
      { term: '邊際稅率', en: 'marginal', def: '下一塊錢的稅率。', example: '30%。' },
      { term: '綜合所得淨額', en: 'net income', def: '套稅率的金額。', example: '不含股利。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '股利：合併 vs 分開計稅（115 年度級距，實際計算）', sliders: [

          { id: 'div', label: '全年國內股利', min: 0, max: 5000000, step: 10000, value: 200000, unit: '元' },
        ], compute: (v) => {
          const credit = Math.min(v.div * 0.085, 80000);
          const combined = incomeTax(v.net + v.div) - credit;
          const separate = incomeTax(v.net) + v.div * 0.28;
          const better = combined <= separate ? '合併計稅' : '分開計稅';
          return { rows: [
            { label: '合併計稅：應納（負數為退稅）', value: `${Math.round(combined).toLocaleString()} 元`, ratio: Math.min(1, Math.abs(combined) / Math.max(1, separate, Math.abs(combined))) },

        } } },
        { type: 'heading', id: 'cases', text: '幾個例子' },
        { type: 'table', head: ['不含股利的淨所得', '股利', '合併計稅', '分開計稅', '較有利'], rows: [

        ], caption: '用 115 年度級距計算的總應納稅額（含股利以外的所得），只用來說明方向；實際以申報系統為準。' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="配息的稅務代價：同樣的總報酬，配息型把一部分報酬變成當年要課稅與二代健保的股利；不配息或少配息的，報酬留在價格裡，直到賣出時才實現，而上市股票價差目前停徵所得稅">
