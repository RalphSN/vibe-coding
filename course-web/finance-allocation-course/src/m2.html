<script>

  '定期定額': { en: 'dollar-cost averaging', def: '每隔固定時間投入固定金額；價格低時買到較多單位，價格高時買到較少。', example: '每月 5 日投入 1 萬。', lesson: '2-1' },

defineLessons({

    analogy: {
      text: ['想像你要從岸邊走進一個水溫適中的游泳池。一次跳下去（[[單筆投入]]）最快開始游；一步一步走下去（分批投入）比較不會被冷到，但待在岸上的時間比較長。如果池水平均來說越來越暖（市場長期向上），待在岸上越久，錯過的就越多。', 'Vanguard 2012 年的研究用美國、英國、澳洲的歷史資料比較：單筆投入大約在三分之二的期間勝過分批投入。研究的結論是：分批投入並沒有消除風險，只是把承擔風險的時間往後延。'],
      limit: ['游泳池的比喻假設你手上已經有一筆錢。大多數上班族沒有一大筆錢，而是每個月領薪水；這時[[定期定額]]不是「選擇」，而是收入的自然節奏。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 260" role="img" aria-label="手上有一筆錢時的兩種做法：單筆投入讓全部的錢立刻參與市場；分批投入讓部分資金在等待期間留在現金，期望報酬較低但遺憾較小">
        <text x="140" y="26" text-anchor="middle" font-size="15" font-weight="900">單筆投入</text>
        <text x="420" y="26" text-anchor="middle" font-size="15" font-weight="900">分 6 個月投入</text>
        <rect x="60" y="50" width="160" height="150" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="140" y="130" text-anchor="middle" font-size="14" font-weight="900" class="on-color">第 1 天全部投入</text>
        ${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="${330 + i * 30}" y="${200 - (i + 1) * 25}" width="26" height="${(i + 1) * 25}" style="fill:var(--m4)" class="stroke-ink" stroke-width="2"/><rect x="${330 + i * 30}" y="50" width="26" height="${150 - (i + 1) * 25}" style="fill:var(--m0)" class="stroke-ink" stroke-width="2"/>`).join('')}

        <text x="280" y="252" text-anchor="middle" font-size="13">期望報酬：單筆較高（約三分之二的期間勝出）；遺憾：分批較小</text>
      </svg>`,
      caption: '分批期間還在現金的那一部分，期望報酬低於市場；這就是分批投入的平均成本。',

    define: [
      { term: '單筆投入', en: 'lump sum', def: '一次投入。', example: '年終 30 萬。' },
      { term: '定期定額', en: 'DCA', def: '固定時間投入固定金額。', example: '每月 1 萬。' },

        '從純數學看，單筆投入的期望值較高；但人不是只看期望值。如果一次投入後馬上遇到大跌，讓你從此不敢投資，那麼數學上較好的選擇，實際結果反而最差。行為經濟學稱之為「預期後悔」：人會為了避免將來後悔，選擇期望值較低的做法。這不是錯，只要你知道自己為了什麼付出這個成本，並且把分批的時程固定下來，不再因為市場變化而改變。',

          ['已經有投資經驗、能承受波動', '單筆或先投一半'],
          ['每月領薪水，沒有大筆資金', '定期定額就是自然的單筆投入'],
        ] },
      ],

      { wrong: '市場大跌時暫停定期定額。', why: '正好放棄了以低價買進的機會。', right: '扣款照常，必要時檢查預備金。' },
    ],
    keypoints: [
      '單筆投入的期望報酬較高，分批只是延後承擔風險。',

      '一大筆錢可以折衷：先投一半、其餘照時程分批。',
    ],
    sources: ['vanguard-dca', 'ubs-2026'],
  },

  '2-2': {

      limit: ['訂閱的運費通常一目了然；券商的費用常寫在活動條款或費率表裡，而且會隨活動調整，要自己查清楚。'],

        <text x="280" y="215" text-anchor="middle" font-size="13" font-weight="900">每年一次：檢查比例、費用、扣款金額</text>
      </svg>`,
      caption: '扣款日放在發薪日之後一兩天，確保帳戶有錢；餘額不足的扣款失敗，常常就是中斷的開始。',
    },

      { term: '定期定額', en: 'DCA', def: '固定時間投入固定金額。', example: '每月 5 日。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '小額投入的實際手續費率（實際計算，費率與最低手續費請依你的券商填）', sliders: [

          { id: 'min', label: '每筆最低手續費', min: 0, max: 20, step: 1, value: 1, unit: '元' },
          { id: 'times', label: '每月扣款次數', min: 1, max: 4, step: 1, value: 1, unit: '次' },
        ], compute: (v) => {
          const fee = Math.max(v.min, Math.floor(v.amt * 0.001425 * v.disc / 10));
          const rate = fee / v.amt * 100;

          return { rows: [
            { label: '每筆手續費', value: `${fee} 元`, ratio: Math.min(1, fee / 50) },
            { label: '實際費率', value: `${rate.toFixed(3)}%`, ratio: Math.min(1, rate / 1) },
            { label: '一年的手續費', value: `${year.toLocaleString()} 元`, ratio: Math.min(1, year / 5000) },
          ], note: '手續費以 0.1425% × 折扣計算，不足最低手續費時收最低（各券商計算與取整方式不同）。最低手續費 20 元時，每次投入 3,000 元的實際費率約 0.67%，是牌告的近 5 倍；把扣款合併成每月一次較大的金額，比例就會下降。' };
