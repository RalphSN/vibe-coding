defineLessons({

      '用能力、意願、需要三個面向決定股債比',

    ],
    analogy: {
      text: ['決定股債比，像是決定開車的速度。能開多快，看三件事：路況與車子（[[風險能力]]：期間多長、收入穩不穩、有沒有預備金）、你敢不敢開快（[[風險意願]]）、以及有沒有必要趕時間（[[風險需要]]）。', '三者取最低的那一個。路況很好、但你一開快就手心冒汗，硬開快只會在彎道出事；你敢開快、但其實時間很充裕，也沒必要冒險。'],
      limit: ['開車的速度可以隨時調整；股債比如果在恐慌時大幅調降，常常就是賣在低點。所以要在冷靜時先決定好，並寫下來。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 270" role="img" aria-label="決定股債比的三個面向：風險能力、風險意願、風險需要；最後的股票比例取三者之中最低的那一個">
        ${[['風險能力', '期間、收入、預備金', 70, 'm2'], ['風險意願', '跌多少會賣', 45, 'm4'], ['風險需要', '目標需要多少報酬', 60, 'm3']].map(([a, b, h, c], i) => `<rect x="${40 + i * 170}" y="${220 - h * 2.4}" width="140" height="${h * 2.4}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${110 + i * 170}" y="${212 - h * 2.4}" text-anchor="middle" font-size="14" font-weight="900">${a}：${h}%</text><text x="${110 + i * 170}" y="${245}" text-anchor="middle" font-size="12">${b}</text>`).join('')}
        <line x1="30" y1="${220 - 45 * 2.4}" x2="530" y2="${220 - 45 * 2.4}" style="stroke:var(--m5)" stroke-width="3" stroke-dasharray="8 5"/>
        <text x="530" y="${210 - 45 * 2.4}" text-anchor="end" font-size="13" font-weight="900">取最低：股票約 45%</text>
      </svg>`,
      caption: '數字是示意。意願最常是最低的那一個，而且在沒經歷過大跌之前，多數人都高估了自己的意願。',
    },
    define: [
      { term: '風險能力', en: 'capacity', def: '財務上能承受多少。', example: '期間長。' },
      { term: '風險意願', en: 'willingness', def: '心理上能承受多少。', example: '跌 30% 不賣。' },
      { term: '風險需要', en: 'need', def: '目標需要多少風險。', example: '已達標就低。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '三個面向的股票比例上限（經驗法則，實際計算）', sliders: [
          { id: 'years', label: '這筆錢幾年後才用', min: 1, max: 40, step: 1, value: 20, unit: '年' },
          { id: 'stable', label: '收入穩定度（1 很不穩、3 很穩）', min: 1, max: 3, step: 1, value: 2 },
          { id: 'fund', label: '預備金已經存滿', min: 0, max: 1, step: 1, value: 1 },
          { id: 'maxdrop', label: '帳面最多能跌多少而不賣', min: 5, max: 60, step: 5, value: 25, unit: '%' },
          { id: 'need', label: '目標需要的年報酬', min: 0, max: 8, step: 0.5, value: 5, unit: '%' },
        ], compute: (v) => {
          let cap = Math.min(100, v.years * 6) * ({ 1: 0.75, 2: 0.9, 3: 1 }[v.stable]);
          if (!v.fund) cap = Math.min(cap, 30);
          const will = Math.min(100, (v.maxdrop / 50) * 100);
          const need = Math.max(0, Math.min(100, ((v.need - 2.5) / (7 - 2.5)) * 100));
          const pick = Math.min(cap, will, Math.max(need, 0));
          return { rows: [
            { label: '能力上限', value: `${cap.toFixed(0)}%`, ratio: cap / 100 },
            { label: '意願上限（假設股票最差跌 50%）', value: `${will.toFixed(0)}%`, ratio: will / 100 },
            { label: '需要（達成目標報酬的比例）', value: `${need.toFixed(0)}%`, ratio: need / 100 },
            { label: '建議的起點：取最低', value: `股票約 ${Math.round(pick / 5) * 5}%`, ratio: pick / 100 },

        { type: 'heading', id: 'drop-test', text: '跌幅測試：最誠實的問題' },

        { type: 'heading', id: 'age-rule', text: '年齡法則：粗略的起點' },

        { type: 'heading', id: 'whole-picture', text: '深入：把全部的資產一起看' },
        '股債比應該看「所有可投資資產」的總比例，而不是每個帳戶各自的比例。例如退休金帳戶全是股票、另一個證券帳戶全是債券，合起來的比例才是你的真實配置。另外，穩定的薪資（尤其是公教人員）有點像債券：未來收入越穩定，越能承受投資組合裡較高的股票比例；收入高度依賴景氣的人則相反（第三部 4-2）。',
        { type: 'heading', id: 'lifetime', text: '深入：配置會隨人生改變' },
        { type: 'table', head: ['人生階段', '能力', '需要', '常見的方向'], rows: [

          ['接近退休', '期間縮短、順序風險增加', '保護成果', '逐步降低股票比例，保留一兩年現金'],
        ], caption: '這是一般的方向，不是規則。最重要的仍是你自己的意願：任何階段，承受不了的配置都不是好配置。' },
        '調整配置最好是「事先排好的」：例如寫下「50 歲起每年把股票比例降低 1 個百分點」，而不是在某次大跌後才決定降低。',

      { wrong: '在大漲之後提高股票比例。', why: '那時的意願常被高估。', right: '在冷靜時決定、寫下來。' },
      { wrong: '每個帳戶分開看比例。', why: '真實配置是全部加總。', right: '把所有可投資資產合在一起算。' },

    keypoints: [
      '股債比取能力、意願、需要三者最低。',

        <rect x="20" y="40" width="300" height="160" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/>
        <text x="170" y="110" text-anchor="middle" font-size="18" font-weight="900" class="on-color">全球股票</text>
        <text x="170" y="138" text-anchor="middle" font-size="13" class="on-color">多國、多產業</text>
        <rect x="320" y="40" width="100" height="160" style="fill:var(--m1)" class="stroke-ink" stroke-width="3"/>

      </svg>`,

    },
    define: [
      { term: '核心組合', en: 'core', def: '長期持有的分散部位。', example: '三檔基金。' },
      { term: '資產配置', en: 'allocation', def: '各類資產的比例。', example: '70／30。' },
      { term: '總持有成本', en: 'TCO', def: '所有成本加總。', example: '加權平均費用。' },

    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '三塊核心組合：比例與加權費用（實際計算，費用請填你選的工具）', sliders: [
          { id: 'g', label: '全球股票', min: 0, max: 100, step: 5, value: 50, unit: '%' },
          { id: 't', label: '台灣股票', min: 0, max: 100, step: 5, value: 20, unit: '%' },
          { id: 'feeG', label: '全球股票工具的總費用率', min: 0, max: 2, step: 0.05, value: 0.3, unit: '%' },
          { id: 'feeT', label: '台灣股票工具的總費用率', min: 0, max: 2, step: 0.05, value: 0.2, unit: '%' },
          { id: 'feeB', label: '債券工具的總費用率', min: 0, max: 2, step: 0.05, value: 0.2, unit: '%' },
        ], compute: (v) => {
          const b = Math.max(0, 100 - v.g - v.t);

          const fee = (v.g * v.feeG + v.t * v.feeT + b * v.feeB) / Math.max(1, v.g + v.t + b);

          return { rows: [
            { label: '債券（剩下的）', value: over ? '股票已超過 100%' : `${b}%`, ratio: b / 100 },
            { label: '股票合計', value: `${Math.min(100, v.g + v.t)}%`, ratio: Math.min(1, (v.g + v.t) / 100) },

        } } },
        { type: 'heading', id: 'home', text: '台灣要佔多少' },
        { type: 'table', head: ['考量', '偏向多一點台股', '偏向少一點台股'], rows: [
