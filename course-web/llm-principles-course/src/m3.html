  return Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => fn(i, j)));
}

  if (i === 5 && j === 0) return 4.0; // 牠 → 動物
  if (i === 7 && j === 5) return 3.2; // 累 → 牠
  if (i === 7 && j === 0) return 2.6; // 累 → 動物
  if (i === 3 && j === 2) return 2.4; // 馬路 → 過
  if (i === j) return 1.2;
  return 0.4 + ((i * 3 + j * 5) % 7) / 10;
});

</svg>`;
