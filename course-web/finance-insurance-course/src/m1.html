  '保額': { en: 'sum assured', def: '保險事故發生時，保險公司依約定給付的金額上限或固定金額。', example: '壽險保額 500 萬。', lesson: '1-2' },

    analogy: {
      text: ['一萬個人約好：每人每年出 1,300 元放進共同基金。根據過去經驗，這一萬人裡每年大約有 1 個人會遇到 1,000 萬的重大損失。基金一年收 1,300 萬，賠出 1,000 萬，剩下的支付管理與預留。', '對任何一個人來說，明年會不會出事是不確定的；但對一萬人的總和來說，結果非常穩定，這就是[[大數法則]]。保險公司賣的，就是把「個人的不確定」換成「群體的確定」。'],
      limit: ['真實的保險公司還會投資這筆基金、承擔利率風險，也會遇到傳染病這種讓很多人同時出事的情況（大數法則失靈）；比喻只說明最核心的機制。'],

        <rect x="40" y="40" width="300" height="80" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/>
        <text x="190" y="74" text-anchor="middle" font-size="17" font-weight="900" class="on-color">純保費</text>
        <text x="190" y="100" text-anchor="middle" font-size="13" class="on-color">機率 × 理賠金額（付給出事的人）</text>
        <rect x="340" y="40" width="180" height="80" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/>

        <text x="430" y="100" text-anchor="middle" font-size="12" class="on-color">佣金、營運、利潤</text>
        <text x="280" y="30" text-anchor="middle" font-size="14" font-weight="900">你繳的保費</text>
        <text x="280" y="170" text-anchor="middle" font-size="15" font-weight="900" class="mono">平均理賠 ＝ 純保費 ＜ 保費</text>
        <text x="280" y="204" text-anchor="middle" font-size="14">所以對「平均的人」來說，保險的期望值一定是負的</text>
        <text x="280" y="236" text-anchor="middle" font-size="14">買保險買的不是報酬，而是「不會被一次事故擊垮」</text>
      </svg>`,
      caption: '比例是示意。附加費用的比例依商品與通路差很多；保障型商品通常比儲蓄型透明。',

    define: [

      { term: '附加費用', en: 'loading', def: '保費 − 純保費。', example: '3,000 元。' },
    ],
    examples: {
      blocks: [

          const pure = (v.p / 100) * v.claim;
          const premium = pure / (1 - v.load / 100);
          const expectCases = (v.n * v.p) / 100;
          const sd = Math.sqrt(v.n * (v.p / 100) * (1 - v.p / 100));
          return { rows: [
            { label: '每人純保費', value: `${Math.round(pure).toLocaleString()} 元`, ratio: Math.min(1, pure / 100000) },
            { label: '每人實際保費', value: `${Math.round(premium).toLocaleString()} 元`, ratio: Math.min(1, premium / 100000) },
            { label: '每年預計出事人數', value: `${expectCases.toFixed(1)} 人`, ratio: Math.min(1, expectCases / 500) },
            { label: '出事人數的相對波動', value: expectCases > 0 ? `±${((sd / expectCases) * 100).toFixed(0)}%` : '—', ratio: expectCases > 0 ? Math.min(1, sd / expectCases) : 1 },
          ], note: '把人數從 100 拉到 10 萬，觀察最後一列：人數越多，實際出事人數相對預期的波動越小，這就是大數法則。個人是在賭，保險池是在算。' };
        } } },
        { type: 'heading', id: 'negative-ev', text: '期望值是負的，為什麼還要買' },
        '因為錢對你的價值不是直線。存款 50 萬的人損失 5 萬，生活幾乎不受影響；損失 500 萬，可能要賣房、借高利貸、拖垮好幾年。經濟學稱這種現象為「邊際效用遞減」：越大的損失，每一塊錢造成的痛苦越大。保險用一筆確定的小痛苦（保費），交換掉發生機率低、但會造成巨大痛苦的事件。',
        { type: 'svg', svg: `<svg viewBox="0 0 560 250" role="img" aria-label="損失與痛苦的關係是一條向上彎的曲線：小損失時痛苦增加得慢，大損失時痛苦急遽增加；保險把曲線右端的大損失換成左端確定的小成本">

          ['健康狀況', '已有疾病會提高理賠機率', '可能加費、除外或拒保'],

        { type: 'heading', id: 'pool-fail', text: '深入：大數法則失靈的時候' },
        '大數法則有一個前提：每個人出事與否大致互不相關。地震、大規模傳染病這類「同時影響很多人」的事件會打破這個前提，保險公司因此會用除外條款、再保險、或政府參與的機制（例如住宅地震保險）處理。對保戶來說，要知道：保單的除外責任，常常就是這類風險。',
        { type: 'heading', id: 'adverse', text: '深入：逆選擇與道德風險' },
        { type: 'table', head: ['現象', '是什麼', '保險公司怎麼處理', '對你的影響'], rows: [
          ['逆選擇', '風險高的人比較想買保險', '核保、健康告知、等待期', '要據實告知（5-1），否則可能被解約'],
          ['道德風險', '有了保險後比較不小心，或誇大損失', '自負額、限額、損害填補原則', '實支實付只能補實際支出（3-2）'],
        ] },
      ],
    },
    mistakes: [
      { wrong: '覺得沒出事就是「保費白繳了」。', why: '保險買的是「萬一」，沒出事正是最好的結果。', right: '把保費當作風險轉移的成本，不是儲蓄。' },
      { wrong: '期待保險「賺回來」。', why: '平均理賠一定低於保費。', right: '只把保險用在自己扛不起的損失。' },
      { wrong: '等到身體有狀況才想買。', why: '核保會加費、除外或拒保，且有等待期。', right: '在年輕健康時，先把大事故的保障補上。' },
    ],
    keypoints: [
      '大數法則讓群體的損失可以預估。',
      '保費 ＝ 純保費 ＋ 附加費用，期望值是負的。',
      '值得買的理由：大損失的痛苦遠大於比例。',
    ],
    sources: ['fsc-moneywise', 'penetration'],
  },

  '1-2': {
    goals: [
      '依優先順序列出該保的風險',

    },
    model: {

      </svg>`,
      caption: '失能放在很前面，是因為它常被忽略：身故時家人失去收入，失能時除了失去收入，還多了照顧費用。',

    define: [
      { term: '保額', en: 'sum assured', def: '事故時的給付金額。', example: '500 萬。' },

    examples: {

        { type: 'table', head: ['該保（扛不起）', '通常不必保（扛得起或不是風險）'], rows: [
          ['主要收入者身故，家人失去生活費', '沒有人依靠你的收入時的高額壽險'],
          ['長期失能，收入中斷又要照顧費', '感冒、小傷的門診費用'],
          ['重大疾病的治療與休養期收入', '手機、家電的延長保固'],
          ['住院、手術的大額自費', '只是為了「有一張」的小額保單'],
          ['重大意外造成的失能與醫療', '把保險當存錢工具（模組 4）'],
        ] },
        { type: 'heading', id: 'budget', text: '保費預算：經驗法則' },
        '台灣常聽到的「雙十原則」：年保費約佔年收入的 10%，壽險保額約為年收入的 10 倍。它是粗略的起點，不是標準：保費 10% 對剛工作的人常常太多，而保額 10 倍對有房貸、有孩子的家庭又常常不夠。更好的做法是先算保障缺口（3-1、3-5），再看預算夠不夠。',

          { id: 'inc', label: '家庭年收入', min: 300000, max: 5000000, step: 10000, value: 800000, unit: '元' },

          const budget = (v.inc * v.pct) / 100;

            { label: '年度保費預算', value: `${Math.round(budget).toLocaleString()} 元`, ratio: Math.min(1, budget / 500000) },
            { label: '真正用在保障的保費', value: `${Math.round(protect).toLocaleString()} 元`, ratio: Math.min(1, protect / Math.max(1, budget)) },
            { label: '儲蓄型佔保費預算', value: `${((Math.min(v.saving, budget) / budget) * 100).toFixed(0)}%`, ratio: Math.min(1, v.saving / budget) },
            { label: '雙十原則的壽險保額參考', value: `${(v.inc * 10).toLocaleString()} 元`, ratio: Math.min(1, v.inc * 10 / 50000000) },

        '有些保險（例如部分醫療險、產險）可以選擇[[自負額]]：小額損失自己付，超過才理賠。這和模組 0 的邏輯一致：有預備金的人，可以把自負額設高一點，換取較低的保費，讓保險只處理真正的大事。',
        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="不同人生階段的保障重點：單身時重在失能、重病與醫療；有家庭與房貸時加上高額定期壽險；子女獨立後壽險需求下降；退休後重在醫療與長照">

        '第一部 1-4 提過，年輕人最大的資產是「未來能賺的錢」（人力資本）。從這個角度看，壽險、失能險、重大疾病險其實都在保護同一件東西：身故讓人力資本完全消失，失能讓它長期中斷甚至變成負擔，重病讓它中斷一段時間。',
        { type: 'table', head: ['事件', '人力資本怎麼了', '對應的保險'], rows: [
