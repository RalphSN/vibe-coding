<script>
/* ==========================================================================
   模組 4：保險 ≠ 投資
   ========================================================================== */
defineTerms({
  '儲蓄險': { en: 'endowment / savings insurance', def: '以累積保單價值、到期或一定年後領回為主要目的的壽險；保障成分通常很低。', example: '6 年繳費、第 20 年領回。', lesson: '4-1' },
  'IRR': { en: 'internal rate of return', def: '內部報酬率：把每一筆繳費與領回的時間點都考慮進去，換算成「每年複利多少 %」；比較不同儲蓄工具時用它。', example: '總報酬 50%，但 IRR 可能只有約 2.3%。', lesson: '4-1' },
  '解約金': { en: 'cash surrender value', def: '提前終止保單時能拿回的金額；前幾年通常低於已繳保費。', example: '繳了 3 年 30 萬，解約只拿回 22 萬。', lesson: '4-1' },
  '宣告利率': { en: 'declared rate', def: '利率變動型保單每期由保險公司宣告的利率，會變動、不保證。', example: '今年宣告 2.5%，明年可能調整。', lesson: '4-1' },
  '投資型保單': { en: 'investment-linked insurance', def: '保費扣除各項費用後放進投資帳戶，帳戶價值隨所選標的漲跌；投資風險由保戶承擔。', example: '連結基金或 ETF 的變額壽險。', lesson: '4-2' },
  '危險保險費': { en: 'cost of insurance', def: '投資型保單每月從帳戶扣除、用來支付壽險保障的費用；依年齡與淨危險保額計算，年紀越大越貴。', example: '40 歲時每月幾百元，70 歲時可能數千元。', lesson: '4-2' },
  '資產撥回': { en: 'asset distribution', def: '類全委投資型保單定期撥給保戶的金額；可能來自收益，也可能來自本金。', example: '每月撥回 0.5%，帳戶淨值卻在下降。', lesson: '4-2' },
});

function fvPayments(P, n, T, r) { let s = 0; for (let k = 0; k < n; k += 1) s += P * (1 + r) ** (T - k); return s; }
function solveIrr(P, n, T, V) { let lo = -0.5; let hi = 0.5; for (let i = 0; i < 200; i += 1) { const m = (lo + hi) / 2; if (fvPayments(P, n, T, m) > V) hi = m; else lo = m; } return (lo + hi) / 2; }

defineLessons({

    goals: [

        <line x1="60" y1="230" x2="530" y2="230" class="stroke-ink" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="230" class="stroke-ink" stroke-width="2"/>
        <path d="M60 210 L120 170 L180 130 L240 90 L300 70 L360 70 L420 70 L480 70 L530 70" fill="none" style="stroke:var(--m7)" stroke-width="4" stroke-dasharray="10 6"/>
        <path d="M60 228 L120 205 L180 170 L240 128 L300 96 L360 78 L420 62 L480 48 L530 36" fill="none" style="stroke:var(--m2)" stroke-width="4"/>
        <text x="300" y="60" font-size="13" font-weight="900">累計已繳保費</text>
        <text x="420" y="30" font-size="13" font-weight="900">解約金</text>
        <line x1="380" y1="40" x2="380" y2="230" class="stroke-ink" stroke-width="2" stroke-dasharray="4 4"/>

        <text x="200" y="250" text-anchor="middle" font-size="12">這段解約會虧本金</text>
      </svg>`,
      caption: '示意曲線。兩條線交會的年份，就是「至少要放這麼久才不虧」；每張保單不同，要看保單的解約金表。',
    },

          { id: 'p', label: '每年保費', min: 10000, max: 1000000, step: 10000, value: 100000, unit: '元' },
          { id: 'n', label: '繳費年數', min: 1, max: 20, step: 1, value: 6, unit: '年' },
          { id: 't', label: '第幾年底領回', min: 1, max: 40, step: 1, value: 20, unit: '年' },
          { id: 'v', label: '領回金額（看保單的解約金或滿期表）', min: 10000, max: 20000000, step: 10000, value: 900000, unit: '元' },

          const r = solveIrr(v.p, v.n, v.t, v.v);
          const alt = fvPayments(v.p, v.n, v.t, v.dep / 100);
          return { rows: [
            { label: '總共繳', value: `${paid.toLocaleString()} 元`, ratio: Math.min(1, paid / v.v) },
            { label: '帳面總報酬', value: `${(((v.v - paid) / paid) * 100).toFixed(1)}%`, ratio: Math.min(1, Math.abs(v.v - paid) / paid) },
            { label: 'IRR（年化）', value: `${(r * 100).toFixed(2)}%`, ratio: Math.min(1, Math.abs(r) / 0.08) },
            { label: `同樣繳法放在 ${v.dep}% 的工具`, value: `${Math.round(alt).toLocaleString()} 元`, ratio: Math.min(1, alt / Math.max(v.v, alt)) },
          ], note: '預設：繳 6 年共 60 萬、第 20 年領 90 萬，帳面報酬 50%，IRR 約 2.34%。拿它和定存、通膨（2026 年 9 月 CPI 年增 2.73%）比較，才知道它到底賺多少。' };
        } } },
        '這個例子的 IRR 和臺灣銀行一年期以上定存（約 1.7%）相比略高，但還要扣掉兩個代價：20 年間錢幾乎不能動（提前解約可能虧本），以及這段期間通膨若高於 IRR，實質購買力仍可能減少。',
        { type: 'heading', id: 'risks', text: '三種常被忽略的風險' },
        { type: 'table', head: ['風險', '是什麼', '怎麼看'], rows: [
          ['流動性', '前幾年解約金低於已繳保費', '看解約金表，確認至少要放幾年才不虧'],
          ['利率', '利率變動型的[[宣告利率]]不保證；預定利率則鎖住，可能錯過升息', '業務展示的通常是假設宣告利率不變的結果'],
          ['匯率', '外幣保單用外幣計價，換回新臺幣時有匯率損益', '外幣保單的 IRR 要另外考慮匯率；需求熱的時候尤其要冷靜'],
        ] },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="儲蓄險、定存、指數化投資的比較：儲蓄險本金相對有保障但流動性差、報酬低；定存流動性較好、報酬低；指數化投資長期報酬較高但會波動">
          ${[['儲蓄險', ['本金相對保障', '流動性差', '報酬低'], 'm1'], ['定存', ['本金保障', '流動性中等', '報酬低'], 'm2'], ['指數化投資', ['會波動', '流動性好', '長期報酬較高'], 'm3']].map(([a, items, c], i) => `<rect x="${15 + i * 182}" y="20" width="165" height="180" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${97 + i * 182}" y="56" text-anchor="middle" font-size="16" font-weight="900" class="on-color">${a}</text>${items.map((t, j) => `<text x="${97 + i * 182}" y="${100 + j * 32}" text-anchor="middle" font-size="13" class="on-color">${t}</text>`).join('')}`).join('')}

        </svg>`, caption: '儲蓄險適合的情況很窄：確定這筆錢很多年都不會動、又真的需要強迫儲蓄的人。' },
        { type: 'heading', id: 'sales', text: '深入：常見的銷售話術怎麼拆' },
        { type: 'table', head: ['話術', '要問的問題'], rows: [

  '4-2': {
    goals: [
      '列出投資型保單的五類費用',
      '說明危險保險費為什麼會隨年齡吃掉帳戶',

    analogy: {
      text: ['[[投資型保單]]像是一個套裝行程：保險和投資綁在一起賣，看起來方便，但每個環節都有一筆費用。把同樣的行程拆開自己訂（買定期壽險，加上自己投資低成本的指數基金），常常更便宜、也更透明。', '它最容易被誤解的地方有兩個：保障的成本（[[危險保險費]]）會隨年齡上升、從投資帳戶裡扣；以及類全委保單的[[資產撥回]]看起來像配息，卻可能是把你自己的本金還給你。'],
      limit: ['套裝行程也有它的價值（例如強迫投資、某些稅務或傳承安排）；這一課只是讓你看清楚價格，不是說它一定不能買。'],

          { id: 'prem', label: '每年投入', min: 10000, max: 500000, step: 10000, value: 120000, unit: '元' },
          { id: 'years', label: '投入年數', min: 5, max: 40, step: 1, value: 20, unit: '年' },
          { id: 'ret', label: '投資標的的年報酬（扣費用前）', min: -5, max: 12, step: 0.5, value: 5, unit: '%' },
