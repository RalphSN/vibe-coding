<script>

defineTerms({

    { text: '1', why: '少算了。' },

  { level: '應用', type: 'mc', q: '（回顧 2-3）單人 decode 速度上限？', options: [
    { text: '頻寬 ÷ 權重大小', correct: true, why: '每 token 讀一次權重。' },

      text: ['照片存成 JPEG：看起來幾乎一樣，檔案卻小很多。代價是放大看會有一點點失真。', '[[量化]]對權重做類似的事：把每個 16 位元的數，四捨五入到少數幾個等級（例如 4 位元只有 16 級），存的時候只存「第幾級」和一個[[縮放因子]]。記憶體與 decode 時要搬的資料都少了好幾倍（2-3）。'],

    },
    model: {
      svg: `<svg viewBox="0 0 560 230" role="img" aria-label="對稱量化：把負 0.8 到 0.8 的範圍切成 15 個等級，每個權重四捨五入到最近的等級，只存等級編號">
        <line x1="40" y1="110" x2="520" y2="110" class="stroke-ink" stroke-width="3"/>

      { term: 'QLoRA', en: 'QLoRA', def: '4 位元基底模型＋少量可訓練參數的微調方法。', example: '單張 48 GB 卡微調 65B。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '把 8 個權重量化（實際計算：對稱量化）', sliders: [
          { id: 'b', label: '位元數', min: 2, max: 8, step: 1, value: 4 },
        ], compute: (v) => {
          const levels = 2 ** (v.b - 1) - 1;
          const scale = Math.max(...WEIGHTS.map(Math.abs)) / levels;
          const q = WEIGHTS.map((w) => Math.round(w / scale) * scale);
          const mse = WEIGHTS.reduce((s, w, i) => s + (w - q[i]) ** 2, 0) / WEIGHTS.length;
          const maxErr = Math.max(...WEIGHTS.map((w, i) => Math.abs(w - q[i])));
          return { rows: [
            { label: `等級：−${levels} ～ ${levels}，每級`, value: scale.toFixed(4), ratio: Math.min(1, scale / 0.8) },
            { label: '還原後', value: q.map((x) => x.toFixed(2)).join(' '), ratio: 0 },
            { label: '平均平方誤差', value: mse.toExponential(2), ratio: Math.min(1, mse / 0.02) },
            { label: '最大誤差', value: maxErr.toFixed(4), ratio: Math.min(1, maxErr / 0.2) },
            { label: '記憶體（相對 16 位元）', value: `${((v.b / 16) * 100).toFixed(1)}%`, ratio: v.b / 16 },

        } } },
        { type: 'table', head: ['格式', '每參數', '70B 權重', '常見用途'], rows: [

          ['8 位元', '1', '70 GB', '伺服器推論，品質通常很接近'],
          ['4 位元', '約 0.5', '約 35 GB', '本地部署最常見'],
          ['2～3 位元', '更少', '更小', '品質下降較明顯，要評估'],

      { wrong: '把量化和蒸餾混為一談。', why: '量化是同一個模型存得更省；蒸餾是訓練一個新的小模型。', right: '兩者可以一起用。' },

        { text: '7', why: '只算了一邊。' },

      { level: '應用', type: 'mc', q: '同一個模型從 BF16 量化成 4 位元，decode 速度上限大約？', options: [
        { text: '快 4 倍', correct: true, why: '要搬的資料少 4 倍。' },

        '一、數字計算本來就不該靠模型，交給工具（第一部模組 4）；二、比較 8 位元版本是否改善；三、只把對精度敏感的部分保留高精度。',
        '關鍵是用自己的評估集在各種量化等級上實測，而不是只看整體分數。',
      ] },
    ],
    keypoints: [
      '量化：每個權重四捨五入到少數等級，存等級＋縮放因子。',
      '省記憶體、加快 decode；位元越少品質風險越高。',
      '本地部署最常見 4 位元；一定要用自己的任務評估。',
    ],
    sources: ['llamacpp', 'qlora'],
  },

  '4-2': {
    goals: [
      '說出蒸餾的基本做法',
      '解釋軟標籤比硬標籤多了什麼資訊',
      '用 DistilBERT 的數字說明蒸餾的效果',
    ],
    review: [
      { level: '回想', type: 'mc', q: '（回顧 4-1）量化和蒸餾的差別？', options: [

        { text: '兩者完全一樣', why: '做法不同。' },

      { level: '應用', type: 'mc', q: '（回顧 2-1）8B 模型 4 位元？', options: [

      limit: ['學生再怎麼學，能力上限受自己的大小限制；而且用別家的模型輸出來訓練，可能違反使用條款，這是法律與授權問題，不只是技術問題。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 230" role="img" aria-label="蒸餾：同一筆輸入給老師和學生，老師輸出機率分布當作軟標籤，學生的損失同時看正確答案和老師的分布">
        <rect x="20" y="90" width="110" height="56" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="75" y="124" text-anchor="middle" font-size="15" font-weight="900" class="on-color">輸入</text>
        <rect x="190" y="30" width="150" height="60" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/><text x="265" y="58" text-anchor="middle" font-size="15" font-weight="900" class="on-color">老師（大）</text><text x="265" y="78" text-anchor="middle" font-size="12" class="on-color">固定不動</text>
        <rect x="190" y="150" width="150" height="60" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/><text x="265" y="178" text-anchor="middle" font-size="15" font-weight="900" class="on-color">學生（小）</text><text x="265" y="198" text-anchor="middle" font-size="12" class="on-color">在學習</text>
        <line x1="130" y1="110" x2="190" y2="60" class="stroke-ink" stroke-width="3"/><line x1="130" y1="126" x2="190" y2="180" class="stroke-ink" stroke-width="3"/>

        <line x1="340" y1="60" x2="390" y2="108" class="stroke-ink" stroke-width="3"/><line x1="340" y1="180" x2="390" y2="128" class="stroke-ink" stroke-width="3"/>
        <text x="280" y="224" text-anchor="middle" font-size="13">只有學生的參數會被更新</text>
      </svg>`,
      caption: 'Hinton、Vinyals、Dean 2015 把這個做法系統化。',
    },
    define: [
      { term: '蒸餾', en: 'distillation', def: '小模型學大模型的輸出。', example: 'DistilBERT。' },
      { term: '軟標籤', en: 'soft targets', def: '老師的完整機率分布。', example: '貓 70%、老虎 20%。' },
      { term: '硬標籤', en: 'hard label', def: '只有正確答案。', example: '貓。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '老師的分數 → 軟標籤：溫度越高，越看得到「第二像」（實際計算）', sliders: [
          { id: 't', label: '蒸餾溫度 T', min: 1, max: 10, step: 0.5, value: 1 },
        ], compute: (v) => {
          const labels = ['貓', '老虎', '狗', '汽車'];
          const logits = [6, 4, 2, -2];
          const s = logits.map((x) => x / v.t); const m = Math.max(...s);
          const e = s.map((x) => Math.exp(x - m)); const tot = e.reduce((a, b) => a + b, 0);
          return { rows: labels.map((n, i) => ({ label: n, value: `${((e[i] / tot) * 100).toFixed(1)}%`, ratio: e[i] / tot })), note: '硬標籤只說「是貓」。T＝1 時老師幾乎全押貓；T 拉高後看得出「老虎比狗像、狗比汽車像」：這種相似關係就是軟標籤多給學生的知識。' };

        { type: 'svg', svg: `<svg viewBox="0 0 560 170" role="img" aria-label="三種讓模型變便宜的方法：量化、蒸餾、直接選小模型，可以疊加使用">

          <text x="280" y="158" text-anchor="middle" font-size="13">可以疊加：蒸餾出的小模型再量化，是本地部署常見的組合</text>

      ],
      tryit: {

        draft: '我的回答：＿',
        answer: ['它告訴學生：這張圖除了是貓，還有點像老虎、不太像狗、完全不像汽車。學生從中學到類別之間的相似結構，用同樣的資料學得更多、更快。', '硬標籤只給了一個 bit 的「對／錯」，軟標籤給了一整組關係。'],

    mistakes: [

      { wrong: '隨便用別家 API 的輸出來蒸餾自己的模型。', why: '可能違反服務條款。', right: '先確認授權與使用條款。' },
      { wrong: '以為蒸餾不需要資料。', why: '還是要輸入資料讓老師產生軟標籤。', right: '準備和任務相關的輸入資料。' },
    ],

      { level: '應用', type: 'mc', q: 'DistilBERT 相對於 BERT？', options: [
