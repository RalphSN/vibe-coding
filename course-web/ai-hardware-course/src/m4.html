<script>
/* ==========================================================================
   模組 4：量化、蒸餾、小模型
   ========================================================================== */
defineTerms({
  '量化': { en: 'quantization', def: '用更少的位元存權重（例如 16 位元 → 4 位元），把每個數四捨五入到少數幾個等級；省記憶體、加快 decode，代價是一點精度。', example: '70B：140 GB → 約 35 GB。', lesson: '4-1' },
  '縮放因子': { en: 'scale', def: '量化時把原本的數字範圍對應到整數等級的比例；還原時乘回去。', example: '最大值 0.8、4 位元 → 每一級約 0.114。', lesson: '4-1' },
  'GGUF': { en: 'GGUF', def: 'llama.cpp 使用的模型檔案格式，常用來存量化後的模型。', example: 'model-Q4_K_M.gguf。', lesson: '4-1' },
  '離群值': { en: 'outlier', def: '比其他數值大很多的少數值；量化時它會把縮放因子撐大，讓其他數字都擠在少數幾個等級。', example: 'LLM.int8 發現約 6.7B 規模以上的模型出現離群特徵。', lesson: '4-1' },
  '蒸餾': { en: 'knowledge distillation', def: '讓小模型（學生）學大模型（老師）的輸出機率，而不只學正確答案；Hinton 等 2015。', example: 'DistilBERT。', lesson: '4-2' },
  '軟標籤': { en: 'soft targets', def: '老師給的完整機率分布，包含「第二像、第三像」的資訊。', example: '貓 70%、老虎 20%、狗 10%。', lesson: '4-2' },
  '小模型': { en: 'small language model', def: '參數較少（例如十億級以下到幾十億）的模型；便宜、快、可以在本地跑。', example: '分類、抽取、簡單問答。', lesson: '4-3' },
});


const WEIGHTS = [0.8, -0.35, 0.12, -0.71, 0.05, 0.44, -0.18, 0.63];

defineLessons({
  '4-1': {
    goals: [
      '手算一次對稱量化',
      '說出量化省了什麼、付出什麼',
      '知道常見的量化等級與工具',
    ],
    analogy: {
      text: ['照片存成 JPEG：看起來幾乎一樣，檔案卻小很多。代價是放大看會有一點點失真。', '[[量化]]對權重做類似的事：把每個 16 位元的數，四捨五入到少數幾個等級（例如 4 位元只有 16 級），存的時候只存「第幾級」和一個[[縮放因子]]。記憶體與 decode 時要搬的資料都少了好幾倍（2-3）。'],
      limit: ['JPEG 的失真人眼看不出來，量化的失真可能讓模型在某些任務（數學、程式、罕見語言）明顯變差；位元越少，風險越高，要用自己的任務評估。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 230" role="img" aria-label="對稱量化：把負 0.8 到 0.8 的範圍切成 15 個等級，每個權重四捨五入到最近的等級，只存等級編號">
        <line x1="40" y1="110" x2="520" y2="110" class="stroke-ink" stroke-width="3"/>
        ${[...Array(15).keys()].map((i) => `<line x1="${40 + i * (480 / 14)}" y1="100" x2="${40 + i * (480 / 14)}" y2="120" class="stroke-ink" stroke-width="2"/>`).join('')}
        <text x="40" y="142" text-anchor="middle" font-size="13">−0.8</text><text x="280" y="142" text-anchor="middle" font-size="13">0</text><text x="520" y="142" text-anchor="middle" font-size="13">0.8</text>
        <circle cx="${280 + 0.44 * 300}" cy="80" r="7" style="fill:var(--m0)" class="stroke-ink" stroke-width="2"/><text x="${280 + 0.44 * 300}" y="66" text-anchor="middle" font-size="13">0.44</text>
        <path d="M${280 + 0.44 * 300} 87 L${40 + 11 * (480 / 14)} 104" class="stroke-ink" stroke-width="2"/>
        <text x="280" y="40" text-anchor="middle" font-size="15" font-weight="900">4 位元對稱：−7 到 7，共 15 級（每級 ≈ 0.114）</text>
        <text x="280" y="180" text-anchor="middle" font-size="14">0.44 → 第 4 級 → 還原成 4 × 0.114 ≈ 0.457（誤差 0.017）</text>
        <text x="280" y="210" text-anchor="middle" font-size="13">實際工具會分組量化、用更聰明的方法，但想法一樣</text>
      </svg>`,
      caption: '縮放因子 ＝ 最大絕對值 ÷ 7。只存小整數＋每組一個縮放因子。',
    },
    define: [
      { term: '量化', en: 'quantization', def: '用更少位元存權重。', example: '16 → 4 位元。' },
      { term: '縮放因子', en: 'scale', def: '等級與真實數值的換算比例。', example: '最大值 ÷ 7。' },
      { term: 'GGUF', en: 'GGUF', def: 'llama.cpp 的模型格式。', example: 'Q4_K_M。' },
      { term: 'QLoRA', en: 'QLoRA', def: '4 位元基底模型＋少量可訓練參數的微調方法。', example: '單張 48 GB 卡微調 65B。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '把 8 個權重量化（實際計算：對稱量化）', sliders: [
          { id: 'b', label: '位元數', min: 2, max: 8, step: 1, value: 4 },
        ], compute: (v) => {
          const levels = 2 ** (v.b - 1) - 1;
          const scale = Math.max(...WEIGHTS.map(Math.abs)) / levels;
          const q = WEIGHTS.map((w) => Math.round(w / scale) * scale);
          const mse = WEIGHTS.reduce((s, w, i) => s + (w - q[i]) ** 2, 0) / WEIGHTS.length;
          const maxErr = Math.max(...WEIGHTS.map((w, i) => Math.abs(w - q[i])));
          return { rows: [
            { label: `等級：−${levels} ～ ${levels}，每級`, value: scale.toFixed(4), ratio: Math.min(1, scale / 0.8) },
            { label: '還原後', value: q.map((x) => x.toFixed(2)).join(' '), ratio: 0 },
            { label: '平均平方誤差', value: mse.toExponential(2), ratio: Math.min(1, mse / 0.02) },
            { label: '最大誤差', value: maxErr.toFixed(4), ratio: Math.min(1, maxErr / 0.2) },
            { label: '記憶體（相對 16 位元）', value: `${((v.b / 16) * 100).toFixed(1)}%`, ratio: v.b / 16 },
          ], note: `原本：${WEIGHTS.join(' ')}。位元越少誤差越大；2 位元只剩 −1、0、1 三級，很多權重被歸成 0。實際工具會分小組各自算縮放因子，誤差比這裡小。` };
        } } },
        { type: 'table', head: ['格式', '每參數', '70B 權重', '常見用途'], rows: [
          ['BF16', '2 位元組', '140 GB', '訓練、伺服器推論'],
          ['8 位元', '1', '70 GB', '伺服器推論，品質通常很接近'],
          ['4 位元', '約 0.5', '約 35 GB', '本地部署最常見'],
          ['2～3 位元', '更少', '更小', '品質下降較明顯，要評估'],
        ], caption: 'llama.cpp 支援 1.5～8 位元的整數量化；實際檔案還有縮放因子等額外空間。' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 180" role="img" aria-label="量化的取捨：位元越少，記憶體與速度越好，品質風險越高；要用自己的任務評估">
          <line x1="40" y1="90" x2="520" y2="90" class="stroke-ink" stroke-width="4"/>
          ${[['16', 60], ['8', 200], ['4', 340], ['2', 480]].map(([b, x]) => `<circle cx="${x}" cy="90" r="12" style="fill:var(--m${b === '16' ? 3 : b === '8' ? 2 : b === '4' ? 4 : 7})" class="stroke-ink" stroke-width="3"/><text x="${x}" y="70" text-anchor="middle" font-size="14" font-weight="900">${b} 位元</text>`).join('')}
          <text x="60" y="130" font-size="13">品質最穩</text>
          <text x="520" y="130" text-anchor="end" font-size="13">最省、最快、風險最高</text>
          <text x="280" y="166" text-anchor="middle" font-size="13">先試 8 位元或 4 位元，用自己的評估集比較（第一部 8-1）</text>
        </svg>`, caption: '量化是推論的工具；訓練通常不直接用這麼低的位元。' },
        { type: 'heading', id: 'quant-why-groups', text: '深入：為什麼要分組，以及量化了什麼' },
        '上面的拉桿只用一個縮放因子。如果 8 個權重裡有一個是 8.0，其他都在 ±0.5 以內，每一級就變成 8 ÷ 7 ≈ 1.14，其他權重幾乎全被歸成 0。這種[[離群值]]在大模型裡真的存在（LLM.int8 論文），所以實際工具把權重分成每 32～128 個一組，各自算縮放因子，再用 GPTQ、AWQ 等方法挑出對誤差影響最大的權重特別處理。',
        { type: 'table', head: ['量化方式', '例子', '加速了什麼'], rows: [
          ['只量化權重（W4A16）', 'GGUF Q4、GPTQ、AWQ', 'decode：要搬的權重少 4 倍；計算時還原成 16 位元，prefill 不一定變快'],
          ['權重與 activation 都量化（W8A8、FP8）', '伺服器上的 FP8 推論', 'prefill 與大批次也變快，因為 Tensor Core 直接用低精度算（1-3）'],
          ['KV cache 量化', 'FP8 KV cache', '長 context 能服務更多人（2-4）'],
        ] },
        '因為每組還要存縮放因子，「4 位元」的檔案平均每個權重其實超過 4 位元；GGUF 的 Q4_K_M 還會把部分敏感的層用更多位元存。估算記憶體時，4 位元的數字再多抓一成左右比較保險。',
      ],
    },
    mistakes: [
      { wrong: '以為量化後品質一定和原本一樣。', why: '位元越少誤差越大，某些任務特別敏感。', right: '用自己的任務評估。' },
      { wrong: '以為量化只省記憶體。', why: 'decode 被頻寬卡住，資料少了就變快。', right: '量化同時省記憶體、加快 decode。' },
      { wrong: '把量化和蒸餾混為一談。', why: '量化是同一個模型存得更省；蒸餾是訓練一個新的小模型。', right: '兩者可以一起用。' },
    ],
    practice: [
      { level: '深入思考', type: 'reveal', q: ['你把客服模型量化到 4 位元後，一般問答沒問題，但「計算退款金額」常錯。怎麼處理？'], answer: [
        '一、數字計算本來就不該靠模型，交給工具（第一部模組 4）；二、比較 8 位元版本是否改善；三、只把對精度敏感的部分保留高精度。',
        '關鍵是用自己的評估集在各種量化等級上實測，而不是只看整體分數。',
      ] },
    ],
    keypoints: [
      '量化：每個權重四捨五入到少數等級，存等級＋縮放因子。',
      '省記憶體、加快 decode；位元越少品質風險越高。',
      '本地部署最常見 4 位元；一定要用自己的任務評估。',
    ],
    sources: ['llamacpp', 'qlora', 'llm-int8'],
  },

  '4-2': {
    goals: [
      '說出蒸餾的基本做法',
      '解釋軟標籤比硬標籤多了什麼資訊',
      '用 DistilBERT 的數字說明蒸餾的效果',
    ],
    analogy: {
      text: ['學圍棋時，只看棋譜的最後勝負（硬標籤）學得很慢；如果有老師在旁邊說「這一步不錯，那一步也可以，但這步最好」，你學得快很多。', '[[蒸餾]]就是讓小模型（學生）跟著大模型（老師）學：不只學正確答案，還學老師給每個選項的機率（[[軟標籤]]），裡面藏著「哪些答案很接近」的知識。'],
      limit: ['學生再怎麼學，能力上限受自己的大小限制；而且用別家的模型輸出來訓練，可能違反使用條款，這是法律與授權問題，不只是技術問題。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 230" role="img" aria-label="蒸餾：同一筆輸入給老師和學生，老師輸出機率分布當作軟標籤，學生的損失同時看正確答案和老師的分布">
        <rect x="20" y="90" width="110" height="56" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="75" y="124" text-anchor="middle" font-size="15" font-weight="900" class="on-color">輸入</text>
        <rect x="190" y="30" width="150" height="60" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/><text x="265" y="58" text-anchor="middle" font-size="15" font-weight="900" class="on-color">老師（大）</text><text x="265" y="78" text-anchor="middle" font-size="12" class="on-color">固定不動</text>
        <rect x="190" y="150" width="150" height="60" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/><text x="265" y="178" text-anchor="middle" font-size="15" font-weight="900" class="on-color">學生（小）</text><text x="265" y="198" text-anchor="middle" font-size="12" class="on-color">在學習</text>
        <line x1="130" y1="110" x2="190" y2="60" class="stroke-ink" stroke-width="3"/><line x1="130" y1="126" x2="190" y2="180" class="stroke-ink" stroke-width="3"/>
        <rect x="390" y="90" width="150" height="56" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="465" y="114" text-anchor="middle" font-size="14" font-weight="900" class="on-color">損失</text><text x="465" y="134" text-anchor="middle" font-size="12" class="on-color">像老師＋答對</text>
        <line x1="340" y1="60" x2="390" y2="108" class="stroke-ink" stroke-width="3"/><line x1="340" y1="180" x2="390" y2="128" class="stroke-ink" stroke-width="3"/>
        <text x="280" y="224" text-anchor="middle" font-size="13">只有學生的參數會被更新</text>
      </svg>`,
      caption: 'Hinton、Vinyals、Dean 2015 把這個做法系統化。',
    },
    define: [
      { term: '蒸餾', en: 'distillation', def: '小模型學大模型的輸出。', example: 'DistilBERT。' },
      { term: '軟標籤', en: 'soft targets', def: '老師的完整機率分布。', example: '貓 70%、老虎 20%。' },
      { term: '硬標籤', en: 'hard label', def: '只有正確答案。', example: '貓。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '老師的分數 → 軟標籤：溫度越高，越看得到「第二像」（實際計算）', sliders: [
          { id: 't', label: '蒸餾溫度 T', min: 1, max: 10, step: 0.5, value: 1 },
        ], compute: (v) => {
          const labels = ['貓', '老虎', '狗', '汽車'];
          const logits = [6, 4, 2, -2];
          const s = logits.map((x) => x / v.t); const m = Math.max(...s);
          const e = s.map((x) => Math.exp(x - m)); const tot = e.reduce((a, b) => a + b, 0);
          return { rows: labels.map((n, i) => ({ label: n, value: `${((e[i] / tot) * 100).toFixed(1)}%`, ratio: e[i] / tot })), note: '硬標籤只說「是貓」。T＝1 時老師幾乎全押貓；T 拉高後看得出「老虎比狗像、狗比汽車像」：這種相似關係就是軟標籤多給學生的知識。' };
        } } },
        { type: 'table', head: ['DistilBERT（Sanh 等 2019）', '相對於 BERT'], rows: [
          ['模型大小', '小 40%'],
          ['速度', '快 60%'],
          ['語言理解能力', '保留 97%'],
        ], caption: '論文摘要的數字。蒸餾的典型結果：小很多、快很多、只掉一點點能力。' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 170" role="img" aria-label="三種讓模型變便宜的方法：量化、蒸餾、直接選小模型，可以疊加使用">
          ${[['量化', '同一個模型存更省', 'm4'], ['蒸餾', '訓練一個學大模型的小模型', 'm3'], ['選小模型', '直接用小一號的', 'm2']].map(([a, b, c], i) => `<rect x="${10 + i * 185}" y="30" width="170" height="100" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${95 + i * 185}" y="70" text-anchor="middle" font-size="16" font-weight="900" class="on-color">${a}</text><text x="${95 + i * 185}" y="100" text-anchor="middle" font-size="12" class="on-color">${b}</text>`).join('')}
          <text x="280" y="158" text-anchor="middle" font-size="13">可以疊加：蒸餾出的小模型再量化，是本地部署常見的組合</text>
        </svg>`, caption: '很多公開的小模型本身就是用蒸餾等方法訓練的（🟡 通則；個別模型以官方說明為準）。' },
        { type: 'heading', id: 'distill-llm', text: '深入：大型語言模型的蒸餾長什麼樣' },
        'Hinton 等 2015 的做法要拿到老師對每個選項的完整機率（logits），而且溫度拉高後梯度會變小，所以軟標籤的損失要乘上 T² 補回來。可是透過 API 用別人的模型，通常拿不到完整機率，最多只有前幾名的 logprobs。',
        { type: 'table', head: ['做法', '學生學什麼', '需要什麼'], rows: [

          ['序列蒸餾（用老師的輸出當訓練資料）', '老師寫出的完整回答', '只要老師的文字輸出'],

        '大型語言模型現在多用第二種。DeepSeek-R1 的論文就用 R1 產生約 80 萬筆樣本，直接微調 Qwen 與 Llama 系列的小模型，得到推理能力明顯提升的蒸餾版本。這也是為什麼「用別家 API 輸出來訓練」的條款問題變得這麼實際。',
      ],
    },
    mistakes: [

      { wrong: '隨便用別家 API 的輸出來蒸餾自己的模型。', why: '可能違反服務條款。', right: '先確認授權與使用條款。' },
      { wrong: '以為蒸餾不需要資料。', why: '還是要輸入資料讓老師產生軟標籤。', right: '準備和任務相關的輸入資料。' },

    keypoints: [

      '軟標籤包含類別之間的相似關係。',

    ],
    sources: ['hinton-distill', 'distilbert', 'deepseek-r1'],

  '4-3': {
    goals: [
      '依任務判斷要不要用小模型',
      '用成本與延遲比較大、小模型',
