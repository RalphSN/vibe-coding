const COPY_TEXT = new Map();
const LANG_ALIAS = { cmd: 'plaintext', bat: 'plaintext', pwsh: 'powershell', text: 'plaintext', prompt: 'plaintext', toml: 'ini', jsonc: 'json', sh: 'bash', zsh: 'bash', shell: 'bash', yml: 'yaml', md: 'markdown', js: 'javascript', ts: 'typescript', ps1: 'powershell', py: 'python' };
const LANG_LABEL = { plaintext: 'TEXT', bash: 'BASH', json: 'JSON', python: 'PYTHON', typescript: 'TYPESCRIPT', javascript: 'JAVASCRIPT', markdown: 'MARKDOWN', yaml: 'YAML', xml: 'XML', ini: 'TOML', powershell: 'POWERSHELL', sql: 'SQL', dockerfile: 'DOCKERFILE' };

/* 單元內容裡定義的術語，自動加進術語表 */
LESSONS.forEach((lesson) => {
  const defs = lesson.content && lesson.content.define;
  if (!defs) return;
  defs.forEach((d) => {
    if (!GLOSSARY[d.term]) GLOSSARY[d.term] = { en: d.en, def: d.def, example: d.example, lesson: lesson.id };
    else if (!GLOSSARY[d.term].lesson) GLOSSARY[d.term].lesson = lesson.id;
  });
});

/* ---------- 區塊渲染 ---------- */
function renderBlocks(blocks) {
  if (blocks == null) return '';
  const list = Array.isArray(blocks) ? blocks : [blocks];
  return list.map(renderBlock).join('');
}

function renderBlock(b) {
  if (typeof b === 'string') return `<p>${md(b)}</p>`;
  switch (b.type) {
    case 'list': {
      const tag = b.ordered ? 'ol' : 'ul';
      return `<${tag}>${b.items.map((i) => `<li>${md(i)}</li>`).join('')}</${tag}>`;
    }
    case 'code': return codeBlock(b);
    case 'table': return tableBlock(b);
    case 'callout': return `<div class="callout ${esc(b.variant || 'tip')}"><span class="label">${md(b.title || '')}</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'unverified': return `<div class="callout unverified"><span class="label">截至 2026-10 查證狀態：未確認</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'timely': return `<div class="callout timely"><span class="label">時效提醒</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'legacy': return legacyBlock(b);
    case 'svg': return `<figure class="figure">${b.svg}<button type="button" class="btn small nb-press fig-zoom" data-fig-zoom>放大看</button>${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure>`;
    case 'compare': return compareBlock(b);
    case 'tabs': return tabsBlock(b);
    case 'reveal': return `<details class="reveal"><summary>${esc(b.summary || '展開')}</summary><div class="reveal-body blocks">${renderBlocks(b.body)}</div></details>`;
    case 'quiz': return quizList(b.items, b.key || uid('qz'));
    case 'widget': return renderWidget(b);
    case 'heading': return `<h2 class="ref-h" id="sec-${esc(b.id)}"><span class="label">${esc(b.text)}</span></h2>`;
    case 'tryit': return tryitBlock(b);
    default:
      console.error('未知的區塊類型：', b);
      return '';
  }
}

function codeBlock({ lang = 'text', code, title, label }) {
  const resolved = LANG_ALIAS[lang] || lang;
  const id = uid('code');
  COPY_TEXT.set(id, code);
  return `<div class="code">
    <div class="code-head"><span class="lang">${esc(label || (lang === 'cmd' || lang === 'bat' ? 'CMD' : lang === 'zsh' ? 'ZSH' : LANG_LABEL[resolved] || resolved))}</span><span class="ttl">${esc(title || '')}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${title ? ` ${esc(title)}` : '程式碼'}">複製</button></div>
    <pre tabindex="0" aria-label="${esc(title || '程式碼')}"><code class="language-${esc(resolved)}">${esc(code)}</code></pre>
  </div>`;
}

function tableBlock({ head, rows, caption }) {
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption || '表格')}"><table>
    ${caption ? `<caption>${md(caption)}</caption>` : ''}
    <thead><tr>${head.map((h) => `<th scope="col">${md(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => (i === 0 ? `<th scope="row">${md(cell)}</th>` : `<td>${md(cell)}</td>`)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function legacyBlock({ title, rows, note }) {
  return `<div class="callout legacy"><span class="label">${esc(title || '舊做法 → 現在的做法')}</span><div class="body">
    <div class="legacy-grid">${rows.map(([oldWay, newWay]) => `<div class="legacy-row"><div class="old">${md(oldWay)}</div><div class="arrow" aria-hidden="true">→</div><div class="new"><span class="visually-hidden">現在：</span>${md(newWay)}</div></div>`).join('')}</div>
    ${note ? `<p style="margin-top:var(--sp-3)">${md(note)}</p>` : ''}
  </div></div>`;
}

/* ---------- 對照器：prompt、設定檔、指令都適用 ---------- */
const DIFF_RE = /\{\{(\d+):([\s\S]+?)\}\}/g;
function promptHtml(text) { return esc(text).replace(DIFF_RE, '<mark class="diff" data-n="$1">$2</mark>'); }
function promptPlain(text) { return text.replace(DIFF_RE, '$2'); }

function compareSide(kind, label, text, ctx, result, isCode) {
  const id = uid('cmp');
  COPY_TEXT.set(id, promptPlain(text));
  return `<div class="compare-side ${kind}">
    <div class="side-head"><span class="label">${esc(label)}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${esc(label)}">複製</button></div>
    <pre class="prompt-text${isCode ? ' is-code' : ''}">${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${promptHtml(text)}</pre>
    ${result ? `<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)"><strong>${kind === 'bad' ? '可能的結果' : '得到的結果'}：</strong>${md(result)}</p>` : ''}
  </div>`;
}

function compareBlock(b) {
  return `<div class="compare side-by-side">
    ${b.title ? `<div class="compare-title"><span class="label">${esc(b.kind || '對照')}</span>${md(b.title)}</div>` : ''}
    <div class="compare-grid">
      ${compareSide('bad', b.badLabel || '✗ 壞做法', b.bad, b.badCtx, b.badResult, b.code)}
      ${compareSide('good', b.goodLabel || '✓ 好做法', b.good, b.goodCtx, b.goodResult, b.code)}
    </div>
    ${b.why && b.why.length ? `<div class="why"><strong>差在哪裡</strong><ol>${b.why.map((w, i) => `<li><span class="n">${i + 1}</span><span>${md(w)}</span></li>`).join('')}</ol></div>` : ''}
  </div>`;
}

function tryitBlock(t) {
  return `<div class="tryit"><span class="label">換你補完</span>
    <div class="blocks">${renderBlocks(t.q)}</div>
    ${t.draft ? `<pre class="prompt-text${t.code ? ' is-code' : ''}" style="margin-top:var(--sp-3)">${esc(t.draft).replace(/____/g, '<span class="blank" aria-label="空格">　</span>')}</pre>` : ''}
    <details class="reveal" style="margin-top:var(--sp-4)"><summary>我寫好了，看參考答案</summary><div class="reveal-body blocks">${renderBlocks(t.answer)}</div></details>
  </div>`;
}

/* ---------- 分頁：舊面板淡出後，新面板淡入 ---------- */
function tabsBlock({ tabs, label }) {
  const base = uid('tabs');
  return `<div class="tabs">
    <div class="tablist" role="tablist" aria-label="${esc(label || '分頁')}">
      ${tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="${base}-t${i}" aria-controls="${base}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(t.label)}</button>`).join('')}
    </div>
    ${tabs.map((t, i) => `<div class="tabpanel blocks" role="tabpanel" id="${base}-p${i}" aria-labelledby="${base}-t${i}" tabindex="0" ${i === 0 ? '' : 'hidden'}>${renderBlocks(t.blocks)}</div>`).join('')}
  </div>`;
}
const TAB_LEAVE_MS = 120;
function selectTab(tab) {
  if (tab.getAttribute('aria-selected') === 'true') return;
  const list = tab.closest('[role="tablist"]');
  const tabs = $$('[role="tab"]', list);
  const oldTab = tabs.find((t) => t.getAttribute('aria-selected') === 'true');
  tabs.forEach((t) => {
    const selected = t === tab;
    t.setAttribute('aria-selected', String(selected));
    t.tabIndex = selected ? 0 : -1;
  });
  const newPanel = document.getElementById(tab.getAttribute('aria-controls'));
  const oldPanel = oldTab ? document.getElementById(oldTab.getAttribute('aria-controls')) : null;
  const swap = () => {
    if (oldPanel) { oldPanel.hidden = true; oldPanel.classList.remove('is-leaving'); }
    newPanel.hidden = false;
  };
  if (!oldPanel || prefersReducedMotion()) { swap(); return; }
  oldPanel.classList.add('is-leaving');
  window.setTimeout(swap, TAB_LEAVE_MS);
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) selectTab(tab);
});
document.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]'));
  const i = tabs.indexOf(tab);
  const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const next = tabs[(moves[e.key] + tabs.length) % tabs.length];
  selectTab(next);
  next.focus();
});

/* ---------- 測驗：每個選項都有解析，選項依 key 固定打亂 ---------- */
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 同一題每次載入順序一樣，存下來的答案才對得上；不同題順序不同 */
function shuffledOrder(n, key) {
  const order = Array.from({ length: n }, (_, i) => i);
  let seed = hashString(key) || 1;
  for (let i = n - 1; i > 0; i -= 1) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = seed % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

function quizList(items, keyBase) {
  return `<div class="quiz-list">${items.map((item, i) => quizItem(item, `${keyBase}:${i}`)).join('')}</div>`;
}

function quizHead(item) {
  const parts = [];
  if (item.level) parts.push(`<span class="label lv" data-lv="${esc(item.level)}">${esc(item.level)}</span>`);
  if (item.from && LESSON_BY_ID[item.from]) parts.push(`<a class="label review-from" href="#/l/${item.from}">回顧 ${esc(item.from)}</a>`);
  return parts.length ? `<div class="quiz-head">${parts.join('')}</div>` : '';
}

function quizItem(item, key) {
  if (item.type === 'mc') {
    QUIZ_REGISTRY.set(key, item);
    const order = shuffledOrder(item.options.length, key);
    return `<form class="quiz" data-quiz="${esc(key)}" novalidate>
      ${quizHead(item)}
      <fieldset><legend>${md(item.q)}</legend>
        <div class="opts">${order.map((oi) => `<label class="opt" data-oi="${oi}"><input type="radio" name="${esc(key)}" value="${oi}"><span>${md(item.options[oi].text)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div>
      </fieldset>
      <div class="quiz-actions"><button type="submit" class="btn primary nb-press">送出答案</button><button type="button" class="btn small nb-press" data-quiz-reset hidden>重做這題</button></div>
      <div class="quiz-feedback" hidden></div>
    </form>`;
  }
  return `<div class="quiz" data-reveal="${esc(key)}">
    ${quizHead(item)}
    <div class="quiz-q blocks">${renderBlocks(item.q)}</div>
    <details class="reveal"><summary>我想好了，看答案</summary><div class="reveal-body blocks">${renderBlocks(item.answer)}</div></details>
  </div>`;
}

const QUIZ_REGISTRY = new Map();
const correctIndex = (item) => item.options.findIndex((o) => o.correct);

function showQuizResult(form, item, choice) {
  const answer = correctIndex(item);
  const isCorrect = choice === answer;
  form.classList.add('answered');
  const displayOrder = $$('.opt', form).map((opt) => Number(opt.dataset.oi));
  $$('.opt', form).forEach((opt) => {
    const oi = Number(opt.dataset.oi);
    const input = $('input', opt);
    input.checked = oi === choice;
    input.disabled = true;
    opt.classList.toggle('is-correct', oi === answer);
    opt.classList.toggle('is-wrong', oi === choice && !isCorrect);
    $('.mark', opt).textContent = oi === answer ? '✓ 正確' : (oi === choice ? '✗ 你的選擇' : '');
  });
  // 選中的解析放最上面，其他依畫面順序
  const explainOrder = [choice, ...displayOrder.filter((oi) => oi !== choice)];
  const items = explainOrder.map((oi) => {
    const o = item.options[oi];
    const tag = oi === answer
      ? '<span class="label" style="--chip:var(--success)">✓ 正確答案</span>'
      : '<span class="label" style="--chip:var(--danger)">✗ 錯誤選項</span>';
    const picked = oi === choice ? '<span class="label" style="--chip:var(--highlight)">你選的</span>' : '';
    return `<li class="${oi === choice ? 'is-picked' : ''}">${tag}${picked}<span class="opt-text">${md(o.text)}</span>${md(o.why || '')}</li>`;
  }).join('');
  const fb = $('.quiz-feedback', form);
  fb.innerHTML = `<p class="verdict">${isCorrect ? '✓ 答對了' : '✗ 答錯了，正確答案已標示'}</p><ol class="explain-list">${items}</ol>`;
  fb.hidden = false;
  $('[type="submit"]', form).hidden = true;
  $('[data-quiz-reset]', form).hidden = false;
  return isCorrect;
}

function resetQuiz(form) {
  form.classList.remove('answered');
  $$('.opt', form).forEach((opt) => {
    const input = $('input', opt);
    input.checked = false; input.disabled = false;
    opt.classList.remove('is-correct', 'is-wrong');
    $('.mark', opt).textContent = '';
  });
  $('.quiz-feedback', form).hidden = true;
  $('[type="submit"]', form).hidden = false;
  $('[data-quiz-reset]', form).hidden = true;
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form.quiz');
  if (!form) return;
  e.preventDefault();
  const key = form.dataset.quiz;
  const item = QUIZ_REGISTRY.get(key);
  const picked = $('input:checked', form);
  const fb = $('.quiz-feedback', form);
  if (!item) { console.error('找不到測驗題目：', key); return; }
  if (!picked) {
    fb.innerHTML = '<p class="verdict">先選一個答案再送出。</p>';
    fb.hidden = false;
    $('input', form).focus();
    return;
  }
  const choice = Number(picked.value);
  const isCorrect = showQuizResult(form, item, choice);
  Store.update((s) => { s.quiz[key] = { choice, correct: isCorrect }; });
  announce(isCorrect ? '答對了' : '答錯了，正確答案已標示');
  fb.setAttribute('tabindex', '-1');
  fb.focus({ preventScroll: false });
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-quiz-reset]');
  if (!btn) return;
  const form = btn.closest('form.quiz');
  resetQuiz(form);
  Store.update((s) => { delete s.quiz[form.dataset.quiz]; });
  $('input', form).focus();
});
document.addEventListener('toggle', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-reveal]');
  if (wrap && e.target.open) Store.update((s) => { s.quiz[wrap.dataset.reveal] = { viewed: true }; });
}, true);

Hydrators.push((root) => {
  $$('form.quiz', root).forEach((form) => {
    const saved = Store.get().quiz[form.dataset.quiz];
    const item = QUIZ_REGISTRY.get(form.dataset.quiz);
    if (saved && item && typeof saved.choice === 'number') showQuizResult(form, item, saved.choice);
  });
});

/* ---------- 複製 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    console.warn('Clipboard API 失敗，改用備援方式：', err);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { console.warn('execCommand 複製失敗：', err); ok = false; }
  ta.remove();
  return ok;
}
const COPY_RESET_MS = 1500;
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = COPY_TEXT.get(btn.dataset.copy) ?? (btn.dataset.copyText || '');
  const ok = await copyText(text);
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = ok ? '已複製 ✓' : '請按 Ctrl/Cmd + C';
  btn.classList.toggle('copied', ok);
  if (!ok) {
    const pre = btn.closest('.code, .compare-side');
    const target = pre && $('pre', pre);
    if (target) window.getSelection().selectAllChildren(target);
  }
  announce(ok ? '已複製到剪貼簿' : '複製失敗，已選取文字，請按 Ctrl 或 Cmd 加 C');
  window.clearTimeout(Number(btn.dataset.timer));
  btn.dataset.timer = String(window.setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, COPY_RESET_MS));
});

/* ---------- 語法高亮 ---------- */
function highlightIn(root) {
  if (!window.hljs) return;
  $$('pre code[class*="language-"]', root).forEach((el) => {
    if (el.dataset.highlighted) return;
    try { window.hljs.highlightElement(el); } catch (err) { console.warn('語法高亮失敗：', err); }
  });
}
Hydrators.push(highlightIn);
window.addEventListener('load', () => highlightIn(document));

/* ---------- 術語 popup（WCAG 1.4.13：可 hover、可關閉、持續） ---------- */
const TermPop = (() => {
  const SHOW_DELAY_MS = 150;
  const HIDE_GRACE_MS = 100;
  const GAP = 10;
  const EDGE = 16;
  const el = document.createElement('div');
  el.className = 'term-pop';
  el.id = 'term-pop';
  el.dataset.open = 'false';
  let anchor = null;
  let pinned = false;
  let showTimer = 0;
  let hideTimer = 0;

  function content(key, term) {
    const current = window.App.currentLessonId();
    const link = term.lesson && term.lesson !== current
      ? `<a class="tt-link" href="#/l/${esc(term.lesson)}">在 ${esc(term.lesson)} 學到 →</a>` : '';
    return { html: `<span class="tt-term">${esc(key)}</span>${term.en ? `<span class="tt-en">${esc(term.en)}</span>` : ''}<span class="tt-def">${md(term.def)}</span>${term.example ? `<span class="tt-ex"><strong>例子：</strong>${md(term.example)}</span>` : ''}${link}`, hasLink: !!link };
  }
  function show(btn, pin = false) {
    window.clearTimeout(hideTimer);
    const key = btn.dataset.term.replace(/&amp;/g, '&');
    const term = GLOSSARY[key];
    if (!term) return;
    if (anchor && anchor !== btn) release(anchor);
    anchor = btn;
    pinned = pin;
    const { html, hasLink } = content(key, term);
    el.innerHTML = html;
    // 有連結時是非模態 popover，要能 Tab 進去；沒有連結時是 tooltip
    if (hasLink) { el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${key} 的說明`); btn.removeAttribute('aria-describedby'); }
    else { el.setAttribute('role', 'tooltip'); el.removeAttribute('aria-label'); btn.setAttribute('aria-describedby', el.id); }
    if (el.previousElementSibling !== btn) btn.after(el);
    btn.setAttribute('aria-expanded', 'true');
    position(btn);
    el.dataset.open = 'true';
  }
  function release(btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.removeAttribute('aria-describedby');
  }
  function hide() {
    window.clearTimeout(showTimer);
    if (!anchor) return;
    release(anchor);
    anchor = null; pinned = false;
    el.dataset.open = 'false';
  }
  function scheduleHide() {
    window.clearTimeout(showTimer);
    if (pinned) return;
    window.clearTimeout(hideTimer);
    hideTimer = window.setTimeout(hide, HIDE_GRACE_MS);
  }
  function position(btn) {
    const r = btn.getClientRects()[0] || btn.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const left = Math.max(EDGE, Math.min(Math.max(EDGE, r.left), window.innerWidth - w - EDGE));
    let top = r.bottom + GAP;
    if (top + h > window.innerHeight - EDGE) top = r.top - h - GAP;
    top = Math.max(EDGE, top);
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    // popup 插在術語旁邊（讓 Tab 能進到裡面的連結）；祖先若有 transform（例如換課動畫），
    // fixed 會改以那個祖先為基準，所以量一次實際位置，把差距補回來
    const actual = el.getBoundingClientRect();
    if (Math.abs(actual.left - left) > 1 || Math.abs(actual.top - top) > 1) {
      el.style.left = `${left * 2 - actual.left}px`;
      el.style.top = `${top * 2 - actual.top}px`;
    }
  }

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (!b || pinned) return;
    window.clearTimeout(hideTimer);
    window.clearTimeout(showTimer);
    showTimer = window.setTimeout(() => show(b), anchor ? 0 : SHOW_DELAY_MS);
  });
  document.addEventListener('mouseout', (e) => {
    const from = e.target.closest('.term, .term-pop');
    if (!from) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.term, .term-pop');
    if (to === anchor || to === el) return;
    scheduleHide();
  });
  document.addEventListener('focusin', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (b) show(b, pinned && anchor === b);
    else if (anchor && !pinned) hide();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.term-pop')) return;
    const b = e.target.closest('.term');
    if (b) { if (anchor === b && pinned) hide(); else show(b, true); return; }
    if (anchor) hide();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && anchor) { const a = anchor; hide(); a.focus(); }
  });
  window.addEventListener('scroll', () => { if (anchor) position(anchor); }, { passive: true });
  window.addEventListener('resize', () => { if (anchor) position(anchor); });
  window.addEventListener('hashchange', hide);
  return { show, hide };
})();

/* ---------- 搜尋 ---------- */
(() => {
  $('#search-slot').outerHTML = `
    <div class="search" role="search">
      <label for="site-search" class="visually-hidden">搜尋課程標題與術語</label>
      <svg class="ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="2.5"/></svg>
      <input id="site-search" type="search" placeholder="搜尋" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <kbd class="hint" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" data-open="false"></div>
    </div>`;
  const input = $('#site-search');
  const box = $('#search-results');
  const MAX_RESULTS = 12;
  const SUB_MAX = 70;
  let results = [];
  let active = -1;

  const norm = (s) => String(s || '').toLowerCase();
  function buildIndex() {
    const items = LESSONS.map((l) => ({
      kind: '課程', title: `${l.id} ${l.plain}`, sub: plainTitle(COURSES[l.moduleId].title),
      hay: norm(`${l.id} ${l.plain} ${plainTitle(COURSES[l.moduleId].title)}`), href: `#/l/${l.id}`,
    }));
    Object.entries(GLOSSARY).forEach(([key, t]) => items.push({
      kind: '術語', title: `${key}${t.en ? `（${t.en}）` : ''}`, sub: t.def.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => l || k).replace(/[`*=]/g, ''),
      hay: norm(`${key} ${t.en} ${t.def}`), href: t.lesson ? `#/l/${t.lesson}` : null,
    }));
    return items;
  }
  let INDEX = null;

  function run() {
    INDEX = INDEX || buildIndex();
    const q = norm(input.value.trim());
    if (!q) { close(); return; }
    const words = q.split(/\s+/);
    results = INDEX.filter((it) => words.every((w) => it.hay.includes(w)))
      .sort((a, b) => Number(!norm(a.title).includes(words[0])) - Number(!norm(b.title).includes(words[0])))
      .slice(0, MAX_RESULTS);
    active = results.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.innerHTML = results.length
      ? results.map((r, i) => `<div role="option" id="sr-${i}" aria-selected="${i === active}" data-i="${i}">
          <span class="label" style="--chip:${r.kind === '課程' ? 'var(--info)' : 'var(--accent)'};font-size:.7rem;padding:0 4px">${r.kind}</span>
          ${esc(r.title)}<small>${esc(r.sub.length > SUB_MAX ? `${r.sub.slice(0, SUB_MAX)}…` : r.sub)}</small></div>`).join('')
      : '<div class="empty">找不到符合的課程或術語。</div>';
    box.dataset.open = 'true';
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`);
    else input.removeAttribute('aria-activedescendant');
    const act = $(`#sr-${active}`, box);
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function close() {
    box.dataset.open = 'false';
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function go(i) {
    const r = results[i];
    if (!r) return;
    if (r.href) {
      window.location.hash = r.href.slice(1);
      input.value = '';
      close();
    } else {
      announce(`${r.title}：${r.sub}`);
    }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', () => { if (input.value.trim()) run(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; draw(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (box.dataset.open === 'true') close(); else input.blur(); }
  });
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => { const opt = e.target.closest('[role="option"]'); if (opt) go(Number(opt.dataset.i)); });
  input.addEventListener('blur', () => window.setTimeout(close, 100));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTyping(document.activeElement) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
})();

/* ---------- levers：想做的程度＝做得到 × 重要或有趣 ÷（衝動 × 距離） ---------- */
// props: { start?: { e, v, i, d } }；依 Steel（2007）的時間動機理論，只做相對比較，不是精確分數
const LEVERS = [
  { key: 'e', label: '做得到的感覺', low: '完全沒把握', high: '很有把握', tip: '把第一步縮小，直到「這個我做得到」（1-1）。', lesson: '1-1' },
  { key: 'v', label: '重要或有趣', low: '無聊又無感', high: '很重要或很有趣', tip: '讓它現在就有回饋：做完立刻打勾、配一首喜歡的歌、跟人約好（1-4）。', lesson: '1-4' },
  { key: 'i', label: '分心的拉力', low: '環境很安靜', high: '手機就在手邊', tip: '把分心的東西移出視線，把要做的東西擺在眼前（1-3）。', lesson: '1-3' },
  { key: 'd', label: '離截止日多遠', low: '今天就要', high: '一個月以後', tip: '把截止日拉近：給自己一個今天的小截止點（2-2）。', lesson: '2-2' },
];
const LEVER_MIN = 1;
const LEVER_MAX = 10;
const LEVER_STEP = 2;
// e、v 越高越想做；i、d 越高越不想做
function leverScore({ e, v, i, d }) { return (e * v) / (i * d); }
const SCORE_LOG_MIN = -2;
const SCORE_LOG_RANGE = 4;
function leverPercent(values) {
  const pct = ((Math.log10(leverScore(values)) - SCORE_LOG_MIN) / SCORE_LOG_RANGE) * 100;
  return Math.max(0, Math.min(100, Math.round(pct)));
}
function bestLever(values) {
  const tries = LEVERS.map((lv) => {
    const sign = lv.key === 'e' || lv.key === 'v' ? 1 : -1;
    const next = { ...values, [lv.key]: Math.max(LEVER_MIN, Math.min(LEVER_MAX, values[lv.key] + sign * LEVER_STEP)) };
    return { lv, gain: leverScore(next) / leverScore(values) };
  });
  return tries.sort((a, b) => b.gain - a.gain)[0].lv;
}
Widgets.levers = {
  render(props, id) {
    const start = props.start || { e: 3, v: 4, i: 7, d: 8 };
    return `<div class="jw lv">
      <div class="jw-head"><span class="label" style="--chip:var(--m0)">拉拉看</span><span class="grow">想一件你一直拖著的事，照實際感覺調四個拉桿</span></div>
      <div class="lv-sliders">${LEVERS.map((lv) => `<label class="lv-row" for="${id}-${lv.key}">
        <span class="lv-name">${esc(lv.label)}</span>
        <input type="range" id="${id}-${lv.key}" min="${LEVER_MIN}" max="${LEVER_MAX}" step="1" value="${start[lv.key]}" data-lv="${lv.key}">
        <span class="lv-ends"><span>${esc(lv.low)}</span><span>${esc(lv.high)}</span></span>
      </label>`).join('')}</div>
      <div class="lv-meter" role="img" aria-label="想做的程度"><span class="lv-fill"></span></div>
      <p class="lv-out" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el, props) {
    const values = { ...(props.start || { e: 3, v: 4, i: 7, d: 8 }) };
    const fill = $('.lv-fill', el);
    const meter = $('.lv-meter', el);
    function draw() {
      const pct = leverPercent(values);
      fill.style.transform = `scaleX(${pct / 100})`;
      meter.setAttribute('aria-label', `想做的程度 ${pct}%`);
      const lv = bestLever(values);
      $('.lv-out', el).innerHTML = `想做的程度：<strong>${pct}%</strong>。現在最有效的槓桿是「${esc(lv.label)}」：${md(lv.tip)}`;
    }
    el.addEventListener('input', (e) => {
      const k = e.target.dataset.lv;
      if (!k) return;
      values[k] = Number(e.target.value);
      draw();
    });
    draw();
  },
};

/* ---------- shrinker：把第一步縮到 2 分鐘內做得到 ---------- */
const SHRINK_PROMPTS = [
  '如果只有 2 分鐘，你會先做哪一小塊？',
  '開始之前，第一個要打開的東西是什麼？（檔案、網頁、App、抽屜）',
  '把它寫成「動詞＋看得到的東西」，例如「打開報告檔，寫下標題」。',
  '再小一點：這一步裡面，最前面的那個動作是什麼？',
];
Widgets.shrinker = {
  render(props, id) {
    return `<div class="jw sh">
      <div class="jw-head"><span class="label" style="--chip:var(--m1)">縮小</span><span class="grow">把一件事縮到「現在 2 分鐘內就能開始」</span></div>

      <input class="fb-input" id="${id}-in" autocomplete="off" placeholder="${esc(props.placeholder || '例如：寫季度報告')}">
      <ol class="sh-ladder"></ol>
      <p class="jw-note sh-warn" aria-live="polite"></p>
      <div class="jw-row">
        <button type="button" class="btn small nb-press" data-sh="smaller">還是太大，再縮小</button>
        <button type="button" class="btn small primary nb-press" data-sh="done">這個我現在做得到</button>
        <button type="button" class="btn small nb-press" data-sh="reset">重來</button>
      </div>
      <p class="jw-note sh-out" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el) {
    const input = $('input', el);
    const ladder = $('.sh-ladder', el);
    const steps = [];
    function current() { return input.value.trim(); }
    function warn(text) {
      const vague = findVague(text);
      $('.sh-warn', el).textContent = vague.length ? `「${vague.join('、')}」有點模糊，改成看得到的動作會更容易開始。` : '';
    }
    function nextPrompt() {
      const q = SHRINK_PROMPTS[Math.min(steps.length - 1, SHRINK_PROMPTS.length - 1)];
      $('.sh-q', el).textContent = q;
      input.value = '';
      input.focus();
    }
    el.addEventListener('input', () => warn(current()));
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sh]');
      if (!b) return;
      const act = b.dataset.sh;
      if (act === 'reset') { steps.length = 0; ladder.innerHTML = ''; $('.sh-q', el).textContent = '一直拖著的那件事是：'; $('.sh-out', el).textContent = ''; input.value = ''; return; }
      const text = current();
      if (!text) { $('.sh-warn', el).textContent = '先寫下一點東西，再按按鈕。'; return; }
      steps.push(text);
      ladder.innerHTML = steps.map((s) => `<li>${esc(s)}</li>`).join('');
      if (act === 'smaller') { nextPrompt(); return; }
      saveToSystem('steps', { task: steps[0], step: text });
      $('.sh-out', el).innerHTML = `<strong>你的第一步：</strong>${esc(text)}。現在就做，計時 2 分鐘；做完可以停，也可以接著做。`;
    });
  },
};

/* ---------- ifthen：如果…就…產生器 ---------- */
// props: { ifHint?, thenHint? }
Widgets.ifthen = {
  render(props, id) {
    return `<div class="jw it">
      <div class="jw-head"><span class="label" style="--chip:var(--m1)">寫一條</span><span class="grow">讓情境替你按下開始</span></div>
      <label for="${id}-if">如果（什麼時候、在哪裡、做完什麼之後）</label>

      <ul class="it-checks" aria-live="polite"></ul>

    </div>`;
  },
  hydrate(el) {
    const [ifIn, thenIn] = $$('input', el);
    function checks() {
      const cond = ifIn.value.trim();
      const act = thenIn.value.trim();
      const vague = findVague(act);
      return [
        [cond && CUE_PATTERN.test(cond), '「如果」有具體的時間、地點或前一個動作'],
        [act.length > 0 && vague.length === 0, vague.length ? `「我就」裡的「${vague.join('、')}」太模糊` : '「我就」是一個看得到的動作'],
        [act.length > 0 && act.length <= 40, '「我就」短到一眼看得完（40 字內）'],
      ];
    }
    function draw() {
      $('.it-checks', el).innerHTML = checks().map(([ok, text]) => `<li class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${esc(text)}</li>`).join('');
      const cond = ifIn.value.trim();
      const act = thenIn.value.trim();

    }

    });

/* ---------- timebox：看得見的倒數（時間真的在流逝，所以用動畫） ---------- */
const TIMEBOX_OPTIONS = [5, 10, 25];
const MS_PER_MINUTE = 60000;
const MS_PER_SECOND = 1000;
Widgets.timebox = {
  render() {
    return `<div class="jw tb">
      <div class="jw-head"><span class="label" style="--chip:var(--m2)">倒數</span><span class="grow">選一個長度，看著時間變少</span></div>
      <div class="jw-row">${TIMEBOX_OPTIONS.map((m) => `<button type="button" class="btn small nb-press" data-tb-start="${m}">${m} 分鐘</button>`).join('')}
        <button type="button" class="btn small nb-press" data-tb-pause disabled>暫停</button></div>
      <div class="tb-track"><span class="tb-fill"></span></div>
      <p class="tb-time" aria-live="off">--:--</p>
      <p class="jw-note tb-status" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el) {
    const fill = $('.tb-fill', el);
    const time = $('.tb-time', el);
    const pauseBtn = $('[data-tb-pause]', el);
    let total = 0; let left = 0; let last = 0; let timer = 0; let running = false;
    const fmt = (ms) => { const sec = Math.ceil(ms / MS_PER_SECOND); return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };
    function paint() {
      // reduced-motion：只在整分鐘更新長條，不做連續縮小
      const ratio = prefersReducedMotion() ? Math.ceil(left / MS_PER_MINUTE) * MS_PER_MINUTE / total : left / total;
      fill.style.transform = `scaleX(${Math.max(0, Math.min(1, ratio))})`;
      time.textContent = fmt(left);
    }
    function tick() {
      if (!document.body.contains(el)) { window.clearInterval(timer); return; }
      const now = performance.now();
      left -= now - last; last = now;
      if (left <= 0) { left = 0; stop(); $('.tb-status', el).textContent = '時間到。做到哪裡都算數：留一行麵包屑，再決定要不要再來一輪。'; }
      paint();
    }
    function stop() { running = false; window.clearInterval(timer); pauseBtn.textContent = '暫停'; pauseBtn.disabled = left <= 0; }
    function run() { running = true; last = performance.now(); timer = window.setInterval(tick, MS_PER_SECOND / 4); pauseBtn.textContent = '暫停'; pauseBtn.disabled = false; }
    el.addEventListener('click', (e) => {
      const s = e.target.closest('[data-tb-start]');
      if (s) { stop(); total = Number(s.dataset.tbStart) * MS_PER_MINUTE; left = total; $('.tb-status', el).textContent = `開始 ${s.dataset.tbStart} 分鐘。`; paint(); run(); return; }
      if (e.target.closest('[data-tb-pause]')) {
        if (running) { stop(); pauseBtn.textContent = '繼續'; pauseBtn.disabled = false; $('.tb-status', el).textContent = '已暫停。'; } else if (left > 0) { run(); $('.tb-status', el).textContent = '繼續。'; }
      }
    });
  },
};

/* ---------- estimator：估時校正倍數 ---------- */
const MIN_RECORDS_FOR_RATIO = 3;
function medianOf(nums) {
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}
Widgets.estimator = {
  render(props, id) {
    return `<div class="jw es">
      <div class="jw-head"><span class="label" style="--chip:var(--m2)">記錄</span><span class="grow">我以為要多久 vs. 實際多久</span></div>
      <div class="es-form">
        <label for="${id}-t">做了什麼</label><input class="fb-input" id="${id}-t" autocomplete="off" placeholder="例如：回覆客戶 email">
        <label for="${id}-g">預估（分鐘）</label><input class="fb-input" id="${id}-g" type="number" min="1" inputmode="numeric">
        <label for="${id}-a">實際（分鐘）</label><input class="fb-input" id="${id}-a" type="number" min="1" inputmode="numeric">
      </div>
      <div class="jw-row"><button type="button" class="btn small primary nb-press" data-es-add>加一筆</button></div>
      <p class="es-ratio" aria-live="polite"></p>
      <ol class="es-list"></ol>
    </div>`;
  },
  hydrate(el) {
    const [taskIn, guessIn, actualIn] = $$('input', el);
    function draw() {
      const rows = SystemStore.get().estimates;
      $('.es-list', el).innerHTML = rows.map((r) => `<li>${esc(r.task)}：預估 ${r.guess} 分、實際 ${r.actual} 分（×${(r.actual / r.guess).toFixed(1)}） <button type="button" class="btn small nb-press" data-es-del="${esc(r.id)}" aria-label="刪除「${esc(r.task)}」">刪除</button></li>`).join('');
      const ratio = rows.length >= MIN_RECORDS_FOR_RATIO ? medianOf(rows.map((r) => r.actual / r.guess)) : null;
      $('.es-ratio', el).innerHTML = ratio
        ? `你的校正倍數（${rows.length} 筆的中位數）：<strong>×${ratio.toFixed(1)}</strong>。下次預估 30 分鐘的事，排 ${Math.round(30 * ratio)} 分鐘。`
        : `再記 ${MIN_RECORDS_FOR_RATIO - rows.length} 筆，就能算出你的校正倍數。`;

/* ---------- 圖片放大：手機上圖裡的字會縮到 8px 左右，點「放大看」用原尺寸檢視 ---------- */
// 放大後最小字級至少 12.5px（content-rules：375px 時圖中文字要 ≥ 12px）
const FIG_MIN_TEXT_PX = 12.5;
const FigZoom = (() => {
  let dialog = null;
  let opener = null;
  function ensureDialog() {
    if (dialog) return dialog;
    dialog = document.createElement('dialog');
    dialog.className = 'fig-dialog';
    dialog.setAttribute('aria-label', '放大檢視圖解');
    dialog.innerHTML = '<div class="fig-dialog-bar"><span class="fig-dialog-hint">可以左右、上下捲動</span><button type="button" class="btn small nb-press" data-fig-close>關閉</button></div><div class="fig-dialog-body"><div class="figure fig-dialog-figure"></div></div>';
    dialog.addEventListener('click', (e) => {
      if (e.target.closest('[data-fig-close]') || e.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', () => {
      $('.fig-dialog-figure', dialog).textContent = '';
      if (opener) opener.focus();
    });
    document.body.appendChild(dialog);
    return dialog;
  }
  function open(button) {
    const svg = $('svg', button.closest('.figure'));
    if (!svg) return;
    const box = ensureDialog();
    const clone = svg.cloneNode(true);
    const fontSizes = [...clone.querySelectorAll('text')].map((t) => parseFloat(t.getAttribute('font-size'))).filter(Boolean);
    const minFont = fontSizes.length ? Math.min(...fontSizes) : 16;
    const scale = Math.max(1, FIG_MIN_TEXT_PX / minFont);
    clone.style.width = `${Math.ceil(svg.viewBox.baseVal.width * scale)}px`;
    clone.style.maxWidth = 'none';
    $('.fig-dialog-figure', box).appendChild(clone);
    opener = button;
    box.showModal();
    $('[data-fig-close]', box).focus();
  }
  document.addEventListener('click', (e) => {
    const button = e.target.closest('[data-fig-zoom]');
    if (button) open(button);
  });
  return { open };
})();
/* ---------- 單元各段 ---------- */
Sections.review = (c, lesson) => `<p style="font-size:var(--fs-small);color:var(--ink-muted)">先回想前面學過的內容，再往下讀。</p>${quizList(c.review, `${lesson.id}:review`)}`;
Sections.analogy = (c) => `<div class="pair">
  <div class="callout analogy drop-in" style="--i:0"><span class="label">比喻</span><div class="body blocks">${renderBlocks(c.analogy.text)}</div></div>
  <div class="callout limit drop-in" style="--i:1"><span class="label">這個比喻的限制</span><div class="body blocks">${renderBlocks(c.analogy.limit)}</div></div>
</div>`;
Sections.model = (c) => `<div class="blocks">${c.model.svg ? renderBlock({ type: 'svg', svg: c.model.svg, caption: c.model.caption }) : ''}${renderBlocks(c.model.blocks)}</div>`;
Sections.define = (c) => `<dl class="defs">${c.define.map((d) => `<div><dt>${esc(d.term)}<span class="en">${esc(d.en || '')}</span></dt><dd>${md(d.def)}${d.example ? `<br><small><strong>例子：</strong>${md(d.example)}</small>` : ''}</dd></div>`).join('')}</dl>`;
Sections.examples = (c) => {
  const ex = c.examples;
  return `<div class="blocks">
    ${(ex.compare || []).map((cmp) => compareBlock(cmp)).join('')}
    ${renderBlocks(ex.blocks)}
    ${ex.tryit ? tryitBlock(ex.tryit) : ''}
  </div>`;
};
Sections.mistakes = (c) => `<ol class="mistakes">${c.mistakes.map((m) => `<li>
  <div class="row"><span class="k wrong">錯誤做法</span><div>${md(m.wrong)}</div></div>
  <div class="row"><span class="k why">為什麼錯</span><div>${md(m.why)}</div></div>
  <div class="row"><span class="k right">正確做法</span><div>${md(m.right)}</div></div>
</li>`).join('')}</ol>`;
Sections.practice = (c, lesson) => quizList(c.practice, `${lesson.id}:practice`);
// 今天就用：{ minutes, task: [段落], blocks: [互動元件等] }；練習量和改善程度相關（solanto-2010）
Sections.today = (c) => `<div class="callout today"><span class="label" style="--chip:var(--accent)">今天就用・約 ${c.today.minutes || 3} 分鐘</span><div class="body blocks">${renderBlocks(c.today.task)}</div></div>
  ${c.today.blocks ? `<div class="blocks" style="margin-top:var(--sp-4)">${renderBlocks(c.today.blocks)}</div>` : ''}`;
Sections.keypoints =(c) => `<div class="callout keypoints"><span class="label">三個重點</span><div class="body"><ol style="margin:0">${c.keypoints.map((k) => `<li>${md(k)}</li>`).join('')}</ol></div></div>`;
Sections.sources = (c) => `<aside class="sources" aria-label="本課來源"><span class="label" style="--chip:var(--neutral)">來源（查證於 ${SITE.verifiedOn}）</span>
  <ol>${c.sources.map((k) => {
    const s = SOURCES[k];
    if (!s) { console.error('找不到來源：', k); return ''; }
    return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`;
  }).join('')}</ol></aside>`;
Sections.reference = (c, lesson) => `<div class="blocks" style="--chip:var(--m${lesson.moduleId})">${renderBlocks(c.blocks)}</div>`;

/* ---------- 元件樣式表 ---------- */
Views.styleguide = () => {
  const sampleQuiz = { type: 'mc', level: '應用', q: '下面哪一個是「下一步」？', options: [
    { text: '處理報告', why: '「處理」看不出第一個動作是什麼。' },
    { text: '打開報告檔，寫下標題', correct: true, why: '動詞開頭、看得到，坐下就能做。' },
  ] };
  return `<div class="content">
    <header class="lesson-head" style="--chip:var(--neutral)"><span class="lid-big">SG</span><h1>元件樣式表</h1></header>
    <p>這頁列出全站共用元件與它們的狀態。改樣式後先看這頁，深淺色各看一次。</p>

    <section class="sg-block"><h2>按鈕：預設／hover／按下／焦點／停用</h2>
      <div class="sg-row">
        <button class="btn primary nb-press" type="button">預設</button>
        <button class="btn primary nb-press force-hover" type="button">hover</button>
        <button class="btn primary nb-press force-active" type="button">按下</button>
        <button class="btn primary nb-press force-focus" type="button">焦點</button>
        <button class="btn primary nb-press" type="button" disabled>已停用</button>
      </div>
      <div class="sg-row" style="margin-top:var(--sp-4)">
        <button class="btn nb-press" type="button">次要</button>
        <button class="btn success nb-press" type="button">成功</button>
        <button class="btn danger nb-press" type="button">危險</button>
        <button class="btn small nb-press" type="button">小按鈕</button>
        <button class="btn big primary nb-press" type="button">大按鈕</button>
      </div>
    </section>

    <section class="sg-block"><h2>徽章與狀態</h2>
      <div class="sg-row">
        <span class="label">預設</span><span class="label tilt" style="--chip:var(--accent)">傾斜</span>
        ${COURSES.map((m) => `<span class="label" style="--chip:var(--m${m.id})">M${m.id}</span>`).join('')}
      </div>
      <div class="sg-row" style="margin-top:var(--sp-4)">
        <span class="status" data-state="new" role="img" aria-label="未讀"></span> 未讀
        <span class="status" data-state="visited" role="img" aria-label="讀到一半"></span> 讀到一半
        <span class="status" data-state="done" role="img" aria-label="已完成"></span> 已完成
        <span class="stamp">已完成 ✓</span>
      </div>
    </section>

    <section class="sg-block"><h2>進度條</h2>
      <div class="progress" style="--p:.35" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" aria-label="範例進度"><span></span></div>
    </section>

    <section class="sg-block"><h2>卡片與提示框</h2>
      <div class="blocks">
        <div class="card"><h3 class="card-title">卡片</h3><p style="margin:0">4px 框、6px 硬陰影。</p></div>
        ${['analogy', 'limit', 'define', 'mistake', 'keypoints', 'legacy', 'tip', 'danger'].map((v) => renderBlock({ type: 'callout', variant: v, title: v, body: ['提示框內文，可以放 `程式碼`、==螢光標記== 和 [連結](https://nice.org.uk/guidance/ng87/documents/evidence-review-5)。'] })).join('')}
        ${renderBlock({ type: 'unverified', body: ['這是未確認的項目。'] })}
        ${renderBlock({ type: 'timely', body: ['這是會過期的資訊。'] })}
        ${renderBlock({ type: 'legacy', rows: [['「明天再說」', '「明天 9 點一坐下就打開報告檔」'], ['「我要努力」', '「如果下午 3 點，我就先寫 5 分鐘」']] })}
      </div>
    </section>

    <section class="sg-block"><h2>術語 popup</h2>
      <p>${md('把滑鼠移到 [[執行功能]] 或 [[執行意圖]] 上，或按 Tab 聚焦；滑鼠可以移進 popup，點擊會固定，按 {kbd:Esc} 關閉。')}</p>
    </section>

    <section class="sg-block"><h2>對照器</h2>
      ${compareBlock({ title: '同一件事的兩種寫法', bad: '{{1:處理}}報告', good: '{{1:打開}}報告檔，寫下標題', why: ['動詞要看得到，坐下就能做'] })}
    </section>

    <section class="sg-block"><h2>分頁</h2>
      ${tabsBlock({ label: '卡在哪一段', tabs: [{ label: '想不清楚', blocks: ['先找下一步（3-1）'] }, { label: '開不了頭', blocks: ['把第一步縮小（1-1）'] }, { label: '中途斷掉', blocks: ['留麵包屑（5-2）'] }] })}
    </section>

    <section class="sg-block"><h2>摺疊與測驗</h2>
      <div class="quiz-list">
        ${quizItem(sampleQuiz, 'styleguide:q:0')}
        ${quizItem({ type: 'reveal', level: '遷移', q: '先想一想：為什麼答案要先藏起來？', answer: ['先嘗試提取記憶，再看答案，記得比較牢（提取練習）。'] }, 'styleguide:r:0')}
      </div>
    </section>

    <section class="sg-block"><h2>表格</h2>
      ${tableBlock({ head: ['槓桿', '往哪調', '對應的課'], rows: [['做得到的感覺', '把第一步縮小', '1-1'], ['重要或有趣', '讓現在就有回饋', '1-4'], ['分心的拉力', '把分心的東西移走', '1-3']] })}
    </section>

    <section class="sg-block"><h2>檢查清單</h2>
      ${renderWidget({ name: 'checklist', props: { key: 'sg', items: ['第一項', '第二項', '第三項'] } })}
    </section>

    <section class="sg-block"><h2>stuckcheck</h2>
      ${renderWidget({ name: 'stuckcheck', props: {} })}
    </section>
    <section class="sg-block"><h2>levers</h2>
      ${renderWidget({ name: 'levers', props: {} })}
    </section>
    <section class="sg-block"><h2>shrinker</h2>
      ${renderWidget({ name: 'shrinker', props: {} })}
    </section>
    <section class="sg-block"><h2>ifthen</h2>
      ${renderWidget({ name: 'ifthen', props: {} })}
    </section>
    <section class="sg-block"><h2>timebox</h2>
      ${renderWidget({ name: 'timebox', props: {} })}
    </section>
    <section class="sg-block"><h2>estimator</h2>
      ${renderWidget({ name: 'estimator', props: {} })}
    </section>
    <section class="sg-block"><h2>breakdown</h2>
      ${renderWidget({ name: 'breakdown', props: {} })}
    </section>
    <section class="sg-block"><h2>promptkit</h2>
      ${renderWidget({ name: 'promptkit', props: {} })}
    </section>
    <section class="sg-block"><h2>woop</h2>
      ${renderWidget({ name: 'woop', props: {} })}
    </section>
    <section class="sg-block"><h2>鍵盤提示</h2>
      <p><kbd>←</kbd> <kbd>→</kbd> 換課、<kbd>/</kbd> 搜尋、<kbd>Esc</kbd> 關閉</p>
    </section>
  </div>`;
};

window.App.renderBlocks = renderBlocks;
window.App.Widgets = Widgets;
window.App.renderWidget = renderWidget;
window.App.uid = uid;
window.App.COPY_TEXT = COPY_TEXT;
})();
</script>
</body>
</html>
