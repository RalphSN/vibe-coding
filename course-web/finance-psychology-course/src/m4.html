<script>
/* ==========================================================================
   模組 4：市場的情緒
   ========================================================================== */
defineTerms({
  '泡沫': { en: 'bubble', def: '價格因為一再上漲吸引更多買家而遠高於基本面能支持的水準，最後通常以大跌結束。', example: '1990 年台股本益比超過 100 倍。', lesson: '4-1' },
  '最大回落': { en: 'maximum drawdown', def: '從前一個高點到之後最低點的跌幅；衡量一段時間裡最痛的一次下跌。', example: '台股 1990 年從 12,682 點跌到 2,485 點，回落約 80%。', lesson: '4-1' },
});

defineLessons({
  '4-1': {
    goals: [
      '說出泡沫形成與破裂的循環',
      '算出不同跌幅需要多少漲幅、多少年才能回來',
      '知道大跌時最常見的錯誤與對策',
    ],
    analogy: {
      text: ['一場派對越來越熱鬧，大家都知道總有一天會結束，但沒有人想第一個離開；等到燈一亮，所有人同時擠向門口。[[泡沫]]就是這樣：價格上漲吸引新買家，新買家讓價格繼續上漲，直到再也找不到新的買家，大家同時想賣。', '台股在 1990 年 2 月漲到 12,682 點，當時許多股票的本益比超過 100 倍；之後不到一年跌到 2,485 點，[[最大回落]]約 80%。指數要再站回 12,682 點，花了大約 30 年（這是不含股利的價格指數；含股利的報酬指數回得比較早）。'],
      limit: ['派對結束的時間沒有人知道；泡沫也一樣，事後看很明顯，當下卻很難判斷，提早離場也可能錯過好幾年的上漲。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 280" role="img" aria-label="泡沫的五個階段：新故事出現、價格上漲、大眾湧入與狂熱、少數人開始賣出、恐慌與崩跌；情緒在狂熱時最樂觀，在崩跌底部最悲觀">
        <path d="M30 230 C 100 225, 150 200, 200 160 C 250 110, 280 40, 320 40 C 360 40, 380 120, 420 190 C 450 240, 490 240, 530 225" fill="none" style="stroke:var(--m3)" stroke-width="4"/>

    },
    define: [
      { term: '泡沫', en: 'bubble', def: '價格遠超基本面。', example: '本益比 100 倍。' },

          const need = 1 / (1 - v.dd / 100) - 1;
          const years = Math.log(1 / (1 - v.dd / 100)) / Math.log(1 + v.r / 100);
          return { rows: [
            { label: '需要的漲幅', value: `${(need * 100).toFixed(0)}%`, ratio: Math.min(1, need / 4) },

          ['低點', '約 2,485 點（1990 年下半年），回落約 80%'],
          ['當時的估值', '許多股票本益比超過 100 倍、股價淨值比 30 倍以上（媒體回顧）'],
          ['價格指數回到高點', '約 30 年後（2020 年）'],
        ], caption: '這個例子同時說明兩件事：單一市場、單一時間點全押的風險很大（第三部的分散）；價格指數不含股利，會低估長期持有者的實際報酬。' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="大跌時的三種反應：賣出，把帳面損失變成真實損失；停止投入，錯過低價；照計畫繼續投入並再平衡，在低點買到更多">
          ${[['全部賣出', '帳面損失變真實損失', 'm4'], ['停止投入', '錯過最便宜的時候', 'm1'], ['照計畫＋再平衡', '在低點買到更多', 'm2']].map(([a, b, c], i) => `<rect x="${15 + i * 182}" y="40" width="165" height="130" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${97 + i * 182}" y="94" text-anchor="middle" font-size="15" font-weight="900" class="on-color">${a}</text><text x="${97 + i * 182}" y="124" text-anchor="middle" font-size="11" class="on-color">${b}</text>`).join('')}
          <text x="280" y="204" text-anchor="middle" font-size="13">大跌時最大的風險，常常是自己的反應</text>
        </svg>`, caption: '第四部的再平衡規則在這裡發揮作用：股票跌多了比例下降，規則會要你買回來，正好是情緒最不想做的事。' },
        { type: 'heading', id: 'missing', text: '深入：錯過最好的幾天' },
        '大跌之後常常緊接著大漲：市場最好的幾個交易日，很多出現在空頭市場或剛反轉的時候。恐慌賣出、想「等穩定再進場」的人，往往同時錯過了最壞與最好的日子裡最好的那一半。許多基金公司的統計都顯示，長期裡只要錯過最好的 10 個交易日，總報酬就會明顯縮水（數字依市場與期間而不同）。這也是為什麼「留在市場裡」比「抓準進出時機」重要。',
        { type: 'heading', id: 'prepare', text: '深入：大跌之前就要準備的事' },
        { type: 'list', ordered: true, items: [
          '**緊急預備金**（第一部）：大跌時不必為了生活費賣股票。',
          '**股債比**（第四部）：選一個你在跌 40% 時也睡得著的比例。',
          '**再平衡規則**：寫下偏離幾個百分點就調整，大跌時照做。',
          '**寫給未來自己的信**：冷靜時寫下「大跌時我會怎麼做、為什麼」，大跌時打開來讀（5-2）。',
        ] },
      ],

      { wrong: '以為跌 50% 只要漲 50% 就回來。', why: '要漲 100% 才回得來。', right: '用跌幅計算需要的漲幅與時間。' },
    ],
    keypoints: [
      '泡沫：上漲吸引買家，直到沒有新買家。',
      '跌 50% 要漲 100%；跌得越深，回本越久。',
      '大跌時最大的風險是自己的反應；準備要在大跌之前做好。',
    ],
    sources: ['twse-1990', 'ubs-2026', 'myopic-1995'],
  },
});
