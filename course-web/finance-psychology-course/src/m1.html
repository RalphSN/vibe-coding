<script>
/* ==========================================================================
   模組 1：大腦的兩套系統
   ========================================================================== */
defineTerms({
  '系統一': { en: 'System 1', def: '快速、自動、憑直覺的思考方式；不費力，但容易受情緒與捷徑影響。', example: '看到股價大跌，立刻覺得「要賣」。', lesson: '1-1' },
  '系統二': { en: 'System 2', def: '緩慢、費力、需要專注的推理方式；能計算與檢查，但很容易累、很容易被系統一搶先。', example: '打開投資計畫，對照再平衡規則。', lesson: '1-1' },
  '捷思法': { en: 'heuristic', def: '大腦用來快速做判斷的經驗法則；大部分時候很好用，在特定情境下會產生系統性的偏誤。', example: '「最近常聽到的事比較可能發生」。', lesson: '1-1' },
  '近因偏誤': { en: 'recency bias', def: '把最近發生的事看得太重，以為最近的趨勢會一直持續。', example: '股市連漲三年，就以為會一直漲。', lesson: '1-1' },
});

defineLessons({
  '1-1': {
    goals: [
      '分辨系統一與系統二',
      '說出捷思法為什麼會變成偏誤',
      '畫出投資偏誤的地圖',
    ],
    analogy: {
      text: ['心理學家 Daniel Kahneman 用「快思」與「慢想」描述大腦的兩套系統。[[系統一]]像自動駕駛：開熟悉的路不用想，看到紅燈自動踩煞車；[[系統二]]像手動導航：要看地圖、要計算、很累，所以能不用就不用。', '大部分的生活，自動駕駛都很好用。但投資的環境很特別：回饋很慢、雜訊很多、情緒很強，正好是自動駕駛最容易出錯的地方。那些幫祖先在叢林裡活下來的[[捷思法]]（看到別人跑就跟著跑、損失比獲利更值得注意），放到股市裡，就變成追高殺低與恐慌賣出。'],
      limit: ['「兩套系統」是幫助理解的比喻，不是大腦裡真的有兩個獨立的部位；兩者是交織在一起運作的。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 270" role="img" aria-label="系統一與系統二的比較：系統一快速、自動、受情緒影響，在投資上常讓人追高殺低；系統二緩慢、費力、會計算，在投資上負責照計畫執行">
        <rect x="20" y="30" width="250" height="200" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/>
        <text x="145" y="64" text-anchor="middle" font-size="18" font-weight="900" class="on-color">系統一：快思</text>
        ${['快速、自動、不費力', '受情緒與印象影響', '投資上：看到大跌就想賣', '看到大漲就想追'].map((t, i) => `<text x="145" y="${102 + i * 30}" text-anchor="middle" font-size="13" class="on-color">${t}</text>`).join('')}
        <rect x="290" y="30" width="250" height="200" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/>
        <text x="415" y="64" text-anchor="middle" font-size="18" font-weight="900" class="on-color">系統二：慢想</text>
        ${['緩慢、費力、會計算', '容易累、常被搶先', '投資上：對照計畫與規則', '冷靜時寫下投資原則'].map((t, i) => `<text x="415" y="${102 + i * 30}" text-anchor="middle" font-size="13" class="on-color">${t}</text>`).join('')}
        <text x="280" y="258" text-anchor="middle" font-size="13">對策的核心：讓系統二在冷靜時把決定先做好</text>
      </svg>`,
      caption: '系統二會累、會被搶先；所以與其期待它在關鍵時刻勝出，不如讓它事先把規則寫好（模組 5）。',
    },
    define: [
      { term: '系統一', en: 'System 1', def: '快速、直覺的思考。', example: '看到大跌就想賣。' },
      { term: '系統二', en: 'System 2', def: '緩慢、費力的推理。', example: '對照規則。' },
      { term: '捷思法', en: 'heuristic', def: '快速判斷的經驗法則。', example: '跟著別人跑。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'map', text: '投資偏誤地圖' },
        { type: 'table', head: ['偏誤', '一句話', '常見行為', '這一卷'], rows: [
          ['損失趨避', '賠錢的痛大約是賺錢快樂的兩倍', '不敢投資、大跌時恐慌', '2-1'],
          ['處分效應', '賣掉賺錢的、抱著賠錢的', '「等回本再賣」', '2-2'],
          ['後悔與沉沒成本', '怕做錯、捨不得已經付出的', '不敢停損、不敢買', '2-3'],
          ['過度自信', '高估自己的判斷', '頻繁交易、集中押注', '3-1'],
          ['從眾與近因', '跟著大家、以為趨勢會持續', '追高殺低', '3-2'],
          ['錨定與確認偏誤', '被數字綁住、只看想看的', '「以前 100 元」、只看利多', '3-3'],
          ['心理帳戶', '把錢分抽屜看待', '獎金亂花、一邊借一邊存', '第一部 2-2'],
        ] },
        { type: 'widget', name: 'knobs', props: { title: '現在適合做投資決定嗎？（情緒溫度計，經驗法則）', sliders: [
          { id: 'move', label: '最近一個月市場漲跌幅（絕對值）', min: 0, max: 30, step: 1, value: 8, unit: '%' },
          { id: 'news', label: '最近看到的財經新聞與社群討論量（1 很少、5 很多）', min: 1, max: 5, step: 1, value: 4 },
          { id: 'checks', label: '這週打開投資帳戶的次數', min: 0, max: 50, step: 1, value: 12, unit: '次' },
          { id: 'sleep', label: '最近睡眠或心情受投資影響（0 沒有、3 很大）', min: 0, max: 3, step: 1, value: 1 },
        ], compute: (v) => {
          const score = Math.min(10, v.move / 3) + (v.news - 1) * 1.5 + Math.min(10, v.checks / 3) + v.sleep * 3;
          const level = score >= 18 ? '很高：今天不要做任何買賣決定' : score >= 10 ? '偏高：只照事先寫好的規則做' : '正常：可以照計畫檢查';
          return { rows: [
            { label: '情緒溫度（0–33）', value: score.toFixed(0), ratio: Math.min(1, score / 33) },
            { label: '建議', value: level, ratio: Math.min(1, score / 33) },
          ], note: '這不是科學量表，只是一個提醒：市場波動大、新聞多、看帳戶頻繁、睡不好，都是系統一主導的訊號。這時候最好的決定，通常是「不做新的決定」。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="投資環境為什麼特別容易出錯：回饋慢而且充滿雜訊、情緒強烈、每天都有新的資訊刺激；這三點讓系統一特別容易主導">
          ${[['回饋慢、雜訊多', '做對的事也可能短期虧錢', 'm1'], ['情緒強烈', '金額大、與安全感相關', 'm4'], ['刺激不斷', '新聞、推播、社群', 'm3']].map(([a, b, c], i) => `<rect x="${15 + i * 182}" y="40" width="165" height="130" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${97 + i * 182}" y="92" text-anchor="middle" font-size="15" font-weight="900" class="on-color">${a}</text><text x="${97 + i * 182}" y="124" text-anchor="middle" font-size="11" class="on-color">${b}</text>`).join('')}
        </svg>`, caption: '在下棋、開車這類回饋快速清楚的領域，經驗能讓直覺變準；投資的回饋太慢太雜，直覺很難被訓練準。' },
        { type: 'heading', id: 'recency', text: '深入：近因偏誤與「這次不一樣」' },
        '[[近因偏誤]]讓人把最近的經驗當成常態：經歷過幾年的多頭，覺得股市「本來就會漲」，提高股票比例；經歷過一次大跌，覺得股市「太危險」，從此不敢投資。第三部的長期資料提醒我們：上漲與大跌都是常態的一部分。每當你聽到「這次不一樣」，往往正是近因偏誤最強的時候。',
      ],
    },
    mistakes: [
      { wrong: '相信自己的直覺在投資上很準。', why: '投資的回饋慢且雜，直覺很難被訓練準。', right: '用規則與數據取代直覺。' },
      { wrong: '在情緒很強時做重大決定。', why: '系統一主導，容易追高殺低。', right: '情緒溫度高時，不做新的決定。' },
      { wrong: '以為知道偏誤就不會犯。', why: '偏誤是自動的。', right: '事先設計環境與規則。' },
    ],
    keypoints: [
      '系統一快而直覺，系統二慢而會算；投資環境讓系統一容易主導。',
      '偏誤是系統性地朝同一方向犯錯。',
      '情緒溫度高時，最好的決定是不做新的決定。',
    ],
    sources: ['kt-1979', 'thaler-1999'],
  },
});
</script>
