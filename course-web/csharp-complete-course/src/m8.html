<script>

defineTerms({
  'Task': { en: 'Task / Task<T>', def: '代表「一件進行中的工作」的物件：將來會完成，並可能帶回結果（Task<T>）。', example: '`Task<string> t = http.GetStringAsync(url);`' },
  'async': { en: 'async modifier', def: '標在方法上，表示方法裡可以用 await；編譯器會把它改寫成能暫停與繼續的狀態機。', example: '`async Task<int> LoadAsync()`' },
  'await': { en: 'await operator', def: '「等這個 Task 完成再繼續」，等待期間把執行緒還回去做別的事，不會卡住。', example: '`var html = await http.GetStringAsync(url);`' },
  'I/O 密集': { en: 'I/O-bound', def: '大部分時間在等外部回應（網路、磁碟、資料庫），CPU 閒著。async/await 最適合這類工作。', example: '呼叫 API、讀檔案。' },
  'CPU 密集': { en: 'CPU-bound', def: '大部分時間在計算，例如影像處理、壓縮。要加速得把工作分給多個核心（Task.Run、Parallel）。', example: '計算 1 億個質數。' },
  '同步阻塞': { en: 'blocking', def: '執行緒停在原地等待、什麼都不能做，例如 `.Result`、`.Wait()`、`Thread.Sleep`。', example: '`var s = task.Result;`' },
  'Task.WhenAll': { en: 'Task.WhenAll', def: '同時等待多個 Task，全部完成才繼續；總時間約等於最慢的那一個。', example: '`await Task.WhenAll(t1, t2, t3);`' },
  'Task.WhenAny': { en: 'Task.WhenAny', def: '等多個 Task 中「第一個」完成的。', example: '`var first = await Task.WhenAny(t1, t2);`' },
  'CancellationToken': { en: 'CancellationToken', def: '傳給非同步方法的「取消信號」；呼叫端要求取消時，方法可以盡早停下並拋 OperationCanceledException。', example: '`await http.GetAsync(url, token);`' },
  'CancellationTokenSource': { en: 'CancellationTokenSource', def: '產生 CancellationToken 並負責發出取消的物件；可以設定逾時自動取消。', example: '`using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(5));`' },
  'IAsyncEnumerable': { en: 'IAsyncEnumerable<T>', def: '非同步版的 IEnumerable：每一筆資料都可能要等，用 await foreach 一筆一筆處理。', example: '`await foreach (var row in ReadRowsAsync()) { … }`' },
  'yield return': { en: 'yield return', def: '在迭代器方法裡「交出一個元素就暫停」，下次要下一個時從這裡繼續。', example: '`yield return line;`' },
});

        { type: 'code', lang: 'csharp', title: 'fetch.cs', code: 'using var http = new HttpClient();\nstring html = await FetchTitleAsync(http, "https://dot.net");\nConsole.WriteLine(html);\n\nasync Task<string> FetchTitleAsync(HttpClient client, string url)\n{\n    string page = await client.GetStringAsync(url);\n    int start = page.IndexOf("<title>") + 7;\n    int end = page.IndexOf("</title>");\n    return page[start..end];\n}' },

        { type: 'heading', id: 'deep-statemachine', text: '深入：async 方法其實是狀態機' },

      { level: '深入思考', type: 'reveal', q: ['一個 Web API 在流量高時回應變很慢，CPU 使用率卻很低。查程式碼發現到處都是 `.Result`。為什麼會這樣？'], answer: [
