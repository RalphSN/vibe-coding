   模組 5：集合與 LINQ

defineTerms({
  'List': { en: 'List<T>', def: '可以增減長度的有序集合，內部用陣列實作，空間不夠時自動換一個更大的陣列。', example: '`var names = new List<string>(); names.Add("A");`' },

  '雜湊': { en: 'hash', def: '把資料算成一個數字，用來決定放在哪一格。Dictionary 與 HashSet 靠它做到快速查詢。', example: '`"abc".GetHashCode()`' },
  'IEnumerable': { en: 'IEnumerable<T>', def: '「可以一個一個走過」的介面。陣列、List、LINQ 查詢結果都實作它，foreach 就是靠它。', example: '`IEnumerable<int> nums = [1, 2, 3];`' },
  'LINQ': { en: 'Language Integrated Query', def: '一組以 IEnumerable 為對象的擴充方法（Where、Select、OrderBy…），讓你描述「要什麼資料」而不是寫迴圈。', example: '`scores.Where(s => s >= 60).Count()`' },
  'lambda': { en: 'lambda expression', def: '寫在行內的匿名函式：`參數 => 運算式`。LINQ 用它描述條件與轉換。', example: '`x => x * 2`' },
  '擴充方法': { en: 'extension method', def: '看起來像某型別自己的方法，其實定義在別的靜態類別裡。LINQ 全部都是擴充方法；C# 14 起可用 extension 區塊定義擴充成員。', example: '`numbers.Where(…)`' },
  '延遲執行': { en: 'deferred execution', def: 'LINQ 查詢在定義時不執行，等到被列舉（foreach、ToList、Count）時才真的跑，而且每次列舉都重跑一次。', example: '`var q = list.Where(…);` 這行還沒篩選。' },
  '具體化': { en: 'materialization', def: '用 ToList、ToArray、ToDictionary 讓查詢立刻執行，把結果存成集合。', example: '`var result = query.ToList();`' },
  'GroupBy': { en: 'GroupBy', def: '依某個鍵把元素分組，每組是一個 IGrouping，有 Key 與該組元素。', example: '`orders.GroupBy(o => o.Country)`' },
  'CountBy': { en: 'CountBy', def: '.NET 9 起：依鍵計數，直接得到「鍵 → 數量」，不用先 GroupBy。', example: '`words.CountBy(w => w)`' },
  'AggregateBy': { en: 'AggregateBy', def: '.NET 9 起：依鍵做累計（例如加總），不用先建立分組。', example: '`orders.AggregateBy(o => o.Country, 0m, (sum, o) => sum + o.Total)`' },
});
