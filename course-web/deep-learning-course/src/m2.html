<script>
/* ==========================================================================
   模組 2：前向傳播
   ========================================================================== */
defineTerms({
  '前向傳播': { en: 'forward pass', def: '輸入從第一層一路算到輸出與損失的過程；每一層都是矩陣乘法＋偏差＋激活。', example: 'x → h → ŷ → 損失。', lesson: '2-1' },
  '全連接層': { en: 'fully connected layer / linear layer', def: '每個輸入都連到每個輸出的層：輸出＝激活(x·W＋b)。PyTorch 叫 nn.Linear。', example: '2 個輸入、3 個輸出：W 是 2×3。', lesson: '2-1' },
  '批次': { en: 'batch', def: '一次一起算的一組樣本；把多筆輸入疊成矩陣，一次矩陣乘法就算完。', example: '64 筆一批。', lesson: '2-1' },
  '形狀': { en: 'shape', def: '矩陣或 tensor 每一維的大小，例如 (批次, 特徵)。寫程式最常見的錯就是形狀對不上。', example: '(64, 784)。', lesson: '2-1' },
  'FLOPs': { en: 'floating-point operations', def: '浮點運算次數；一次乘法加一次加法算 2 次。用來估算模型的計算量。', example: '一層全連接約 2 × B × 輸入 × 輸出。', lesson: '2-1' },
  '梯度檢查點': { en: 'gradient checkpointing', def: '只存部分層的中間值，反向時再重算缺的前向，用多一點計算換大量記憶體。', example: 'Chen 等 2016。', lesson: '2-2' },
  'cross-entropy': { en: 'cross-entropy loss', def: '分類用的損失：−log(給正確類別的機率)；二元時就是 log loss。', example: '正確類別機率 0.7 → 約 0.357。', lesson: '2-3' },
});


const SMALL_NET = { w: [[0.4, -0.5], [0.6, 0.2]], b: [0.1, 0.3], v: [1.5, -1], c: 0.2 };

defineLessons({
  '2-1': {
    goals: [
      '把一整層神經元寫成一次矩陣乘法',
      '算出每一層輸入、權重、輸出的形狀',
      '說出為什麼要一次算一批',
    ],
    analogy: {
      text: ['學校統計成績：每位學生有三科分數，每個獎項對三科有不同的加權。把「所有學生 × 三科」排成一張表、「三科 × 每個獎項的權重」排成另一張表，相乘一次就得到「每位學生在每個獎項的總分」。', '一個[[全連接層]]就是這件事：輸入（[[批次]] × 特徵）乘上權重（特徵 × 神經元），一次矩陣乘法算完整層、整批的加權加總，再加偏差、過激活。'],
      limit: ['成績單只算一次，網路每一層都要算一次；而且[[形狀]]對不上（例如特徵數不同）就完全不能乘，這是寫深度學習程式最常見的錯誤。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 230" role="img" aria-label="一層等於矩陣乘法：輸入 X 的形狀是批次乘以輸入特徵，乘上 W 的形狀輸入特徵乘以輸出神經元，得到批次乘以輸出神經元，再加上偏差 b">
        <rect x="20" y="50" width="90" height="120" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="65" y="104" text-anchor="middle" font-size="16" font-weight="900" class="on-color">X</text><text x="65" y="128" text-anchor="middle" font-size="13" class="on-color">B × 2</text>
        <text x="132" y="116" font-size="22" font-weight="900">×</text>
        <rect x="160" y="80" width="140" height="60" style="fill:var(--m1)" class="stroke-ink" stroke-width="3"/><text x="230" y="106" text-anchor="middle" font-size="16" font-weight="900" class="on-color">W</text><text x="230" y="128" text-anchor="middle" font-size="13" class="on-color">2 × 3</text>
        <text x="322" y="116" font-size="22" font-weight="900">＋b →</text>
        <rect x="400" y="50" width="140" height="120" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/><text x="470" y="104" text-anchor="middle" font-size="16" font-weight="900" class="on-color">Z</text><text x="470" y="128" text-anchor="middle" font-size="13" class="on-color">B × 3</text>
        <text x="280" y="204" text-anchor="middle" font-size="14">中間的 2 要對得上；B（批次大小）一路保留</text>
      </svg>`,
      caption: '一層：Z＝X·W＋b，A＝激活(Z)。b 的長度等於神經元數，加到每一列上。',
    },
    define: [
      { term: '全連接層', en: 'linear layer', def: 'A＝激活(XW＋b)。', example: 'nn.Linear(2, 3)。' },
      { term: '批次', en: 'batch', def: '一次一起算的一組樣本。', example: 'B＝64。' },
      { term: '形狀', en: 'shape', def: '每一維的大小。', example: '(64, 784)。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '一層的形狀與計算量（實際計算）', sliders: [
          { id: 'B', label: '批次大小 B', min: 1, max: 256, step: 1, value: 64 },
          { id: 'i', label: '輸入特徵', min: 1, max: 1024, step: 1, value: 784 },
          { id: 'o', label: '輸出神經元', min: 1, max: 1024, step: 1, value: 128 },
        ], compute: (v) => {
          const mults = v.B * v.i * v.o;
          return { rows: [
            { label: `輸入 X：(${v.B}, ${v.i})`, value: (v.B * v.i).toLocaleString('en-US'), ratio: Math.min(1, (v.B * v.i) / 262144) },
            { label: `權重 W：(${v.i}, ${v.o})`, value: (v.i * v.o).toLocaleString('en-US'), ratio: Math.min(1, (v.i * v.o) / 1048576) },
            { label: `輸出 Z：(${v.B}, ${v.o})`, value: (v.B * v.o).toLocaleString('en-US'), ratio: Math.min(1, (v.B * v.o) / 262144) },
            { label: '乘法次數 B × 輸入 × 輸出', value: mults.toLocaleString('en-US'), ratio: Math.min(1, mults / 268435456) },
          ], note: '權重的大小和批次無關：同一組 W 給整批共用。乘法次數則和 B 成正比，GPU 的強項就是一次做完這些（第五部 1）。' };
        } } },
        { type: 'code', lang: 'python', title: '一層＝一次矩陣乘法（示意，NumPy）', code: 'import numpy as np\nX = np.array([[1.0, 0.5],      # 第 1 筆\n              [0.0, 2.0]])     # 第 2 筆：形狀 (2, 2)\nW = np.array([[0.4, -0.5, 1.0],\n              [0.6,  0.2, 0.0]])  # (2 個輸入, 3 個神經元)\nb = np.array([0.1, 0.3, -1.0])\nZ = X @ W + b                  # (2, 3)\nA = np.maximum(0, Z)           # ReLU\nprint(Z)  # [[0.8 -0.1 0. ] [1.3 0.7 -1. ]]' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 190" role="img" aria-label="形狀錯誤：X 是 64 乘 784，W 是 512 乘 128，中間的 784 和 512 對不上，無法相乘">
          <rect x="20" y="50" width="150" height="60" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="95" y="86" text-anchor="middle" font-size="15" font-weight="900" class="on-color">(64, 784)</text>
          <text x="190" y="88" font-size="22" font-weight="900">×</text>
          <rect x="220" y="50" width="150" height="60" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/><text x="295" y="86" text-anchor="middle" font-size="15" font-weight="900" class="on-color">(512, 128)</text>
          <text x="400" y="88" font-size="16" font-weight="900">→ 錯誤</text>
          <text x="280" y="148" text-anchor="middle" font-size="14">784 ≠ 512：前一層的輸出數要等於下一層的輸入數</text>
          <text x="280" y="174" text-anchor="middle" font-size="13">PyTorch 會報「mat1 and mat2 shapes cannot be multiplied」</text>
        </svg>`, caption: '寫網路時，先把每一層的形狀寫在註解裡，可以省下很多除錯時間。' },
        { type: 'heading', id: 'linear-detail', text: '深入：PyTorch 的權重是「倒過來」存的' },
        '課文寫 Z＝XW＋b，W 的形狀是 (輸入, 輸出)。PyTorch 的 nn.Linear 把權重存成 (輸出, 輸入)，計算 y＝xAᵀ＋b（官方文件 2.15 版）。數學完全一樣，只是看 model.weight.shape 時要知道它是倒過來的。',
        '計算量常用 [[FLOPs]] 表示：一次乘法加一次加法算 2 個浮點運算，所以一層約 2 × B × 輸入 × 輸出 FLOPs。上面拉桿的乘法次數乘 2，就是論文與 GPU 規格上用的數字。',
        'nn.Linear 預設從均勻分布 U(−√k, √k) 抽初始權重，k＝1 ÷ 輸入數。輸入越多，初始權重越小，讓加總的大小不會隨輸入數暴增（4-4 的深入段落）。',
      ],
    },
    mistakes: [
      { wrong: '一筆一筆用迴圈算。', why: '很慢，也浪費 GPU。', right: '疊成批次，一次矩陣乘法。' },
      { wrong: '以為批次變大，權重也要變大。', why: '權重形狀只看輸入與輸出數。', right: '批次只影響輸入與輸出的第一維。' },
      { wrong: '前一層輸出 128，下一層輸入寫成 256。', why: '形狀對不上無法相乘。', right: '相鄰兩層的數字要一致。' },
    ],
    practice: [
      { level: '深入思考', type: 'reveal', q: ['一個 784 → 128 → 64 → 10 的網路，寫出每一層的權重形狀，並算總參數。'], answer: [
        '權重：(784, 128)、(128, 64)、(64, 10)；偏差：128、64、10。',
        '參數：100,352＋128 ＋ 8,192＋64 ＋ 640＋10 ＝ 109,386。',
      ] },
    ],
    keypoints: [
      '一層：Z＝XW＋b，A＝激活(Z)。',
      '形狀：(B, 輸入) × (輸入, 輸出) → (B, 輸出)；中間要對得上。',
      '一次算一批：同一組權重給整批共用。',
    ],
    sources: ['pytorch-quickstart', 'pytorch-linear'],
  },

  '2-2': {
    goals: [
      '手算一個 2 → 2 → 1 網路的前向傳播',
      '看出 ReLU 怎麼讓某些神經元「關掉」',
      '算出這筆資料的損失',
    ],
    analogy: {
      text: ['工廠兩道工序：第一站兩位師傅各自加工（隱藏層），第二站主管看兩位師傅的成品決定最終產品（輸出層）。', '前向傳播就是把原料一站一站送過去，每站都用固定的配方（權重）。下面用一組小數字手算一次，每一步都可以拿互動核對。'],
      limit: ['工廠師傅的工作有意義，網路裡的 h₁、h₂ 只是數字；它們代表什麼，是訓練之後才「長」出來的。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 250" role="img" aria-label="2 到 2 到 1 的小網路：輸入 x1 等於 1、x2 等於 0.5；隱藏 h1 等於 0.8，h2 等於 0；輸出 y-hat 等於 1.4">
        <circle cx="70" cy="70" r="30" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="70" y="76" text-anchor="middle" font-size="15" font-weight="900" class="on-color">x₁＝1</text>
        <circle cx="70" cy="180" r="30" style="fill:var(--m0)" class="stroke-ink" stroke-width="3"/><text x="70" y="186" text-anchor="middle" font-size="14" font-weight="900" class="on-color">x₂＝.5</text>
        <circle cx="280" cy="70" r="34" style="fill:var(--m1)" class="stroke-ink" stroke-width="3"/><text x="280" y="76" text-anchor="middle" font-size="15" font-weight="900" class="on-color">h₁＝.8</text>
        <circle cx="280" cy="180" r="34" class="fill-bg stroke-ink" stroke-width="3" stroke-dasharray="6 4"/><text x="280" y="186" text-anchor="middle" font-size="15" font-weight="900">h₂＝0</text>
        <circle cx="480" cy="125" r="36" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/><text x="480" y="131" text-anchor="middle" font-size="15" font-weight="900" class="on-color">ŷ＝1.4</text>
        <line x1="100" y1="70" x2="246" y2="70" class="stroke-ink" stroke-width="2"/><text x="170" y="62" font-size="13">0.4</text>
        <line x1="100" y1="180" x2="246" y2="76" class="stroke-ink" stroke-width="2"/><text x="132" y="140" font-size="13">0.6</text>
        <line x1="100" y1="70" x2="246" y2="174" class="stroke-ink" stroke-width="2"/><text x="200" y="104" font-size="13">−0.5</text>
        <line x1="100" y1="180" x2="246" y2="180" class="stroke-ink" stroke-width="2"/><text x="170" y="198" font-size="13">0.2</text>
        <line x1="314" y1="70" x2="446" y2="115" class="stroke-ink" stroke-width="2"/><text x="380" y="80" font-size="13">1.5</text>
        <line x1="314" y1="180" x2="446" y2="135" class="stroke-ink" stroke-width="2"/><text x="380" y="176" font-size="13">−1</text>
        <text x="280" y="236" text-anchor="middle" font-size="13">偏差：h₁ 0.1、h₂ 0.3、輸出 0.2；h 用 ReLU，輸出不加激活</text>
      </svg>`,
      caption: 'h₂ 的 z 是 −0.1，ReLU 把它關掉了（虛線）。',
    },
    define: [
      { term: '前向傳播', en: 'forward pass', def: '一層一層算到輸出。', example: 'x → h → ŷ。' },
      { term: '被關掉的神經元', en: 'inactive unit', def: 'ReLU 輸入為負，輸出 0。', example: '這筆資料的 h₂。' },
      { term: '線性輸出', en: 'linear output', def: '回歸問題的輸出層通常不加激活。', example: 'ŷ 可以是任何數。' },
    ],
    examples: {
      blocks: [
        { type: 'table', head: ['步驟', '算式', '結果'], rows: [
          ['z₁（h₁ 的加總）', '0.4×1 ＋ 0.6×0.5 ＋ 0.1', '0.8'],
          ['h₁ ＝ ReLU(z₁)', '', '0.8'],
          ['z₂（h₂ 的加總）', '−0.5×1 ＋ 0.2×0.5 ＋ 0.3', '−0.1'],
          ['h₂ ＝ ReLU(z₂)', '', '0（關掉）'],
          ['ŷ', '1.5×0.8 ＋ (−1)×0 ＋ 0.2', '1.4'],
          ['損失（答案 1，平方誤差）', '(1.4 − 1)²', '0.16'],
        ] },
        { type: 'widget', name: 'knobs', props: { title: '同一個網路，換輸入看看（實際計算，權重固定）', sliders: [
          { id: 'x1', label: 'x₁', min: -2, max: 2, step: 0.5, value: 1 },
          { id: 'x2', label: 'x₂', min: -2, max: 2, step: 0.5, value: 0.5 },
          { id: 't', label: '答案 y', min: -2, max: 3, step: 0.5, value: 1 },
        ], compute: (v) => {
          const { w, b, v: vv, c } = SMALL_NET;
          const z = [0, 1].map((j) => w[0][j] * v.x1 + w[1][j] * v.x2 + b[j]);
          const h = z.map((x) => Math.max(0, x));
          const y = vv[0] * h[0] + vv[1] * h[1] + c;
          const L = (y - v.t) ** 2;
          return { rows: [
            { label: `h₁ ＝ ReLU(${z[0].toFixed(2)})`, value: h[0].toFixed(2), ratio: Math.min(1, h[0] / 3) },
            { label: `h₂ ＝ ReLU(${z[1].toFixed(2)})`, value: h[1].toFixed(2), ratio: Math.min(1, h[1] / 3) },
            { label: 'ŷ', value: y.toFixed(2), ratio: Math.min(1, Math.abs(y) / 5) },
            { label: '損失 (ŷ − y)²', value: L.toFixed(3), ratio: Math.min(1, L / 10) },
          ], note: '試試 x₁＝−1：h₁ 也被關掉，ŷ 只剩偏差 0.2 和 h₂ 的貢獻。不同輸入會「點亮」不同的神經元，這就是網路能表示彎曲關係的原因。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 180" role="img" aria-label="前向傳播一路算到損失：輸入、隱藏層加總、ReLU、輸出、損失；每一步的值都要存起來給反向傳播用">
          ${[['x', '輸入'], ['z', '加總'], ['h', 'ReLU'], ['ŷ', '輸出'], ['L', '損失']].map(([a, b], i) => `<rect x="${10 + i * 110}" y="40" width="100" height="70" style="fill:var(--m${i})" class="stroke-ink" stroke-width="3"/><text x="${60 + i * 110}" y="74" text-anchor="middle" font-size="18" font-weight="900" class="on-color">${a}</text><text x="${60 + i * 110}" y="98" text-anchor="middle" font-size="13" class="on-color">${b}</text>`).join('')}
          <text x="280" y="146" text-anchor="middle" font-size="14">每一格算出來的值都要記住</text>
          <text x="280" y="170" text-anchor="middle" font-size="13">反向傳播會用到它們（模組 3）</text>
        </svg>`, caption: '這也是訓練比推論更吃記憶體的原因之一：中間值要留著（第五部 3）。' },
        { type: 'heading', id: 'memory', text: '深入：訓練時記憶體花在哪裡' },
        { type: 'table', head: ['記憶體項目', '推論', '訓練'], rows: [
          ['參數', '要', '要'],
          ['激活值（前向的中間值）', '算完下一層就能丟', '要留到反向傳播用完'],
          ['梯度', '不用', '每個參數一份'],
          ['優化器狀態', '不用', 'Adam 每個參數再多兩份（4-3）'],
        ] },
        '激活值和批次大小、層數成正比，大模型訓練時常常比參數本身還佔記憶體。這是 7-1 拉桿裡「一個中間值就幾十 MB」要乘上層數的原因。',
        '[[梯度檢查點]]用計算換記憶體：只存部分層的中間值，反向時再把缺的那段前向重算一次。Chen 等 2016 的做法讓記憶體從和層數成正比降到約平方根，代價是多做約一次前向。',
      ],
    },
    mistakes: [
      { wrong: '忘了每一層都要加偏差。', why: '偏差是每個神經元自己的參數。', right: '每層：加權加總＋偏差，再激活。' },
      { wrong: '回歸問題的輸出也套 ReLU。', why: '預測不到負數。', right: '回歸輸出層通常不加激活。' },
      { wrong: '以為被 ReLU 關掉的神經元沒用。', why: '換一筆資料它可能就打開了。', right: '不同輸入點亮不同神經元。' },
    ],
    practice: [
      { level: '深入思考', type: 'reveal', q: ['同樣的網路結構，如果把所有 ReLU 拿掉，對 x＝[1, 0.5] 的輸出會變成多少？為什麼結果不同？'], answer: [
        '沒有 ReLU 時 h₂ ＝ −0.1 不會變 0：ŷ ＝ 1.5×0.8 ＋ (−1)×(−0.1) ＋ 0.2 ＝ 1.5。',
        '差別在 ReLU 把負的中間值關掉了。有了這種開關，網路對不同區域的輸入才能用不同的「組合」，這就是非線性的來源。',
      ] },
    ],
    keypoints: [
      '前向傳播：一層一層加權加總、加偏差、激活，最後算損失。',
      'ReLU 會讓某些神經元在某些輸入下關掉。',
      '中間值要記住，反向傳播會用到。',
    ],
    sources: ['rumelhart-1986', 'checkpointing'],
  },

  '2-3': {
    goals: [
      '依問題類型選輸出層與損失',
      '算出 softmax ＋ cross-entropy 的損失',
      '知道 PyTorch 為什麼常把 softmax 包進損失函數',
