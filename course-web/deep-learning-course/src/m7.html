const CORPUS = '學習就是讓損失變小。模型先猜，再看錯多少，再往錯得少的方向走一步。走很多步之後，模型就學會了。學得好不好，要看沒看過的資料。看沒看過的資料，才知道是不是真的學會。';

defineLessons({

</svg>`, caption: '模型和資料都要在同一個裝置上。' },
        { type: 'code', lang: 'python', title: 'tensor 與自動微分（需要自己的 Python 環境，示意）', code: 'import torch\n\nx = torch.tensor([[1.0, 2.0], [3.0, 4.0]])   # 形狀 (2, 2)\nprint(x.shape, x.dtype)                      # torch.Size([2, 2]) torch.float32\n\nw = torch.tensor([0.5, -1.0], requires_grad=True)\nb = torch.tensor(0.1, requires_grad=True)\ny = x @ w + b                                # (2,)：每一列和 w 做點積\nloss = (y ** 2).mean()\nloss.backward()                              # 反向傳播\nprint(w.grad, b.grad)                        # 每個參數的梯度\n\ndevice = "cuda" if torch.cuda.is_available() else "cpu"\nx = x.to(device)                             # 有 GPU 就搬過去' },

        } } },

    analogy: {
      text: ['做菜：先寫好食譜（[[nn.Module]]：有哪些材料、怎麼處理），然後每天照同樣的流程煮一次、試吃、調整（[[訓練迴圈]]）。', '整個深度學習的訓練，最後就濃縮成五行：拿一批、前向算損失、清梯度、反向傳播、更新。這一卷的每個模組，都對應其中一行。'],

        ${[['x, y = 下一批', '4-1 小批次', 'm0'], ['loss = loss_fn(model(x), y)', '模組 1、2', 'm1'], ['opt.zero_grad()', '3-3 清掉舊梯度', 'm5'], ['loss.backward()', '模組 3', 'm3'], ['opt.step()', '模組 4', 'm4']].map(([a, b, c], i) => `<rect x="20" y="${18 + i * 42}" width="330" height="36" style="fill:var(--${c})" class="stroke-ink" stroke-width="2"/><text x="32" y="${42 + i * 42}" font-size="14" font-weight="900" class="mono on-color">${a}</text><text x="370" y="${42 + i * 42}" font-size="14" font-weight="900">← ${b}</text>`).join('')}
        <text x="280" y="234" text-anchor="middle" font-size="13">重複幾千到幾百萬次，就是「訓練」</text>
      </svg>`,
      caption: 'zero_grad 和 backward 的順序可以互換位置，只要在 backward 之前清掉上一步的梯度。',
    },
    define: [
      { term: 'nn.Module', en: 'nn.Module', def: '__init__ 宣告層、forward 寫計算。', example: 'class Net(nn.Module)。' },
      { term: 'model.train() / model.eval()', en: 'train / eval mode', def: '切換訓練與評估模式（影響 dropout 等）。', example: '驗證前呼叫 eval()。' },
      { term: '訓練迴圈', en: 'training loop', def: '五行重複執行。', example: '下面的程式。' },
    ],
    examples: {
      blocks: [
        { type: 'code', lang: 'python', title: '一個兩層網路與完整訓練迴圈（需要自己的環境，示意）', code: 'import torch\nimport torch.nn as nn\n\nclass Net(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.layers = nn.Sequential(\n            nn.Linear(2, 16), nn.ReLU(),     # 模組 1、2\n            nn.Linear(16, 1),\n        )\n    def forward(self, x):\n        return self.layers(x)\n\n# XOR（1-3）：一個神經元做不到，加一層隱藏層就可以\nX = torch.tensor([[0., 0.], [0., 1.], [1., 0.], [1., 1.]])\nY = torch.tensor([[0.], [1.], [1.], [0.]])\n\nmodel = Net()\nopt = torch.optim.Adam(model.parameters(), lr=0.01)\nloss_fn = nn.BCEWithLogitsLoss()          # sigmoid＋log loss 合在一起\n\nfor step in range(2000):\n    loss = loss_fn(model(X), Y)\n    opt.zero_grad()\n    loss.backward()\n    opt.step()\n\nprint(torch.sigmoid(model(X)).round())   # 預期接近 [[0], [1], [1], [0]]' },
        { type: 'widget', name: 'ragtrace', props: { chip: '逐行追蹤', title: '訓練迴圈的一步裡，發生了什麼', scenarios: [{ label: '一步', stages: [

          { title: 'opt.zero_grad()', body: ['把每個參數的 .grad 清成 0。不清的話，這一步的梯度會疊在上一步上（3-4 的 ＋＝）。'] },
          { title: 'loss.backward()', body: ['沿著計算圖反向傳播，算出每個參數的梯度，存在 .grad（模組 3）。'] },
          { title: 'opt.step()', body: ['Adam 讀每個參數的 .grad，更新參數本身（4-3）。這一步之後，模型稍微變好了一點。'] },

        { type: 'svg', svg: `<svg viewBox="0 0 560 170" role="img" aria-label="訓練與驗證交錯：每個 epoch 訓練完，切到評估模式在驗證集上算損失，記錄兩條曲線">
