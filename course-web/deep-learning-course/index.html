/* ---------- sampler：下一個 token 的機率，以及取樣（每按一次真的抽一次） ---------- */
// props: { title, steps: [{ context, candidates: [{ t, logit }] }], temperature: true, topP: true, note }
// 機率＝softmax(logit / T)；top-p 只保留累積機率達到門檻的前幾名再重新分配
const SAMPLER_T = { min: 0.1, max: 2, step: 0.1, start: 1 };
const SAMPLER_P = { min: 0.5, max: 1, step: 0.05, start: 1 };
function samplerProbs(candidates, temperature, topP) {
  const scaled = candidates.map((c) => c.logit / temperature);
  const top = Math.max(...scaled);
  const exps = scaled.map((v) => Math.exp(v - top)); // 先減最大值，避免數字溢位
  const total = exps.reduce((a, b) => a + b, 0);
  const ranked = candidates.map((c, i) => ({ ...c, p: exps[i] / total })).sort((a, b) => b.p - a.p);
  let cumulative = 0;
  ranked.forEach((c) => { c.kept = cumulative < topP - 1e-9; cumulative += c.p; });
  const keptTotal = ranked.filter((c) => c.kept).reduce((a, c) => a + c.p, 0);
  ranked.forEach((c) => { c.final = c.kept ? c.p / keptTotal : 0; });
  return ranked;
}
Widgets.sampler = {
  render(props, id) {
    return `<div class="jw sp">
      <div class="jw-head"><span class="label" style="--chip:var(--m4)">下一個 token</span><span class="grow">${esc(props.title || '模型算出機率，再從中抽一個')}</span></div>
      <p class="sp-sentence" aria-live="polite"></p>
      <ol class="sp-bars"></ol>
      <div class="lv-sliders">
        ${props.temperature === false ? '' : `<div class="lv-row"><label for="${id}-t">temperature：<output data-sp-out="t"></output></label><input type="range" id="${id}-t" data-sp="t" min="${SAMPLER_T.min}" max="${SAMPLER_T.max}" step="${SAMPLER_T.step}" value="${SAMPLER_T.start}"><div class="lv-ends"><span>集中：幾乎都挑第一名</span><span>分散：冷門字也有機會</span></div></div>`}
        ${props.topP ? `<div class="lv-row"><label for="${id}-p">top-p：<output data-sp-out="p"></output></label><input type="range" id="${id}-p" data-sp="p" min="${SAMPLER_P.min}" max="${SAMPLER_P.max}" step="${SAMPLER_P.step}" value="${SAMPLER_P.start}"><div class="lv-ends"><span>只留前幾名</span><span>全部都留</span></div></div>` : ''}
      </div>
      <div class="tw-controls" role="group" aria-label="取樣">
        <button type="button" class="btn small primary nb-press" data-sp-act="sample">抽一個</button>
        <button type="button" class="btn small nb-press" data-sp-act="greedy">挑最高的</button>
        <button type="button" class="btn small nb-press" data-sp-act="reset">重來</button>
      </div>
      <p class="jw-note">${md(props.note || '機率是示意的數字，不是真實模型的輸出。')}</p>
    </div>`;
  },
  hydrate(el, props) {
    const v = { t: SAMPLER_T.start, p: SAMPLER_P.start };
    let step = 0;
    let chosen = [];
    const sentence = $('.sp-sentence', el);
    const bars = $('.sp-bars', el);
    function draw() {
      const done = step >= props.steps.length;
      sentence.innerHTML = `${esc(props.steps[0].context)}<mark>${esc(chosen.join(''))}</mark>${done ? '<span class="sp-done">（完成）</span>' : '<span class="sp-cursor" aria-hidden="true">▍</span>'}`;
      if (done) { bars.innerHTML = ''; } else {
        const ranked = samplerProbs(props.steps[step].candidates, v.t, v.p);
        bars.innerHTML = ranked.map((c) => `<li class="sp-row${c.kept ? '' : ' is-cut'}"><code>${esc(c.t)}</code><span class="lv-meter"><span class="lv-fill" style="transform:scaleX(${c.final.toFixed(3)})"></span></span><strong>${(c.final * 100).toFixed(1)}%</strong></li>`).join('');
      }
      $$('[data-sp-act="sample"], [data-sp-act="greedy"]', el).forEach((b) => { b.disabled = done; });
      const outT = $('[data-sp-out="t"]', el); if (outT) outT.textContent = v.t.toFixed(1);
      const outP = $('[data-sp-out="p"]', el); if (outP) outP.textContent = v.p.toFixed(2);
    }
    function pick(mode) {
      const ranked = samplerProbs(props.steps[step].candidates, v.t, v.p);
      let choice = ranked[0];
      if (mode === 'sample') {
        let r = Math.random();
        choice = ranked.find((c) => { r -= c.final; return r <= 0 && c.final > 0; }) || ranked[0];
      }
      chosen.push(choice.t);
      step += 1;
      draw();
    }
    el.addEventListener('input', (e) => { const s = e.target.closest('[data-sp]'); if (s) { v[s.dataset.sp] = Number(s.value); draw(); } });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sp-act]');
      if (!b) return;
      if (b.dataset.spAct === 'reset') { step = 0; chosen = []; draw(); return; }
      if (step < props.steps.length) pick(b.dataset.spAct);
    });
    draw();
  },
};

const HERO_CHUNK_MS = 70;

      <div class="hd-req"><span class="label" style="--chip:var(--m1)">POST /v1/messages</span><pre class="hd-json"></pre></div>

    const text = $('.hd-text', el);
    const body = (s) => `{\n  "model": "claude-opus-5-5",\n  "max_tokens": 1024,\n  "messages": [\n    { "role": "user",\n      "content": "${s.ask}" }\n  ]\n}`;

      const s = HERO_SAMPLES[n % HERO_SAMPLES.length];

/* ---------- 圖片放大：手機上圖裡的字會縮到 8px 左右，點「放大看」用原尺寸檢視 ---------- */
// 放大後最小字級至少 12.5px（content-rules：375px 時圖中文字要 ≥ 12px）
const FIG_MIN_TEXT_PX = 12.5;
const FigZoom = (() => {
  let dialog = null;
  let opener = null;
  function ensureDialog() {
    if (dialog) return dialog;
    dialog = document.createElement('dialog');
    dialog.className = 'fig-dialog';
    dialog.setAttribute('aria-label', '放大檢視圖解');
    dialog.innerHTML = '<div class="fig-dialog-bar"><span class="fig-dialog-hint">可以左右、上下捲動</span><button type="button" class="btn small nb-press" data-fig-close>關閉</button></div><div class="fig-dialog-body"><div class="figure fig-dialog-figure"></div></div>';
    dialog.addEventListener('click', (e) => {
      if (e.target.closest('[data-fig-close]') || e.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', () => {
      $('.fig-dialog-figure', dialog).textContent = '';
      if (opener) opener.focus();
    });
    document.body.appendChild(dialog);
    return dialog;
  }
  function open(button) {
    const svg = $('svg', button.closest('.figure'));
    if (!svg) return;
    const box = ensureDialog();
    const clone = svg.cloneNode(true);
    const fontSizes = [...clone.querySelectorAll('text')].map((t) => parseFloat(t.getAttribute('font-size'))).filter(Boolean);
    const minFont = fontSizes.length ? Math.min(...fontSizes) : 16;
    const scale = Math.max(1, FIG_MIN_TEXT_PX / minFont);
    clone.style.width = `${Math.ceil(svg.viewBox.baseVal.width * scale)}px`;
    clone.style.maxWidth = 'none';
    $('.fig-dialog-figure', box).appendChild(clone);
    opener = button;
    box.showModal();
    $('[data-fig-close]', box).focus();
  }
  document.addEventListener('click', (e) => {
    const button = e.target.closest('[data-fig-zoom]');
    if (button) open(button);
  });
  return { open };
})();

/* 共用：把資料座標換成 SVG 座標的小畫布 */
const PLOT_W = 520;
const PLOT_H = 300;
const PLOT_PAD = 44;
function makeScale([x0, x1], [y0, y1]) {
  return {
    px: (x) => PLOT_PAD + ((x - x0) / (x1 - x0)) * (PLOT_W - PLOT_PAD - 16),
    py: (y) => PLOT_H - PLOT_PAD + 10 - ((y - y0) / (y1 - y0)) * (PLOT_H - PLOT_PAD - 16),
  };
}
function plotAxes(sc, xr, yr, xLabel, yLabel) {
  const ticks = (a, b) => { const step = (b - a) / 4; return [0, 1, 2, 3, 4].map((i) => +(a + i * step).toFixed(2)); };
  return `<g class="pl-axes">
    <line x1="${sc.px(xr[0])}" y1="${sc.py(yr[0])}" x2="${sc.px(xr[1])}" y2="${sc.py(yr[0])}" class="stroke-ink" stroke-width="2"/>
    <line x1="${sc.px(xr[0])}" y1="${sc.py(yr[0])}" x2="${sc.px(xr[0])}" y2="${sc.py(yr[1])}" class="stroke-ink" stroke-width="2"/>
    ${ticks(...xr).map((t) => `<text x="${sc.px(t)}" y="${sc.py(yr[0]) + 18}" text-anchor="middle" font-size="13">${t}</text>`).join('')}
    ${ticks(...yr).map((t) => `<text x="${sc.px(xr[0]) - 8}" y="${sc.py(t) + 4}" text-anchor="end" font-size="13">${t}</text>`).join('')}
    <text x="${PLOT_W - 16}" y="${sc.py(yr[0]) - 8}" text-anchor="end" font-size="13" font-weight="900">${esc(xLabel || 'x')}</text>
    <text x="${sc.px(xr[0]) + 8}" y="16" font-size="13" font-weight="900">${esc(yLabel || 'y')}</text>
  </g>`;
}
const fmt2 = (v) => (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2));

/* ---------- fitline：拉 w、b 畫一條線，看殘差與 MSE；可以一步一步做梯度下降 ---------- */
// props: { title, points: [[x, y]], w, b, xRange, yRange, xLabel, yLabel, gd: true, lr: 0.01, wRange: [-2, 4], bRange: [-5, 10] }
function lineLoss(points, w, b) {
  const n = points.length;
  let mse = 0; let dw = 0; let db = 0;
  points.forEach(([x, y]) => { const e = w * x + b - y; mse += e * e; dw += 2 * e * x; db += 2 * e; });
  return { mse: mse / n, dw: dw / n, db: db / n };
}
Widgets.fitline = {
  render(props, id) {
    const wr = props.wRange || [-2, 4];
    const br = props.bRange || [-5, 10];
    return `<div class="jw fl">
      <div class="jw-head"><span class="label" style="--chip:var(--m1)">畫一條線</span><span class="grow">${esc(props.title || '拉動 w 和 b，讓線靠近所有點')}</span></div>
      <svg class="pl-svg" viewBox="0 0 ${PLOT_W} ${PLOT_H}" role="img" aria-label="散布圖與目前的直線"></svg>
      <div class="lv-sliders">
        <div class="lv-row"><label for="${id}-w">斜率 w：<output data-fl-out="w"></output></label><input type="range" id="${id}-w" data-fl="w" min="${wr[0]}" max="${wr[1]}" step="0.05" value="${props.w ?? 0}"></div>
        <div class="lv-row"><label for="${id}-b">截距 b：<output data-fl-out="b"></output></label><input type="range" id="${id}-b" data-fl="b" min="${br[0]}" max="${br[1]}" step="0.05" value="${props.b ?? 0}"></div>
        ${props.gd ? `<div class="lv-row"><label for="${id}-lr">學習率：<output data-fl-out="lr"></output></label><input type="range" id="${id}-lr" data-fl="lr" min="0.001" max="${props.lrMax || 0.1}" step="0.001" value="${props.lr || 0.01}"></div>` : ''}
      </div>
      ${props.gd ? `<div class="tw-controls" role="group" aria-label="梯度下降">
        <button type="button" class="btn small primary nb-press" data-fl-act="1">走 1 步</button>
        <button type="button" class="btn small nb-press" data-fl-act="10">走 10 步</button>
        <button type="button" class="btn small nb-press" data-fl-act="reset">重設</button>
      </div>` : ''}
      <div class="kn-rows fl-stats" aria-live="polite"></div>
      ${props.note ? `<p class="jw-note">${md(props.note)}</p>` : ''}
    </div>`;
  },
  hydrate(el, props) {
    const xr = props.xRange || [0, 10];
    const yr = props.yRange || [0, 10];
    const sc = makeScale(xr, yr);
    const start = { w: props.w ?? 0, b: props.b ?? 0 };
    const v = { ...start, lr: props.lr || 0.01 };
    let steps = 0;
    let history = [];
    const svg = $('.pl-svg', el);
    function draw() {
      const { mse, dw, db } = lineLoss(props.points, v.w, v.b);
      const x0 = xr[0]; const x1 = xr[1];
      svg.innerHTML = `${plotAxes(sc, xr, yr, props.xLabel, props.yLabel)}
        ${props.points.map(([x, y]) => `<line x1="${sc.px(x)}" y1="${sc.py(y)}" x2="${sc.px(x)}" y2="${sc.py(v.w * x + v.b)}" class="pl-resid"/>`).join('')}
        <line x1="${sc.px(x0)}" y1="${sc.py(v.w * x0 + v.b)}" x2="${sc.px(x1)}" y2="${sc.py(v.w * x1 + v.b)}" class="pl-line"/>
        ${props.points.map(([x, y]) => `<circle cx="${sc.px(x)}" cy="${sc.py(y)}" r="7" class="pl-dot"/>`).join('')}`;
      const maxLoss = Math.max(history[0] || mse, mse, 1e-9);
      const rows = [{ label: 'MSE（平均平方誤差）', value: fmt2(mse), ratio: Math.min(1, mse / maxLoss) }];
      if (props.gd) {
        rows.push({ label: '∂MSE/∂w（w 的梯度）', value: fmt2(dw), ratio: Math.min(1, Math.abs(dw) / 50) });
        rows.push({ label: '∂MSE/∂b（b 的梯度）', value: fmt2(db), ratio: Math.min(1, Math.abs(db) / 20) });
        rows.push({ label: '已走步數', value: String(steps), ratio: Math.min(1, steps / 100) });
      }
      $('.fl-stats', el).innerHTML = rows.map((r) => `<div class="kn-row"><span>${esc(r.label)}</span><span class="lv-meter"><span class="lv-fill" style="transform:scaleX(${r.ratio})"></span></span><strong>${esc(r.value)}</strong></div>`).join('');
      $('[data-fl-out="w"]', el).textContent = v.w.toFixed(2);
      $('[data-fl-out="b"]', el).textContent = v.b.toFixed(2);
      const outLr = $('[data-fl-out="lr"]', el); if (outLr) outLr.textContent = v.lr.toFixed(3);
      $('[data-fl="w"]', el).value = v.w;
      $('[data-fl="b"]', el).value = v.b;
    }
    function step(n) {
      for (let i = 0; i < n; i += 1) {
        const { mse, dw, db } = lineLoss(props.points, v.w, v.b);
        if (!history.length) history.push(mse);
        v.w -= v.lr * dw;
        v.b -= v.lr * db;
        steps += 1;
        if (!Number.isFinite(v.w) || Math.abs(v.w) > 1e6) break;
      }
      draw();
    }
    el.addEventListener('input', (e) => {
      const s = e.target.closest('[data-fl]');
      if (!s) return;
      v[s.dataset.fl] = Number(s.value);
      if (s.dataset.fl !== 'lr') { steps = 0; history = []; }
      draw();
    });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-fl-act]');
      if (!b) return;
      if (b.dataset.flAct === 'reset') { v.w = start.w; v.b = start.b; steps = 0; history = []; draw(); return; }
      step(Number(b.dataset.flAct));
    });
    draw();
  },
};

/* ---------- kmeans：分配 → 移動中心，一步一步跑 ---------- */
// props: { title, points: [[x, y]], centers: [[x, y]], xRange, yRange }
function kmeansHistory(points, centers, maxIter = 8) {
  const hist = [{ centers: centers.map((c) => [...c]), assign: null, phase: '一開始：隨便放 k 個中心' }];
  let cs = centers.map((c) => [...c]);
  let prev = '';
  for (let it = 0; it < maxIter; it += 1) {
    const assign = points.map(([x, y]) => { let best = 0; let bd = Infinity; cs.forEach(([cx, cy], k) => { const d = (x - cx) ** 2 + (y - cy) ** 2; if (d < bd) { bd = d; best = k; } }); return best; });
    hist.push({ centers: cs.map((c) => [...c]), assign, phase: `第 ${it + 1} 輪・分配：每個點歸給最近的中心` });
    cs = cs.map((c, k) => { const mine = points.filter((_, i) => assign[i] === k); return mine.length ? [mine.reduce((s, p) => s + p[0], 0) / mine.length, mine.reduce((s, p) => s + p[1], 0) / mine.length] : c; });
    hist.push({ centers: cs.map((c) => [...c]), assign, phase: `第 ${it + 1} 輪・移動：中心搬到自己那群的平均位置` });
    const key = assign.join(',');
    if (key === prev) { hist.push({ centers: cs, assign, phase: '分配不再改變：收斂了' }); break; }
    prev = key;
  }
  return hist;
}
Widgets.kmeans = {
  render(props) {
    return `<div class="jw km">
      <div class="jw-head"><span class="label" style="--chip:var(--m5)">k-means 分群</span><span class="grow">${esc(props.title || '沒有答案，只有點：讓它自己分成 k 群')}</span></div>
      ${stepperControls('k-means 控制')}
      <p class="rt-title km-phase" aria-live="polite"></p>
      <svg class="pl-svg" viewBox="0 0 ${PLOT_W} ${PLOT_H}" role="img" aria-label="點的散布與分群中心"></svg>
      <div class="kn-rows km-stats"></div>
    </div>`;
  },
  hydrate(el, props) {
    const xr = props.xRange || [0, 10];
    const yr = props.yRange || [0, 10];
    const sc = makeScale(xr, yr);
    const hist = kmeansHistory(props.points, props.centers);
    const svg = $('.pl-svg', el);
    makeStepper(el, hist.length, (s) => {
      const h = hist[s];
      $('.km-phase', el).innerHTML = `<span class="step">步驟 ${s} / ${hist.length - 1}</span>${esc(h.phase)}`;
      svg.innerHTML = `${plotAxes(sc, xr, yr, 'x', 'y')}
        ${props.points.map(([x, y], i) => `<circle cx="${sc.px(x)}" cy="${sc.py(y)}" r="7" class="pl-dot" style="${h.assign ? `fill:var(--m${[1, 2, 3, 4][h.assign[i]]})` : ''}"/>`).join('')}
        ${h.centers.map(([x, y], k) => `<rect x="${sc.px(x) - 11}" y="${sc.py(y) - 11}" width="22" height="22" class="stroke-ink" stroke-width="3" style="fill:var(--m${[1, 2, 3, 4][k]})"/><text x="${sc.px(x)}" y="${sc.py(y) + 5}" text-anchor="middle" font-size="13" font-weight="900" class="on-color">${k + 1}</text>`).join('')}`;
      let inertia = 0;
      if (h.assign) props.points.forEach(([x, y], i) => { const [cx, cy] = h.centers[h.assign[i]]; inertia += (x - cx) ** 2 + (y - cy) ** 2; });
      $('.km-stats', el).innerHTML = h.assign ? `<div class="kn-row"><span>每個點到自己中心的距離平方和</span><span class="lv-meter"><span class="lv-fill" style="transform:scaleX(${Math.min(1, inertia / 200)})"></span></span><strong>${inertia.toFixed(1)}</strong></div>` : '';
    }, { interval: 1800 });
  },

/* ---------- bandit：三台拉霸機，ε-greedy 自己試 ---------- */
// props: { arms: [{ label, p }], epsilon: 0.1 }；每按一次真的用亂數決定有沒有中獎
Widgets.bandit = {
  render(props, id) {
    return `<div class="jw bd">
      <div class="jw-head"><span class="label" style="--chip:var(--m4)">拉霸機</span><span class="grow">${esc(props.title || '不知道哪台比較好：要探索還是利用？')}</span></div>
      <div class="lv-sliders"><div class="lv-row"><label for="${id}-eps">探索比例 ε：<output data-bd-out></output></label><input type="range" id="${id}-eps" data-bd-eps min="0" max="1" step="0.05" value="${props.epsilon ?? 0.1}"><div class="lv-ends"><span>只挑目前最好的</span><span>完全亂挑</span></div></div></div>
      <div class="tw-controls" role="group" aria-label="拉霸">
        ${props.arms.map((a, i) => `<button type="button" class="btn small nb-press" data-bd-arm="${i}">自己拉 ${esc(a.label)}</button>`).join('')}
        <button type="button" class="btn small primary nb-press" data-bd-auto="100">讓 ε-greedy 拉 100 次</button>
        <button type="button" class="btn small nb-press" data-bd-reset>重來</button>
      </div>
      <label class="rq-check"><input type="checkbox" data-bd-reveal>顯示真實中獎率（作弊）</label>
      <div class="bd-table" aria-live="polite"></div>
    </div>`;
  },
  hydrate(el, props) {
    let plays; let wins; let eps = props.epsilon ?? 0.1; let reveal = false;
    function reset() { plays = props.arms.map(() => 0); wins = props.arms.map(() => 0); }
    function pull(i) { plays[i] += 1; if (Math.random() < props.arms[i].p) wins[i] += 1; }
    function greedyArm() { let best = 0; let bv = -1; plays.forEach((n, i) => { const est = n ? wins[i] / n : 1; if (est > bv) { bv = est; best = i; } }); return best; }
    function draw() {
      const total = plays.reduce((a, b) => a + b, 0);
      const totalWins = wins.reduce((a, b) => a + b, 0);
      $('.bd-table', el).innerHTML = tableBlock({
        head: ['拉霸機', '拉了幾次', '中了幾次', '估計中獎率', ...(reveal ? ['真實中獎率'] : [])],
        rows: props.arms.map((a, i) => [a.label, String(plays[i]), String(wins[i]), plays[i] ? `${((wins[i] / plays[i]) * 100).toFixed(0)}%` : '—', ...(reveal ? [`${Math.round(a.p * 100)}%`] : [])]),
        caption: `總共拉 ${total} 次、中 ${totalWins} 次（平均 ${total ? ((totalWins / total) * 100).toFixed(1) : 0}%）`,
      });
      $('[data-bd-out]', el).textContent = eps.toFixed(2);
    }
    el.addEventListener('click', (e) => {
      const arm = e.target.closest('[data-bd-arm]');
      if (arm) { pull(Number(arm.dataset.bdArm)); draw(); return; }
      if (e.target.closest('[data-bd-auto]')) {
        for (let t = 0; t < 100; t += 1) pull(Math.random() < eps ? Math.floor(Math.random() * props.arms.length) : greedyArm());
        draw(); return;
      }
      if (e.target.closest('[data-bd-reset]')) { reset(); draw(); }
    });
    el.addEventListener('input', (e) => { if (e.target.closest('[data-bd-eps]')) { eps = Number(e.target.value); draw(); } });
    el.addEventListener('change', (e) => { if (e.target.closest('[data-bd-reveal]')) { reveal = e.target.checked; draw(); } });
    reset();
    draw();
  },
};

/* ---------- polyfit：多項式次數與正則化，看訓練誤差與驗證誤差 ---------- */
// props: { title, seed, nTrain, nVal, noise, degree, lambda: true }；資料＝sin(2πx)＋固定種子的雜訊
function seededRandom(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function gaussFrom(rand) { const u = Math.max(rand(), 1e-9); const v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function polyData(props) {
  const rand = seededRandom(props.seed || 7);
  const make = (n, offset) => Array.from({ length: n }, (_, i) => { const x = (i + offset) / n; return [x, Math.sin(2 * Math.PI * x) + (props.noise ?? 0.25) * gaussFrom(rand)]; });
  return { train: make(props.nTrain || 10, 0.25), val: make(props.nVal || 10, 0.75) };
}
function solveLinear(A, b) {
  const n = b.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c += 1) {
    let p = c;
    for (let r = c + 1; r < n; r += 1) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const piv = M[c][c] || 1e-12;
    for (let r = 0; r < n; r += 1) {
      if (r === c) continue;
      const f = M[r][c] / piv;
      for (let k = c; k <= n; k += 1) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => row[n] / (row[i] || 1e-12));
}
function polyFit(points, degree, lambda) {
  const feats = (x) => Array.from({ length: degree + 1 }, (_, k) => (2 * x - 1) ** k); // x 先換到 −1～1，矩陣比較好解
  const X = points.map(([x]) => feats(x));
  const A = Array.from({ length: degree + 1 }, (_, i) => Array.from({ length: degree + 1 }, (_, j) => X.reduce((s, row) => s + row[i] * row[j], 0) + (i === j && i > 0 ? lambda : 0)));
  const b = Array.from({ length: degree + 1 }, (_, i) => X.reduce((s, row, r) => s + row[i] * points[r][1], 0));
  const w = solveLinear(A, b);
  return { predict: (x) => feats(x).reduce((s, f, k) => s + f * w[k], 0), w };
}
const mseOf = (pts, f) => pts.reduce((s, [x, y]) => s + (f(x) - y) ** 2, 0) / pts.length;
Widgets.polyfit = {

/* ---------- autodiff：迷你自動微分，前向一步一步、反向一步一步 ---------- */
// props: { title, nodes: [{ id, op: 'leaf'|'add'|'mul'|'sub'|'tanh'|'relu'|'sq'|'sigmoid', args?, value? }] }
// nodes 要照「先算的在前面」排好；最後一個是輸出（通常是損失），反向從它的梯度＝1 開始
const AD_OPS = {
  add: { f: (a, b) => a + b, sym: '＋', grads: (a, b) => [1, 1] },
  sub: { f: (a, b) => a - b, sym: '−', grads: () => [1, -1] },
  mul: { f: (a, b) => a * b, sym: '×', grads: (a, b) => [b, a] },
  tanh: { f: (a) => Math.tanh(a), name: 'tanh', grads: (a) => [1 - Math.tanh(a) ** 2] },
  relu: { f: (a) => Math.max(0, a), name: 'ReLU', grads: (a) => [a > 0 ? 1 : 0] },
  sigmoid: { f: (a) => 1 / (1 + Math.exp(-a)), name: 'σ', grads: (a) => { const s = 1 / (1 + Math.exp(-a)); return [s * (1 - s)]; } },
  sq: { f: (a) => a * a, name: '平方', grads: (a) => [2 * a] },
};
const adFmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(3));
function autodiffTrace(nodes) {
  const val = {}; const grad = {};
  const steps = [];
  nodes.forEach((n) => {
    if (n.op === 'leaf') { val[n.id] = n.value; return; }
    const op = AD_OPS[n.op];
    const xs = n.args.map((a) => val[a]);
    val[n.id] = op.f(...xs);
    const expr = op.sym ? `${n.args[0]} ${op.sym} ${n.args[1]} ＝ ${adFmt(xs[0])} ${op.sym} ${adFmt(xs[1])}` : `${op.name}(${n.args[0]}) ＝ ${op.name}(${adFmt(xs[0])})`;
    steps.push({ phase: 'fwd', id: n.id, text: `前向：${n.id} ＝ ${expr} ＝ ${adFmt(val[n.id])}`, val: { ...val }, grad: {} });
  });
  nodes.forEach((n) => { grad[n.id] = 0; });
  const out = nodes[nodes.length - 1].id;
  grad[out] = 1;
  steps.push({ phase: 'bwd', id: out, text: `反向開始：∂${out}/∂${out} ＝ 1`, val: { ...val }, grad: { ...grad } });
  [...nodes].reverse().forEach((n) => {
    if (n.op === 'leaf') return;
    const op = AD_OPS[n.op];
    const xs = n.args.map((a) => val[a]);
    const local = op.grads(...xs);
    const parts = n.args.map((a, i) => { grad[a] += local[i] * grad[n.id]; return `${a}.grad ＋＝ ${adFmt(local[i])} × ${adFmt(grad[n.id])}`; });
    steps.push({ phase: 'bwd', id: n.id, text: `反向：${n.id} 的梯度分給輸入：${parts.join('；')}`, val: { ...val }, grad: { ...grad } });
  });
  return steps;
}
Widgets.autodiff = {
  render(props) {
    return `<div class="jw ad">
      <div class="jw-head"><span class="label" style="--chip:var(--m3)">自動微分</span><span class="grow">${esc(props.title || '先前向算值，再反向算梯度')}</span></div>
      ${stepperControls('自動微分控制')}
      <p class="rt-title ad-now" aria-live="polite"></p>
      <div class="ad-table"></div>
    </div>`;
  },
  hydrate(el, props) {
    const steps = autodiffTrace(props.nodes);
    makeStepper(el, steps.length, (s) => {
      const st = steps[s];
      $('.ad-now', el).innerHTML = `<span class="step">第 ${s + 1} 步 / 共 ${steps.length} 步・${st.phase === 'fwd' ? '前向' : '反向'}</span>${esc(st.text)}`;
      $('.ad-table', el).innerHTML = tableBlock({
        head: ['節點', '怎麼算', '值', '梯度 ∂輸出/∂節點'],
        rows: props.nodes.map((n) => {
          const how = n.op === 'leaf' ? '輸入／參數' : AD_OPS[n.op].sym ? `${n.args[0]} ${AD_OPS[n.op].sym} ${n.args[1]}` : `${AD_OPS[n.op].name}(${n.args[0]})`;
          const v = st.val[n.id];
          const g = st.grad[n.id];
          const mark = n.id === st.id ? '▶ ' : '';
          return [`${mark}${n.id}`, how, v === undefined ? '—' : adFmt(v), st.phase === 'bwd' && g !== undefined ? adFmt(g) : '—'];
        }),
      });
    }, { interval: 2200 });
  },
};

/* ---------- optim2d：同一個橢圓碗，SGD、動量、Adam 各走一條路 ---------- */
// props: { title, start: [x, y], k: 10, lr, steps }；f(x, y)＝0.5(x² ＋ k·y²)
function optimPaths(k, start, lr, steps) {
  const grad = ([x, y]) => [x, k * y];
  const f = ([x, y]) => 0.5 * (x * x + k * y * y);
  const sgd = [start]; let p = [...start];
  for (let t = 0; t < steps; t += 1) { const g = grad(p); p = [p[0] - lr * g[0], p[1] - lr * g[1]]; sgd.push(p); }
  const mom = [start]; p = [...start]; let v = [0, 0];
  for (let t = 0; t < steps; t += 1) { const g = grad(p); v = [0.9 * v[0] + g[0], 0.9 * v[1] + g[1]]; p = [p[0] - lr * v[0], p[1] - lr * v[1]]; mom.push(p); }
  const adam = [start]; p = [...start]; let m = [0, 0]; let s = [0, 0];
  for (let t = 1; t <= steps; t += 1) {
    const g = grad(p);
    m = m.map((mi, i) => 0.9 * mi + 0.1 * g[i]);
    s = s.map((si, i) => 0.999 * si + 0.001 * g[i] * g[i]);
    const mh = m.map((mi) => mi / (1 - 0.9 ** t));
    const sh = s.map((si) => si / (1 - 0.999 ** t));
    p = p.map((pi, i) => pi - lr * mh[i] / (Math.sqrt(sh[i]) + 1e-8));
    adam.push(p);
  }
  return { f, paths: [['SGD', sgd, 'm7'], ['動量', mom, 'm2'], ['Adam', adam, 'm3']] };
}

/* ---------- conv：3×3 卷積核滑過 7×7 的小圖 ---------- */
// props: { title, image: ['0011100', …], kernels: [{ name, k: [[…],[…],[…]] }] }
Widgets.conv = {
  render(props) {
    return `<div class="jw cv">
      <div class="jw-head"><span class="label" style="--chip:var(--m5)">卷積</span><span class="grow">${esc(props.title || '選一個卷積核，點輸出的一格看它怎麼算')}</span></div>
      ${chipGroup('卷積核', props.kernels.map((k, i) => [String(i), k.name]), 'data-cv-k', '0')}
      <div class="cv-wrap">
        <div><p class="sc-cap">輸入（7×7）</p><div class="cv-grid cv-in" style="--n:7"></div></div>
        <div><p class="sc-cap">卷積核（3×3）</p><div class="cv-grid cv-k" style="--n:3"></div></div>
        <div><p class="sc-cap">輸出（5×5）</p><div class="cv-grid cv-out" style="--n:5" role="group" aria-label="輸出的每一格，點一下看計算"></div></div>
      </div>
      <p class="cv-calc" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el, props) {
    const img = props.image.map((row) => [...row].map(Number));
    let ki = 0; let sel = [1, 1];
    function outAt(r, c, k) { let s = 0; for (let i = 0; i < 3; i += 1) for (let j = 0; j < 3; j += 1) s += img[r + i][c + j] * k[i][j]; return s; }
    function draw() {
      const k = props.kernels[ki].k;
      const out = Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (__, c) => outAt(r, c, k)));
      const maxAbs = Math.max(1, ...out.flat().map(Math.abs));
      $('.cv-in', el).innerHTML = img.flatMap((row, r) => row.map((v, c) => { const inWin = r >= sel[0] && r < sel[0] + 3 && c >= sel[1] && c < sel[1] + 3; return `<span class="cv-cell${v ? ' is-on' : ''}${inWin ? ' is-win' : ''}">${v}</span>`; })).join('');
      $('.cv-k', el).innerHTML = k.flat().map((v) => `<span class="cv-cell is-k">${+v.toFixed(2)}</span>`).join('');
      $('.cv-out', el).innerHTML = out.flatMap((row, r) => row.map((v, c) => `<button type="button" class="cv-cell cv-o${Math.abs(v) / maxAbs > 0.45 ? ' is-hot' : ''}${r === sel[0] && c === sel[1] ? ' is-win' : ''}" data-cv-o="${r},${c}" style="--p:${Math.round((Math.abs(v) / maxAbs) * 100)}%" aria-label="第 ${r + 1} 列第 ${c + 1} 欄：${+v.toFixed(2)}">${+v.toFixed(2)}</button>`)).join('');
      const terms = []; for (let i = 0; i < 3; i += 1) for (let j = 0; j < 3; j += 1) if (k[i][j] !== 0) terms.push(`${img[sel[0] + i][sel[1] + j]}×${+k[i][j].toFixed(2)}`);
      $('.cv-calc', el).innerHTML = md(`輸出第 ${sel[0] + 1} 列第 ${sel[1] + 1} 欄 ＝ 窗格內對應相乘再相加 ＝ ${terms.join(' ＋ ')} ＝ **${+outAt(sel[0], sel[1], k).toFixed(2)}**`);
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cv-k]');
      if (b) { ki = Number(b.dataset.cvK); pressOnly(el, 'data-cv-k', b.dataset.cvK); draw(); return; }
      const o = e.target.closest('[data-cv-o]');
      if (o) { sel = o.dataset.cvO.split(',').map(Number); draw(); }
    });
    draw();
  },
};

/* ---------- charlm：字元二元模型，數一數再抽字 ---------- */
// props: { title, corpus, start }；「訓練」＝數每個字後面接什麼字幾次
Widgets.charlm = {
  render(props, id) {
    return `<div class="jw cl">
      <div class="jw-head"><span class="label" style="--chip:var(--m1)">字元語言模型</span><span class="grow">${esc(props.title || '只看前一個字，猜下一個字')}</span></div>
      <p class="cl-corpus">${md(`訓練文字（${[...props.corpus].length} 字）：「${props.corpus.slice(0, 60)}${props.corpus.length > 60 ? '…' : ''}」`)}</p>
      <div class="jw-row"><label for="${id}-c">看這個字後面接什麼：</label><input id="${id}-c" class="fb-input cl-in" maxlength="1" value="${esc(props.start || [...props.corpus][0])}" style="width:4em"></div>
      <ol class="sp-bars cl-bars" aria-live="polite"></ol>
      <div class="lv-sliders"><div class="lv-row"><label for="${id}-t">temperature：<output data-cl-out></output></label><input type="range" id="${id}-t" data-cl-t min="0.2" max="2" step="0.1" value="1"></div></div>
      <div class="tw-controls" role="group" aria-label="產生文字"><button type="button" class="btn small primary nb-press" data-cl-gen>產生 40 個字</button></div>
      <p class="sp-sentence cl-out" aria-live="polite"></p>
    </div>`;
  },
  hydrate(el, props) {
    const chars = [...props.corpus];
    const counts = new Map();
    for (let i = 0; i < chars.length - 1; i += 1) {
      const a = chars[i]; const b = chars[i + 1];
      if (!counts.has(a)) counts.set(a, new Map());
      counts.get(a).set(b, (counts.get(a).get(b) || 0) + 1);
    }
    let t = 1;
    function dist(c) {
      const m = counts.get(c);
      if (!m) return [];
      const items = [...m.entries()].map(([ch, n]) => ({ ch, w: n ** (1 / t), n }));
      const total = items.reduce((s, x) => s + x.w, 0);
      return items.map((x) => ({ ...x, p: x.w / total })).sort((x, y) => y.p - x.p);
    }
    function drawBars() {
      const c = $('.cl-in', el).value || chars[0];
      const d = dist(c);
      $('.cl-bars', el).innerHTML = d.length ? d.slice(0, 6).map((x) => `<li class="sp-row"><code>${esc(x.ch === ' ' ? '空白' : x.ch)}</code><span class="lv-meter"><span class="lv-fill" style="transform:scaleX(${x.p.toFixed(3)})"></span></span><strong>${(x.p * 100).toFixed(0)}%（${x.n} 次）</strong></li>`).join('') : '<li>訓練文字裡沒有這個字後面接東西的紀錄</li>';
      $('[data-cl-out]', el).textContent = t.toFixed(1);
    }
    function generate() {
      let c = $('.cl-in', el).value || chars[0];
      let out = c;
      for (let i = 0; i < 40; i += 1) {
        const d = dist(c);
        if (!d.length) break;
        let r = Math.random();
        c = (d.find((x) => { r -= x.p; return r <= 0; }) || d[0]).ch;
        out += c;
      }
      $('.cl-out', el).textContent = out;
    }
    $('.cl-in', el).addEventListener('input', drawBars);
    el.addEventListener('input', (e) => { if (e.target.closest('[data-cl-t]')) { t = Number(e.target.value); drawBars(); } });
    el.addEventListener('click', (e) => { if (e.target.closest('[data-cl-gen]')) generate(); });
    drawBars();
  },
};
