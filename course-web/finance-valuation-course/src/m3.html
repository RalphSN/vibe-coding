function dcfValue(fcf, growth, years, termGrowth, rate, netDebt, shares) {
  let pv = 0; let f = fcf;
  for (let t = 1; t <= years; t += 1) { f *= 1 + growth; pv += f / (1 + rate) ** t; }
  const tv = (f * (1 + termGrowth)) / (rate - termGrowth);
  const tvPv = tv / (1 + rate) ** years;
  const ev = pv + tvPv;
  return { ev, tvShare: tvPv / ev, perShare: (ev - netDebt) / shares };
}
