      { type: 'heading', id: 't-settings', text: '1. 專案權限與 hook' },
      '放在 `.claude/settings.json` 並進版控。對應單元 3-3、4-2、5-3、5-4。',
      { type: 'code', lang: 'json', title: '.claude/settings.json', code: '{\n  "permissions": {\n    "allow": [\n      "Bash(npm run test *)",\n      "Bash(npm run lint *)",\n      "Bash(npx tsc --noEmit *)",\n      "Bash(npm ci)",\n      "Bash(git status *)",\n      "Bash(git diff *)",\n      "Bash(git log *)"\n    ],\n    "ask": [\n      "Bash(git push *)",\n      "Bash(npm install *)",\n      "Bash(npm i *)",\n      "mcp__github__create_*"\n    ],\n    "deny": [\n      "Read(./.env)",\n      "Read(./.env.*)",\n      "Read(./secrets/**)",\n      "Edit(/infra/prod/**)",\n      "Bash(git push --force *)",\n      "Bash(git push -f *)"\n    ]\n  },\n  "hooks": {\n    "PreToolUse": [\n      {\n        "matcher": "Edit|Write",\n        "hooks": [\n          {\n            "type": "command",\n            "command": "\\"$CLAUDE_PROJECT_DIR\\"/.claude/hooks/protect-files.sh"\n          }\n        ]\n      }\n    ]\n  },\n  "enabledPlugins": {\n    "security-guidance@claude-plugins-official": true\n  }\n}' },

      { type: 'heading', id: 't-hook', text: '2. 保護檔案的 hook' },
      '依官方範例改寫：先取檔名再比對，擋 `.env` 與 `.env.*`，不誤擋 `.envrc`。macOS／Linux 記得 `chmod +x`，需要 `jq`。對應單元 3-3。',
      { type: 'code', lang: 'bash', title: '.claude/hooks/protect-files.sh', code: '#!/bin/bash\n# 擋下對敏感檔案的編輯；exit 2 = 擋下，stderr 會回饋給 Claude\nINPUT=$(cat)\nFILE_PATH=$(echo "$INPUT" | jq -r \'.tool_input.file_path // empty\')\nFILE_PATH="${FILE_PATH//\\\\//}"\nBASENAME=$(basename "$FILE_PATH")\n\nif [[ "$BASENAME" == ".env" || "$BASENAME" == .env.* ]]; then\n  echo "Blocked: $FILE_PATH 是環境變數檔" >&2\n  exit 2\nfi\n\nfor pattern in "package-lock.json" ".git/" "migrations/"; do\n  if [[ "$FILE_PATH" == *"$pattern"* ]]; then\n    echo "Blocked: $FILE_PATH 符合保護規則 \'$pattern\'" >&2\n    exit 2\n  fi\ndone\n\nexit 0' },

      { type: 'heading', id: 't-sandbox', text: '3. 個人的 sandbox 設定' },
      '放在 `~/.claude/settings.json`，套用到你所有專案。macOS、Linux、WSL2 可用；原生 Windows 不支援。網域依你的工具調整。對應單元 4-3。',
      { type: 'code', lang: 'json', title: '~/.claude/settings.json', code: '{\n  "sandbox": {\n    "enabled": true,\n    "allowUnsandboxedCommands": false,\n    "network": {\n      "allowedDomains": ["registry.npmjs.org", "*.npmjs.org"]\n    },\n    "credentials": {\n      "files": [\n        { "path": "~/.aws/credentials", "mode": "deny" },\n        { "path": "~/.ssh", "mode": "deny" }\n      ],\n      "envVars": [\n        { "name": "GITHUB_TOKEN", "mode": "deny" },\n        { "name": "NPM_TOKEN", "mode": "deny" }\n      ]\n    }\n  }\n}' },

      { type: 'heading', id: 't-claudemd', text: '4. CLAUDE.md 骨架' },
      '只寫模型猜不到的事，控制在 200 行內。對應單元 1-3、1-4。',
      { type: 'code', lang: 'markdown', title: 'CLAUDE.md', code: '# shop-api\n\n## 指令\n- 測試：`npm run test`（單一檔案：`npm run test -- path/to/file`）\n- 型別檢查：`npx tsc --noEmit`\n- Lint：`npm run lint`\n\n## 慣例\n- 金額一律用整數「分」，不用浮點數\n- 錯誤回應用 `src/http/errors.ts` 的 `apiError()`\n- `src/gen/` 由 `npm run codegen` 產生，不要手改\n\n## 完成條件\n- 新功能要有測試；修 bug 先寫重現的失敗測試\n- 不要修改既有測試；認為測試錯了先停下來說明\n\n## 安全\n- 敏感檔案與危險指令由 .claude/settings.json 的 deny 規則與 hook 處理\n- 每個 API 都要檢查「這個使用者能不能存取這筆資料」' },

      { type: 'heading', id: 't-guidance', text: '5. 給安全審查的專案規則' },
      'security guidance plugin 的模型審查會讀這份。對應單元 5-2、5-4。',
      { type: 'code', lang: 'markdown', title: '.claude/claude-security-guidance.md', code: '# 這個 repo 的安全規則\n\n- `/admin` 路由在讀資料庫之前一定要呼叫 `requireRole("admin")`\n- 資料庫查詢一律參數化，並限定 `user_id` 或 `tenant_id`\n- 驗證、簽章檢查發生例外時一律回傳失敗（fail-closed）\n- 不要在 INFO 以上的 log 記錄 email、使用者 ID、request body\n- 比對 token 用 `crypto.timingSafeEqual`' },

      { type: 'heading', id: 't-agent', text: '6. 唯讀的安全審查 subagent' },
      '只給讀取工具。對應單元 3-2。',
      { type: 'code', lang: 'markdown', title: '.claude/agents/security-reviewer.md', code: '---\nname: security-reviewer\ndescription: 審查改動中的安全問題。主 session 完成一組改動後使用。\ntools: Read, Grep, Glob\nmodel: sonnet\n---\n\n讀取主 session 指定的檔案，找出：未驗證的外部輸入、字串拼接的查詢、\n缺少擁有者檢查的端點、fail-open 的錯誤處理、寫死的金鑰。\n只回報影響安全或正確性的問題，附檔名與行號；沒有就說沒有。' },

      { type: 'heading', id: 't-ci', text: '7. 只審查、不修改的 PR workflow' },
      '權限只有讀取。對應單元 7-1。',
      { type: 'code', lang: 'yaml', title: '.github/workflows/claude-review.yml', code: 'name: Claude Review\non:\n  pull_request:\n    types: [opened, synchronize, ready_for_review]\njobs:\n  review:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    permissions:\n      contents: read\n      pull-requests: read\n      id-token: write\n    steps:\n      - uses: actions/checkout@v6\n        with:\n          fetch-depth: 1\n      - uses: anthropics/claude-code-action@v1\n        with:\n          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}\n          prompt: "審查這個 PR 的安全與正確性問題，只在 workflow log 回報，不要修改任何檔案。"\n          claude_args: "--max-turns 8"' },

      { type: 'heading', id: 't-managed', text: '8. 組織的 managed settings' },
      '由管理員透過後台、MDM 或 managed-settings.json 下發。對應單元 4-4、7-3。',
      { type: 'code', lang: 'json', title: 'managed-settings.json', code: '{\n  "permissions": {\n    "disableBypassPermissionsMode": "disable",\n    "deny": [\n      "Read(~/.ssh/**)",\n      "Read(~/.aws/**)",\n      "Bash(git push --force *)"\n    ]\n  },\n  "env": {\n    "CLAUDE_CODE_ENABLE_TELEMETRY": "1",\n    "OTEL_METRICS_EXPORTER": "otlp",\n    "OTEL_EXPORTER_OTLP_PROTOCOL": "grpc",\n    "OTEL_EXPORTER_OTLP_ENDPOINT": "http://collector.example.com:4317"\n  }\n}' },

      { type: 'heading', id: 't-checklist', text: '9. 上線前檢查清單' },
      { type: 'svg', svg: `<svg viewBox="0 0 560 420" role="img" aria-label="上線前流程：寫的當下有 security guidance 與 hook；完成後跑測試、型別與 lint；開 PR 前跑 /security-review 與 /code-review；PR 上有 Code Review 與 CI 掃描；人審查後合併">
        <g font-size="22">
          <rect x="10" y="10" width="540" height="64" style="fill:var(--m8)" class="stroke-ink" stroke-width="4"/><text x="30" y="50" font-weight="900" class="on-color">寫的當下：security guidance＋hook</text>
          <rect x="10" y="94" width="540" height="64" class="fill-surface stroke-ink" stroke-width="4"/><text x="30" y="134" font-weight="900">完成：測試、型別、lint 全過</text>
          <rect x="10" y="178" width="540" height="64" style="fill:var(--m8)" class="stroke-ink" stroke-width="4"/><text x="30" y="218" font-weight="900" class="on-color">開 PR 前：/security-review、/code-review</text>
          <rect x="10" y="262" width="540" height="64" class="fill-surface stroke-ink" stroke-width="4"/><text x="30" y="302" font-weight="900">PR：Code Review＋CI 掃描</text>
          <rect x="10" y="346" width="540" height="64" style="fill:var(--primary)" class="stroke-ink" stroke-width="4"/><text x="30" y="386" font-weight="900" class="on-color">人審查 diff 後合併</text>
        </g>
        <path d="M280 74 V94 M280 158 V178 M280 242 V262 M280 326 V346" class="stroke-ink" stroke-width="4"/>
      </svg>`, caption: '最後一格永遠是人。前面每一層都在讓這一格的工作變少，不是取代它。' },
      { type: 'widget', name: 'checklist', props: { key: 'ship', items: [
        '`.claude/settings.json` 的 deny 規則涵蓋 `.env`、`secrets/`、force push',
        'protect-files hook 用「該擋」與「該放」的檔名各測過一次',
        '這次新增的套件都查證過名稱、下載量、維護狀態，lockfile 的 diff 看過',
        '測試、型別檢查、lint 全過；UI 改動在手機與桌面寬度實際看過',
        '每個新的 API 都檢查了「這個使用者能不能存取這筆資料」',
        '錯誤處理是 fail-closed，log 裡沒有個資與秘密',
        '`/security-review` 跑過，發現的問題都處理或說明了',
        '沒有秘密被 commit；若有，已撤銷並重發',
        'PR 的 diff 由人看過，包含測試檔的變更',
      ] } },
    ],
  },

      { type: 'quiz', key: '8-2:final', items: [
        { from: '1-1', type: 'mc', q: 'Claude 用 `rm -rf dist/` 刪掉了建置結果。下列哪個方式可以把它救回來？', options: [
          { text: '重新執行建置指令產生，或從 git 還原被追蹤的檔案', correct: true, why: 'bash 的刪除不在 checkpoint 範圍內；產生的檔案重建即可，被追蹤的檔案用 git 還原。' },
          { text: '`/rewind` 回到刪除之前', why: 'rewind 只還原檔案工具的編輯，bash 的變更不在內。' },
          { text: '按兩下 Esc 選擇還原程式碼', why: '和 `/rewind` 是同一個功能，範圍一樣。' },
          { text: '請 Claude 從 context 裡把檔案內容寫回來', why: '它通常沒有讀過 dist 裡的每個檔案，寫回來的也不可靠。' },

          { text: '金額一律用整數「分」儲存', why: '專案慣例，適合 CLAUDE.md。' },

        ] },

  return {
    get: () => state,
    persistent: () => isPersistent,

}

/* ---------- 文字處理：先跳脫，再套用輕量標記 ---------- */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

}
/**
 * 內文標記：**粗體**、==螢光==、`程式碼`、{kbd:按鍵}、[[術語]] 或 [[術語|顯示文字]]、[文字](網址)

function md(str) {

const wordSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null;

  const text = rawText.replace(LATIN_RUN, (run) => (run.length <= MAX_GLUED_LATIN ? run.replace(/ /g, ' ') : run));
  if (!wordSegmenter) return esc(text);
  return [...wordSegmenter.segment(text)]
    .map(({ segment, isWordLike }) => (isWordLike && HAN.test(segment) ? `<span class="word">${esc(segment)}</span>` : esc(segment)))

function collectText(value) {

  if (Array.isArray(value)) return value.map(collectText).join('');
  if (typeof value === 'object') {

/* ---------- 主題切換：跟隨系統 → 淺色 → 深色 ---------- */

/* ---------- 可拖曳寬度的側欄（components.md 第 1 節） ---------- */
const SIDEBAR_WIDTH = { min: 224, max: 480, step: 16, fallback: 288 };
const Resizer = (() => {
  const root = document.documentElement;
  const handle = $('.sidebar-resizer');
  const maxWidth = () => Math.min(SIDEBAR_WIDTH.max, Math.round(window.innerWidth * 0.4));
  function apply(px) {

/* ---------- 孤行處理：動態縮小字級（line-breaking.md 2.5） ---------- */
const FIT = { minScale: 0.8, step: 0.05, shortChars: 2 };

const FIT_TARGETS = '.lesson-head h1, .card-title, .lesson-nav .ttl';
function measureLines(element) {
  const chars = [];
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    for (let i = 0; i < node.length; i += 1) {
      if (!node.data[i].trim()) continue;

      range.setStart(node, i);

          <span class="t">${renderPhrases(mod.title)}</span>
          <span class="count">${done}/${total}</span>
          <span class="caret" aria-hidden="true">▸</span>
        </button>
        <div class="collapse" id="nav-m${mod.id}" data-open="${isOpen}"><div class="collapse-inner">
          <ul class="nav-lessons">
          ${mod.lessons.map((l) => {
            const st = lessonState(l.id);
            const current = l.id === currentLessonId ? ' aria-current="page"' : '';
            return `<li><a class="nav-link" href="#/l/${l.id}"${current}>
              <span class="status" data-state="${st}" role="img" aria-label="${STATE_TEXT[st]}"></span>
              <span class="lid">${l.id}</span><span class="ttl">${renderPhrases(l.title)}</span></a></li>`;
          }).join('')}
          </ul>
        </div></div>
      </div>`);
  });
  $('#nav').innerHTML = html.join('');
}

function updateTopProgress() {
  const { done, total } = overallProgress();
  $('#top-progress-fill').parentElement.style.setProperty('--p', done / total);
  $('#top-progress-text').textContent = `${done} / ${total}`;
}

const Drawer = (() => {
  const sidebar = () => $('#sidebar');
  const isDesktop = () => window.matchMedia('(min-width: 1280px)').matches;
  let lastFocus = null;
  function open() {
    if (isDesktop()) return;
    lastFocus = document.activeElement;
    sidebar().classList.add('open');
    $('#scrim').dataset.open = 'true';
    $('.menu-btn').setAttribute('aria-expanded', 'true');
    const current = $('.nav-link[aria-current="page"]', sidebar()) || $('.sidebar-close');
    window.setTimeout(() => current.focus(), 50);
  }
  function close(restoreFocus = true) {
    if (!sidebar().classList.contains('open')) return;
    sidebar().classList.remove('open');
    $('#scrim').dataset.open = 'false';
    $('.menu-btn').setAttribute('aria-expanded', 'false');
    if (restoreFocus && lastFocus) lastFocus.focus();
  }
  function trap(e) {
    if (e.key !== 'Tab' || !sidebar().classList.contains('open')) return;
    const focusables = $$('button, a[href]', sidebar()).filter((el) => el.offsetParent !== null && !el.closest('.collapse[data-open="false"]'));
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  return { open, close, trap, isOpen: () => sidebar().classList.contains('open') };
})();

/* ---------- 路由 ---------- */
function parseRoute() {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] === 'l' && LESSON_BY_ID[parts[1]]) return { name: 'lesson', id: parts[1] };
  if (parts[0] === 'm' && COURSES[Number(parts[1])]) return { name: 'module', id: Number(parts[1]) };
  if (parts[0] === 'styleguide') return { name: 'styleguide' };
  if (parts[0] === 'references') return { name: 'references' };
  if (parts.length === 0) return { name: 'home' };
  return { name: 'notfound', raw: hash };
}

const Views = {};

function render() {
  const route = parseRoute();
  currentLessonId = route.name === 'lesson' ? route.id : null;
  const main = $('#main');
  const view = Views[route.name] || Views.notfound;
  main.innerHTML = view(route);
  $('#toc').innerHTML = route.name === 'lesson' ? renderToc(route.id) : '';
  // 沒有本課目錄的頁面（首頁、模組頁），不保留右側空欄
  $('.layout').classList.toggle('no-toc', !$('#toc').innerHTML.trim());
  if (!prefersReducedMotion()) {
    main.classList.remove('view-enter');
    void main.offsetWidth;
    main.classList.add('view-enter');
  }
  if (route.name === 'lesson') {
    Store.update((s) => { s.visited[route.id] = true; });
    document.title = `${route.id} ${LESSON_BY_ID[route.id].plain}｜${SITE.name}`;
  } else if (route.name === 'module') {
    document.title = `模組 ${route.id} ${plainTitle(COURSES[route.id].title)}｜${SITE.name}`;
  } else {
    document.title = SITE.name;
  }
  renderNav();
  updateTopProgress();
  Drawer.close(false);
  hydrate(main);
  focusHeading(main);
  scheduleFit();
}

function focusHeading(main) {
  const h1 = $('h1', main);
  if (!h1) return;
  h1.setAttribute('tabindex', '-1');
  if (window.scrollY > 0) window.scrollTo(0, 0);
  h1.focus({ preventScroll: true });
}

/* ---------- 單元頁 ---------- */
const SECTION_DEFS = [
  ['goals', '這課你會學到 3 件事'],
  ['review', '暖身回顧'],
  ['analogy', '比喻'],
  ['model', '心智模型'],
  ['define', '正式定義'],
  ['examples', '範例'],
  ['mistakes', '常見錯誤'],
  ['practice', '練習'],
  ['keypoints', '三個重點'],
];

/* 單元各段的渲染函式由元件區提供；這裡是退回用的簡單版本 */
const Sections = {
  goals: (c) => `<ol class="goals">${c.goals.map((g) => `<li><span class="goal-text">${md(g)}</span></li>`).join('')}</ol>`,
};

function lessonSections(lesson) {
  const c = lesson.content;
  return SECTION_DEFS.filter(([key]) => {
    if (c.layout === 'reference') return false;
    const v = c[key];
    return v != null && (!Array.isArray(v) || v.length > 0);
  });
}

function renderToc(id) {
  const lesson = LESSON_BY_ID[id];
  if (!lesson.content) return '';
  const secs = lesson.content.layout === 'reference'
    ? (lesson.content.blocks || []).filter((b) => b.type === 'heading').map((b) => [b.id, b.text])
    : lessonSections(lesson);
  if (!secs.length) return '';
  return `<span class="label" style="--chip:var(--m${lesson.moduleId})">本課段落</span>
    <ol>${secs.map(([key, label]) => `<li><a href="#/l/${id}" data-scroll="sec-${key}">${esc(label)}</a></li>`).join('')}</ol>`;
}

Views.lesson = ({ id }) => {
  const lesson = LESSON_BY_ID[id];
  const mod = COURSES[lesson.moduleId];
  const pos = LESSONS.indexOf(lesson);
  const prev = LESSONS[pos - 1];
  const next = LESSONS[pos + 1];
  const min = readingMinutes(lesson);
  const modP = moduleProgress(mod);
  const c = lesson.content;
  const isDone = !!Store.get().done[id];

  let body;
  if (!c) {
    body = '<div class="placeholder"><span class="label" style="--chip:var(--warning)">製作中</span><p style="margin-top:var(--sp-3)">這個單元的內容還在製作。</p></div>';
  } else if (c.layout === 'reference') {
    body = (Sections.reference ? Sections.reference(c, lesson) : '');
  } else {
    body = lessonSections(lesson).map(([key, label]) => {
      const fn = Sections[key];
      const inner = fn ? fn(c, lesson) : '';
      return `<section class="lsec" id="sec-${key}" aria-labelledby="h-${key}">
        <h2 id="h-${key}"><span class="label" style="--chip:var(--m${mod.id})">${esc(label)}</span></h2>
        ${inner}
      </section>`;
    }).join('');
  }

  const sources = c && c.sources && Sections.sources ? Sections.sources(c) : '';

  return `
  <article class="content" style="--chip:var(--m${mod.id})">
    <header class="lesson-head">
      <div class="lesson-meta">
        <a class="label" href="#/m/${mod.id}">模組 ${mod.id}・${esc(mod.short)}</a>
        <span class="meta-group">單元 ${lesson.index + 1} / ${mod.lessons.length}</span>
        <span class="meta-group"><span class="progress" style="--p:${(modP.done) / modP.total};--fill:var(--m${mod.id})" role="progressbar" aria-label="本模組進度" aria-valuemin="0" aria-valuemax="${modP.total}" aria-valuenow="${modP.done}"><span></span></span>已完成 ${modP.done} / ${modP.total}</span>
        ${min ? `<span class="meta-group">閱讀約 ${min} 分鐘</span>` : ''}
      </div>
      <span class="lid-big">${lesson.id}</span>
      <h1>${renderPhrases(lesson.title)}</h1>
    </header>
    ${body}
    ${sources}
    ${c ? `<div class="done-row" id="done-row">
      ${isDone
        ? `<span class="stamp">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
        : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完、做完練習後按一下。</span>`}
    </div>` : ''}
    <nav class="lesson-nav" aria-label="上一課與下一課">
      ${prev ? `<a class="prev nb-press" href="#/l/${prev.id}" rel="prev"><span class="dir">← 上一課</span><span class="ttl">${renderPhrases(`${prev.id} ${prev.title}`)}</span></a>` : ''}
      ${next ? `<a class="next nb-press" href="#/l/${next.id}" rel="next"><span class="dir">下一課 →</span><span class="ttl">${renderPhrases(`${next.id} ${next.title}`)}</span></a>` : ''}
    </nav>
  </article>`;
};

/* ---------- 全域事件 ---------- */
function onClick(e) {
  const moduleBtn = e.target.closest('.nav-module-btn');
  if (moduleBtn) {
    const id = moduleBtn.dataset.module;
    const panel = document.getElementById(`nav-m${id}`);
    const willOpen = panel.dataset.open !== 'true';
    panel.dataset.open = String(willOpen);
    moduleBtn.setAttribute('aria-expanded', String(willOpen));
    Store.update((s) => { s.openModules[id] = willOpen; });
    return;
  }
  const fontBtn = e.target.closest('[data-font]');
  if (fontBtn) { changeFont(fontBtn.dataset.font); return; }
  const scrollLink = e.target.closest('[data-scroll]');
  if (scrollLink) {
    e.preventDefault();
    const target = document.getElementById(scrollLink.dataset.scroll);
    if (target) {
      target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      const heading = $('h2', target) || target;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const { action: name, id } = action.dataset;
  if (name === 'done') markDone(id, true);
  if (name === 'undone') markDone(id, false);
  if (name === 'reset' && window.confirm('確定要清除所有學習進度與測驗紀錄嗎？字級與目錄寬度不會被清除。')) {
    Store.reset();
    render();
    announce('學習進度已清除');
  }
}

function markDone(id, isDone) {
  Store.update((s) => { if (isDone) s.done[id] = true; else delete s.done[id]; });
  const row = $('#done-row');
  if (row) {
    row.innerHTML = isDone
      ? `<span class="stamp animate">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
      : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完、做完練習後按一下。</span>`;
    const focusTarget = $('button', row);
    if (focusTarget) focusTarget.focus();
  }
  renderNav();
  updateTopProgress();
  announce(isDone ? `${id} 已標記為完成` : `${id} 已改回未完成`);
}

function isTyping(el) {
  return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function onKeydown(e) {
  if (e.key === 'Escape' && Drawer.isOpen()) { Drawer.close(); return; }
  Drawer.trap(e);
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || isTyping(document.activeElement)) return;
  if (document.activeElement && document.activeElement.closest('[role="tablist"], .loop-controls, .tw-controls, .anat-input, .cls-btns, [role="listbox"], [role="separator"], input[type="range"], [role="radiogroup"]')) return;
  const route = parseRoute();
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && route.name === 'lesson') {
    const pos = LESSONS.findIndex((l) => l.id === route.id);
    const target = LESSONS[pos + (e.key === 'ArrowRight' ? 1 : -1)];
    if (target) { e.preventDefault(); window.location.hash = `#/l/${target.id}`; }
  }
}

/* 對外開放給元件區使用 */
window.App = { $, $$, esc, md, Store, Prefs, Sections, Views, Hydrators, announce, render, renderNav, updateTopProgress, prefersReducedMotion, isTyping, readingMinutes, renderPhrases, scheduleFit, fitAll, measureLines, currentLessonId: () => currentLessonId };

document.addEventListener('click', onClick);
document.addEventListener('keydown', onKeydown);
$('.menu-btn').addEventListener('click', () => Drawer.open());
$('.sidebar-close').addEventListener('click', () => Drawer.close());
$('#scrim').addEventListener('click', () => Drawer.close());
$('#theme-btn').addEventListener('click', cycleTheme);
$$('.theme-side-btn').forEach((b) => b.addEventListener('click', cycleTheme));
window.addEventListener('hashchange', render);
// 換課動畫結束就拿掉 class：留著的 transform 會讓 main 變成 fixed 元素的定位基準
$('#main').addEventListener('animationend', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('view-enter'); });

/* 元件區載入後再進行第一次渲染 */
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  applyFontScale(currentFontScale(), false);
  renderFooter();
  render();
  new ResizeObserver(scheduleFit).observe($('#main'));
  // 頂部列的實際高度會隨斷點、字級改變，量出來寫回 --topbar-h，讓側欄、把手、捲動定位都貼齊它的底線
  syncTopbarHeight();
  window.addEventListener('resize', syncTopbarHeight);
  new ResizeObserver(syncTopbarHeight).observe($('.topbar'), { box: 'border-box' }); // padding 在不同斷點會變，要看外框高度
  if (document.fonts) document.fonts.ready.then(scheduleFit);
});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/powershell.min.js" integrity="sha512-I2sYcyooqG4MUbNURH1azVlcuwqA4uxCFT9tLOXIhrvwrosPpNrE0Zz0AYdjRaGPacIrJTwnTut5CzB6VNc6Hw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script>
/* ==========================================================================
   共用元件
   ========================================================================== */
(() => {
'use strict';
const { $, $$, esc, md, Store, Sections, Views, Hydrators, announce, prefersReducedMotion, isTyping, renderPhrases } = window.App;

let uidCounter = 0;
const uid = (prefix = 'u') => `${prefix}${++uidCounter}`;
const COPY_TEXT = new Map();
const LANG_ALIAS = { text: 'plaintext', prompt: 'plaintext', toml: 'ini', jsonc: 'json', sh: 'bash', zsh: 'bash', shell: 'bash', yml: 'yaml', md: 'markdown', js: 'javascript', ts: 'typescript', ps1: 'powershell', py: 'python' };
const LANG_LABEL = { plaintext: 'TEXT', bash: 'BASH', json: 'JSON', python: 'PYTHON', typescript: 'TYPESCRIPT', javascript: 'JAVASCRIPT', markdown: 'MARKDOWN', yaml: 'YAML', xml: 'XML', ini: 'TOML', powershell: 'POWERSHELL', sql: 'SQL', dockerfile: 'DOCKERFILE' };

/* 單元內容裡定義的術語，自動加進術語表 */
LESSONS.forEach((lesson) => {
  const defs = lesson.content && lesson.content.define;
  if (!defs) return;
  defs.forEach((d) => {
    if (!GLOSSARY[d.term]) GLOSSARY[d.term] = { en: d.en, def: d.def, example: d.example, lesson: lesson.id };
    else if (!GLOSSARY[d.term].lesson) GLOSSARY[d.term].lesson = lesson.id;
  });
});

/* ---------- 區塊渲染 ---------- */
function renderBlocks(blocks) {
  if (blocks == null) return '';
  const list = Array.isArray(blocks) ? blocks : [blocks];
  return list.map(renderBlock).join('');
}

function renderBlock(b) {
  if (typeof b === 'string') return `<p>${md(b)}</p>`;
  switch (b.type) {
    case 'list': {
      const tag = b.ordered ? 'ol' : 'ul';
      return `<${tag}>${b.items.map((i) => `<li>${md(i)}</li>`).join('')}</${tag}>`;
    }
    case 'code': return codeBlock(b);
    case 'table': return tableBlock(b);
    case 'callout': return `<div class="callout ${esc(b.variant || 'tip')}"><span class="label">${md(b.title || '')}</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'unverified': return `<div class="callout unverified"><span class="label">截至 2026-10 查證狀態：未確認</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'timely': return `<div class="callout timely"><span class="label">時效提醒</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'legacy': return legacyBlock(b);
    case 'svg': return `<figure class="figure">${b.svg}${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure>`;
    case 'compare': return compareBlock(b);
    case 'tabs': return tabsBlock(b);
    case 'reveal': return `<details class="reveal"><summary>${esc(b.summary || '展開')}</summary><div class="reveal-body blocks">${renderBlocks(b.body)}</div></details>`;
    case 'quiz': return quizList(b.items, b.key || uid('qz'));
    case 'widget': return renderWidget(b);
    case 'heading': return `<h2 class="ref-h" id="sec-${esc(b.id)}"><span class="label">${esc(b.text)}</span></h2>`;
    case 'tryit': return tryitBlock(b);
    default:
      console.error('未知的區塊類型：', b);
      return '';
  }
}

function codeBlock({ lang = 'text', code, title }) {
  const resolved = LANG_ALIAS[lang] || lang;
  const id = uid('code');
  COPY_TEXT.set(id, code);
  return `<div class="code">
    <div class="code-head"><span class="lang">${esc(LANG_LABEL[resolved] || resolved)}</span><span class="ttl">${esc(title || '')}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${title ? ` ${esc(title)}` : '程式碼'}">複製</button></div>
    <pre tabindex="0" aria-label="${esc(title || '程式碼')}"><code class="language-${esc(resolved)}">${esc(code)}</code></pre>
  </div>`;
}

function tableBlock({ head, rows, caption }) {
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption || '表格')}"><table>
    ${caption ? `<caption>${md(caption)}</caption>` : ''}
    <thead><tr>${head.map((h) => `<th scope="col">${md(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => (i === 0 ? `<th scope="row">${md(cell)}</th>` : `<td>${md(cell)}</td>`)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function legacyBlock({ title, rows, note }) {
  return `<div class="callout legacy"><span class="label">${esc(title || '舊做法 → 現在的做法')}</span><div class="body">
    <div class="legacy-grid">${rows.map(([oldWay, newWay]) => `<div class="legacy-row"><div class="old">${md(oldWay)}</div><div class="arrow" aria-hidden="true">→</div><div class="new"><span class="visually-hidden">現在：</span>${md(newWay)}</div></div>`).join('')}</div>
    ${note ? `<p style="margin-top:var(--sp-3)">${md(note)}</p>` : ''}
  </div></div>`;
}

/* ---------- 對照器：prompt、設定檔、指令都適用 ---------- */
const DIFF_RE = /\{\{(\d+):([\s\S]+?)\}\}/g;
function promptHtml(text) { return esc(text).replace(DIFF_RE, '<mark class="diff" data-n="$1">$2</mark>'); }
function promptPlain(text) { return text.replace(DIFF_RE, '$2'); }

function compareSide(kind, label, text, ctx, result, isCode) {
  const id = uid('cmp');
  COPY_TEXT.set(id, promptPlain(text));
  return `<div class="compare-side ${kind}">
    <div class="side-head"><span class="label">${esc(label)}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${esc(label)}">複製</button></div>
    <pre class="prompt-text${isCode ? ' is-code' : ''}">${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${promptHtml(text)}</pre>
    ${result ? `<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)"><strong>${kind === 'bad' ? '可能的結果' : '得到的結果'}：</strong>${md(result)}</p>` : ''}
  </div>`;
}

function compareBlock(b) {
  return `<div class="compare side-by-side">
    ${b.title ? `<div class="compare-title"><span class="label">${esc(b.kind || '對照')}</span>${md(b.title)}</div>` : ''}
    <div class="compare-grid">
      ${compareSide('bad', b.badLabel || '✗ 壞做法', b.bad, b.badCtx, b.badResult, b.code)}
      ${compareSide('good', b.goodLabel || '✓ 好做法', b.good, b.goodCtx, b.goodResult, b.code)}
    </div>
    ${b.why && b.why.length ? `<div class="why"><strong>差在哪裡</strong><ol>${b.why.map((w, i) => `<li><span class="n">${i + 1}</span><span>${md(w)}</span></li>`).join('')}</ol></div>` : ''}
  </div>`;
}

function tryitBlock(t) {
  return `<div class="tryit"><span class="label">換你補完</span>
    <div class="blocks">${renderBlocks(t.q)}</div>
    ${t.draft ? `<pre class="prompt-text${t.code ? ' is-code' : ''}" style="margin-top:var(--sp-3)">${esc(t.draft).replace(/____/g, '<span class="blank" aria-label="空格">　</span>')}</pre>` : ''}
    <details class="reveal" style="margin-top:var(--sp-4)"><summary>我寫好了，看參考答案</summary><div class="reveal-body blocks">${renderBlocks(t.answer)}</div></details>
  </div>`;
}

/* ---------- 分頁：舊面板淡出後，新面板淡入 ---------- */
function tabsBlock({ tabs, label }) {
  const base = uid('tabs');
  return `<div class="tabs">
    <div class="tablist" role="tablist" aria-label="${esc(label || '分頁')}">
      ${tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="${base}-t${i}" aria-controls="${base}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(t.label)}</button>`).join('')}
    </div>
    ${tabs.map((t, i) => `<div class="tabpanel blocks" role="tabpanel" id="${base}-p${i}" aria-labelledby="${base}-t${i}" tabindex="0" ${i === 0 ? '' : 'hidden'}>${renderBlocks(t.blocks)}</div>`).join('')}
  </div>`;
}
const TAB_LEAVE_MS = 120;
function selectTab(tab) {
  if (tab.getAttribute('aria-selected') === 'true') return;
  const list = tab.closest('[role="tablist"]');
  const tabs = $$('[role="tab"]', list);
  const oldTab = tabs.find((t) => t.getAttribute('aria-selected') === 'true');
  tabs.forEach((t) => {
    const selected = t === tab;
    t.setAttribute('aria-selected', String(selected));
    t.tabIndex = selected ? 0 : -1;
  });
  const newPanel = document.getElementById(tab.getAttribute('aria-controls'));
  const oldPanel = oldTab ? document.getElementById(oldTab.getAttribute('aria-controls')) : null;
  const swap = () => {
    if (oldPanel) { oldPanel.hidden = true; oldPanel.classList.remove('is-leaving'); }
    newPanel.hidden = false;
  };
  if (!oldPanel || prefersReducedMotion()) { swap(); return; }
  oldPanel.classList.add('is-leaving');
  window.setTimeout(swap, TAB_LEAVE_MS);
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) selectTab(tab);
});
document.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]'));
  const i = tabs.indexOf(tab);
  const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const next = tabs[(moves[e.key] + tabs.length) % tabs.length];
  selectTab(next);
  next.focus();
});

/* ---------- 測驗：每個選項都有解析，選項依 key 固定打亂 ---------- */
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 同一題每次載入順序一樣，存下來的答案才對得上；不同題順序不同 */
function shuffledOrder(n, key) {
  const order = Array.from({ length: n }, (_, i) => i);
  let seed = hashString(key) || 1;
  for (let i = n - 1; i > 0; i -= 1) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = seed % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

function quizList(items, keyBase) {
  return `<div class="quiz-list">${items.map((item, i) => quizItem(item, `${keyBase}:${i}`)).join('')}</div>`;
}

function quizHead(item) {
  const parts = [];
  if (item.level) parts.push(`<span class="label lv" data-lv="${esc(item.level)}">${esc(item.level)}</span>`);
  if (item.from && LESSON_BY_ID[item.from]) parts.push(`<a class="label review-from" href="#/l/${item.from}">回顧 ${esc(item.from)}</a>`);
  return parts.length ? `<div class="quiz-head">${parts.join('')}</div>` : '';
}

function quizItem(item, key) {
  if (item.type === 'mc') {
    QUIZ_REGISTRY.set(key, item);
    const order = shuffledOrder(item.options.length, key);
    return `<form class="quiz" data-quiz="${esc(key)}" novalidate>
      ${quizHead(item)}
      <fieldset><legend>${md(item.q)}</legend>
        <div class="opts">${order.map((oi) => `<label class="opt" data-oi="${oi}"><input type="radio" name="${esc(key)}" value="${oi}"><span>${md(item.options[oi].text)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div>
      </fieldset>
      <div class="quiz-actions"><button type="submit" class="btn primary nb-press">送出答案</button><button type="button" class="btn small nb-press" data-quiz-reset hidden>重做這題</button></div>
      <div class="quiz-feedback" hidden></div>
    </form>`;
  }
  return `<div class="quiz" data-reveal="${esc(key)}">
    ${quizHead(item)}
    <div class="quiz-q blocks">${renderBlocks(item.q)}</div>
    <details class="reveal"><summary>我想好了，看答案</summary><div class="reveal-body blocks">${renderBlocks(item.answer)}</div></details>
  </div>`;
}

const QUIZ_REGISTRY = new Map();
const correctIndex = (item) => item.options.findIndex((o) => o.correct);

function showQuizResult(form, item, choice) {
  const answer = correctIndex(item);
  const isCorrect = choice === answer;
  form.classList.add('answered');
  const displayOrder = $$('.opt', form).map((opt) => Number(opt.dataset.oi));
  $$('.opt', form).forEach((opt) => {
    const oi = Number(opt.dataset.oi);
    const input = $('input', opt);
    input.checked = oi === choice;
    input.disabled = true;
    opt.classList.toggle('is-correct', oi === answer);
    opt.classList.toggle('is-wrong', oi === choice && !isCorrect);
    $('.mark', opt).textContent = oi === answer ? '✓ 正確' : (oi === choice ? '✗ 你的選擇' : '');
  });
  // 選中的解析放最上面，其他依畫面順序
  const explainOrder = [choice, ...displayOrder.filter((oi) => oi !== choice)];
  const items = explainOrder.map((oi) => {
    const o = item.options[oi];
    const tag = oi === answer
      ? '<span class="label" style="--chip:var(--success)">✓ 正確答案</span>'
      : '<span class="label" style="--chip:var(--danger)">✗ 錯誤選項</span>';
    const picked = oi === choice ? '<span class="label" style="--chip:var(--highlight)">你選的</span>' : '';
    return `<li class="${oi === choice ? 'is-picked' : ''}">${tag}${picked}<span class="opt-text">${md(o.text)}</span>${md(o.why || '')}</li>`;
  }).join('');
  const fb = $('.quiz-feedback', form);
  fb.innerHTML = `<p class="verdict">${isCorrect ? '✓ 答對了' : '✗ 答錯了，正確答案已標示'}</p><ol class="explain-list">${items}</ol>`;
  fb.hidden = false;
  $('[type="submit"]', form).hidden = true;
  $('[data-quiz-reset]', form).hidden = false;
  return isCorrect;
}

function resetQuiz(form) {
  form.classList.remove('answered');
  $$('.opt', form).forEach((opt) => {
    const input = $('input', opt);
    input.checked = false; input.disabled = false;
    opt.classList.remove('is-correct', 'is-wrong');
    $('.mark', opt).textContent = '';
  });
  $('.quiz-feedback', form).hidden = true;
  $('[type="submit"]', form).hidden = false;
  $('[data-quiz-reset]', form).hidden = true;
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form.quiz');
  if (!form) return;
  e.preventDefault();
  const key = form.dataset.quiz;
  const item = QUIZ_REGISTRY.get(key);
  const picked = $('input:checked', form);
  const fb = $('.quiz-feedback', form);
  if (!item) { console.error('找不到測驗題目：', key); return; }
  if (!picked) {
    fb.innerHTML = '<p class="verdict">先選一個答案再送出。</p>';
    fb.hidden = false;
    $('input', form).focus();
    return;
  }
  const choice = Number(picked.value);
  const isCorrect = showQuizResult(form, item, choice);
  Store.update((s) => { s.quiz[key] = { choice, correct: isCorrect }; });
  announce(isCorrect ? '答對了' : '答錯了，正確答案已標示');
  fb.setAttribute('tabindex', '-1');
  fb.focus({ preventScroll: false });
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-quiz-reset]');
  if (!btn) return;
  const form = btn.closest('form.quiz');
  resetQuiz(form);
  Store.update((s) => { delete s.quiz[form.dataset.quiz]; });
  $('input', form).focus();
});
document.addEventListener('toggle', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-reveal]');
  if (wrap && e.target.open) Store.update((s) => { s.quiz[wrap.dataset.reveal] = { viewed: true }; });
}, true);

Hydrators.push((root) => {
  $$('form.quiz', root).forEach((form) => {
    const saved = Store.get().quiz[form.dataset.quiz];
    const item = QUIZ_REGISTRY.get(form.dataset.quiz);
    if (saved && item && typeof saved.choice === 'number') showQuizResult(form, item, saved.choice);
  });
});

/* ---------- 複製 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    console.warn('Clipboard API 失敗，改用備援方式：', err);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { console.warn('execCommand 複製失敗：', err); ok = false; }
  ta.remove();
  return ok;
}
const COPY_RESET_MS = 1500;
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = COPY_TEXT.get(btn.dataset.copy) ?? (btn.dataset.copyText || '');
  const ok = await copyText(text);
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = ok ? '已複製 ✓' : '請按 Ctrl/Cmd + C';
  btn.classList.toggle('copied', ok);
  if (!ok) {
    const pre = btn.closest('.code, .compare-side');
    const target = pre && $('pre', pre);
    if (target) window.getSelection().selectAllChildren(target);
  }
  announce(ok ? '已複製到剪貼簿' : '複製失敗，已選取文字，請按 Ctrl 或 Cmd 加 C');
  window.clearTimeout(Number(btn.dataset.timer));
  btn.dataset.timer = String(window.setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, COPY_RESET_MS));
});

/* ---------- 語法高亮 ---------- */
function highlightIn(root) {
  if (!window.hljs) return;
  $$('pre code[class*="language-"]', root).forEach((el) => {
    if (el.dataset.highlighted) return;
    try { window.hljs.highlightElement(el); } catch (err) { console.warn('語法高亮失敗：', err); }
  });
}
Hydrators.push(highlightIn);
window.addEventListener('load', () => highlightIn(document));

/* ---------- 術語 popup（WCAG 1.4.13：可 hover、可關閉、持續） ---------- */
const TermPop = (() => {
  const SHOW_DELAY_MS = 150;
  const HIDE_GRACE_MS = 100;
  const GAP = 10;
  const EDGE = 16;
  const el = document.createElement('div');
  el.className = 'term-pop';
  el.id = 'term-pop';
  el.dataset.open = 'false';
  let anchor = null;
  let pinned = false;
  let showTimer = 0;
  let hideTimer = 0;

  function content(key, term) {
    const current = window.App.currentLessonId();
    const link = term.lesson && term.lesson !== current
      ? `<a class="tt-link" href="#/l/${esc(term.lesson)}">在 ${esc(term.lesson)} 學到 →</a>` : '';
    return { html: `<span class="tt-term">${esc(key)}</span>${term.en ? `<span class="tt-en">${esc(term.en)}</span>` : ''}<span class="tt-def">${md(term.def)}</span>${term.example ? `<span class="tt-ex"><strong>例子：</strong>${md(term.example)}</span>` : ''}${link}`, hasLink: !!link };
  }
  function show(btn, pin = false) {
    window.clearTimeout(hideTimer);
    const key = btn.dataset.term.replace(/&amp;/g, '&');
    const term = GLOSSARY[key];
    if (!term) return;
    if (anchor && anchor !== btn) release(anchor);
    anchor = btn;
    pinned = pin;
    const { html, hasLink } = content(key, term);
    el.innerHTML = html;
    // 有連結時是非模態 popover，要能 Tab 進去；沒有連結時是 tooltip
    if (hasLink) { el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${key} 的說明`); btn.removeAttribute('aria-describedby'); }
    else { el.setAttribute('role', 'tooltip'); el.removeAttribute('aria-label'); btn.setAttribute('aria-describedby', el.id); }
    if (el.previousElementSibling !== btn) btn.after(el);
    btn.setAttribute('aria-expanded', 'true');
    position(btn);
    el.dataset.open = 'true';
  }
  function release(btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.removeAttribute('aria-describedby');
  }
  function hide() {
    window.clearTimeout(showTimer);
    if (!anchor) return;
    release(anchor);
    anchor = null; pinned = false;
    el.dataset.open = 'false';
  }
  function scheduleHide() {
    window.clearTimeout(showTimer);
    if (pinned) return;
    window.clearTimeout(hideTimer);
    hideTimer = window.setTimeout(hide, HIDE_GRACE_MS);
  }
  function position(btn) {
    const r = btn.getClientRects()[0] || btn.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const left = Math.max(EDGE, Math.min(Math.max(EDGE, r.left), window.innerWidth - w - EDGE));
    let top = r.bottom + GAP;
    if (top + h > window.innerHeight - EDGE) top = r.top - h - GAP;
    top = Math.max(EDGE, top);
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    // popup 插在術語旁邊（讓 Tab 能進到裡面的連結）；祖先若有 transform（例如換課動畫），
    // fixed 會改以那個祖先為基準，所以量一次實際位置，把差距補回來
    const actual = el.getBoundingClientRect();
    if (Math.abs(actual.left - left) > 1 || Math.abs(actual.top - top) > 1) {
      el.style.left = `${left * 2 - actual.left}px`;
      el.style.top = `${top * 2 - actual.top}px`;
    }
  }

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (!b || pinned) return;
    window.clearTimeout(hideTimer);
    window.clearTimeout(showTimer);
    showTimer = window.setTimeout(() => show(b), anchor ? 0 : SHOW_DELAY_MS);
  });
  document.addEventListener('mouseout', (e) => {
    const from = e.target.closest('.term, .term-pop');
    if (!from) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.term, .term-pop');
    if (to === anchor || to === el) return;
    scheduleHide();
  });
  document.addEventListener('focusin', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (b) show(b, pinned && anchor === b);
    else if (anchor && !pinned) hide();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.term-pop')) return;
    const b = e.target.closest('.term');
    if (b) { if (anchor === b && pinned) hide(); else show(b, true); return; }
    if (anchor) hide();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && anchor) { const a = anchor; hide(); a.focus(); }
  });
  window.addEventListener('scroll', () => { if (anchor) position(anchor); }, { passive: true });
  window.addEventListener('resize', () => { if (anchor) position(anchor); });
  window.addEventListener('hashchange', hide);
  return { show, hide };
})();

(() => {
  $('#search-slot').outerHTML = `
    <div class="search" role="search">
      <label for="site-search" class="visually-hidden">搜尋課程標題與術語</label>
      <svg class="ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="2.5"/></svg>
      <input id="site-search" type="search" placeholder="搜尋" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <kbd class="hint" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" data-open="false"></div>
    </div>`;
  const input = $('#site-search');
  const box = $('#search-results');
  const MAX_RESULTS = 12;
  const SUB_MAX = 70;
  let results = [];
  let active = -1;

  const norm = (s) => String(s || '').toLowerCase();
  function buildIndex() {
    const items = LESSONS.map((l) => ({
      kind: '課程', title: `${l.id} ${l.plain}`, sub: plainTitle(COURSES[l.moduleId].title),
      hay: norm(`${l.id} ${l.plain} ${plainTitle(COURSES[l.moduleId].title)}`), href: `#/l/${l.id}`,
    }));
    Object.entries(GLOSSARY).forEach(([key, t]) => items.push({
      kind: '術語', title: `${key}${t.en ? `（${t.en}）` : ''}`, sub: t.def.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => l || k).replace(/[`*=]/g, ''),
      hay: norm(`${key} ${t.en} ${t.def}`), href: t.lesson ? `#/l/${t.lesson}` : null,
    }));
    return items;
  }
  let INDEX = null;

  function run() {
    INDEX = INDEX || buildIndex();
    const q = norm(input.value.trim());
    if (!q) { close(); return; }
    const words = q.split(/\s+/);
    results = INDEX.filter((it) => words.every((w) => it.hay.includes(w)))
      .sort((a, b) => Number(!norm(a.title).includes(words[0])) - Number(!norm(b.title).includes(words[0])))
      .slice(0, MAX_RESULTS);
    active = results.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.innerHTML = results.length
      ? results.map((r, i) => `<div role="option" id="sr-${i}" aria-selected="${i === active}" data-i="${i}">
          <span class="label" style="--chip:${r.kind === '課程' ? 'var(--info)' : 'var(--accent)'};font-size:.7rem;padding:0 4px">${r.kind}</span>
          ${esc(r.title)}<small>${esc(r.sub.length > SUB_MAX ? `${r.sub.slice(0, SUB_MAX)}…` : r.sub)}</small></div>`).join('')
      : '<div class="empty">找不到符合的課程或術語。</div>';
    box.dataset.open = 'true';
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`);
    else input.removeAttribute('aria-activedescendant');
    const act = $(`#sr-${active}`, box);
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function close() {
    box.dataset.open = 'false';
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function go(i) {
    const r = results[i];
    if (!r) return;
    if (r.href) {
      window.location.hash = r.href.slice(1);
      input.value = '';
      close();
    } else {
      announce(`${r.title}：${r.sub}`);
    }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', () => { if (input.value.trim()) run(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; draw(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (box.dataset.open === 'true') close(); else input.blur(); }
  });
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => { const opt = e.target.closest('[role="option"]'); if (opt) go(Number(opt.dataset.i)); });
  input.addEventListener('blur', () => window.setTimeout(close, 100));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTyping(document.activeElement) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
})();

    function draw() {
      const s = steps[step];

    });

    draw();
  },
};

/* 權限規則模擬器：照官方的 deny → ask → allow 順序判定（簡化版，只示範 Bash 與 Read） */
const SIM_SEPARATORS = /\s*(?:&&|\|\||;|\|)\s*/;
function bashPatternToRegex(pattern) {
  // 「指令 *」結尾、而且只有這一個 * 時，也匹配不帶參數的指令（官方規則）
  const onlyTrailing = /^[^*]* \*$/.test(pattern);
  const escaped = pattern.replace(/[.+?^${}()|[\]\\]/g, '\\$&');
  let source = escaped.replace(/\*/g, '.*');
  if (onlyTrailing) source = `${escaped.slice(0, -2).replace(/\*/g, '.*')}(?: .*)?`;
  return new RegExp(`^${source}$`);
}
function globToRegex(glob) {
  const source = glob.replace(/^\.\//, '').replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*/g, '\u0001').replace(/\*/g, '[^/]*').replace(/\u0001/g, '.*');
  return new RegExp(`^(?:\\./)?${source}$`);
}
function parseRule(rule) {
  const m = rule.match(/^(\w+)\((.*)\)$/);
  return m ? { tool: m[1], spec: m[2] } : { tool: rule, spec: null };
}
function ruleMatches(rule, call) {
  const r = parseRule(rule);
  if (r.tool !== call.tool) return false;
  if (r.spec === null) return true;
  if (call.tool === 'Bash') return bashPatternToRegex(r.spec).test(call.input.trim());
  return globToRegex(r.spec).test(call.input.trim());
}
// 官方：Read 的 deny 規則也套用到 Claude Code 認得的讀檔指令（cat、head、tail…），但管不到自己開檔的腳本
const READ_COMMANDS = /^(?:cat|head|tail|less|more)\s+(?:-\S+\s+)*(\S+)/;
function evaluateCall(rules, call) {
  if (call.tool === 'Bash') {
    const m = call.input.trim().match(READ_COMMANDS);
    const hit = m && rules.deny.find((rule) => parseRule(rule).tool === 'Read' && ruleMatches(rule, { tool: 'Read', input: m[1] }));
    if (hit) return { verdict: 'deny', rule: hit, note: 'Read 的 deny 規則也套用到認得的讀檔指令' };
  }
  for (const kind of ['deny', 'ask', 'allow']) {
    const hit = rules[kind].find((rule) => ruleMatches(rule, call));
    if (hit) return { verdict: kind, rule: hit };
  }
  if (call.tool === 'Read') return { verdict: 'allow', rule: null, note: '工作目錄內的讀取，預設不需要確認' };
  return { verdict: 'ask', rule: null, note: '沒有規則符合：Manual 模式下會詢問你（fail-closed）' };
}
const VERDICT_TEXT = { deny: '拒絕', ask: '詢問你', allow: '直接執行' };
const VERDICT_RANK = { allow: 0, ask: 1, deny: 2 };
Widgets.permsim = {
  render(props, id) {
    const rows = ['deny', 'ask', 'allow'].flatMap((kind) => props.rules[kind].map((rule) => `<div class="sim-rule" data-rule="${esc(rule)}"><span class="label" style="--chip:${kind === 'deny' ? 'var(--danger)' : kind === 'ask' ? 'var(--warning)' : 'var(--success)'}">${kind}</span>${esc(rule)}</div>`));
    return `<div class="sim">
      <div><span class="label" style="--chip:var(--m4)">目前的規則（照評估順序排列）</span><div class="sim-rules" style="margin-top:var(--sp-3)">${rows.join('')}</div></div>
      <div>
        <p style="margin-bottom:var(--sp-2);font-weight:700">挑一個範例，或自己輸入：</p>
        <div class="sim-presets">${props.presets.map((p, i) => `<button type="button" class="btn small nb-press" data-preset="${i}">${esc(p.tool === 'Bash' ? p.input : `${p.tool} ${p.input}`)}</button>`).join('')}</div>
      </div>
      <div class="sim-input">
        <label class="visually-hidden" for="${id}-tool">工具</label>
        <select id="${id}-tool" data-sim-tool><option value="Bash">Bash</option><option value="Read">Read</option></select>
        <label class="visually-hidden" for="${id}-input">指令或路徑</label>
        <input id="${id}-input" data-sim-input type="text" autocomplete="off" spellcheck="false" value="${esc(props.presets[0].input)}">
      </div>
      <div class="sim-out" aria-live="polite"></div>
    </div>`;
  },
  hydrate(el, props) {
    const tool = $('[data-sim-tool]', el);
    const input = $('[data-sim-input]', el);
    const out = $('.sim-out', el);
    function update() {
      const text = input.value.trim();
      $$('.sim-rule', el).forEach((r) => r.classList.remove('is-hit'));
      if (!text) { out.innerHTML = '<p style="margin:0">輸入一個指令或路徑。</p>'; return; }
      const parts = tool.value === 'Bash' ? text.split(SIM_SEPARATORS).filter(Boolean) : [text];
      const results = parts.map((part) => ({ part, ...evaluateCall(props.rules, { tool: tool.value, input: part }) }));
      const final = results.reduce((worst, r) => (VERDICT_RANK[r.verdict] > VERDICT_RANK[worst.verdict] ? r : worst), results[0]);
      results.forEach((r) => { if (r.rule) $$('.sim-rule', el).filter((x) => x.dataset.rule === r.rule).forEach((x) => x.classList.add('is-hit')); });
      out.innerHTML = `<span class="verdict" data-v="${final.verdict}">${VERDICT_TEXT[final.verdict]}</span>
        <ol>${results.map((r) => `<li><code>${esc(r.part)}</code> → <strong>${VERDICT_TEXT[r.verdict]}</strong>${r.rule ? `（符合 <code>${esc(r.rule)}</code>）` : `（${esc(r.note)}）`}</li>`).join('')}</ol>
        ${parts.length > 1 ? '<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)">複合指令會拆成子指令逐一判定，取最嚴格的結果。</p>' : ''}`;
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-preset]');
      if (!b) return;
      const p = props.presets[Number(b.dataset.preset)];
      tool.value = p.tool;
      input.value = p.input;
      update();
    });
    input.addEventListener('input', update);
    tool.addEventListener('change', update);
    update();
  },
};

/* Context 成本滑桿：估算「再問一句話」的輸入成本（牌價，未含快取寫入加價） */
const COST_MODELS = {
  sonnet: { name: 'Sonnet 5.5', input: 2, cacheRead: 0.2 },
  opus: { name: 'Opus 5.5', input: 4, cacheRead: 0.2 },

const TOKENS_PER_MTOK = 1000000;
const FRESH_CONTEXT_TOKENS = 20000;
Widgets.ctxcost = {
  render(props, id) {
    return `<div class="cost">
      <div class="cost-field">
        <label for="${id}-ctx">對話目前的 context 長度</label>

      </div>

          <label><input type="radio" name="${id}-cache" value="warm" checked> 剛剛還在對話（cache 命中）</label>
          <label><input type="radio" name="${id}-cache" value="cold"> 離開超過 cache 存活時間</label>
        </div>
      </div>
      <div class="cost-field">
        <span style="font-weight:700" id="${id}-model-l">模型</span>
        <div class="cost-seg" role="radiogroup" aria-labelledby="${id}-model-l">
          ${Object.entries(COST_MODELS).map(([k, m], i) => `<label><input type="radio" name="${id}-model" value="${k}" ${i === 0 ? 'checked' : ''}> ${esc(m.name)}</label>`).join('')}
        </div>
      </div>
      <div class="cost-bars" aria-live="polite"></div>
      <p style="margin:0;font-size:var(--fs-small);color:var(--ink-muted)">估算方式：context 長度 × 每百萬 token 牌價。只算「讀進去」的輸入成本，不含輸出與快取寫入加價。實際數字請看 <code>/usage</code>。</p>
    </div>`;
  },
  hydrate(el) {
    const ctx = $('[data-ctx]', el);
    const ctxOut = $('[data-ctx-out]', el);
    const bars = $('.cost-bars', el);
    function update() {
      const tokens = Number(ctx.value) * 1000;
      const cache = $('input[value="warm"]', el).checked ? 'warm' : 'cold';
      const model = COST_MODELS[$(`input[name$="-model"]:checked`, el).value];
      const rate = cache === 'warm' ? model.cacheRead : model.input;
      const nowCost = (tokens / TOKENS_PER_MTOK) * rate;
      const freshCost = (FRESH_CONTEXT_TOKENS / TOKENS_PER_MTOK) * model.input;
      const max = (800000 / TOKENS_PER_MTOK) * model.input;
      ctxOut.textContent = `${Number(ctx.value).toLocaleString('zh-TW')}K tokens`;
      const bar = (label, cost, fill) => `<div class="cost-bar"><div class="meta"><span>${esc(label)}</span><strong>約 US$${cost.toFixed(3)}</strong></div><div class="track"><span class="fill" style="--p:${Math.min(1, cost / max)};--fill:${fill}"></span></div></div>`;
      bars.innerHTML = bar(`在這個對話再問一句（${cache === 'warm' ? '讀 cache' : 'cache 失效，整段重讀'}）`, nowCost, cache === 'warm' ? 'var(--success)' : 'var(--danger)')
        + bar('先 /clear 再問（約 2 萬 tokens 的基本 context）', freshCost, 'var(--info)');

/* ==== 從終端機課移植：終端機播放器、指令拆解器、流程動畫、分類練習 ==== */
/* ==========================================================================
   終端機主題的互動元件
   ========================================================================== */
const SHELLS = {
  pwsh: { name: 'PowerShell', chip: 'var(--info)', cwd: 'C:\\Users\\you' },
  zsh: { name: 'zsh・macOS', chip: 'var(--m3)', cwd: '~' },
  bash: { name: 'bash', chip: 'var(--m8)', cwd: '~' },
  cmd: { name: 'cmd・命令提示字元', chip: 'var(--neutral)', cwd: 'C:\\Users\\you' },
};
function promptFor(shell, cwd) {
  const dir = cwd || SHELLS[shell].cwd;
  if (shell === 'pwsh') return `PS ${dir}> `;
  if (shell === 'cmd') return `${dir}>`;
  if (shell === 'zsh') return `you@mac ${dir} % `;
  return `you@linux:${dir}$ `;
}
const TYPE_MS = 34;
const STEP_MS = 2400;

/* 逐步播放的共用控制：上一步、播放／暫停、下一步、重設；方向鍵也能用 */
function stepperControls(label) {
  return `<div class="tw-controls" role="group" aria-label="${esc(label || '動畫控制')}">
    <button type="button" class="btn small nb-press" data-step="prev">← 上一步</button>
    <button type="button" class="btn small primary nb-press" data-step="play">▶ 播放</button>
    <button type="button" class="btn small nb-press" data-step="next">下一步 →</button>
    <button type="button" class="btn small nb-press" data-step="reset">重設</button>
  </div>`;
}
function makeStepper(el, count, draw, { interval = STEP_MS, start = 0 } = {}) {
  let step = start;
  let timer = null;
  const playBtn = $('[data-step="play"]', el);
  const reduced = prefersReducedMotion();
  if (reduced) {
    playBtn.disabled = true;
    playBtn.textContent = '自動播放已關閉';
    playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一步」逐步觀看';
  }
  function sync() {
    $('[data-step="prev"]', el).disabled = step <= 0;
    $('[data-step="next"]', el).disabled = step >= count - 1;
  }
  function stop() {
    window.clearInterval(timer);
    timer = null;
    if (!reduced) playBtn.textContent = '▶ 播放';
  }
  function go(to, animate = true) {
    step = Math.min(Math.max(to, 0), count - 1);
    draw(step, animate && !reduced);
    sync();
  }
  function play() {
    if (timer) { stop(); return; }
    if (step >= count - 1) go(0);
    playBtn.textContent = '❚❚ 暫停';
    timer = window.setInterval(() => {
      if (step >= count - 1 || !document.body.contains(el)) { stop(); return; }
      go(step + 1);
    }, interval);
  }
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b || !el.contains(b)) return;
    const a = b.dataset.step;
    if (a === 'play') { play(); return; }
    stop();
    if (a === 'prev') go(step - 1);
    if (a === 'next') go(step + 1);
    if (a === 'reset') go(0, false);
  });
  el.addEventListener('keydown', (e) => {
    if (!e.target.closest('.tw-controls')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(step + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(step - 1); }
  });
  window.addEventListener('hashchange', stop, { once: true });
  go(start, false);
  return { go, stop };
}

/* 把指令逐字打進 target；回傳取消函式 */
function typeInto(target, text, done) {
  let i = 0;
  const timer = window.setInterval(() => {
    if (!document.body.contains(target)) { window.clearInterval(timer); return; }
    i += 1;
    target.textContent = text.slice(0, i);
    if (i >= text.length) { window.clearInterval(timer); if (done) done(); }
  }, TYPE_MS);
  return () => window.clearInterval(timer);
}

const OP_NOTES = {
  '|': '管線：把左邊的輸出接到右邊當輸入', '>': '重新導向：把輸出寫進檔案（覆寫）', '>>': '重新導向：把輸出加到檔案最後（附加）',
  '2>': '把錯誤訊息寫進檔案', '2>&1': '把錯誤訊息併進正常輸出', '<': '從檔案讀入，當成輸入', '&&': '左邊成功才執行右邊',
  '||': '左邊失敗才執行右邊', ';': '不管成敗，依序執行', '&': '背景執行（bash）；在 cmd 是依序執行',
};
const OPERATORS = ['2>&1', '&&', '||', '>>', '2>', '|', '>', '<', ';', '&'];
const REDIRECT_OPS = new Set(['>', '>>', '2>', '<']);
function shellTokens(src) {
  const out = [];
  let cur = '';
  let quote = null;
  const flush = () => { if (cur) out.push(cur); cur = ''; };
  for (let i = 0; i < src.length; i += 1) {
    const ch = src[i];
    if (quote) { cur += ch; if (ch === quote) quote = null; continue; }
    if (ch === '"' || ch === "'") { quote = ch; cur += ch; continue; }
    if (/\s/.test(ch)) { flush(); continue; }
    const op = OPERATORS.find((o) => src.startsWith(o, i));
    // 2> 只在字首才算運算子，避免把 file2>out 拆錯
    if (op && !(op.startsWith('2') && cur)) { flush(); out.push(op); i += op.length - 1; continue; }
    cur += ch;
  }
  flush();
  return out;
}
function classifyTokens(tokens, overrides = {}) {
  const result = [];
  let expectProgram = true;
  let program = null;
  let sawSub = false;
  let afterRedirect = false;
  let prevOpt = null;
  tokens.forEach((t) => {
    let kind;
    let note;
    if (OP_NOTES[t]) {
      kind = 'op'; note = OP_NOTES[t];
      afterRedirect = REDIRECT_OPS.has(t);
      expectProgram = !afterRedirect && t !== '2>&1';
      prevOpt = null;
    } else if (afterRedirect) {
      kind = 'arg'; note = '重新導向的目標檔案'; afterRedirect = false;
    } else if (/^(\$env:\w+|\$\{?\w+\}?|%\w+%)$/.test(t)) {
      kind = 'var'; note = '變數：執行前 shell 會先換成它的值';
    } else if (expectProgram) {
      kind = 'prog';
      program = t.toLowerCase();
      note = PROGRAM_NOTES[program] ? `程式：${PROGRAM_NOTES[program]}` : '程式：shell 會到 PATH 裡找這個名字的程式';
      expectProgram = program === 'sudo';
      sawSub = false;
    } else if (/^--?[A-Za-z]/.test(t)) {
      kind = 'opt';
      if (t.startsWith('--')) note = t.includes('=') ? '長選項，等號後面是它的值' : '長選項：用完整單字寫的開關';
      else if (/^-[a-z]{2,}$/.test(t)) note = `短選項合併寫法：等於 ${t.slice(1).split('').map((c) => `-${c}`).join(' ')}`;
      else note = /^-[A-Z][a-z]/.test(t) ? 'PowerShell 參數名稱（-開頭的單字）' : '短選項：一個字母的開關';
      prevOpt = t;
      return result.push({ t, kind, note: overrides[t] || note });
    } else if (SUBCOMMAND_PROGRAMS.has(program) && !sawSub) {
      kind = 'sub'; note = `子指令：告訴 ${program} 這次要做哪一種工作`; sawSub = true;
    } else {
      kind = 'arg';
      note = /^["']/.test(t) && prevOpt ? `參數：前一個選項 ${prevOpt} 的值（有空白所以加引號）` : /^["']/.test(t) ? '參數：引號把含空白的文字包成一個參數' : '參數：這次要處理的對象';
    }
    prevOpt = null;
    result.push({ t, kind, note: overrides[t] || note });
  });
  return result;
}
function tokenChips(parts, withNotes = true) {
  return parts.map((p, i) => `<span class="tok" data-k="${p.kind}" style="--i:${i}"><code>${esc(p.t)}</code><small>${esc(KIND_TEXT[p.kind])}</small></span>`).join('');
}

      li.className = `cls-item ${ok ? 'is-right' : 'is-wrong'}`;
      $('.cls-fb', li).innerHTML = `<strong>${ok ? '✓ 正確' : `✗ 應該是「${esc(label(it.answer))}」`}</strong>　${md(it.why)}`;
      sync();
    });
    sync();
  },
};

/* ---------- 單元各段 ---------- */
Sections.review = (c, lesson) => `<p style="font-size:var(--fs-small);color:var(--ink-muted)">先回想前面學過的內容，再往下讀。</p>${quizList(c.review, `${lesson.id}:review`)}`;
Sections.analogy = (c) => `<div class="pair">
  <div class="callout analogy drop-in" style="--i:0"><span class="label">比喻</span><div class="body blocks">${renderBlocks(c.analogy.text)}</div></div>
  <div class="callout limit drop-in" style="--i:1"><span class="label">這個比喻的限制</span><div class="body blocks">${renderBlocks(c.analogy.limit)}</div></div>
</div>`;
Sections.model = (c) => `<div class="blocks">${c.model.svg ? renderBlock({ type: 'svg', svg: c.model.svg, caption: c.model.caption }) : ''}${renderBlocks(c.model.blocks)}</div>`;
Sections.define = (c) => `<dl class="defs">${c.define.map((d) => `<div><dt>${esc(d.term)}<span class="en">${esc(d.en || '')}</span></dt><dd>${md(d.def)}${d.example ? `<br><small><strong>例子：</strong>${md(d.example)}</small>` : ''}</dd></div>`).join('')}</dl>`;
Sections.examples = (c) => {
  const ex = c.examples;
  return `<div class="blocks">
    ${(ex.compare || []).map((cmp) => compareBlock(cmp)).join('')}
    ${renderBlocks(ex.blocks)}
    ${ex.tryit ? tryitBlock(ex.tryit) : ''}
  </div>`;
};
Sections.mistakes = (c) => `<ol class="mistakes">${c.mistakes.map((m) => `<li>
  <div class="row"><span class="k wrong">錯誤做法</span><div>${md(m.wrong)}</div></div>
  <div class="row"><span class="k why">為什麼錯</span><div>${md(m.why)}</div></div>
  <div class="row"><span class="k right">正確做法</span><div>${md(m.right)}</div></div>
</li>`).join('')}</ol>`;
Sections.practice = (c, lesson) => quizList(c.practice, `${lesson.id}:practice`);
Sections.keypoints = (c) => `<div class="callout keypoints"><span class="label">三個重點</span><div class="body"><ol style="margin:0">${c.keypoints.map((k) => `<li>${md(k)}</li>`).join('')}</ol></div></div>`;
Sections.sources = (c) => `<aside class="sources" aria-label="本課來源"><span class="label" style="--chip:var(--neutral)">來源（查證於 ${SITE.verifiedOn}）</span>
  <ol>${c.sources.map((k) => {
    const s = SOURCES[k];
    if (!s) { console.error('找不到來源：', k); return ''; }
    return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`;
  }).join('')}</ol></aside>`;
Sections.reference = (c, lesson) => `<div class="blocks" style="--chip:var(--m${lesson.moduleId})">${renderBlocks(c.blocks)}</div>`;

/* ---------- 元件樣式表 ---------- */
Views.styleguide = () => {
  const sampleQuiz = { type: 'mc', level: '應用', q: '你想讓 Claude 永遠不要讀 `.env`，哪個做法真的有強制力？', options: [
    { text: '在 CLAUDE.md 寫「不要讀 .env」', why: '看起來最直覺，但 CLAUDE.md 只是送進對話的指示，模型可能忽略。' },
    { text: '在 settings.json 加 `Read(./.env)` 的 deny 規則', correct: true, why: '權限規則由 Claude Code 執行，不靠模型自律。' },
  ] };
  return `<div class="content">
    <header class="lesson-head" style="--chip:var(--neutral)"><span class="lid-big">SG</span><h1>元件樣式表</h1></header>
    <p>這頁列出全站共用元件與它們的狀態。改樣式後先看這頁，深淺色各看一次。</p>

    <section class="sg-block"><h2>按鈕：預設／hover／按下／焦點／停用</h2>
      <div class="sg-row">
        <button class="btn primary nb-press" type="button">預設</button>
        <button class="btn primary nb-press force-hover" type="button">hover</button>
        <button class="btn primary nb-press force-active" type="button">按下</button>
        <button class="btn primary nb-press force-focus" type="button">焦點</button>
        <button class="btn primary nb-press" type="button" disabled>已停用</button>
      </div>
      <div class="sg-row" style="margin-top:var(--sp-4)">
        <button class="btn nb-press" type="button">次要</button>
        <button class="btn success nb-press" type="button">成功</button>
        <button class="btn danger nb-press" type="button">危險</button>
        <button class="btn small nb-press" type="button">小按鈕</button>
        <button class="btn big primary nb-press" type="button">大按鈕</button>
      </div>
    </section>

    <section class="sg-block"><h2>徽章與狀態</h2>
      <div class="sg-row">
        <span class="label">預設</span><span class="label tilt" style="--chip:var(--accent)">傾斜</span>
        ${COURSES.map((m) => `<span class="label" style="--chip:var(--m${m.id})">M${m.id}</span>`).join('')}
      </div>
      <div class="sg-row" style="margin-top:var(--sp-4)">
        <span class="status" data-state="new" role="img" aria-label="未讀"></span> 未讀
        <span class="status" data-state="visited" role="img" aria-label="讀到一半"></span> 讀到一半
        <span class="status" data-state="done" role="img" aria-label="已完成"></span> 已完成
        <span class="stamp">已完成 ✓</span>
      </div>
    </section>

    <section class="sg-block"><h2>進度條</h2>
      <div class="progress" style="--p:.35" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" aria-label="範例進度"><span></span></div>
    </section>

    <section class="sg-block"><h2>卡片與提示框</h2>
      <div class="blocks">
        <div class="card"><h3 class="card-title">卡片</h3><p style="margin:0">4px 框、6px 硬陰影。</p></div>
        ${['analogy', 'limit', 'define', 'mistake', 'keypoints', 'legacy', 'tip', 'danger'].map((v) => renderBlock({ type: 'callout', variant: v, title: v, body: ['提示框內文，可以放 `程式碼`、==螢光標記== 和 [連結](https://code.claude.com/docs/en/security)。'] })).join('')}
        ${renderBlock({ type: 'unverified', body: ['這是未確認的項目。'] })}
        ${renderBlock({ type: 'timely', body: ['這是會過期的資訊。'] })}
        ${renderBlock({ type: 'legacy', rows: [['`/cost`', '`/usage`（`/cost` 是別名）'], ['參考站固定寬度側欄', '可拖曳側欄']] })}
      </div>
    </section>

    <section class="sg-block"><h2>術語 popup</h2>
      <p>${md('把滑鼠移到 [[權限規則]] 或 [[sandbox]] 上，或按 Tab 聚焦；滑鼠可以移進 popup，點擊會固定，按 {kbd:Esc} 關閉。')}</p>
    </section>

    <section class="sg-block"><h2>程式碼區塊</h2>
      ${codeBlock({ lang: 'bash', title: 'install.sh', code: '# 安裝 Claude Code（macOS / Linux / WSL）\ncurl -fsSL https://claude.ai/install.sh | bash\nclaude --version' })}
      <div style="height:var(--sp-5)"></div>
      ${codeBlock({ lang: 'json', title: '.claude/settings.json', code: '{\n  "permissions": {\n    "deny": ["Read(./.env)", "Read(./.env.*)"]\n  }\n}' })}
    </section>

    <section class="sg-block"><h2>對照器</h2>
      ${compareBlock({ title: '擋住 .env', code: true, bad: '# CLAUDE.md\n{{1:請不要讀 .env}}', good: '// .claude/settings.json\n{ "permissions": { "deny": [{{1:"Read(./.env)"}}] } }', why: ['規則由 Claude Code 執行，不靠模型記得'] })}
    </section>

    <section class="sg-block"><h2>分頁</h2>
      ${tabsBlock({ label: '作業系統', tabs: [{ label: 'macOS', blocks: ['Seatbelt 沙箱'] }, { label: 'Linux／WSL2', blocks: ['bubblewrap ＋ socat'] }, { label: 'Windows', blocks: ['原生不支援，改用 WSL2'] }] })}
    </section>

    <section class="sg-block"><h2>摺疊與測驗</h2>
      <div class="quiz-list">
        ${quizItem(sampleQuiz, 'styleguide:q:0')}
        ${quizItem({ type: 'reveal', level: '遷移', q: '先想一想：為什麼答案要先藏起來？', answer: ['先嘗試提取記憶，再看答案，記得比較牢（提取練習）。'] }, 'styleguide:r:0')}
      </div>
    </section>

    <section class="sg-block"><h2>表格</h2>
      ${tableBlock({ head: ['模式', '不經詢問', '適用'], rows: [['`default`', '只有讀取', '敏感工作'], ['`auto`', '全部＋分類器審查', '長任務'], ['`bypassPermissions`', '全部', '只限隔離環境']] })}
    </section>

    <section class="sg-block"><h2>檢查清單</h2>
      ${renderWidget({ name: 'checklist', props: { key: 'sg', items: ['第一項', '第二項', '第三項'] } })}
    </section>

    <section class="sg-block"><h2>權限規則模擬器</h2>
      ${renderWidget({ name: 'permsim', props: { rules: { deny: ['Read(./.env)'], ask: ['Bash(git push *)'], allow: ['Bash(npm run *)'] }, presets: [{ tool: 'Bash', input: 'npm run test' }, { tool: 'Bash', input: 'npm run build && git push origin main' }, { tool: 'Read', input: './.env' }] } })}
    </section>

    <section class="sg-block"><h2>成本滑桿</h2>
      ${renderWidget({ name: 'ctxcost', props: {} })}
    </section>

    <section class="sg-block"><h2>鍵盤提示</h2>
      <p><kbd>←</kbd> <kbd>→</kbd> 換課、<kbd>/</kbd> 搜尋、<kbd>Esc</kbd> 關閉</p>
    </section>
  </div>`;
};

window.App.renderBlocks = renderBlocks;
window.App.Widgets = Widgets;
window.App.uid = uid;
window.App.COPY_TEXT = COPY_TEXT;
})();
</script>
</body>
</html>
