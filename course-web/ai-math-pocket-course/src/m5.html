<script>
/* ==========================================================================
   模組 5：對數與 cross-entropy：損失怎麼算
   ========================================================================== */
defineTerms({
  '對數': { en: 'logarithm', def: '「要幾次方才會等於這個數」。ln 是以 e 為底的對數；log₂ 以 2 為底。', example: 'ln(e³) ＝ 3；log₂ 8 ＝ 3。', lesson: '5-1' },
  '下溢': { en: 'underflow', def: '數字小到電腦表示不了，直接變成 0。', example: '0.5 的 1000 次方在 float32 會變 0。', lesson: '5-1' },
  'perplexity': { en: 'perplexity', def: 'e 的（平均 cross-entropy）次方；可以讀成「模型平均在幾個選項之間猶豫」。', example: 'cross-entropy 0.41 → perplexity 約 1.5。', lesson: '5-2' },
  'log-sum-exp': { en: 'log-sum-exp', def: '計算 log(Σ eˣ) 時先減掉最大值再算，結果一樣但不會溢位或下溢。', example: 'log(e¹⁰⁰⁰ ＋ e¹⁰⁰⁰) ＝ 1000 ＋ ln 2。', lesson: '5-1' },
  'entropy': { en: 'entropy', def: '一個分布本身有多不確定；所有選項一樣可能時最大，只有一個選項時是 0。', example: '公平硬幣是 1 位元。', lesson: '5-2' },
  'KL 散度': { en: 'KL divergence', def: '用分布 q 去近似真實分布 p 時多付出的代價；兩者一樣時是 0，永遠不會是負的。', example: 'cross-entropy ＝ entropy ＋ KL。', lesson: '5-2' },
  'one-hot': { en: 'one-hot', def: '只有正確答案那一格是 1、其他都是 0 的向量。', example: '正確答案是第 1 個：(1, 0, 0)。', lesson: '5-2' },
});

const NEG_LOG_PATH = Array.from({ length: 50 }, (_, i) => { const p = 0.02 + i * 0.02; return `${i ? 'L' : 'M'}${(60 + p * 460).toFixed(1)} ${(200 - -Math.log(p) * 42).toFixed(1)}`; }).join(' ');


defineLessons({

    goals: [
      '說出對數把乘法變成加法',

    ],
    analogy: {
      text: ['地震規模每加 1，能量約變 32 倍；聲音每加 10 分貝，強度變 10 倍。人類習慣把「一直相乘」的量，改用「加了幾格」來描述，數字就不會大到或小到難以處理。', '[[對數]]就是這把尺：log(a × b) ＝ log a ＋ log b。一句話的機率是每個 token 機率相乘，越乘越小；取對數之後變成相加，一句話再長也不會[[下溢]]。'],
      limit: ['地震規模的每一格是固定倍數；機率的 log 則是負數（因為機率小於 1），所以實務上常加一個負號，變成「越小越好」的正數。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 250" role="img" aria-label="−ln p 的曲線：p 接近 1 時接近 0，p 越小越陡地升高；p ＝ 0.5 時 0.69，p ＝ 0.1 時 2.30">
        <line x1="60" y1="200" x2="530" y2="200" class="stroke-ink" stroke-width="2"/><line x1="60" y1="14" x2="60" y2="206" class="stroke-ink" stroke-width="2"/>
        <path d="${NEG_LOG_PATH}" fill="none" style="stroke:var(--m4)" stroke-width="4"/>
        ${[[0.9, '0.11'], [0.5, '0.69'], [0.1, '2.30']].map(([p, v]) => `<circle cx="${(60 + p * 460).toFixed(1)}" cy="${(200 + Math.log(p) * 42).toFixed(1)}" r="6" style="fill:var(--m5)" class="stroke-ink" stroke-width="2"/><text x="${(p === 0.9 ? 48 : 72) + p * 460}" y="${(200 + Math.log(p) * 42 - 12).toFixed(1)}" text-anchor="${p === 0.9 ? 'end' : 'start'}" font-size="13" font-weight="900" class="mono">p＝${p}：${v}</text>`).join('')}
        <text x="295" y="228" text-anchor="middle" font-size="13">p（正確答案的機率）→ 1</text>
        <text x="30" y="110" text-anchor="middle" font-size="13" transform="rotate(-90 30 110)">−ln p</text>
      </svg>`,
      caption: '機率 1 → 0（完全沒有懲罰）；機率越接近 0，−ln p 衝得越高。這就是下一課的損失。',
    },
    define: [
      { term: '對數', en: 'logarithm', def: '幾次方才等於這個數。', example: 'log₂ 8 ＝ 3。' },
      { term: '下溢', en: 'underflow', def: '太小變成 0。', example: '0.5¹⁰⁰⁰。' },
      { term: '指數', en: 'exponential', def: '對數的反過來。', example: 'e^(ln x) ＝ x。' },
    ],
    examples: {
      blocks: [
        { type: 'table', head: ['規則', '例子'], rows: [
          ['log(a × b) ＝ log a ＋ log b', 'log₂(4 × 8) ＝ 2 ＋ 3 ＝ 5 ＝ log₂ 32'],
          ['log(1) ＝ 0', '機率 1 的 −log 是 0'],
          ['0 < p < 1 時 log p 是負的', 'ln 0.5 ≈ −0.693'],
          ['ln 和 log₂ 只差一個倍數', 'log₂ x ＝ ln x ÷ ln 2'],
        ], caption: '機器學習的 log 幾乎都是 ln（以 e 為底）；資訊理論常用 log₂，單位叫位元。' },
        { type: 'widget', name: 'knobs', props: { title: '一句話有 n 個 token、每個機率 p：相乘會變多小？取 log 呢？（實際計算）', sliders: [
          { id: 'p', label: '每個 token 的機率 p', min: 0.01, max: 0.99, step: 0.01, value: 0.5 },
          { id: 'n', label: 'token 數 n', min: 1, max: 1000, step: 1, value: 100 },
        ], compute: (v) => {
          const logSum = v.n * Math.log(v.p);
          const prod32 = Math.fround(v.p ** v.n);
          const exp10 = logSum / Math.LN10;
          return { rows: [
            { label: '−ln p（一個 token）', value: (-Math.log(v.p)).toFixed(3), ratio: Math.min(1, -Math.log(v.p) / 4.6) },
            { label: '−log₂ p（位元）', value: (-Math.log2(v.p)).toFixed(3), ratio: Math.min(1, -Math.log2(v.p) / 6.7) },
            { label: '整句機率 pⁿ（約 10 的幾次方）', value: `10^${exp10.toFixed(1)}`, ratio: Math.min(1, -exp10 / 300) },
            { label: '用 float32 直接相乘', value: prod32 === 0 ? '0（下溢）' : prod32.toExponential(2), ratio: prod32 === 0 ? 1 : 0.3 },
            { label: '改用 log 相加：Σ ln p', value: logSum.toFixed(1), ratio: Math.min(1, -logSum / 4600) },
          ], note: 'p ＝ 0.5、n ＝ 100：整句機率約 7.9 × 10⁻³¹，log 相加是 −69.3。把 n 拉到 200 以上，float32 直接相乘就變成 0；log 相加永遠是一個普通大小的數字。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 200" role="img" aria-label="三個 token 的機率 0.5、0.25、0.125：相乘得 1/64；取 log₂ 之後是 −1、−2、−3，相加得 −6，也就是 2 的 −6 次方">
          ${[['0.5', '−1'], ['0.25', '−2'], ['0.125', '−3']].map(([p, l], i) => `<rect x="${20 + i * 130}" y="30" width="110" height="56" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/><text x="${75 + i * 130}" y="64" text-anchor="middle" font-size="16" font-weight="900" class="on-color mono">${p}</text><rect x="${20 + i * 130}" y="110" width="110" height="56" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="${75 + i * 130}" y="144" text-anchor="middle" font-size="16" font-weight="900" class="on-color mono">${l}</text>`).join('')}
          <text x="430" y="64" font-size="15" font-weight="900" class="mono">相乘 ＝ 1/64</text>
          <text x="430" y="144" font-size="15" font-weight="900" class="mono">相加 ＝ −6</text>
          <text x="280" y="192" text-anchor="middle" font-size="13">上排是機率；下排是 log₂ 機率。2⁻⁶ ＝ 1/64，兩邊說的是同一件事</text>
        </svg>`, caption: '乘法變加法：電腦處理一長串加法，比處理一長串越來越小的乘法穩定得多。' },
        { type: 'heading', id: 'deep-float', text: '深入：浮點數能裝多小的數' },
        { type: 'table', head: ['格式', '最小的正常數', '最大', '有效精度（相對）', '常用在'], rows: [
          ['float32', '約 1.2 × 10⁻³⁸', '約 3.4 × 10³⁸', '約 10⁻⁷', '訓練時的主權重、損失'],
          ['float16', '約 6.1 × 10⁻⁵', '65,504', '約 10⁻³', '推論；訓練時要配合 loss scaling'],
          ['bfloat16', '約 1.2 × 10⁻³⁸', '約 3.4 × 10³⁸', '約 8 × 10⁻³', '現在大模型訓練最常用'],
        ], caption: '數字依 IEEE 754 與 PyTorch torch.finfo。比最小正常數更小的還有一段「次正常數」，float32 最小約 1.4 × 10⁻⁴⁵，再小就變 0，所以 0.5ⁿ 在 n 約 150 時下溢。' },
        'float16 的範圍很窄：機率 10⁻⁵ 在 float16 已經掉進精度很差的次正常數區，梯度更小就直接變 0。bfloat16 用較少的精度換到和 float32 一樣的範圍，所以大模型改用它，幾乎不必再處理下溢。',
        '取 log 之後還有一個常見的需求：從 log 機率算回「log（總和）」。直接 e 次方再相加會溢位或下溢，做法和 softmax 一樣先減最大值：log Σ eˣⁱ ＝ m ＋ log Σ e^(xᵢ − m)，m 是最大的 xᵢ。這叫 [[log-sum-exp]]，PyTorch 的 log_softmax 和 CrossEntropyLoss 裡面就是這樣算的。',
      ],
    },
    mistakes: [
      { wrong: '以為 log 機率是正數。', why: '機率小於 1，log 是負的。', right: '加一個負號，變成越小越好的正數。' },
      { wrong: '把 log(a ＋ b) 拆成 log a ＋ log b。', why: '這條規則只對乘法成立。', right: 'log(a × b) ＝ log a ＋ log b。' },
      { wrong: '混用 ln 和 log₂ 的數字比較。', why: '兩者差 ln 2 ≈ 0.693 倍。', right: '比較前先確認底數；PyTorch 用 ln。' },
    ],
    practice: [
      { level: '深入思考', type: 'reveal', q: ['語音辨識要比較兩個候選句子哪個比較可能。兩句長度不同（一句 5 個字、一句 20 個字）。直接比較「每個字機率相乘」公平嗎？'], answer: [
        '不公平：每多一個字就多乘一個小於 1 的數，長句的機率天生比較小。',
        '常見做法是比較「平均每個字的 log 機率」（總和 ÷ 字數），這和下一課的 cross-entropy、perplexity 是同一個想法。',
      ] },
    ],
    keypoints: [
      'log(a × b) ＝ log a ＋ log b。',
      '−ln p：機率 1 是 0，機率越小越大。',
      '用 log 相加，長句子也不會下溢。',
    ],
    sources: ['dlbook', '3b1b-calc', 'ieee754'],
  },

  '5-2': {
    goals: [
      '手算一個 token 的 cross-entropy',
      '用 perplexity 解讀損失',
      '說出 softmax ＋ cross-entropy 的梯度是「機率 − 答案」',
    ],
    analogy: {
      text: ['考選擇題，老師要求你寫出每個選項的「信心」，加起來 100%。正確答案你只給了 10%？扣很多分；給了 90%？只扣一點；給了 100%？不扣分。扣分方式是 −ln（你給正確答案的信心）。', '這就是 [[cross-entropy]]。它不只看你有沒有猜對，還看你多有把握：猜對但很猶豫也會被扣分，猜錯又很有把握扣最多。語言模型訓練時，每一個位置都在做這樣一題。'],
      limit: ['考試的正確答案只有一個；語言的下一個字常有好幾個合理的選擇，但訓練資料裡只出現其中一個，模型只能從這個「答案」學。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 260" role="img" aria-label="cross-entropy 的流程：logits 經過 softmax 得到機率，取出正確答案貓的機率 0.665，取負的 ln 得到損失 0.41；如果正確答案是車，機率 0.090，損失 2.41">
        <rect x="20" y="40" width="110" height="80" style="fill:var(--m7)" class="stroke-ink" stroke-width="3"/><text x="75" y="74" text-anchor="middle" font-size="14" font-weight="900" class="on-color">logits</text><text x="75" y="100" text-anchor="middle" font-size="13" class="on-color mono">(2, 1, 0)</text>
        <rect x="160" y="40" width="130" height="80" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/><text x="225" y="74" text-anchor="middle" font-size="14" font-weight="900" class="on-color">softmax</text><text x="225" y="100" text-anchor="middle" font-size="12" class="on-color mono">.665 .245 .090</text>
        <rect x="320" y="40" width="100" height="80" class="fill-surface stroke-ink" stroke-width="3"/><text x="370" y="74" text-anchor="middle" font-size="13" font-weight="900">取正確的</text><text x="370" y="100" text-anchor="middle" font-size="13" class="mono">p ＝ .665</text>
        <rect x="450" y="40" width="90" height="80" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="495" y="74" text-anchor="middle" font-size="14" font-weight="900" class="on-color">−ln p</text><text x="495" y="100" text-anchor="middle" font-size="14" class="on-color mono">0.41</text>
        <path d="M130 80 L160 80 M290 80 L320 80 M420 80 L450 80" class="stroke-ink" stroke-width="3"/>
        <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="900">正確答案是「貓」：損失 0.41</text>
        <rect x="20" y="150" width="520" height="70" class="fill-bg stroke-ink" stroke-width="2"/>
        <text x="280" y="180" text-anchor="middle" font-size="14" font-weight="900">如果正確答案是「車」：p ＝ 0.090 → 損失 2.41</text>
        <text x="280" y="206" text-anchor="middle" font-size="13">同一組 logits，答案不同，損失差了快 6 倍</text>
      </svg>`,
      caption: 'cross-entropy ＝ −ln（正確答案的機率）。正確答案用 one-hot 表示時，完整公式 −Σ yᵢ ln pᵢ 只剩這一項。',
    },
    define: [
      { term: 'cross-entropy', en: 'cross-entropy', def: '−ln（正確答案的機率）。', example: '0.41。' },
      { term: 'perplexity', en: 'perplexity', def: 'e^（平均 cross-entropy）。', example: '1.5。' },
      { term: 'one-hot', en: 'one-hot', def: '只有答案那格是 1。', example: '(1, 0, 0)。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: 'logits → softmax → cross-entropy → 梯度（實際計算）', sliders: [
          { id: 'a', label: '「貓」的 logit', min: -3, max: 5, step: 0.5, value: 2 },
          { id: 'b', label: '「狗」的 logit', min: -3, max: 5, step: 0.5, value: 1 },
          { id: 'c', label: '「車」的 logit', min: -3, max: 5, step: 0.5, value: 0 },
          { id: 'y', label: '正確答案（1 貓、2 狗、3 車）', min: 1, max: 3, step: 1, value: 1 },
        ], compute: (v) => {
          const z = [v.a, v.b, v.c];
          const top = Math.max(...z);
          const e = z.map((s) => Math.exp(s - top));
          const sum = e.reduce((x, y) => x + y, 0);
          const p = e.map((s) => s / sum);
          const ce = -Math.log(p[v.y - 1]);
          const grad = p.map((pi, i) => pi - (i === v.y - 1 ? 1 : 0));
          const names = ['貓', '狗', '車'];
          return { rows: [
            { label: `正確答案「${names[v.y - 1]}」的機率`, value: p[v.y - 1].toFixed(3), ratio: p[v.y - 1] },
            { label: 'cross-entropy ＝ −ln p', value: ce.toFixed(3), ratio: Math.min(1, ce / 8) },
            { label: 'perplexity ＝ e^CE', value: Math.exp(ce).toFixed(2), ratio: Math.min(1, Math.exp(ce) / 50) },
            { label: '梯度（對三個 logits）＝ p − y', value: grad.map((g) => g.toFixed(3)).join('、'), ratio: Math.min(1, Math.abs(grad[v.y - 1])) },
          ], note: '梯度 ＝ 機率 − one-hot 答案：正確答案那格是負的（要把它的 logit 往上推），其他是正的（往下壓）。預設值是 (−0.335, 0.245, 0.090)。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 210" role="img" aria-label="梯度等於機率減答案：機率 0.665、0.245、0.090 減去 one-hot 1、0、0，得到 −0.335、0.245、0.090；負的往上推，正的往下壓">
          ${[['貓', '.665', '1', '−.335', 'm3'], ['狗', '.245', '0', '.245', 'm2'], ['車', '.090', '0', '.090', 'm1']].map(([w, p, y, g, c], i) => `<text x="40" y="${70 + i * 46}" font-size="15" font-weight="900">${w}</text><text x="130" y="${70 + i * 46}" text-anchor="middle" font-size="15" class="mono">${p}</text><text x="210" y="${70 + i * 46}" text-anchor="middle" font-size="15" class="mono">− ${y}</text><rect x="260" y="${48 + i * 46}" width="110" height="34" style="fill:var(--${c})" class="stroke-ink" stroke-width="2"/><text x="315" y="${70 + i * 46}" text-anchor="middle" font-size="15" font-weight="900" class="on-color mono">${g}</text><text x="390" y="${70 + i * 46}" font-size="13">${i ? '往下壓' : '往上推'}</text>`).join('')}
          <text x="130" y="34" text-anchor="middle" font-size="13" font-weight="900">機率 p</text><text x="210" y="34" text-anchor="middle" font-size="13" font-weight="900">答案 y</text><text x="315" y="34" text-anchor="middle" font-size="13" font-weight="900">梯度</text>
          <text x="280" y="196" text-anchor="middle" font-size="13">記得梯度下降是「減掉梯度」：負的梯度讓 logit 變大</text>
        </svg>`, caption: '這是整個系列最常用的一條結果：softmax 接 cross-entropy，梯度剛好是「猜的機率 − 正確答案」，簡單到不可思議。' },
        { type: 'code', lang: 'python', title: 'PyTorch 的 CrossEntropyLoss 直接吃 logits', code: `import torch
from torch import nn

logits = torch.tensor([[2.0, 1.0, 0.0]], requires_grad=True)
target = torch.tensor([0])          # 正確答案是第 0 個（貓）

loss = nn.CrossEntropyLoss()(logits, target)
print(loss)                         # tensor(0.4076)
loss.backward()
print(logits.grad)                  # tensor([[-0.3348, 0.2447, 0.0900]])` },
        'PyTorch 文件說明：CrossEntropyLoss 的輸入是未正規化的 logits，等於先 LogSoftmax 再 NLLLoss，預設把整批的損失取平均。所以模型最後一層不要再自己接一次 softmax。',
        { type: 'table', head: ['情況', 'cross-entropy', 'perplexity', '白話'], rows: [
          ['完全確定且答對（p ＝ 1）', '0', '1', '沒有猶豫'],
          ['p ＝ 0.665', '0.41', '1.5', '像在 1.5 個選項間猶豫'],
          ['p ＝ 0.090', '2.41', '11.1', '像在 11 個選項間猶豫'],
          ['5 萬個 token 隨便猜', '10.82', '50,000', '完全沒學到東西'],
        ], caption: '剛開始訓練的語言模型，損失大約是 ln（詞彙表大小）；訓練就是把它一路往下壓。' },
        { type: 'heading', id: 'deep-ce', text: '深入：cross-entropy 的下限在哪裡' },
        'cross-entropy 可以拆成兩項：資料本身的不確定性（[[entropy]]），加上模型的分布和真實分布差多遠（[[KL 散度]]）。訓練只能把 KL 壓到 0，壓不掉 entropy。語言本來就有很多合理的下一個字，所以語言模型的 loss 不會降到 0；降到 0 通常代表在背訓練資料。',
        { type: 'table', head: ['想比較的東西', '能不能直接比 loss 或 perplexity', '改用什麼'], rows: [
