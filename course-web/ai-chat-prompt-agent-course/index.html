/* ==========================================================================
   圖解產生器：先定節點座標，再由節點算出線段端點（layout-geometry.md 5.1）。
   viewBox 寬 600、字級 24：375px 手機上縮放後約 12px，仍看得清楚。
   文字用 | 標出可以換行的地方；放不下時依 | 分行，仍放不下會 console.warn。
   ========================================================================== */
const Diagram = (() => {
  const W = 600;
  const FS = 24;
  const LH = 1.4;
  const PAD = 14;
  const SW = 4;
  const M = SW / 2 + 2;
  const HEAD = 14;
  const HEAD_HALF = 8;
  const isWide = (ch) => !/[\u0000-ɏ -⁯]/.test(ch);
  const charWidth = (ch, fs) => {
    if (ch === ' ') return fs * 0.3;
    return isWide(ch) ? fs : fs * 0.6;
  };
  const textWidth = (t, fs) => [...t].reduce((w, ch) => w + charWidth(ch, fs), 0);
  const x = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const r1 = (v) => Math.round(v * 10) / 10;
  const blockH = (lines) => (lines - 1) * FS * LH + FS;

  const warnings = [];
  const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null;
  const joinParts = (a, b) => (a && needsSpaceBetween(a, b) ? `${a} ${b}` : a + b);
  /* 把一段放不下的詞組切成詞：英文單字、中文詞都不拆開 */
  const words = (phrase) => (segmenter ? [...segmenter.segment(phrase)].map((x) => x.segment) : [...phrase]);
  /* 先照 | 分行；單一詞組仍放不下時，再在詞與詞之間換行；最後一行不留 1–2 個字 */
  function wrap(text, maxW) {
    const out = [];
    let cur = '';
    const push = (piece, glue) => {
      const next = glue ? joinParts(cur, piece) : cur + piece;
      if (cur.trim() && textWidth(next.trim(), FS) > maxW) { out.push(cur.trim()); cur = piece.trimStart(); } else cur = next;
    };
    String(text).split('|').forEach((phrase) => {
      if (textWidth(phrase, FS) <= maxW) { push(phrase, true); return; }
      words(phrase).forEach((w, i) => push(w, i === 0));
    });
    if (cur.trim()) out.push(cur.trim());
    // 孤行：SVG 每行至少 2 個字（content-rules.md 3.3）；只剩 1 個字時，能併進相鄰的行就併，併不下就借一個詞
    const isShort = (l) => [...l.replace(/\s/g, '')].length <= 1;
    for (let i = 0; i < out.length && out.length > 1; i += 1) {
      if (!isShort(out[i])) continue;
      const j = i === out.length - 1 ? i - 1 : i + 1;
      const merged = j > i ? joinParts(out[i], out[j]) : joinParts(out[j], out[i]);
      if (textWidth(merged, FS) <= maxW) {
        out.splice(Math.min(i, j), 2, merged);
        i = -1;
        continue;
      }
      const neighbor = words(out[j]);
      const borrowed = j > i ? neighbor.shift() : neighbor.pop();
      out[j] = neighbor.join('').trim();
      out[i] = (j > i ? joinParts(out[i], borrowed) : joinParts(borrowed, out[i])).trim();
    }
    out.forEach((l) => {
      if (textWidth(l, FS) > maxW + 0.5) {
        warnings.push(l);
        console.warn('圖解文字放不下，請加 | 斷點或縮短：', l);
      }
    });
    return out;
  }
  function paint(fill) {
    if (!fill || fill === 'surface') return { rect: 'class="fill-surface stroke-ink"', text: '' };
    if (fill === 'bg') return { rect: 'class="fill-bg stroke-ink"', text: '' };
    return { rect: `class="stroke-ink" style="fill:${fill}"`, text: ' class="on-color"' };
  }
  /* rows：[{ t, weight }]；(cx, cy) 是整塊文字的中心，anchor 為 start 時 cx 是左緣 */
  function texts(rows, cx, cy, cls, anchor = 'middle') {
    const total = (rows.length - 1) * FS * LH;
    return rows.map((row, i) => `<text x="${r1(cx)}" y="${r1(cy - total / 2 + i * FS * LH + FS * 0.35)}" text-anchor="${anchor}" font-size="${FS}" font-weight="${row.weight}"${cls}>${x(row.t)}</text>`).join('');
  }
  function nodeRows(node, w) {
    const inner = w - PAD * 2;
    return [
      ...wrap(node.t, inner).map((t) => ({ t, weight: 900 })),
      ...(node.sub ? wrap(node.sub, inner).map((t) => ({ t, weight: 500 })) : []),
    ];
  }
  const boxHeight = (nodes, w) => blockH(Math.max(...nodes.map((nd) => nodeRows(nd, w).length))) + PAD * 2 + 8;
  function box(node, bx, by, w, h) {
    const p = paint(node.fill);
    const dash = node.dashed ? ' stroke-dasharray="10 6"' : '';
    return `<rect x="${r1(bx)}" y="${r1(by)}" width="${r1(w)}" height="${r1(h)}" ${p.rect} stroke-width="${SW}"${dash}/>${texts(nodeRows(node, w), bx + w / 2, by + h / 2, p.text)}`;
  }
  function line(x1, y1, x2, y2) {
    return `<path d="M${r1(x1)} ${r1(y1)} L${r1(x2)} ${r1(y2)}" class="stroke-ink" stroke-width="${SW}" fill="none"/>`;
  }
  /* 線段終點縮進箭頭三角形裡，三角形尖端碰到目標邊緣 */
  function arrow(x1, y1, x2, y2) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ux = (x2 - x1) / len;
    const uy = (y2 - y1) / len;
    const bx = x2 - ux * HEAD;
    const by = y2 - uy * HEAD;
    return line(x1, y1, x2 - ux * (HEAD - 4), y2 - uy * (HEAD - 4))
      + `<path d="M${r1(x2)} ${r1(y2)} L${r1(bx - uy * HEAD_HALF)} ${r1(by + ux * HEAD_HALF)} L${r1(bx + uy * HEAD_HALF)} ${r1(by - ux * HEAD_HALF)}Z" class="fill-ink"/>`;
  }
  const svg = (label, h, body) => `<svg viewBox="0 0 ${W} ${r1(h)}" role="img" aria-label="${x(label)}">${body}</svg>`;

  /** 流程圖：方框依序以箭頭相連，超過 cols 個時蛇形換行（換行處箭頭直直往下） */
  function flow({ label, nodes, cols = Math.min(nodes.length, 3), gap = 48, vgap = 48 }) {
    const w = (W - M * 2 - gap * (cols - 1)) / cols;
    const h = boxHeight(nodes, w);
    const rows = Math.ceil(nodes.length / cols);
    const pos = nodes.map((nd, i) => {
      const row = Math.floor(i / cols);
      const k = i % cols;
      const col = row % 2 === 0 ? k : cols - 1 - k;
      return { x: M + col * (w + gap), y: M + row * (h + vgap) };
    });
    let body = '';
    for (let i = 0; i < nodes.length - 1; i += 1) {
      const a = pos[i];
      const b = pos[i + 1];
      if (a.y === b.y) {
        const y = a.y + h / 2;
        body += b.x > a.x ? arrow(a.x + w, y, b.x, y) : arrow(a.x, y, b.x + w, y);
      } else {
        body += arrow(a.x + w / 2, a.y + h, b.x + w / 2, b.y);
      }
    }
    body += nodes.map((nd, i) => box(nd, pos[i].x, pos[i].y, w, h)).join('');
    return svg(label, M * 2 + rows * h + (rows - 1) * vgap, body);
  }

  /** 左右對照：兩欄，各有色塊標題與條列 */
  function compare({ label, left, right, gap = 28 }) {
    const w = (W - M * 2 - gap) / 2;
    const inner = w - PAD * 2;
    const ITEM_GAP = FS * 0.6;
    const build = (side) => ({
      side,
      head: wrap(side.title, inner).map((t) => ({ t, weight: 900 })),
      items: side.items.map((it) => wrap(it, inner - FS)),
    });
    const cols = [build(left), build(right)];
    const headH = blockH(Math.max(...cols.map((c) => c.head.length))) + PAD * 2;
    const bodyH = (c) => c.items.reduce((sum, ls) => sum + blockH(ls.length), 0) + ITEM_GAP * (c.items.length - 1);
    const h = headH + Math.max(...cols.map(bodyH)) + PAD * 2 + 8;
    const body = cols.map((c, i) => {
      const cx = M + i * (w + gap);
      const p = paint(c.side.fill || (i === 0 ? 'var(--danger)' : 'var(--success)'));
      let y = M + headH + PAD + 4;
      const items = c.items.map((ls) => {
        const top = y;
        y += blockH(ls.length) + ITEM_GAP;
        return ls.map((t, k) => `<text x="${r1(cx + PAD + (k ? FS : 0))}" y="${r1(top + k * FS * LH + FS * 0.85)}" font-size="${FS}" font-weight="500">${x(k ? t : `・${t}`)}</text>`).join('');
      }).join('');
      return `<rect x="${r1(cx)}" y="${M}" width="${r1(w)}" height="${r1(h)}" class="fill-surface stroke-ink" stroke-width="${SW}"/>`
        + `<rect x="${r1(cx)}" y="${M}" width="${r1(w)}" height="${r1(headH)}" ${p.rect} stroke-width="${SW}"/>`
        + texts(c.head, cx + w / 2, M + headH / 2, p.text) + items;
    }).join('');
    return svg(label, M * 2 + h, body);
  }

  /** 架構圖：中心元件橫跨全寬，周圍的職責在上下兩排，以直線連到中心 */
  function hub({ label, center, top = [], bottom = [], gap = 20, vgap = 48 }) {
    const rowW = (k) => (W - M * 2 - gap * (k - 1)) / k;
    const cw = W - M * 2;
    const ch = boxHeight([center], cw);
    const th = top.length ? boxHeight(top, rowW(top.length)) : 0;
    const bh = bottom.length ? boxHeight(bottom, rowW(bottom.length)) : 0;
    const cy = M + (top.length ? th + vgap : 0);
    const by = cy + ch + vgap;
    let body = '';
    const row = (list, y, h, toCenter) => list.map((nd, i) => {
      const w = rowW(list.length);
      const bx = M + i * (w + gap);
      const mid = bx + w / 2;
      const link = toCenter === 'down' ? line(mid, y + h, mid, cy) : line(mid, cy + ch, mid, y);
      return link + box(nd, bx, y, w, h);
    }).join('');
    body += row(top, M, th, 'down');
    body += row(bottom, by, bh, 'up');
    body += box(center, M, cy, cw, ch);
    return svg(label, (bottom.length ? by + bh : cy + ch) + M, body);
  }

  /** 巢狀方框：由外到內，外層包住內層（例如 harness 包住模型） */
  function layers({ label, layers: list, inset = 26, bottomPad = 18 }) {
    const geo = list.map((layer, i) => ({ layer, x: M + i * inset, w: W - M * 2 - i * inset * 2 }));
    geo.forEach((g, i) => {
      const inner = g.w - PAD * 2;
      g.rows = [...wrap(g.layer.t, inner).map((t) => ({ t, weight: 900 })), ...(g.layer.sub ? wrap(g.layer.sub, inner).map((t) => ({ t, weight: 500 })) : [])];
      g.band = i === list.length - 1 ? 0 : blockH(g.rows.length) + PAD * 2;
    });
    const last = geo[geo.length - 1];
    last.h = blockH(last.rows.length) + PAD * 2 + 8;
    geo.forEach((g, i) => { g.y = i === 0 ? M : geo[i - 1].y + geo[i - 1].band; });
    for (let i = geo.length - 2; i >= 0; i -= 1) geo[i].h = geo[i].band + geo[i + 1].h + bottomPad;
    const body = geo.map((g, i) => {
      const p = paint(g.layer.fill);
      const rect = `<rect x="${r1(g.x)}" y="${r1(g.y)}" width="${r1(g.w)}" height="${r1(g.h)}" ${p.rect} stroke-width="${SW}"/>`;
      const label2 = i === geo.length - 1
        ? texts(g.rows, g.x + g.w / 2, g.y + g.h / 2, p.text)
        : texts(g.rows, g.x + PAD, g.y + g.band / 2, p.text, 'start');
      return rect + label2;
    }).join('');
    return svg(label, geo[0].h + M * 2, body);
  }

  /** 時間軸：主線從第一個節點的中心畫到最後一個節點的中心；日期在上、說明在下 */
  function timeline({ label, items }) {
    const step = (W - M * 2) / items.length;
    const inner = step - 8;
    const R = 12;
    const dates = items.map((it) => wrap(it.d, inner).map((t) => ({ t, weight: 900 })));
    const descs = items.map((it) => wrap(it.t, inner).map((t) => ({ t, weight: 500 })));
    const dateH = blockH(Math.max(...dates.map((d) => d.length)));
    const descH = blockH(Math.max(...descs.map((d) => d.length)));
    const cy = M + dateH + 16 + R;
    const cx = (i) => M + step * (i + 0.5);
    let body = line(cx(0), cy, cx(items.length - 1), cy);
    items.forEach((it, i) => {
      const fill = it.fill || 'var(--primary)';
      body += `<circle cx="${r1(cx(i))}" cy="${r1(cy)}" r="${R}" class="stroke-ink" stroke-width="${SW}" style="fill:${fill}"/>`;
      body += texts(dates[i], cx(i), M + dateH / 2, '');
      body += texts(descs[i], cx(i), cy + R + 16 + descH / 2, '');
    });
    return svg(label, cy + R + 16 + descH + M + 4, body);
  }

  /** 橫條圖：每列一個標籤、一個數值，條長依 value / max */
  function bars({ label, items, max = Math.max(...items.map((it) => it.v)), unit = '' }) {
    const TRACK = 30;
    const ROW_GAP = 22;
    let y = M;
    let body = '';
    items.forEach((it) => {
      const val = it.label || `${it.v}${unit}`;
      const valW = textWidth(val, FS);
      const rows = wrap(it.t, W - M * 2 - valW - 20).map((t) => ({ t, weight: 700 }));
      const textH = blockH(rows.length);
      body += texts(rows, M, y + textH / 2, '', 'start');
      body += `<text x="${W - M}" y="${r1(y + FS * 0.85)}" text-anchor="end" font-size="${FS}" font-weight="900">${x(val)}</text>`;
      const ty = y + textH + 10;
      const fw = Math.max(0, (W - M * 2 - SW * 2) * Math.min(1, it.v / max));
      body += `<rect x="${M}" y="${r1(ty)}" width="${W - M * 2}" height="${TRACK}" class="fill-surface stroke-ink" stroke-width="${SW}"/>`;
      if (fw > 0) body += `<rect x="${M + SW}" y="${r1(ty + SW)}" width="${r1(fw)}" height="${TRACK - SW * 2}" style="fill:${it.fill || 'var(--primary)'}"/>`;
      y = ty + TRACK + ROW_GAP;
    });
    return svg(label, y - ROW_GAP + M, body);
  }

  /** 堆疊條：一條總量切成幾段，段內標編號，下方圖例寫名稱與數值 */
  function segments({ label, items, total = items.reduce((s, it) => s + it.v, 0), unit = '' }) {
    const BAR = 56;
    const SQ = 28;
    const usable = W - M * 2;
    let sx = M;
    let body = `<rect x="${M}" y="${M}" width="${usable}" height="${BAR}" class="fill-bg stroke-ink" stroke-width="${SW}"/>`;
    items.forEach((it, i) => {
      const w = (usable * it.v) / total;
      body += `<rect x="${r1(sx)}" y="${M}" width="${r1(w)}" height="${BAR}" class="stroke-ink" stroke-width="${SW}" style="fill:${it.fill}"/>`;
      if (w >= FS + 12) body += `<text x="${r1(sx + w / 2)}" y="${r1(M + BAR / 2 + FS * 0.35)}" text-anchor="middle" font-size="${FS}" font-weight="900" class="on-color">${i + 1}</text>`;
      sx += w;
    });
    let y = M + BAR + 24;
    items.forEach((it, i) => {
      // label 為空字串時不顯示數值（例如分數區間，名稱已經寫了範圍）
      const value = it.label === '' ? '' : `（${it.label || `${it.v}${unit}`}）`;
      const rows = wrap(`${i + 1}. ${it.t}${value}`, usable - SQ - 16).map((t) => ({ t, weight: 500 }));
      const h = Math.max(SQ, blockH(rows.length));
      body += `<rect x="${M}" y="${r1(y + (h - SQ) / 2)}" width="${SQ}" height="${SQ}" class="stroke-ink" stroke-width="3" style="fill:${it.fill}"/>`;
      body += texts(rows, M + SQ + 14, y + h / 2, '', 'start');
      y += h + 14;
    });
    return svg(label, y - 14 + M, body);
  }

  return { flow, compare, hub, layers, timeline, bars, segments, warnings };
})();

    const raw = window.localStorage.getItem(key);

    } catch (err) {
      isPersistent = false;
      console.warn(`無法寫入 localStorage「${key}」，改用暫存模式：`, err);
    }
  }
  return {
    get: () => state,
    persistent: () => isPersistent,
    update(fn) { fn(state); save(); },

  const text = collectText({ ...c, practice: null, review: null, sources: null }).replace(/<[^>]+>/g, '').replace(/\s+/g, '');
  const questions = (c.practice || []).length + (c.review || []).length;
  return Math.max(3, Math.round(text.length / READ_CHARS_PER_MIN + questions * MINUTES_PER_QUESTION));
}

/* ---------- 字級：6 段，存在 Prefs，載入時由 <head> 的 script 先套用 ---------- */
const FONT_STEPS = [0.875, 1, 1.125, 1.25, 1.375, 1.5];
function currentFontScale() { return Prefs.get().fontScale || 1; }
function syncTopbarHeight() {
  const height = Math.ceil($('.topbar').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--topbar-h', `${height}px`);
}
const LARGE_TEXT_SCALE = 1.375;
function applyFontScale(scale, shouldAnnounce) {
  document.documentElement.style.setProperty('--font-scale', String(scale));
  document.documentElement.toggleAttribute('data-large-text', scale >= LARGE_TEXT_SCALE);
  const i = FONT_STEPS.indexOf(scale);
  $$('[data-font-pct]').forEach((el) => { el.textContent = `${Math.round(scale * 100)}%`; });
  $$('[data-font="down"]').forEach((b) => { b.disabled = i <= 0; });
  $$('[data-font="up"]').forEach((b) => { b.disabled = i >= FONT_STEPS.length - 1; });
  if (shouldAnnounce) announce(`字級 ${Math.round(scale * 100)}%`);
  Resizer.applyPreferred();
  syncTopbarHeight();
  scheduleFit();
}
function changeFont(action) {
  const i = FONT_STEPS.indexOf(currentFontScale());
  let next = 1;
  if (action === 'up') next = FONT_STEPS[Math.min(FONT_STEPS.length - 1, i + 1)];
  if (action === 'down') next = FONT_STEPS[Math.max(0, i - 1)];
  Prefs.update((p) => { p.fontScale = next === 1 ? null : next; });
  applyFontScale(next, true);
}

/* ---------- 可拖曳寬度的側欄（components.md 第 1 節） ---------- */
const SIDEBAR_WIDTH = { min: 224, max: 480, step: 16, fallback: 288 };
const Resizer = (() => {
  const root = document.documentElement;
  const handle = $('.sidebar-resizer');
  const maxWidth = () => Math.min(SIDEBAR_WIDTH.max, Math.round(window.innerWidth * 0.4));
  function apply(px) {
    const width = Math.round(Math.min(maxWidth(), Math.max(SIDEBAR_WIDTH.min, px)));
    root.style.setProperty('--sidebar-w', `${width}px`);
    handle.setAttribute('aria-valuenow', String(width));
    handle.setAttribute('aria-valuemax', String(maxWidth()));
    return width;
  }
  // 使用者沒拖過把手時，預設寬度跟著字級放大，150% 字級時目錄標題才不會被擠到斷字
  const defaultWidth = () => Math.round(SIDEBAR_WIDTH.fallback * currentFontScale());
  function save(width) { Prefs.update((p) => { p.sidebarWidth = width === defaultWidth() ? null : width; }); }
  handle.addEventListener('pointerdown', (event) => {
    handle.setPointerCapture(event.pointerId);
    root.classList.add('is-resizing');
  });
  handle.addEventListener('pointermove', (event) => {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    // 側欄貼齊視窗左緣，所以指標的 x 座標就是新寬度
    apply(event.clientX);
  });
  handle.addEventListener('lostpointercapture', () => {
    root.classList.remove('is-resizing');
    save(parseInt(handle.getAttribute('aria-valuenow'), 10));
    scheduleFit();
  });
  handle.addEventListener('dblclick', () => { save(apply(defaultWidth())); scheduleFit(); });
  handle.addEventListener('keydown', (event) => {
    const current = parseInt(handle.getAttribute('aria-valuenow'), 10);
    const next = {
      ArrowLeft: current - SIDEBAR_WIDTH.step,
      ArrowRight: current + SIDEBAR_WIDTH.step,
      Home: SIDEBAR_WIDTH.min,
      End: maxWidth(),
    }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    save(apply(next));
    announce(`目錄寬度 ${handle.getAttribute('aria-valuenow')} 像素`);
    scheduleFit();
  });
  const applyPreferred = () => apply(Prefs.get().sidebarWidth || defaultWidth());
  applyPreferred();
  // 用偏好值重算，而不是目前的值：視窗暫時縮小時被夾到最小值，放大後才回得去
  window.addEventListener('resize', applyPreferred);
  return { apply, applyPreferred };
})();

/* ---------- 孤行處理：動態縮小字級（line-breaking.md 2.5） ---------- */
const FIT = { minScale: 0.8, step: 0.05, shortChars: 2 };
// 首頁 hero 與 section-title 混有貼紙方塊，行高不一，會被誤判成多行，所以不列入
const FIT_TARGETS = '.lesson-head h1, .card-title, .lesson-nav .ttl';
function measureLines(element) {
  const chars = [];
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    for (let i = 0; i < node.length; i += 1) {
      if (!node.data[i].trim()) continue;
      const range = document.createRange();
      range.setStart(node, i);
      range.setEnd(node, i + 1);
      const rect = range.getClientRects()[0];
      if (rect) chars.push({ ch: node.data[i], top: rect.top, height: rect.height });
    }
  }
  const lines = [];
  chars.forEach((c) => {
    const last = lines[lines.length - 1];
    if (!last || c.top - last.top > c.height / 2) lines.push({ top: c.top, text: c.ch });
    else last.text += c.ch;
  });
  return lines.map((l) => l.text);
}
// 1–2 個字，或沒有任何文字（只有編號、符號）的行算孤行
const isShortLine = (line) => line.length <= FIT.shortChars || !/\p{L}/u.test(line);
function hasShortLine(element) {
  const lines = measureLines(element);
  return lines.length > 1 && lines.some(isShortLine);
}
function fitShortText(element) {
  if (!element.offsetParent && element.tagName !== 'H1') return;
  let scale = 1;
  element.style.setProperty('--fit', '1');
  while (hasShortLine(element) && scale - FIT.step >= FIT.minScale - 1e-6) {
    scale = Math.round((scale - FIT.step) * 100) / 100;
    element.style.setProperty('--fit', String(scale));
  }
  if (hasShortLine(element)) {
    console.warn('縮到字級下限仍有孤行，請改寫標題或調整 | 斷點：', element.textContent.trim());
  }
}
let fitFrame = 0;
function fitAll() { $$(FIT_TARGETS).forEach(fitShortText); }
function scheduleFit() {
  window.cancelAnimationFrame(fitFrame);
  fitFrame = window.requestAnimationFrame(fitAll);
}

const Drawer = (() => {
  const sidebar = () => $('#sidebar');
  const isDesktop = () => window.matchMedia('(min-width: 1280px)').matches;
  let lastFocus = null;
  function open() {
    if (isDesktop()) return;
    lastFocus = document.activeElement;
    sidebar().classList.add('open');
    $('#scrim').dataset.open = 'true';
    $('.menu-btn').setAttribute('aria-expanded', 'true');
    const current = $('.nav-link[aria-current="page"]', sidebar()) || $('.sidebar-close');
    window.setTimeout(() => current.focus(), 50);
  }
  function close(restoreFocus = true) {
    if (!sidebar().classList.contains('open')) return;
    sidebar().classList.remove('open');
    $('#scrim').dataset.open = 'false';
    $('.menu-btn').setAttribute('aria-expanded', 'false');
    if (restoreFocus && lastFocus) lastFocus.focus();
  }
  function trap(e) {
    if (e.key !== 'Tab' || !sidebar().classList.contains('open')) return;
    const focusables = $$('button, a[href]', sidebar()).filter((el) => el.offsetParent !== null && !el.closest('.collapse[data-open="false"]'));
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  return { open, close, trap, isOpen: () => sidebar().classList.contains('open') };
})();

function parseRoute() {
  const hash = window.location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] === 'l' && LESSON_BY_ID[parts[1]]) return { name: 'lesson', id: parts[1] };
  if (parts[0] === 'm' && COURSES[Number(parts[1])]) return { name: 'module', id: Number(parts[1]) };
  if (parts[0] === 'styleguide') return { name: 'styleguide' };
  if (parts[0] === 'references') return { name: 'references' };
  if (parts.length === 0) return { name: 'home' };
  return { name: 'notfound', raw: hash };
}

const Views = {};

function render() {
  const route = parseRoute();
  currentLessonId = route.name === 'lesson' ? route.id : null;
  const main = $('#main');
  const view = Views[route.name] || Views.notfound;
  main.innerHTML = view(route);

  } else {

  renderNav();
  updateTopProgress();
  Drawer.close(false);
  hydrate(main);
  focusHeading(main);
  scheduleFit();
}

      ${next ? `<a class="next nb-press" href="#/l/${next.id}" rel="next"><span class="dir">下一課 →</span><span class="ttl">${renderPhrases(`${next.id} ${next.title}`)}</span></a>` : ''}
    </nav>
  </article>`;
};

/* ---------- 頁尾：更新標示與參考資料列表 ---------- */

Views.references = () => `

/* ---------- 全域事件 ---------- */
function onClick(e) {
  const moduleBtn = e.target.closest('.nav-module-btn');
  if (moduleBtn) {
    const id = moduleBtn.dataset.module;
    const panel = document.getElementById(`nav-m${id}`);
    const willOpen = panel.dataset.open !== 'true';
    panel.dataset.open = String(willOpen);
    moduleBtn.setAttribute('aria-expanded', String(willOpen));
    Store.update((s) => { s.openModules[id] = willOpen; });
    return;
  }
  const fontBtn = e.target.closest('[data-font]');
  if (fontBtn) { changeFont(fontBtn.dataset.font); return; }
  const scrollLink = e.target.closest('[data-scroll]');
  if (scrollLink) {
    e.preventDefault();
    const target = document.getElementById(scrollLink.dataset.scroll);
    if (target) {
      target.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      const heading = $('h2', target) || target;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const { action: name, id } = action.dataset;
  if (name === 'done') markDone(id, true);
  if (name === 'undone') markDone(id, false);
  if (name === 'reset' && window.confirm('確定要清除所有學習進度與勾選紀錄嗎？字級與目錄寬度不會被清除。')) {
    Store.reset();
    render();
    announce('學習進度已清除');
  }
}

function markDone(id, isDone) {
  Store.update((s) => { if (isDone) s.done[id] = true; else delete s.done[id]; });
  const row = $('#done-row');
  if (row) {
    row.innerHTML = isDone
      ? `<span class="stamp animate">已完成 ✓</span><button class="btn small nb-press" type="button" data-action="undone" data-id="${id}">改回未完成</button>`
      : `<button class="btn big success nb-press" type="button" data-action="done" data-id="${id}">標記為已完成</button><span style="color:var(--ink-muted)">讀完、實際跑過範例後按一下。</span>`;
    const focusTarget = $('button', row);
    if (focusTarget) focusTarget.focus();
  }
  renderNav();
  updateTopProgress();
  announce(isDone ? `${id} 已標記為完成` : `${id} 已改回未完成`);
}

function isTyping(el) {
  return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function onKeydown(e) {
  if (e.key === 'Escape' && Drawer.isOpen()) { Drawer.close(); return; }
  Drawer.trap(e);
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || isTyping(document.activeElement)) return;
  if (document.activeElement && document.activeElement.closest('[role="tablist"], .loop-controls, .tw-controls, .anat-input, .cls-btns, [role="listbox"], [role="separator"], input[type="range"], [role="radiogroup"]')) return;
  const route = parseRoute();
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && route.name === 'lesson') {
    const pos = LESSONS.findIndex((l) => l.id === route.id);
    const target = LESSONS[pos + (e.key === 'ArrowRight' ? 1 : -1)];
    if (target) { e.preventDefault(); window.location.hash = `#/l/${target.id}`; }
  }
}

window.App = { $, $$, esc, md, Store, Prefs, Sections, Views, Hydrators, announce, render, renderNav, updateTopProgress, prefersReducedMotion, isTyping, readingMinutes, renderPhrases, scheduleFit, fitAll, measureLines, LEVEL_START, currentLessonId: () => currentLessonId };

$('#main').addEventListener('animationend', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('view-enter'); });

/* 元件區載入後再進行第一次渲染 */
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  applyFontScale(currentFontScale(), false);
  renderFooter();
  render();
  new ResizeObserver(scheduleFit).observe($('#main'));
  // 頂部列的實際高度會隨斷點、字級改變，量出來寫回 --topbar-h，讓側欄、把手、捲動定位都貼齊它的底線

});

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/languages/powershell.min.js" integrity="sha512-I2sYcyooqG4MUbNURH1azVlcuwqA4uxCFT9tLOXIhrvwrosPpNrE0Zz0AYdjRaGPacIrJTwnTut5CzB6VNc6Hw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script>
/* ==========================================================================
   共用元件
   ========================================================================== */
(() => {
'use strict';
const { $, $$, esc, md, Store, Sections, Views, Hydrators, announce, prefersReducedMotion, isTyping, renderPhrases } = window.App;
window.App.pendingTemplate = null;

let uidCounter = 0;
const uid = (prefix = 'u') => `${prefix}${++uidCounter}`;
const COPY_TEXT = new Map();
const LANG_ALIAS = { text: 'plaintext', prompt: 'plaintext', toml: 'ini', jsonc: 'json', sh: 'bash', zsh: 'bash', shell: 'bash', yml: 'yaml', md: 'markdown', js: 'javascript', ts: 'typescript', ps1: 'powershell', py: 'python' };
const LANG_LABEL = { plaintext: 'TEXT', bash: 'BASH', json: 'JSON', python: 'PYTHON', typescript: 'TYPESCRIPT', javascript: 'JAVASCRIPT', markdown: 'MARKDOWN', yaml: 'YAML', xml: 'XML', ini: 'TOML', powershell: 'POWERSHELL', sql: 'SQL', dockerfile: 'DOCKERFILE' };

/* 單元內容裡定義的術語，自動加進術語表 */
LESSONS.forEach((lesson) => {
  const defs = lesson.content && lesson.content.define;
  if (!defs) return;
  defs.forEach((d) => {
    if (!GLOSSARY[d.term]) GLOSSARY[d.term] = { en: d.en, def: d.def, example: d.example, lesson: lesson.id };
    else if (!GLOSSARY[d.term].lesson) GLOSSARY[d.term].lesson = lesson.id;
  });
});

/* ---------- 區塊渲染 ---------- */
function renderBlocks(blocks) {
  if (blocks == null) return '';
  const list = Array.isArray(blocks) ? blocks : [blocks];
  return list.map(renderBlock).join('');
}

function renderBlock(b) {
  if (typeof b === 'string') return `<p>${md(b)}</p>`;
  switch (b.type) {
    case 'list': {
      const tag = b.ordered ? 'ol' : 'ul';
      return `<${tag}>${b.items.map((i) => `<li>${md(i)}</li>`).join('')}</${tag}>`;
    }
    case 'code': return codeBlock(b);
    case 'table': return tableBlock(b);
    case 'callout': return `<div class="callout ${esc(b.variant || 'tip')}"><span class="label">${md(b.title || '')}</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'unverified': return `<div class="callout unverified"><span class="label">截至 2026-10 查證狀態：未確認</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'timely': return `<div class="callout timely"><span class="label">時效提醒</span><div class="body blocks">${renderBlocks(b.body)}</div></div>`;
    case 'legacy': return legacyBlock(b);
    case 'svg': return `<figure class="figure">${b.svg}${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure>`;
    case 'compare': return compareBlock(b);
    case 'tabs': return tabsBlock(b);
    case 'reveal': return `<details class="reveal"><summary>${esc(b.summary || '展開')}</summary><div class="reveal-body blocks">${renderBlocks(b.body)}</div></details>`;
    case 'quiz': return quizList(b.items, b.key || uid('qz'));
    case 'widget': return renderWidget(b);
    case 'heading': return `<h2 class="ref-h" id="sec-${esc(b.id)}"><span class="label">${esc(b.text)}</span></h2>`;
    case 'tryit': return tryitBlock(b);
    default:
      console.error('未知的區塊類型：', b);
      return '';
  }
}

function codeBlock({ lang = 'text', code, title }) {
  const resolved = LANG_ALIAS[lang] || lang;
  const id = uid('code');
  COPY_TEXT.set(id, code);
  return `<div class="code">
    <div class="code-head"><span class="lang">${esc(LANG_LABEL[resolved] || resolved)}</span><span class="ttl">${esc(title || '')}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${title ? ` ${esc(title)}` : '程式碼'}">複製</button></div>
    <pre tabindex="0" aria-label="${esc(title || '程式碼')}"><code class="language-${esc(resolved)}">${esc(code)}</code></pre>
  </div>`;
}

function tableBlock({ head, rows, caption }) {
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption || '表格')}"><table>
    ${caption ? `<caption>${md(caption)}</caption>` : ''}
    <thead><tr>${head.map((h) => `<th scope="col">${md(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => (i === 0 ? `<th scope="row">${md(cell)}</th>` : `<td>${md(cell)}</td>`)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function legacyBlock({ title, rows, note }) {
  return `<div class="callout legacy"><span class="label">${esc(title || '舊做法 → 現在的做法')}</span><div class="body">
    <div class="legacy-grid">${rows.map(([oldWay, newWay]) => `<div class="legacy-row"><div class="old">${md(oldWay)}</div><div class="arrow" aria-hidden="true">→</div><div class="new"><span class="visually-hidden">現在：</span>${md(newWay)}</div></div>`).join('')}</div>
    ${note ? `<p style="margin-top:var(--sp-3)">${md(note)}</p>` : ''}
  </div></div>`;
}

/* ---------- 對照器：prompt、設定檔、指令都適用 ---------- */
const DIFF_RE = /\{\{(\d+):([\s\S]+?)\}\}/g;
function promptHtml(text) { return esc(text).replace(DIFF_RE, '<mark class="diff" data-n="$1">$2</mark>'); }
function promptPlain(text) { return text.replace(DIFF_RE, '$2'); }

function compareSide(kind, label, text, ctx, result, isCode) {
  const id = uid('cmp');
  COPY_TEXT.set(id, promptPlain(text));
  return `<div class="compare-side ${kind}">
    <div class="side-head"><span class="label">${esc(label)}</span>
      <button type="button" class="btn small nb-press copy-btn" data-copy="${id}" aria-label="複製${esc(label)}">複製</button></div>
    <pre class="prompt-text${isCode ? ' is-code' : ''}">${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${promptHtml(text)}</pre>
    ${result ? `<p style="margin:var(--sp-3) 0 0;font-size:var(--fs-small)"><strong>${kind === 'bad' ? '可能的結果' : '得到的結果'}：</strong>${md(result)}</p>` : ''}
  </div>`;
}

function compareBlock(b) {
  return `<div class="compare side-by-side">
    ${b.title ? `<div class="compare-title"><span class="label">${esc(b.kind || '對照')}</span>${md(b.title)}</div>` : ''}
    <div class="compare-grid">
      ${compareSide('bad', b.badLabel || '✗ 壞做法', b.bad, b.badCtx, b.badResult, b.code)}
      ${compareSide('good', b.goodLabel || '✓ 好做法', b.good, b.goodCtx, b.goodResult, b.code)}
    </div>
    ${b.why && b.why.length ? `<div class="why"><strong>差在哪裡</strong><ol>${b.why.map((w, i) => `<li><span class="n">${i + 1}</span><span>${md(w)}</span></li>`).join('')}</ol></div>` : ''}
  </div>`;
}

function tryitBlock(t) {
  return `<div class="tryit"><span class="label">換你補完</span>
    <div class="blocks">${renderBlocks(t.q)}</div>
    ${t.draft ? `<pre class="prompt-text${t.code ? ' is-code' : ''}" style="margin-top:var(--sp-3)">${esc(t.draft).replace(/____/g, '<span class="blank" aria-label="空格">　</span>')}</pre>` : ''}
    <details class="reveal" style="margin-top:var(--sp-4)"><summary>我寫好了，看參考答案</summary><div class="reveal-body blocks">${renderBlocks(t.answer)}</div></details>
  </div>`;
}

/* ---------- 分頁：舊面板淡出後，新面板淡入 ---------- */
function tabsBlock({ tabs, label }) {
  const base = uid('tabs');
  return `<div class="tabs">
    <div class="tablist" role="tablist" aria-label="${esc(label || '分頁')}">
      ${tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="${base}-t${i}" aria-controls="${base}-p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(t.label)}</button>`).join('')}
    </div>
    ${tabs.map((t, i) => `<div class="tabpanel blocks" role="tabpanel" id="${base}-p${i}" aria-labelledby="${base}-t${i}" tabindex="0" ${i === 0 ? '' : 'hidden'}>${renderBlocks(t.blocks)}</div>`).join('')}
  </div>`;
}
const TAB_LEAVE_MS = 120;
function selectTab(tab) {
  if (tab.getAttribute('aria-selected') === 'true') return;
  const list = tab.closest('[role="tablist"]');
  const tabs = $$('[role="tab"]', list);
  const oldTab = tabs.find((t) => t.getAttribute('aria-selected') === 'true');
  tabs.forEach((t) => {
    const selected = t === tab;
    t.setAttribute('aria-selected', String(selected));
    t.tabIndex = selected ? 0 : -1;
  });
  const newPanel = document.getElementById(tab.getAttribute('aria-controls'));
  const oldPanel = oldTab ? document.getElementById(oldTab.getAttribute('aria-controls')) : null;
  const swap = () => {
    if (oldPanel) { oldPanel.hidden = true; oldPanel.classList.remove('is-leaving'); }
    newPanel.hidden = false;
  };
  if (!oldPanel || prefersReducedMotion()) { swap(); return; }
  oldPanel.classList.add('is-leaving');
  window.setTimeout(swap, TAB_LEAVE_MS);
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (tab) selectTab(tab);
});
document.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = $$('[role="tab"]', tab.closest('[role="tablist"]'));
  const i = tabs.indexOf(tab);
  const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const next = tabs[(moves[e.key] + tabs.length) % tabs.length];
  selectTab(next);
  next.focus();
});

/* ---------- 測驗：每個選項都有解析，選項依 key 固定打亂 ---------- */
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 同一題每次載入順序一樣，存下來的答案才對得上；不同題順序不同 */
function shuffledOrder(n, key) {
  const order = Array.from({ length: n }, (_, i) => i);
  let seed = hashString(key) || 1;
  for (let i = n - 1; i > 0; i -= 1) {
    seed = (Math.imul(seed, 1103515245) + 12345) >>> 0;
    const j = seed % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

function quizList(items, keyBase) {
  return `<div class="quiz-list">${items.map((item, i) => quizItem(item, `${keyBase}:${i}`)).join('')}</div>`;
}

function quizHead(item) {
  const parts = [];
  if (item.level) parts.push(`<span class="label lv" data-lv="${esc(item.level)}">${esc(item.level)}</span>`);
  if (item.from && LESSON_BY_ID[item.from]) parts.push(`<a class="label review-from" href="#/l/${item.from}">回顧 ${esc(item.from)}</a>`);
  return parts.length ? `<div class="quiz-head">${parts.join('')}</div>` : '';
}

function quizItem(item, key) {
  if (item.type === 'mc') {
    QUIZ_REGISTRY.set(key, item);
    const order = shuffledOrder(item.options.length, key);
    return `<form class="quiz" data-quiz="${esc(key)}" novalidate>
      ${quizHead(item)}
      <fieldset><legend>${md(item.q)}</legend>
        <div class="opts">${order.map((oi) => `<label class="opt" data-oi="${oi}"><input type="radio" name="${esc(key)}" value="${oi}"><span>${md(item.options[oi].text)}</span><span class="mark" aria-hidden="true"></span></label>`).join('')}</div>
      </fieldset>
      <div class="quiz-actions"><button type="submit" class="btn primary nb-press">送出答案</button><button type="button" class="btn small nb-press" data-quiz-reset hidden>重做這題</button></div>
      <div class="quiz-feedback" hidden></div>
    </form>`;
  }
  return `<div class="quiz" data-reveal="${esc(key)}">
    ${quizHead(item)}
    <div class="quiz-q blocks">${renderBlocks(item.q)}</div>
    <details class="reveal"><summary>我想好了，看答案</summary><div class="reveal-body blocks">${renderBlocks(item.answer)}</div></details>
  </div>`;
}

const QUIZ_REGISTRY = new Map();
const correctIndex = (item) => item.options.findIndex((o) => o.correct);

function showQuizResult(form, item, choice) {
  const answer = correctIndex(item);
  const isCorrect = choice === answer;
  form.classList.add('answered');
  const displayOrder = $$('.opt', form).map((opt) => Number(opt.dataset.oi));
  $$('.opt', form).forEach((opt) => {
    const oi = Number(opt.dataset.oi);
    const input = $('input', opt);
    input.checked = oi === choice;
    input.disabled = true;
    opt.classList.toggle('is-correct', oi === answer);
    opt.classList.toggle('is-wrong', oi === choice && !isCorrect);
    $('.mark', opt).textContent = oi === answer ? '✓ 正確' : (oi === choice ? '✗ 你的選擇' : '');
  });
  // 選中的解析放最上面，其他依畫面順序
  const explainOrder = [choice, ...displayOrder.filter((oi) => oi !== choice)];
  const items = explainOrder.map((oi) => {
    const o = item.options[oi];
    const tag = oi === answer
      ? '<span class="label" style="--chip:var(--success)">✓ 正確答案</span>'
      : '<span class="label" style="--chip:var(--danger)">✗ 錯誤選項</span>';
    const picked = oi === choice ? '<span class="label" style="--chip:var(--highlight)">你選的</span>' : '';
    return `<li class="${oi === choice ? 'is-picked' : ''}">${tag}${picked}<span class="opt-text">${md(o.text)}</span>${md(o.why || '')}</li>`;
  }).join('');
  const fb = $('.quiz-feedback', form);
  fb.innerHTML = `<p class="verdict">${isCorrect ? '✓ 答對了' : '✗ 答錯了，正確答案已標示'}</p><ol class="explain-list">${items}</ol>`;
  fb.hidden = false;
  $('[type="submit"]', form).hidden = true;
  $('[data-quiz-reset]', form).hidden = false;
  return isCorrect;
}

function resetQuiz(form) {
  form.classList.remove('answered');
  $$('.opt', form).forEach((opt) => {
    const input = $('input', opt);
    input.checked = false; input.disabled = false;
    opt.classList.remove('is-correct', 'is-wrong');
    $('.mark', opt).textContent = '';
  });
  $('.quiz-feedback', form).hidden = true;
  $('[type="submit"]', form).hidden = false;
  $('[data-quiz-reset]', form).hidden = true;
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form.quiz');
  if (!form) return;
  e.preventDefault();
  const key = form.dataset.quiz;
  const item = QUIZ_REGISTRY.get(key);
  const picked = $('input:checked', form);
  const fb = $('.quiz-feedback', form);
  if (!item) { console.error('找不到測驗題目：', key); return; }
  if (!picked) {
    fb.innerHTML = '<p class="verdict">先選一個答案再送出。</p>';
    fb.hidden = false;
    $('input', form).focus();
    return;
  }
  const choice = Number(picked.value);
  const isCorrect = showQuizResult(form, item, choice);
  Store.update((s) => { s.quiz[key] = { choice, correct: isCorrect }; });
  announce(isCorrect ? '答對了' : '答錯了，正確答案已標示');
  fb.setAttribute('tabindex', '-1');
  fb.focus({ preventScroll: false });
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-quiz-reset]');
  if (!btn) return;
  const form = btn.closest('form.quiz');
  resetQuiz(form);
  Store.update((s) => { delete s.quiz[form.dataset.quiz]; });
  $('input', form).focus();
});
document.addEventListener('toggle', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-reveal]');
  if (wrap && e.target.open) Store.update((s) => { s.quiz[wrap.dataset.reveal] = { viewed: true }; });
}, true);

Hydrators.push((root) => {
  $$('form.quiz', root).forEach((form) => {
    const saved = Store.get().quiz[form.dataset.quiz];
    const item = QUIZ_REGISTRY.get(form.dataset.quiz);
    if (saved && item && typeof saved.choice === 'number') showQuizResult(form, item, saved.choice);
  });
});

/* ---------- 複製 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    console.warn('Clipboard API 失敗，改用備援方式：', err);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { console.warn('execCommand 複製失敗：', err); ok = false; }
  ta.remove();
  return ok;
}
const COPY_RESET_MS = 1500;
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = COPY_TEXT.get(btn.dataset.copy) ?? (btn.dataset.copyText || '');
  const ok = await copyText(text);
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = ok ? '已複製 ✓' : '請按 Ctrl/Cmd + C';
  btn.classList.toggle('copied', ok);
  if (!ok) {
    const pre = btn.closest('.code, .compare-side');
    const target = pre && $('pre', pre);
    if (target) window.getSelection().selectAllChildren(target);
  }
  announce(ok ? '已複製到剪貼簿' : '複製失敗，已選取文字，請按 Ctrl 或 Cmd 加 C');
  window.clearTimeout(Number(btn.dataset.timer));
  btn.dataset.timer = String(window.setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, COPY_RESET_MS));
});

/* ---------- 術語 popup（WCAG 1.4.13：可 hover、可關閉、持續） ---------- */
const TermPop = (() => {
  const SHOW_DELAY_MS = 150;
  const HIDE_GRACE_MS = 100;
  const GAP = 10;
  const EDGE = 16;
  const el = document.createElement('div');
  el.className = 'term-pop';
  el.id = 'term-pop';
  el.dataset.open = 'false';
  let anchor = null;
  let pinned = false;
  let showTimer = 0;
  let hideTimer = 0;

  function content(key, term) {
    const current = window.App.currentLessonId();
    const link = term.lesson && term.lesson !== current
      ? `<a class="tt-link" href="#/l/${esc(term.lesson)}">在 ${esc(term.lesson)} 學到 →</a>` : '';
    return { html: `<span class="tt-term">${esc(key)}</span>${term.en ? `<span class="tt-en">${esc(term.en)}</span>` : ''}<span class="tt-def">${md(term.def)}</span>${term.example ? `<span class="tt-ex"><strong>例子：</strong>${md(term.example)}</span>` : ''}${link}`, hasLink: !!link };
  }
  function show(btn, pin = false) {
    window.clearTimeout(hideTimer);
    const key = btn.dataset.term.replace(/&amp;/g, '&');
    const term = GLOSSARY[key];
    if (!term) return;
    if (anchor && anchor !== btn) release(anchor);
    anchor = btn;
    pinned = pin;
    const { html, hasLink } = content(key, term);
    el.innerHTML = html;
    // 有連結時是非模態 popover，要能 Tab 進去；沒有連結時是 tooltip
    if (hasLink) { el.setAttribute('role', 'group'); el.setAttribute('aria-label', `${key} 的說明`); btn.removeAttribute('aria-describedby'); }
    else { el.setAttribute('role', 'tooltip'); el.removeAttribute('aria-label'); btn.setAttribute('aria-describedby', el.id); }
    if (el.previousElementSibling !== btn) btn.after(el);
    btn.setAttribute('aria-expanded', 'true');
    position(btn);
    el.dataset.open = 'true';
  }
  function release(btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.removeAttribute('aria-describedby');
  }
  function hide() {
    window.clearTimeout(showTimer);
    if (!anchor) return;
    release(anchor);
    anchor = null; pinned = false;
    el.dataset.open = 'false';
  }
  function scheduleHide() {
    window.clearTimeout(showTimer);
    if (pinned) return;
    window.clearTimeout(hideTimer);
    hideTimer = window.setTimeout(hide, HIDE_GRACE_MS);
  }
  function position(btn) {
    const r = btn.getClientRects()[0] || btn.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const left = Math.max(EDGE, Math.min(Math.max(EDGE, r.left), window.innerWidth - w - EDGE));
    let top = r.bottom + GAP;
    if (top + h > window.innerHeight - EDGE) top = r.top - h - GAP;
    top = Math.max(EDGE, top);
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    // popup 插在術語旁邊（讓 Tab 能進到裡面的連結）；祖先若有 transform（例如換課動畫），
    // fixed 會改以那個祖先為基準，所以量一次實際位置，把差距補回來
    const actual = el.getBoundingClientRect();
    if (Math.abs(actual.left - left) > 1 || Math.abs(actual.top - top) > 1) {
      el.style.left = `${left * 2 - actual.left}px`;
      el.style.top = `${top * 2 - actual.top}px`;
    }
  }

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (!b || pinned) return;
    window.clearTimeout(hideTimer);
    window.clearTimeout(showTimer);
    showTimer = window.setTimeout(() => show(b), anchor ? 0 : SHOW_DELAY_MS);
  });
  document.addEventListener('mouseout', (e) => {
    const from = e.target.closest('.term, .term-pop');
    if (!from) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.term, .term-pop');
    if (to === anchor || to === el) return;
    scheduleHide();
  });
  document.addEventListener('focusin', (e) => {
    if (e.target.closest('.term-pop')) { window.clearTimeout(hideTimer); return; }
    const b = e.target.closest('.term');
    if (b) show(b, pinned && anchor === b);
    else if (anchor && !pinned) hide();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.term-pop')) return;
    const b = e.target.closest('.term');
    if (b) { if (anchor === b && pinned) hide(); else show(b, true); return; }
    if (anchor) hide();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && anchor) { const a = anchor; hide(); a.focus(); }
  });
  window.addEventListener('scroll', () => { if (anchor) position(anchor); }, { passive: true });
  window.addEventListener('resize', () => { if (anchor) position(anchor); });
  window.addEventListener('hashchange', hide);
  return { show, hide };
})();

/* ---------- 搜尋 ---------- */
(() => {
  $('#search-slot').outerHTML = `
    <div class="search" role="search">
      <label for="site-search" class="visually-hidden">搜尋課程標題與術語</label>
      <svg class="ico" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11.5 11.5L16 16" stroke="currentColor" stroke-width="2.5"/></svg>
      <input id="site-search" type="search" placeholder="搜尋" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <kbd class="hint" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" data-open="false"></div>
    </div>`;
  const input = $('#site-search');
  const box = $('#search-results');
  const MAX_RESULTS = 12;
  const SUB_MAX = 70;
  let results = [];
  let active = -1;

  const norm = (s) => String(s || '').toLowerCase();
  function buildIndex() {
    const items = LESSONS.map((l) => ({
      kind: '課程', title: `${l.id} ${l.plain}`, sub: plainTitle(COURSES[l.moduleId].title),
      hay: norm(`${l.id} ${l.plain} ${plainTitle(COURSES[l.moduleId].title)}`), href: `#/l/${l.id}`,
    }));
    Object.entries(GLOSSARY).forEach(([key, t]) => items.push({
      kind: '術語', title: `${key}${t.en ? `（${t.en}）` : ''}`, sub: t.def.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => l || k).replace(/[`*=]/g, ''),
      hay: norm(`${key} ${t.en} ${t.def}`), href: t.lesson ? `#/l/${t.lesson}` : null,
    }));
    return items;
  }
  let INDEX = null;

  function run() {
    INDEX = INDEX || buildIndex();
    const q = norm(input.value.trim());
    if (!q) { close(); return; }
    const words = q.split(/\s+/);
    results = INDEX.filter((it) => words.every((w) => it.hay.includes(w)))
      .sort((a, b) => Number(!norm(a.title).includes(words[0])) - Number(!norm(b.title).includes(words[0])))
      .slice(0, MAX_RESULTS);
    active = results.length ? 0 : -1;
    draw();
  }
  function draw() {
    box.innerHTML = results.length
      ? results.map((r, i) => `<div role="option" id="sr-${i}" aria-selected="${i === active}" data-i="${i}">
          <span class="label" style="--chip:${r.kind === '課程' ? 'var(--info)' : 'var(--accent)'};font-size:.7rem;padding:0 4px">${r.kind}</span>
          ${esc(r.title)}<small>${esc(r.sub.length > SUB_MAX ? `${r.sub.slice(0, SUB_MAX)}…` : r.sub)}</small></div>`).join('')
      : '<div class="empty">找不到符合的課程或術語。</div>';
    box.dataset.open = 'true';
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`);
    else input.removeAttribute('aria-activedescendant');
    const act = $(`#sr-${active}`, box);
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function close() {
    box.dataset.open = 'false';
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function go(i) {
    const r = results[i];
    if (!r) return;
    if (r.href) {
      window.location.hash = r.href.slice(1);
      input.value = '';
      close();
    } else {
      announce(`${r.title}：${r.sub}`);
    }
  }
  input.addEventListener('input', run);
  input.addEventListener('focus', () => { if (input.value.trim()) run(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; draw(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (box.dataset.open === 'true') close(); else input.blur(); }
  });
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('click', (e) => { const opt = e.target.closest('[role="option"]'); if (opt) go(Number(opt.dataset.i)); });
  input.addEventListener('blur', () => window.setTimeout(close, 100));
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !isTyping(document.activeElement) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
})();

/* Agent loop（5-1）：依官方三階段（收集情境 → 採取行動 → 驗證結果）逐步播放，步驟放在 props.steps */
const LOOP_NODES = {
  gather: { label: '收集情境', x: 150, y: 16 },
  act: { label: '採取行動', x: 300, y: 196 },
  verify: { label: '驗證結果', x: 0, y: 196 },
};
const LOOP_INTERVAL_MS = 1700;
Widgets.loop = {
  render(props) {
    const nodeSvg = Object.entries(LOOP_NODES).map(([key, n]) => `
      <g class="loop-node" data-node="${key}">
        <rect x="${n.x}" y="${n.y}" width="200" height="64" class="stroke-ink" stroke-width="4"/>
        <text x="${n.x + 100}" y="${n.y + 41}" text-anchor="middle" font-size="24" font-weight="900">${n.label}</text>
      </g>`).join('');
    return `<div class="loop">
      <figure class="figure loop-figure">
        <svg viewBox="0 0 500 300" role="img" aria-label="agent loop 圖：收集情境、採取行動、驗證結果三個節點依順時針循環；中間的你可以隨時插話或按 Esc 中斷">
          <g class="stroke-ink" stroke-width="4" fill="none">
            <path class="loop-arrow" data-arrow="gather" d="M350 80 Q400 120 400 184"/>
            <path class="loop-arrow" data-arrow="act" d="M300 228 H206"/>
            <path class="loop-arrow" data-arrow="verify" d="M100 196 Q100 120 148 82"/>
          </g>
          <g class="fill-ink"><path d="M392 182 L400 196 L408 182Z"/><path d="M212 220 L198 228 L212 236Z"/><path d="M138 78 L152 76 L146 90Z"/></g>
          ${nodeSvg}
          <text x="250" y="150" text-anchor="middle" font-size="22" font-weight="700">你可以隨時插話</text>
        </svg>
        <figcaption>${md(props.caption || '三個階段交錯進行，直到任務完成或你按 {kbd:Esc} 中斷。')}</figcaption>
      </figure>
      <div class="loop-panel">
        <div class="loop-controls" role="group" aria-label="動畫控制">
          <button type="button" class="btn small nb-press" data-loop="prev">← 上一步</button>
          <button type="button" class="btn small primary nb-press" data-loop="play">▶ 播放</button>
          <button type="button" class="btn small nb-press" data-loop="next">下一步 →</button>
          <button type="button" class="btn small nb-press" data-loop="reset">重設</button>
        </div>
        <p class="loop-status" aria-live="polite"></p>
        <ol class="loop-log"></ol>
      </div>
    </div>`;
  },
  hydrate(el, props) {
    const steps = props.steps;
    let step = 0;
    let timer = null;
    const playBtn = $('[data-loop="play"]', el);
    const status = $('.loop-status', el);
    const log = $('.loop-log', el);
    const reduced = prefersReducedMotion();
    if (reduced) {
      playBtn.disabled = true;
      playBtn.textContent = '自動播放已關閉';
      playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一步」逐步觀看';
    }
    const labelOf = (node) => (node === 'done' ? '完成' : LOOP_NODES[node].label);
    function draw() {
      const s = steps[step];
      $$('.loop-node', el).forEach((n) => {
        n.classList.toggle('is-active', n.dataset.node === s.node);
        n.classList.toggle('is-done', s.node === 'done');
      });
      $$('.loop-arrow', el).forEach((a) => a.classList.toggle('is-active', a.dataset.arrow === s.node));
      status.innerHTML = `<strong>步驟 ${step + 1} / ${steps.length}・${esc(labelOf(s.node))}</strong>：${md(s.log)}`;
      log.innerHTML = steps.slice(0, step + 1).map((x, i) => `<li class="${i === step ? 'is-current' : ''}"><span class="label" style="--chip:${x.node === 'done' ? 'var(--success)' : 'var(--m5)'}">${esc(labelOf(x.node))}</span> ${md(x.log)}</li>`).join('');
      log.scrollTop = log.scrollHeight;
      $('[data-loop="prev"]', el).disabled = step === 0;
      $('[data-loop="next"]', el).disabled = step === steps.length - 1;
    }
    function stop() {
      window.clearInterval(timer);
      timer = null;
      if (!reduced) playBtn.textContent = '▶ 播放';
    }
    function go(delta) {
      step = Math.min(Math.max(step + delta, 0), steps.length - 1);
      draw();
    }
    function play() {
      if (timer) { stop(); return; }
      if (step === steps.length - 1) step = 0;
      playBtn.textContent = '❚❚ 暫停';
      draw();
      timer = window.setInterval(() => {
        if (step >= steps.length - 1 || !document.body.contains(el)) { stop(); return; }
        go(1);
      }, LOOP_INTERVAL_MS);
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-loop]');
      if (!b) return;
      const action = b.dataset.loop;
      if (action === 'play') play();
      else { stop(); if (action === 'prev') go(-1); if (action === 'next') go(1); if (action === 'reset') { step = 0; draw(); } }
    });
    el.addEventListener('keydown', (e) => {
      if (!e.target.closest('.loop-controls')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(-1); }
    });
    window.addEventListener('hashchange', stop, { once: true });
    draw();
  },
};

const LONG_CONTEXT_CHARS = 400;

function assemblePrompt(values, enabled, useXml) {
  const parts = [];
  const on = (k) => enabled[k] && values[k] && values[k].trim();
  if (on('role')) parts.push(useXml ? `（系統提示詞）\n${values.role.trim()}` : `# 角色\n${values.role.trim()}`);
  BUILDER_FIELDS.filter((f) => f.key !== 'role').forEach((f) => {
    if (!on(f.key)) return;
    const v = values[f.key].trim();
    parts.push(useXml ? `<${f.tag}>\n${v}\n</${f.tag}>` : `# ${f.name}\n${v}`);
  });
  return parts.join('\n\n');
}

function builderTips(values) {
  const tips = [];
  if (!values.task.trim()) tips.push('還沒寫「任務」：這是唯一建議一定要有的積木。');
  if (/不要|禁止|絕對/.test(values.constraints) && !/因為|所以/.test(values.constraints)) tips.push('「限制」裡有禁令但沒有原因，試著補一句「因為……」（單元 2-2）。');
  if (values.context.length > LONG_CONTEXT_CHARS) tips.push('背景很長：組出來的 prompt 會把背景放在任務前面，這是長資料的建議位置（單元 3-4）。');
  return tips.length ? `提醒：${tips.join(' ')}` : '提醒：不是每次都要 6 個積木全上，簡單的任務只寫任務和格式也可以。';
}

Widgets.builder = {

          <button type="button" class="btn small nb-press" data-preset="__clear">清空</button>
        </div>
        <label class="builder-xml"><input type="checkbox" data-xml checked> 用 XML 標籤分區</label>
        <div class="builder-fields">
          ${BUILDER_FIELDS.map((f) => `<div class="bfield" data-field="${f.key}">
            <div class="bfield-head"><label><input type="checkbox" data-enable="${f.key}" checked> ${esc(f.name)}<span class="visually-hidden">（勾選代表放進 prompt）</span></label><span class="tag" aria-hidden="true">&lt;${f.tag}&gt;</span></div>
            <label class="visually-hidden" for="${id}-${f.key}">${esc(f.name)}的內容</label>
            <textarea id="${id}-${f.key}" data-input="${f.key}" rows="3" placeholder="${esc(f.ph)}"></textarea>
            <p class="help">${esc(f.help)}</p>
          </div>`).join('')}
        </div>
      </div>
      <div class="builder-out">
        <div class="builder-status" aria-live="polite"></div>
        <div class="code"><div class="code-head"><span class="lang">PROMPT</span><span class="ttl" data-count></span>
          <button type="button" class="btn small nb-press copy-btn" data-copy="${id}-out" aria-label="複製組好的 prompt">複製</button></div>
          <pre tabindex="0" aria-label="組好的 prompt"><code class="nohighlight" data-output></code></pre></div>
        <p class="builder-tip"></p>
      </div>
    </div>`;
  },
  hydrate(el, props) {
    const id = el.dataset.wid;
    const values = {};
    const enabled = {};
    BUILDER_FIELDS.forEach((f) => { values[f.key] = ''; enabled[f.key] = true; });
    const out = $('[data-output]', el);
    const xml = $('[data-xml]', el);

    function update() {
      const text = assemblePrompt(values, enabled, xml.checked);
      out.textContent = text || '（填寫欄位後，這裡會即時組出 prompt）';
      COPY_TEXT.set(`${id}-out`, text);
      $('[data-count]', el).textContent = `${text.length} 字`;
      $('.builder-status', el).innerHTML = BUILDER_FIELDS.map((f) => {
        const ok = enabled[f.key] && values[f.key].trim();
        return `<span class="label ${ok ? 'ok' : 'missing'}">${ok ? '✓' : '○'} ${esc(f.name)}<span class="visually-hidden">${ok ? '已填' : '未填'}</span></span>`;
      }).join('');
      $('.builder-tip', el).textContent = builderTips(values);
    }
    function fill(preset) {
      BUILDER_FIELDS.forEach((f) => {
        values[f.key] = preset ? (preset.values[f.key] || '') : '';
        $(`[data-input="${f.key}"]`, el).value = values[f.key];
        enabled[f.key] = true;
        $(`[data-enable="${f.key}"]`, el).checked = true;
        $(`[data-field="${f.key}"]`, el).classList.remove('off');
      });
      update();
    }
    el.addEventListener('input', (e) => {
      const k = e.target.dataset.input;
      if (k) { values[k] = e.target.value; update(); }
    });
    el.addEventListener('change', (e) => {
      const k = e.target.dataset.enable;
      if (k) { enabled[k] = e.target.checked; $(`[data-field="${k}"]`, el).classList.toggle('off', !e.target.checked); }
      update();
    });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-preset]');
      if (!b) return;
      const name = b.dataset.preset;
      fill(name === '__clear' ? null : BUILDER_PRESETS[name]);
      announce(name === '__clear' ? '已清空組裝器' : `已載入「${BUILDER_PRESETS[name].label}」範例`);
    });
    const pending = window.App.pendingTemplate;
    if (pending) {
      window.App.pendingTemplate = null;
      fill({ values: pending });
      announce('已把範本載入組裝器');
    } else if (props.preset) {
      fill(BUILDER_PRESETS[props.preset]);
    } else {
      update();
    }
  },
};

/* 取樣模擬器（1-1）：依機率抽下一個 token，抽越多次，比例越接近機率 */
const SAMPLE_BATCH = 20;
Widgets.sampler = {
  render(props) {
    return `<div class="sampler">
      <p class="sampler-prefix"><span class="label" style="--chip:var(--m1)">前文</span>${esc(props.prefix)}<span class="sampler-next" aria-live="polite" data-next>？</span></p>
      <div class="sampler-controls" role="group" aria-label="取樣控制">
        <button type="button" class="btn primary nb-press" data-sample="1">抽一次</button>
        <button type="button" class="btn nb-press" data-sample="${SAMPLE_BATCH}">連抽 ${SAMPLE_BATCH} 次</button>
        <button type="button" class="btn small nb-press" data-sample="reset">重設</button>
      </div>
      <ol class="sampler-bars">${props.tokens.map((tk, i) => `<li>
        <span class="sampler-tok">「${esc(tk.t)}」<small>${tk.p}%</small></span>
        <span class="sampler-track" aria-hidden="true"><span class="sampler-fill" data-fill="${i}" style="--fill:${tk.fill}"></span></span>
        <span class="sampler-count" data-count="${i}"></span>
      </li>`).join('')}</ol>
      <p class="sampler-note" data-note aria-live="polite"></p>
    </div>`;
  },
  hydrate(el, props) {
    const counts = props.tokens.map(() => 0);
    const next = $('[data-next]', el);
    function pick() {
      let r = Math.random() * 100;
      for (let i = 0; i < props.tokens.length; i += 1) {
        r -= props.tokens[i].p;
        if (r < 0) return i;
      }
      return props.tokens.length - 1;
    }
    function draw(last) {
      const total = counts.reduce((a, b) => a + b, 0);
      counts.forEach((n, i) => {
        const share = total ? n / total : 0;
        $(`[data-fill="${i}"]`, el).style.setProperty('--p', share);
        $(`[data-count="${i}"]`, el).textContent = `${n} 次・${Math.round(share * 100)}%`;
      });
      next.textContent = last == null ? '？' : props.tokens[last].t;
      next.classList.remove('is-new');
      if (last != null && !prefersReducedMotion()) { void next.offsetWidth; next.classList.add('is-new'); }
      $('[data-note]', el).textContent = total
        ? `已抽 ${total} 次。最後一次抽到「${props.tokens[last].t}」。抽得越多，每個 token 的比例越接近它的機率；但每一次抽到什麼，事先都不確定。`
        : '按「抽一次」，看看下一個 token 會是什麼；再按幾次，結果不一定一樣。';
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sample]');
      if (!b) return;
      if (b.dataset.sample === 'reset') { counts.fill(0); draw(null); return; }
      let last = null;
      for (let k = 0; k < Number(b.dataset.sample); k += 1) { last = pick(); counts[last] += 1; }
      draw(last);
    });
    draw(null);
  },
};

/* 能力自我評估（0-2）：勾選「我做得到」的事 → 依序找出第一個沒勾滿的階段 → 等級與建議起點。自評，沒有對錯 */
Widgets.assessment = {
  render(props) {
    return `<div class="assess">
      ${props.stages.map((st, si) => `<fieldset class="assess-stage"><legend><span class="label" style="--chip:var(--m${st.module})">${esc(st.title)}</span></legend>
        <ul class="checklist">${st.items.map((it, i) => `<li><label><input type="checkbox" data-as="${si}:${i}"><span>${md(it)}</span></label></li>`).join('')}</ul>
      </fieldset>`).join('')}
      <div class="quiz-actions" style="margin-top:var(--sp-5)"><button type="button" class="btn big primary nb-press" data-assess-save>存成我的起點</button></div>
      <div class="assess-result" tabindex="-1" aria-live="polite"></div>
    </div>`;
  },
  hydrate(el, props) {
    const result = $('.assess-result', el);
    const isChecked = (si, i) => $(`[data-as="${si}:${i}"]`, el).checked;
    function levelNow() {
      const firstGap = props.stages.findIndex((st, si) => st.items.some((_, i) => !isChecked(si, i)));
      return firstGap === -1 ? props.stages.length + 1 : firstGap + 1;
    }
    function showResult(lv, saved) {
      const info = props.levels[lv];
      const start = window.App.LEVEL_START[lv];
      result.innerHTML = `<div class="callout keypoints" style="margin-top:var(--sp-5)"><span class="label">${saved ? '已存成你的起點' : '目前的自評結果'}：Lv${lv} ${esc(info.name)}</span><div class="body blocks">
        <p>${md(info.desc)}</p>
        <p><a class="btn primary nb-press" href="#/l/${start}">從 ${start} 開始</a></p>
        <p style="font-size:var(--fs-small)">${saved ? '側邊目錄已標示「建議起點」。' : '按「存成我的起點」，側邊目錄會標示建議起點。'}跳級的人也建議讀模組 10（安全與界線）。</p></div></div>`;
    }
    $$('[data-as]', el).forEach((box) => { box.checked = !!Store.get().quiz[`assess:${box.dataset.as}`]; });
    el.addEventListener('change', (e) => {
      const k = e.target.dataset.as;
      if (!k) return;
      Store.update((st) => { if (e.target.checked) st.quiz[`assess:${k}`] = true; else delete st.quiz[`assess:${k}`]; });
      showResult(levelNow(), false);
    });
    el.addEventListener('click', (e) => {
      if (!e.target.closest('[data-assess-save]')) return;
      const lv = levelNow();
      Store.update((st) => { st.level = lv; });
      showResult(lv, true);
      window.App.renderNav();
      result.focus();
      announce(`已存成起點：Lv${lv}`);
    });
    if (Store.get().level) showResult(Store.get().level, true); else showResult(levelNow(), false);
  },
};

/* ==== 從終端機課移植：終端機播放器、指令拆解器、流程動畫、分類練習 ==== */
/* ==========================================================================
   終端機主題的互動元件
   ========================================================================== */
const SHELLS = {
  pwsh: { name: 'PowerShell', chip: 'var(--info)', cwd: 'C:\\Users\\you' },
  zsh: { name: 'zsh・macOS', chip: 'var(--m3)', cwd: '~' },
  bash: { name: 'bash', chip: 'var(--m8)', cwd: '~' },
  cmd: { name: 'cmd・命令提示字元', chip: 'var(--neutral)', cwd: 'C:\\Users\\you' },
};
function promptFor(shell, cwd) {
  const dir = cwd || SHELLS[shell].cwd;
  if (shell === 'pwsh') return `PS ${dir}> `;
  if (shell === 'cmd') return `${dir}>`;
  if (shell === 'zsh') return `you@mac ${dir} % `;
  return `you@linux:${dir}$ `;
}
const TYPE_MS = 34;
const STEP_MS = 2400;

/* 逐步播放的共用控制：上一步、播放／暫停、下一步、重設；方向鍵也能用 */
function stepperControls(label) {
  return `<div class="tw-controls" role="group" aria-label="${esc(label || '動畫控制')}">
    <button type="button" class="btn small nb-press" data-step="prev">← 上一步</button>
    <button type="button" class="btn small primary nb-press" data-step="play">▶ 播放</button>
    <button type="button" class="btn small nb-press" data-step="next">下一步 →</button>
    <button type="button" class="btn small nb-press" data-step="reset">重設</button>
  </div>`;
}
function makeStepper(el, count, draw, { interval = STEP_MS, start = 0 } = {}) {
  let step = start;
  let timer = null;
  const playBtn = $('[data-step="play"]', el);
  const reduced = prefersReducedMotion();
  if (reduced) {
    playBtn.disabled = true;
    playBtn.textContent = '自動播放已關閉';
    playBtn.title = '你的系統開啟了「減少動態效果」，請用「下一步」逐步觀看';
  }
  function sync() {
    $('[data-step="prev"]', el).disabled = step <= 0;
    $('[data-step="next"]', el).disabled = step >= count - 1;
  }
  function stop() {
    window.clearInterval(timer);
    timer = null;
    if (!reduced) playBtn.textContent = '▶ 播放';
  }
  function go(to, animate = true) {
    step = Math.min(Math.max(to, 0), count - 1);
    draw(step, animate && !reduced);
    sync();
  }
  function play() {
    if (timer) { stop(); return; }
    if (step >= count - 1) go(0);
    playBtn.textContent = '❚❚ 暫停';
    timer = window.setInterval(() => {
      if (step >= count - 1 || !document.body.contains(el)) { stop(); return; }
      go(step + 1);
    }, interval);
  }
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b || !el.contains(b)) return;
    const a = b.dataset.step;
    if (a === 'play') { play(); return; }
    stop();
    if (a === 'prev') go(step - 1);
    if (a === 'next') go(step + 1);
    if (a === 'reset') go(0, false);
  });
  el.addEventListener('keydown', (e) => {
    if (!e.target.closest('.tw-controls')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(step + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(step - 1); }
  });
  window.addEventListener('hashchange', stop, { once: true });
  go(start, false);
  return { go, stop };
}

/* 把指令逐字打進 target；回傳取消函式 */
function typeInto(target, text, done) {
  let i = 0;
  const timer = window.setInterval(() => {
    if (!document.body.contains(target)) { window.clearInterval(timer); return; }
    i += 1;
    target.textContent = text.slice(0, i);
    if (i >= text.length) { window.clearInterval(timer); if (done) done(); }
  }, TYPE_MS);
  return () => window.clearInterval(timer);
}

// props: { shell, title, cwd, caption, steps: [{ cmd, out, err, note, cwd }] }
function termOutHtml(s, extraClass = '') {
  if (s.out == null || s.out === '') return '';
  return `<span class="ln o${s.err ? ' err' : ''}${s.dim ? ' dim' : ''}${extraClass}">${esc(s.out)}</span>`;
}
Widgets.term = {
  render(props) {
    const shell = SHELLS[props.shell] ? props.shell : 'bash';
    const info = SHELLS[shell];
    return `<div class="tw${props.steps.length > 1 ? ' side' : ''}">
      <div class="tw-win">
        <div class="tw-bar"><span class="label" style="--chip:${info.chip}">${esc(info.name)}</span><span class="ttl">${esc(props.title || '終端機')}</span></div>
        <pre class="tw-screen" tabindex="0" aria-label="終端機畫面"></pre>
      </div>
      <div class="tw-panel">
        ${props.steps.length > 1 ? stepperControls('終端機播放控制') : ''}
        <div class="tw-dots" aria-hidden="true">${props.steps.map(() => '<span></span>').join('')}</div>
        <p class="tw-note" aria-live="polite"></p>
        ${props.caption ? `<p style="margin:0;font-size:var(--fs-small);color:var(--ink-muted)">${md(props.caption)}</p>` : ''}
      </div>
    </div>`;
  },
  hydrate(el, props) {
    const shell = SHELLS[props.shell] ? props.shell : 'bash';
    const screen = $('.tw-screen', el);
    const note = $('.tw-note', el);
    const dots = $$('.tw-dots span', el);
    let cancel = null;
    const prompt = (s) => promptFor(shell, s.cwd || props.cwd);
    const lineHtml = (s) => `<span class="ln"><span class="p">${esc(prompt(s))}</span><span class="c">${esc(s.cmd)}</span></span>${termOutHtml(s)}`;
    function draw(step, animate) {
      if (cancel) { cancel(); cancel = null; }
      const steps = props.steps;
      const s = steps[step];
      screen.innerHTML = steps.slice(0, step).map(lineHtml).join('');
      dots.forEach((d, i) => d.classList.toggle('on', i <= step));
      note.innerHTML = `<span class="step">步驟 ${step + 1} / ${steps.length}</span>${md(s.note || '')}`;
      const line = document.createElement('span');
      line.className = 'ln';
      line.innerHTML = `<span class="p">${esc(prompt(s))}</span><span class="c"></span>`;
      screen.appendChild(line);
      const cmdEl = $('.c', line);
      const finish = () => {
        screen.insertAdjacentHTML('beforeend', termOutHtml(s, animate ? ' enter' : ''));
        if (step === steps.length - 1) screen.insertAdjacentHTML('beforeend', `<span class="ln"><span class="p">${esc(prompt(s))}</span><span class="caret"></span></span>`);
        screen.scrollTop = screen.scrollHeight;
      };
      if (animate && s.cmd) cancel = typeInto(cmdEl, s.cmd, finish);
      else { cmdEl.textContent = s.cmd || ''; finish(); }
      screen.scrollTop = screen.scrollHeight;
    }
    if (props.steps.length > 1) makeStepper(el, props.steps.length, draw);
    else draw(0, false);
  },
};

const OP_NOTES = {
  '|': '管線：把左邊的輸出接到右邊當輸入', '>': '重新導向：把輸出寫進檔案（覆寫）', '>>': '重新導向：把輸出加到檔案最後（附加）',
  '2>': '把錯誤訊息寫進檔案', '2>&1': '把錯誤訊息併進正常輸出', '<': '從檔案讀入，當成輸入', '&&': '左邊成功才執行右邊',
  '||': '左邊失敗才執行右邊', ';': '不管成敗，依序執行', '&': '背景執行（bash）；在 cmd 是依序執行',
};
const OPERATORS = ['2>&1', '&&', '||', '>>', '2>', '|', '>', '<', ';', '&'];
const REDIRECT_OPS = new Set(['>', '>>', '2>', '<']);
function shellTokens(src) {
  const out = [];
  let cur = '';
  let quote = null;
  const flush = () => { if (cur) out.push(cur); cur = ''; };
  for (let i = 0; i < src.length; i += 1) {
    const ch = src[i];
    if (quote) { cur += ch; if (ch === quote) quote = null; continue; }
    if (ch === '"' || ch === "'") { quote = ch; cur += ch; continue; }
    if (/\s/.test(ch)) { flush(); continue; }
    const op = OPERATORS.find((o) => src.startsWith(o, i));
    // 2> 只在字首才算運算子，避免把 file2>out 拆錯
    if (op && !(op.startsWith('2') && cur)) { flush(); out.push(op); i += op.length - 1; continue; }
    cur += ch;
  }
  flush();
  return out;
}
function classifyTokens(tokens, overrides = {}) {
  const result = [];
  let expectProgram = true;
  let program = null;
  let sawSub = false;
  let afterRedirect = false;
  let prevOpt = null;
  tokens.forEach((t) => {
    let kind;
    let note;
    if (OP_NOTES[t]) {
      kind = 'op'; note = OP_NOTES[t];
      afterRedirect = REDIRECT_OPS.has(t);
      expectProgram = !afterRedirect && t !== '2>&1';
      prevOpt = null;
    } else if (afterRedirect) {
      kind = 'arg'; note = '重新導向的目標檔案'; afterRedirect = false;
    } else if (/^(\$env:\w+|\$\{?\w+\}?|%\w+%)$/.test(t)) {
      kind = 'var'; note = '變數：執行前 shell 會先換成它的值';
    } else if (expectProgram) {
      kind = 'prog';
      program = t.toLowerCase();
      note = PROGRAM_NOTES[program] ? `程式：${PROGRAM_NOTES[program]}` : '程式：shell 會到 PATH 裡找這個名字的程式';
      expectProgram = program === 'sudo';
      sawSub = false;
    } else if (/^--?[A-Za-z]/.test(t)) {
      kind = 'opt';
      if (t.startsWith('--')) note = t.includes('=') ? '長選項，等號後面是它的值' : '長選項：用完整單字寫的開關';
      else if (/^-[a-z]{2,}$/.test(t)) note = `短選項合併寫法：等於 ${t.slice(1).split('').map((c) => `-${c}`).join(' ')}`;
      else note = /^-[A-Z][a-z]/.test(t) ? 'PowerShell 參數名稱（-開頭的單字）' : '短選項：一個字母的開關';
      prevOpt = t;
      return result.push({ t, kind, note: overrides[t] || note });
    } else if (SUBCOMMAND_PROGRAMS.has(program) && !sawSub) {
      kind = 'sub'; note = `子指令：告訴 ${program} 這次要做哪一種工作`; sawSub = true;
    } else {
      kind = 'arg';
      note = /^["']/.test(t) && prevOpt ? `參數：前一個選項 ${prevOpt} 的值（有空白所以加引號）` : /^["']/.test(t) ? '參數：引號把含空白的文字包成一個參數' : '參數：這次要處理的對象';
    }
    prevOpt = null;
    result.push({ t, kind, note: overrides[t] || note });
  });
  return result;
}
function tokenChips(parts, withNotes = true) {
  return parts.map((p, i) => `<span class="tok" data-k="${p.kind}" style="--i:${i}"><code>${esc(p.t)}</code><small>${esc(KIND_TEXT[p.kind])}</small></span>`).join('');
}
const LEGEND_HTML = `<div class="legend" aria-label="顏色說明">${Object.entries(KIND_TEXT).map(([k, v]) => `<span><i style="--kc:var(--k-${k})"></i>${v}</span>`).join('')}</div>`;
Widgets.anatomy = {
  render(props, id) {
    return `<div class="anat">
      ${LEGEND_HTML}
      <div class="anat-presets" role="group" aria-label="範例指令">${props.presets.map((p, i) => `<button type="button" class="btn small nb-press" data-preset="${i}" aria-pressed="${i === 0}">${esc(p.cmd)}</button>`).join('')}</div>
      ${props.input === false ? '' : `<div class="anat-input"><label class="visually-hidden" for="${id}-in">輸入一行指令</label><input id="${id}-in" type="text" autocomplete="off" spellcheck="false" placeholder="也可以貼上你看到的指令"><button type="button" class="btn small primary nb-press" data-go>拆解</button></div>`}
      <div class="anat-line" aria-hidden="true"></div>
      <ol class="anat-list" aria-live="polite"></ol>
      <p style="margin:0;font-size:var(--fs-small);color:var(--ink-muted)">自己輸入的指令用簡化規則判斷，像「這個參數其實是前一個選項的值」這種情況，要看該程式的說明才能確定（1-3）。</p>
    </div>`;
  },
  hydrate(el, props) {
    const line = $('.anat-line', el);
    const list = $('.anat-list', el);
    const input = $('input', el);
    function show(cmd, overrides) {
      const parts = classifyTokens(shellTokens(cmd), overrides || {});
      line.innerHTML = tokenChips(parts);
      list.innerHTML = parts.map((p) => `<li><code class="k" style="--kc:var(--k-${p.kind})">${esc(p.t)}</code><span><strong>${esc(KIND_TEXT[p.kind])}</strong>・${md(p.note.replace(/^[^：]{1,12}：/, ''))}</span></li>`).join('');
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-preset]');
      if (b) {
        const p = props.presets[Number(b.dataset.preset)];
        $$('[data-preset]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        if (input) input.value = p.cmd;
        show(p.cmd, p.notes);
        return;
      }
      if (e.target.closest('[data-go]') && input.value.trim()) {
        $$('[data-preset]', el).forEach((x) => x.setAttribute('aria-pressed', 'false'));
        show(input.value.trim());
      }
    });
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim()) { e.preventDefault(); show(input.value.trim()); } });
    if (input) input.value = props.presets[0].cmd;
    show(props.presets[0].cmd, props.presets[0].notes);
  },
};

  render(props) {

        ${props.stages.map((s, i) => `<div class="pf-stage" data-i="${i}">
          <div class="pf-head">${st ? '' : `<span class="pf-label">第 ${i + 1} 站</span>`}<code class="cmd">${esc(s.cmd)}</code></div>
          <div class="pf-head"><span class="pf-label">${st ? '重點' : '流出的資料'}</span><ul class="pf-lines"></ul>${st && s.note ? `<p class="pf-note">${md(s.note)}</p>` : ''}</div>
        </div>`).join('')}
      </div>
      ${st ? '' : `${stepperControls('管線播放控制')}<p class="tw-note" aria-live="polite"></p>`}
    </div>`;
  },
  hydrate(el, props) {
    const stages = $$('.pf-stage', el);
    const fill = (st, s) => {
      $('.pf-lines', st).innerHTML = s.out.map((l, j) => `<li style="--i:${j}">${esc(l)}</li>`).join('')
        + (s.err || []).map((l, j) => `<li class="err" style="--i:${s.out.length + j}">${esc(l)}</li>`).join('');
    };
    if (props.static) { stages.forEach((st, i) => fill(st, props.stages[i])); return; }
    const note = $('.tw-note', el);
    function draw(step) {
      stages.forEach((st, i) => {
        st.classList.toggle('is-active', i === step);
        st.classList.toggle('is-pending', i > step);
        if (i > step) { $('.pf-lines', st).innerHTML = ''; return; }
        if (i === step || !$('.pf-lines', st).innerHTML) fill(st, props.stages[i]);
      });
      note.innerHTML = `<span class="step">第 ${step + 1} 站 / 共 ${props.stages.length} 站</span>${md(props.stages[step].note || '')}`;
    }
    makeStepper(el, props.stages.length, draw, { interval: 2800 });
  },
};
