<script>
/* ==========================================================================
   模組 3：風險與報酬
   ========================================================================== */
defineTerms({
  '波動度': { en: 'volatility', def: '報酬上下起伏的程度，常用標準差表示；數字越大，每年的結果越分散。', example: '股票年波動度常在 15–25%。', lesson: '3-1' },
  '標準差': { en: 'standard deviation', def: '衡量資料離平均有多分散的統計量；在常態分布下，約三分之二的結果落在平均 ± 一個標準差之內。', example: '平均 6%、標準差 18% → 多數年份在 −12% 到 24%。', lesson: '3-1' },
  '最大跌幅': { en: 'maximum drawdown', def: '從過去的最高點跌到之後最低點的幅度；衡量「最糟的時候帳面會少多少」。', example: '從 100 跌到 55，最大跌幅 45%。', lesson: '3-1' },
  '永久損失': { en: 'permanent loss', def: '資產價值跌了再也回不來，例如公司倒閉、被迫在低點賣出。', example: '單一股票下市。', lesson: '3-1' },
  '無風險利率': { en: 'risk-free rate', def: '幾乎不會違約、期間很短的資產的報酬，常用短期國庫券或定存代表。', example: '短期國庫券、定存。', lesson: '3-2' },
});

/* 標準常態分布的累積機率（Abramowitz–Stegun 近似，誤差約 1e-7） */
function normCdf(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-(z * z) / 2);
  return z >= 0 ? 0.5 * (1 + y) : 0.5 * (1 - y);
}

defineLessons({
  '3-1': {
    goals: [
      '說出風險的四種意義：波動、跌幅、永久損失、達不到目標',
      '用標準差直覺理解一年的結果有多分散',
      '分辨「暫時下跌」與「永久損失」',

    analogy: {
      text: ['搭飛機遇到亂流，杯子裡的水會晃，但飛機還在往目的地飛；真正的危險是飛機失事。投資也一樣，價格上下晃動（[[波動度]]）讓人不舒服，但真正要避免的，是[[永久損失]]：公司倒閉、或是你在最低點被迫下飛機（賣出）。', '所以「風險」不只一種。這一課把它拆成四種，每一種用不同的方法處理。'],
      limit: ['亂流和失事是兩件不同的事；投資裡兩者會互相影響：波動太大、承受不了，就可能在低點賣出，讓暫時的下跌變成永久的損失。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 280" role="img" aria-label="風險的四種意義：波動是價格上下起伏，最大跌幅是最糟時帳面少多少，永久損失是跌了回不來，目標風險是到時候錢不夠">
        ${[['波動', '價格每年上下起伏', '分散、拉長時間', 'm2'], ['最大跌幅', '最糟時帳面少多少', '配置債券與現金', 'm3'], ['永久損失', '跌了回不來', '避免集中、避免被迫賣出', 'm4'], ['目標風險', '到時候錢不夠', '儲蓄率、時間、合理報酬', 'm1']].map(([a, b, c, col], i) => `<rect x="20" y="${12 + i * 66}" width="520" height="58" style="fill:var(--${col})" class="stroke-ink" stroke-width="3"/><text x="36" y="${38 + i * 66}" font-size="16" font-weight="900" class="on-color">${a}</text><text x="36" y="${60 + i * 66}" font-size="12" class="on-color">${b}</text><text x="524" y="${48 + i * 66}" text-anchor="end" font-size="13" font-weight="900" class="on-color">處理：${c}</text>`).join('')}
      </svg>`,
      caption: '一般人最在意第一種，但長期真正會傷害財務的是後兩種。',
    },
    define: [
      { term: '波動度', en: 'volatility', def: '報酬起伏的程度。', example: '15–25%。' },
      { term: '最大跌幅', en: 'drawdown', def: '高點到低點的跌幅。', example: '45%。' },
      { term: '永久損失', en: 'permanent loss', def: '回不來的損失。', example: '公司倒閉。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'sd', text: '用標準差感受「一年的結果有多分散」' },
        '如果某個投資的年報酬平均 6%、[[標準差]] 18%，在常態分布的簡化假設下：大約三分之二的年份落在 −12% 到 24% 之間，大約 95% 的年份落在 −30% 到 42% 之間。真實市場的極端事件比常態分布預期的更常出現，所以這只是幫助直覺的起點。',
        { type: 'widget', name: 'knobs', props: { title: '持有越久，虧損的機率怎麼變（簡化模型：每年報酬獨立、對數常態，實際計算）', sliders: [
          { id: 'mu', label: '長期年化報酬（中位數）', min: 0, max: 12, step: 0.5, value: 6, unit: '%' },
          { id: 'sigma', label: '年波動度', min: 2, max: 40, step: 1, value: 18, unit: '%' },
          { id: 'years', label: '持有年數', min: 1, max: 40, step: 1, value: 1, unit: '年' },
        ], compute: (v) => {
          const m = Math.log(1 + v.mu / 100);
          const s = v.sigma / 100;
          const pLoss = normCdf((-m * v.years) / (s * Math.sqrt(v.years)));
          const low = Math.exp(m * v.years - 1.645 * s * Math.sqrt(v.years));
          const high = Math.exp(m * v.years + 1.645 * s * Math.sqrt(v.years));
          return { rows: [
            { label: '期末低於本金的機率', value: `${(pLoss * 100).toFixed(1)}%`, ratio: pLoss },
            { label: '較差的情況（第 5 百分位）', value: `本金的 ${(low * 100).toFixed(0)}%`, ratio: Math.min(1, low / 4) },
            { label: '較好的情況（第 95 百分位）', value: `本金的 ${(high * 100).toFixed(0)}%`, ratio: Math.min(1, high / 10) },
          ], note: '預設 6%、18%：持有 1 年虧損機率約 37%，10 年約 15%，20 年約 7%。機率下降但不會是 0，而且結果的範圍會越拉越大。這個模型忽略了極端事件與報酬的自我相關，真實情況可能更差。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 240" role="img" aria-label="持有年數與虧損機率：在平均 6%、波動 18% 的簡化假設下，1 年約 37%，5 年約 24%，10 年約 15%，20 年約 7%">
          <line x1="60" y1="200" x2="530" y2="200" class="stroke-ink" stroke-width="2"/>
          ${[[1, 37.3], [5, 23.5], [10, 15.3], [20, 7.4]].map(([y, p], i) => `<rect x="${80 + i * 115}" y="${200 - p * 4}" width="80" height="${p * 4}" style="fill:var(--m${4 - i})" class="stroke-ink" stroke-width="3"/><text x="${120 + i * 115}" y="${192 - p * 4}" text-anchor="middle" font-size="14" font-weight="900">${p}%</text><text x="${120 + i * 115}" y="222" text-anchor="middle" font-size="13">${y} 年</text>`).join('')}
          <text x="295" y="20" text-anchor="middle" font-size="14" font-weight="900">期末低於本金的機率（簡化模型）</text>
        </svg>`, caption: '時間能降低「最後虧錢」的機率，卻不能消除它；而且時間越長，好壞結果之間的差距（金額）越大。' },
        { type: 'heading', id: 'drawdown', text: '最大跌幅：你承受得住嗎' },
        '[[最大跌幅]]問的是：從最高點到後來的最低點，帳面會少多少？股票市場歷史上多次出現 30%、40%、甚至超過 50% 的跌幅。重點不是預測下一次什麼時候來，而是事先問自己：如果帳上的 100 萬變成 50 萬，我會不會賣掉？如果會，表示這樣的配置超過了你的承受度，應該加入更多債券或現金（第四部）。',
        { type: 'table', head: ['跌幅', '要漲回來需要'], rows: [
          ['−10%', '＋11.1%'],
          ['−20%', '＋25%'],
          ['−30%', '＋42.9%'],
          ['−50%', '＋100%'],
          ['−80%', '＋400%'],
        ], caption: '跌幅越大，回本需要的漲幅越不對稱。這是避免「永久損失」與「過度集中」的數學理由。' },
        { type: 'heading', id: 'drag', text: '深入：波動會吃掉報酬' },
        '1-1 提過算術平均高於年化報酬。兩者的差距大約是「波動度的平方除以二」：算術平均 8%、波動度 20% 的資產，長期年化報酬大約只有 8% − 0.2² ÷ 2 ＝ 6%。這叫波動拖累（volatility drag）。所以在平均報酬相近的情況下，波動較小的組合，長期反而可能累積得更多。',
        { type: 'table', head: ['算術平均報酬', '波動度', '約略的年化報酬'], rows: [
          ['8%', '10%', '約 7.5%'],
          ['8%', '20%', '約 6%'],
          ['8%', '30%', '約 3.5%'],
        ], caption: '這是近似公式，但足以說明：降低不必要的波動，本身就是提高長期報酬的方法。' },
        { type: 'heading', id: 'sequence', text: '深入：順序風險' },
        '只在一開始投入一筆錢、之後不動時，報酬的先後順序不影響最後結果。但如果你在持續投入或持續提領，順序就很重要：退休剛開始的幾年遇到大跌，同時又在提領，損失會被鎖住，之後的反彈也幫不上忙。這叫順序風險，是接近退休時要降低股票比例的主要原因之一（第四部）。',
      ],
    },
    mistakes: [

      { wrong: '以為持有夠久就一定不會虧。', why: '時間降低機率但不會歸零。', right: '把時間當作降低風險的工具之一，不是保證。' },
      { wrong: '跌了就賣、漲了才買。', why: '把暫時的下跌變成永久的損失。', right: '事先決定能承受的跌幅，配置成那個程度。' },
    ],
    keypoints: [
      '風險有四種：波動、跌幅、永久損失、達不到目標。',
      '持有越久，虧損機率越低，但不會是 0。',
      '跌 50% 要漲 100% 才回得來。',
    ],
    sources: ['ubs-2026', 'ubs-2026-summary'],
  },

  '3-2': {
    goals: [
      '說出風險溢酬的意思與來源',
      '用長期歷史資料比較股票、債券、現金',
      '知道歷史資料能說明什麼、不能說明什麼',
    ],
    analogy: {
      text: ['如果兩份工作薪水一樣，一份穩定、一份有時加倍有時減半，大多數人會選穩定的那份。要讓人願意做不穩定的那份，平均薪水就得更高。', '資產也是這樣：股票的報酬比定存不穩定得多，所以長期下來，市場必須給它較高的平均報酬，人們才願意持有。這個多出來的部分，叫[[風險溢酬]]。'],
      limit: ['工作的平均薪水是事先談好的；風險溢酬只是長期平均的結果，在任何一段十年、二十年裡都可能不出現，甚至是負的。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 270" role="img" aria-label="報酬與風險的關係：現金風險最低、報酬最低；債券居中；股票風險最高、長期報酬最高；越往右上，報酬越高但波動越大">
        <line x1="60" y1="230" x2="530" y2="230" class="stroke-ink" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="230" class="stroke-ink" stroke-width="2"/>
        <text x="295" y="256" text-anchor="middle" font-size="13" font-weight="900">風險（波動）→</text>
        <text x="66" y="36" font-size="13" font-weight="900">長期報酬 ↑</text>
        ${[['現金', 100, 190, 'm0'], ['債券', 230, 150, 'm1'], ['股債混合', 330, 115, 'm3'], ['股票', 450, 70, 'm4']].map(([t, x, y, c]) => `<circle cx="${x}" cy="${y}" r="16" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${x}" y="${y - 24}" text-anchor="middle" font-size="14" font-weight="900">${t}</text>`).join('')}
        <path d="M100 190 L230 150 L330 115 L450 70" fill="none" class="stroke-ink" stroke-width="2" stroke-dasharray="6 5"/>
      </svg>`,
      caption: '示意位置。風險與報酬大致成正比，但「承擔風險」本身不保證報酬，只有承擔「市場願意補償的風險」才有（4-1：可分散的風險沒有補償）。',
    },
    define: [
      { term: '風險溢酬', en: 'risk premium', def: '承擔風險的額外報酬。', example: '股票高於定存的部分。' },
      { term: '無風險利率', en: 'risk-free rate', def: '幾乎不違約的短期報酬。', example: '短期國庫券。' },
      { term: '波動度', en: 'volatility', def: '報酬的起伏。', example: '股票較大。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'history', text: '126 年的資料' },
        'UBS 的《全球投資報酬年鑑 2026》整理 1900 到 2025 年的資料：1900 年投入股票的 1 美元，到 2025 年底名目上成長為 124,854 美元；同樣的 1 美元投入長期債券是 284 美元，短期國庫券是 69 美元。同一期間美國的通膨年均約 2.9%。媒體摘要的實質年化報酬是：全球股票約 6.6%、債券約 1.6%。',
        { type: 'table', head: ['資產（1900–2025）', '1 美元變成（名目）', '實質年化（摘要）', '特性'], rows: [
          ['股票', '124,854 美元', '約 6.6%', '報酬最高、波動最大，曾出現長期的實質虧損'],
          ['長期債券', '284 美元', '約 1.6%', '報酬較低，高通膨時期表現差'],
          ['短期國庫券', '69 美元', '很低', '接近無風險，但實質報酬接近 0'],
        ], caption: '這是全球（以美國為主的已開發市場佔大部分）的長期資料。各國差異很大，有些市場曾經歷戰爭或長期停滯。' },
        { type: 'widget', name: 'knobs', props: { title: '風險溢酬的長期效果（實際計算，假設報酬率固定，用來感受差距）', sliders: [
          { id: 'rf', label: '無風險資產的實質年報酬', min: -2, max: 4, step: 0.1, value: 0.5, unit: '%' },
          { id: 'prem', label: '股票的風險溢酬', min: 0, max: 8, step: 0.1, value: 5, unit: '%' },

            { label: '差距倍數', value: `${(risky / safe).toFixed(1)} 倍`, ratio: Math.min(1, risky / safe / 10) },

        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="歷史資料能說明的與不能說明的：能說明風險與報酬的長期關係、分散的價值；不能說明未來的確切報酬、下一次下跌的時間">

          <text x="145" y="52" text-anchor="middle" font-size="16" font-weight="900" class="on-color">能說明</text>

          <rect x="290" y="20" width="250" height="180" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/>

        { type: 'heading', id: 'survivor', text: '深入：倖存者偏差' },
        '我們最常看到的長期資料來自美國，而美國恰好是二十世紀表現最好的市場之一。如果只看「後來贏的人」，會高估未來的報酬，這叫倖存者偏差。年鑑之所以整理數十個國家的資料，就是為了降低這個偏差；有些國家的股市曾因戰爭、革命而幾乎歸零。這是分散到多個國家（4-2）的另一個理由。',
