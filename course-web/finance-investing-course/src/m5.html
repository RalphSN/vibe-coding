  '信用風險': { en: 'credit risk', def: '借款人無法如期付息或還本的風險；風險越高，要求的殖利率越高。', example: '公司債殖利率高於公債。', lesson: '5-2' },
  'REITs': { en: 'real estate investment trusts', def: '不動產投資信託：把多筆不動產的租金收入包裝成可在市場交易的受益憑證。', example: '持有辦公大樓、商場的 REITs。', lesson: '5-3' },
});

function bondPrice(coupon, y, n) { let p = 0; for (let k = 1; k <= n; k += 1) p += coupon / (1 + y) ** k; return p + 100 / (1 + y) ** n; }

defineLessons({
  '5-1': {
    goals: [
      '說出股票報酬的來源與風險',
      '說明配息為什麼不會讓總資產變多',
      '分辨個股風險與市場風險',

    analogy: {
      text: ['買[[股票]]就是成為一家公司的小股東。公司賺錢，你分到[[股利]]，公司長大，你持有的那一小塊也跟著變值錢；公司虧損甚至倒閉，你的那一塊也會縮水或歸零。', '股票的長期報酬高於債券與現金，是因為股東排在最後：員工、供應商、債權人都先拿走他們的份，剩下的才是股東的。承擔「最後一個拿」的風險，換來「拿走全部剩餘」的權利。'],
      limit: ['小股東沒辦法決定公司怎麼經營；股價也不只反映公司的實際表現，還反映市場情緒（0-1 的評價變化）。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 270" role="img" aria-label="公司營收的分配順序：先付員工薪資與供應商成本，再付債權人利息，再繳稅，剩下的盈餘屬於股東，可以發放股利或保留再投資">
        ${[['營收', 520, 'm7'], ['− 薪資、原料、營運成本', 420, 'm5'], ['− 利息（債權人先拿）', 340, 'm1'], ['− 稅', 290, 'm0'], ['＝ 盈餘（屬於股東）', 240, 'm2']].map(([t, w, c], i) => `<rect x="20" y="${14 + i * 50}" width="${w}" height="42" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="34" y="${41 + i * 50}" font-size="14" font-weight="900" class="on-color">${t}</text>`).join('')}
        <text x="270" y="258" font-size="13" font-weight="900">→ 發股利，或保留下來再投資</text>
      </svg>`,
      caption: '股東是「剩餘請求權人」：好年冬分到最多，壞年冬最先被犧牲。',
    },
    define: [
      { term: '股票', en: 'stock', def: '公司所有權的一部分。', example: '1 張 ＝ 1,000 股。' },
      { term: '股利', en: 'dividend', def: '分給股東的獲利。', example: '每股 2 元。' },
      { term: '除權息', en: 'ex-dividend', def: '配息時股價扣掉股利。', example: '100 → 97。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'dividend', text: '配息不是「多出來的錢」' },
        '很多人偏好高股息，覺得每年有現金入帳比較安心。但配息時，股價會在除息日扣掉同樣的金額：股價 100 元、配 3 元，除息後的參考價就是 97 元，你的總資產（股票 97 ＋ 現金 3）沒有變。真正讓總資產增加的，是公司後續賺到的錢，而不是配息這個動作本身。',
        { type: 'widget', name: 'knobs', props: { title: '配息與總報酬（實際計算，不含稅與二代健保，第四部再算）', sliders: [
          { id: 'price', label: '除息前股價', min: 10, max: 1000, step: 1, value: 100, unit: '元' },
          { id: 'div', label: '每股股利', min: 0, max: 50, step: 0.5, value: 3, unit: '元' },
          { id: 'shares', label: '持有股數', min: 1000, max: 100000, step: 1000, value: 10000, unit: '股' },
          { id: 'fill', label: '之後一年股價變化（相對除息參考價）', min: -40, max: 40, step: 1, value: 0, unit: '%' },
        ], compute: (v) => {
          const before = v.price * v.shares;
          const ref = v.price - v.div;
          const after = ref * (1 + v.fill / 100) * v.shares + v.div * v.shares;
          return { rows: [
            { label: '除息前總資產', value: `${before.toLocaleString()} 元`, ratio: 1 },
            { label: '除息當下：股票＋現金', value: `${(ref * v.shares).toLocaleString()} ＋ ${(v.div * v.shares).toLocaleString()} 元`, ratio: 1 },
            { label: '一年後總資產', value: `${Math.round(after).toLocaleString()} 元`, ratio: Math.min(1, after / (before * 1.5)) },
            { label: '總報酬', value: `${(((after / before) - 1) * 100).toFixed(1)}%`, ratio: Math.min(1, Math.abs(after / before - 1)) },
          ], note: '股價沒有「填息」（之後變化 0%）時，總報酬是 0%：配息只是把一部分股票價值換成現金。判斷投資好壞要看總報酬（價格變化＋股利），不是殖利率。' };
        } } },
        { type: 'heading', id: 'single', text: '單一股票 vs 整個市場' },
        { type: 'table', head: ['', '單一股票', '整個市場（指數）'], rows: [
          ['報酬來源', '這家公司的成敗', '所有上市公司的總和'],

          ['長期結果分布', '很不平均：少數公司貢獻大部分漲幅', '接近市場平均'],

        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="個股報酬分布的示意：很多股票報酬普通或虧損，少數股票報酬極高，把平均拉高；所以平均報酬高於多數個股的報酬">

          <text x="490" y="212" text-anchor="middle" font-size="12">報酬極高的少數</text>
        </svg>`, caption: '示意圖。右尾的少數贏家把平均拉高，所以「中位數的個股」常常低於市場平均。持有整個市場，才能確保持有那些少數贏家。' },
        { type: 'heading', id: 'metrics', text: '深入：三個最常見的股票數字' },
        { type: 'table', head: ['數字', '算法', '意思', '限制'], rows: [
          ['市值', '股價 × 總股數', '市場對整家公司的定價', '不代表公司「值」多少'],
          ['本益比', '股價 ÷ 每股盈餘', '每賺 1 元，市場願意付幾元', '盈餘可能是一時的高或低'],
          ['股利殖利率', '每股股利 ÷ 股價', '用現在價格買進的現金回報率', '高殖利率可能是因為股價大跌'],
        ], caption: '這些數字的完整用法（財報、估值）在第五部；用指數化投資的人，只要知道它們的意思就夠了。' },
        { type: 'heading', id: 'small-amounts', text: '深入：小額投資股票的方式' },
        '台股一張是 1,000 股，價格高的股票或 ETF 一張要數十萬元。小額投資常見的方式有兩種：零股交易（以股為單位買賣），以及券商提供的定期定額（每月固定金額自動買進）。兩者都讓小額投資人能夠持有分散的 ETF；要注意的是每筆的最低手續費，金額太小時手續費的比例可能偏高。細節與成本比較在第四部。',
      ],
    },
    mistakes: [
      { wrong: '以為高股息就是高報酬。', why: '配息時股價會扣掉股利。', right: '看總報酬：價格變化＋股利。' },
      { wrong: '用「公司很有名」選股。', why: '好公司不等於好投資，價格可能早已反映。', right: '不想研究就持有整個市場。' },
      { wrong: '集中持有少數個股。', why: '個股可能歸零，報酬分布很不平均。', right: '用指數分散，確保持有少數贏家。' },
    ],
    keypoints: [
      '股東最後拿、拿全部剩餘，所以長期報酬較高。',
      '配息本身不增加總資產，要看總報酬。',
      '市場漲幅集中在少數公司，持有整體最穩。',
    ],
    sources: ['ubs-2026', 'tw50-2025'],
  },

  '5-2': {
    goals: [
      '說明債券價格與殖利率為什麼反向',
      '用存續期間估算利率變動的影響',
      '說出債券在組合裡的角色',
    ],
    analogy: {
      text: ['你手上有一張每年付 2% 利息的借據。如果市場上新的借據變成付 3%，還有誰願意用原價買你那張只付 2% 的？只有打折賣才賣得掉。這就是[[債券]]價格和[[殖利率]]反向變動的原因。', '借據離到期越久，被「低利息」綁住的時間越長，打折就要打得越多。衡量這個敏感度的數字叫[[存續期間]]。'],
      limit: ['借據的比喻假設借方一定會還錢；真實的債券還有[[信用風險]]：公司可能違約，這時價格會大跌，而且不一定和利率有關。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 260" role="img" aria-label="債券價格與殖利率的蹺蹺板：殖利率上升時價格下跌，殖利率下降時價格上漲；10 年期、票面 2% 的債券，殖利率升到 3% 價格約 91.5，降到 1% 價格約 109.5">
        <polygon points="280,200 260,240 300,240" class="fill-surface stroke-ink" stroke-width="3"/>
        <line x1="80" y1="150" x2="480" y2="230" class="stroke-ink" stroke-width="6"/>
        <rect x="70" y="100" width="130" height="50" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="135" y="131" text-anchor="middle" font-size="14" font-weight="900" class="on-color">殖利率 ↑ 3%</text>
        <rect x="380" y="180" width="140" height="50" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/><text x="450" y="211" text-anchor="middle" font-size="14" font-weight="900" class="on-color">價格 ↓ 約 91.5</text>
        <text x="280" y="40" text-anchor="middle" font-size="14" font-weight="900">10 年期、票面利率 2%、面額 100</text>
        <text x="280" y="66" text-anchor="middle" font-size="13">殖利率降到 1%：價格約 109.5</text>
      </svg>`,
      caption: '價格 ＝ 未來每一筆利息與本金的現值（1-2）。用來折現的利率（殖利率）越高，現值越低。',
    },
    define: [
      { term: '殖利率', en: 'yield', def: '持有到期的年化報酬。', example: '和價格反向。' },
      { term: '存續期間', en: 'duration', def: '價格對利率的敏感度。', example: '9 年。' },
      { term: '信用風險', en: 'credit risk', def: '借方違約的風險。', example: '公司債較高。' },
    ],
    examples: {
      blocks: [
        { type: 'widget', name: 'knobs', props: { title: '債券價格計算器（每年付息、面額 100，實際計算）', sliders: [
          { id: 'coupon', label: '票面利率', min: 0, max: 10, step: 0.25, value: 2, unit: '%' },
          { id: 'years', label: '剩餘年數', min: 1, max: 30, step: 1, value: 10, unit: '年' },
          { id: 'y0', label: '原本的殖利率', min: 0.25, max: 10, step: 0.25, value: 2, unit: '%' },
          { id: 'y1', label: '變動後的殖利率', min: 0.25, max: 10, step: 0.25, value: 3, unit: '%' },
        ], compute: (v) => {
          const p0 = bondPrice(v.coupon, v.y0 / 100, v.years);
          const p1 = bondPrice(v.coupon, v.y1 / 100, v.years);
          let mac = 0; for (let k = 1; k <= v.years; k += 1) mac += (k * v.coupon) / (1 + v.y0 / 100) ** k;
          mac = (mac + (v.years * 100) / (1 + v.y0 / 100) ** v.years) / p0;
          const mod = mac / (1 + v.y0 / 100);
          return { rows: [
            { label: '原本價格', value: p0.toFixed(2), ratio: Math.min(1, p0 / 150) },
            { label: '變動後價格', value: p1.toFixed(2), ratio: Math.min(1, p1 / 150) },
            { label: '價格變化', value: `${(((p1 / p0) - 1) * 100).toFixed(2)}%`, ratio: Math.min(1, Math.abs(p1 / p0 - 1) * 4) },
            { label: '修正存續期間（估算用）', value: `${mod.toFixed(2)} 年`, ratio: Math.min(1, mod / 25) },
          ], note: '預設：10 年期、2% 票面，殖利率從 2% 升到 3%，價格約從 100 跌到 91.5，約 −8.5%；存續期間約 9 年，用「−9 × 1%」估算也很接近。把剩餘年數改成 2 年，同樣的升息只跌約 2%。' };
        } } },
        { type: 'heading', id: 'role', text: '債券在組合裡的角色' },
        { type: 'table', head: ['角色', '說明', '要注意'], rows: [
          ['降低波動', '高品質債券的波動通常遠小於股票', '利率大幅上升時，長天期債券也會大跌'],
          ['危機時的緩衝', '股市大跌時，高品質公債常持平或上漲', '不是每一次都成立（例如高通膨時期）'],
          ['再平衡的彈藥', '股票大跌時，可以賣債券買股票（第四部）', '需要事先決定規則'],
          ['穩定的現金流', '定期利息，適合接近退休的人', '高收益債的利息高，是因為信用風險高'],
        ], caption: '台灣 10 年期公債殖利率在 2026 年 7 月底升到約 1.8% 多，是三年來的高點；殖利率水準會影響債券未來的預期報酬。' },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="債券的兩個風險軸：橫軸是期限，越長對利率越敏感；縱軸是信用品質，越低違約風險越高；短天期高品質公債最穩，長天期低品質債券波動最大">
          <line x1="60" y1="200" x2="530" y2="200" class="stroke-ink" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="200" class="stroke-ink" stroke-width="2"/>
          <text x="295" y="224" text-anchor="middle" font-size="13" font-weight="900">期限：短 → 長（利率風險）</text>
          <text x="36" y="60" text-anchor="middle" font-size="12" font-weight="900">信用</text><text x="36" y="76" text-anchor="middle" font-size="12" font-weight="900">低</text>
          <text x="36" y="170" text-anchor="middle" font-size="12" font-weight="900">信用</text><text x="36" y="186" text-anchor="middle" font-size="12" font-weight="900">高</text>
          <circle cx="110" cy="175" r="14" style="fill:var(--m2)" class="stroke-ink" stroke-width="3"/><text x="130" y="168" font-size="13" font-weight="900">短天期公債：最穩</text>
          <circle cx="460" cy="175" r="14" style="fill:var(--m3)" class="stroke-ink" stroke-width="3"/><text x="440" y="150" text-anchor="end" font-size="13" font-weight="900">長天期公債：對利率敏感</text>
          <circle cx="460" cy="50" r="14" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="440" y="55" text-anchor="end" font-size="13" font-weight="900">長天期高收益債：波動最大</text>
        </svg>`, caption: '想用債券「降低組合的波動」，通常選高品質、期限適中的債券；追求高利息的高收益債，行為更像股票。' },
        { type: 'heading', id: 'curve', text: '深入：殖利率曲線與再投資風險' },
        '把不同期限的公債殖利率連成一條線，就是殖利率曲線。通常期限越長、殖利率越高，因為借越久，要補償的不確定性越多；偶爾會出現短期殖利率高於長期的「倒掛」，市場常把它當作景氣可能放緩的訊號（第五部）。',
        { type: 'table', head: ['風險', '是什麼', '誰比較怕'], rows: [
          ['利率風險', '利率上升，手上債券的價格下跌', '持有長天期債券、可能提前賣出的人'],
