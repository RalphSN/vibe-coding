<script>
/* ==========================================================================
   模組 0：起點：投資是什麼
   ========================================================================== */
defineTerms({
  '投資': { en: 'investing', def: '把錢交給會產生價值的東西（企業、借款人、房地產），換取它們未來產生的現金流與成長。', example: '買進指數基金，分享上市公司的獲利。', lesson: '0-1' },
  '投機': { en: 'speculation', def: '主要靠「之後有人用更高價格買走」獲利，而不是靠資產本身產生的現金流。', example: '短線追漲殺跌、炒作題材。', lesson: '0-1' },
  '報酬': { en: 'return', def: '一段期間內，投資的價值變化加上收到的現金（股利、利息），除以原本投入的金額。', example: '100 元漲到 105 元、配息 2 元 → 報酬 7%。', lesson: '0-1' },
  '風險溢酬': { en: 'risk premium', def: '承擔風險的資產，長期平均報酬高於無風險資產的部分；是投資人承擔波動的補償。', example: '股票長期報酬高於定存。', lesson: '3-2' },
  '指數化投資': { en: 'index investing', def: '用低成本的方式持有整個市場（例如追蹤指數的 ETF），拿到市場平均報酬，而不嘗試挑出贏家。', example: '持有追蹤台灣 50 或全球股市的 ETF。', lesson: '6-2' },
});

defineLessons({
  '0-1': {
    goals: [
      '分辨儲蓄、投資與投機',
      '說出投資報酬的三個來源',
      '知道這一卷在理財系列裡的位置',
    ],
    analogy: {
      text: ['把錢放在床底下，是保管；放在銀行，是借給銀行賺一點利息（儲蓄）；買下一間麵包店的一部分股份，是分享它未來每天賣出的麵包（[[投資]]）。', '如果你買下麵包店股份，只是因為聽說明天有人會用兩倍價格買走，而不在乎它賣多少麵包，那就比較接近[[投機]]。兩者都可能賺錢，但賺錢的原因完全不同。'],
      limit: ['真實市場裡投資與投機的界線不一定清楚：同一檔股票，有人是長期持有分享獲利，有人是短線交易。差別在你「為什麼買、打算怎麼持有」。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 280" role="img" aria-label="股票投資報酬的三個來源：企業獲利成長、股利、以及市場願意付的價格倍數改變；前兩者來自企業本身，第三者來自市場情緒">
        ${[['獲利成長', '企業賺的錢變多', 'm2', 170], ['股利', '企業把獲利分給股東', 'm3', 120], ['評價變化', '市場願意付的倍數改變', 'm4', 80]].map(([a, b, c, h], i) => `<rect x="${40 + i * 170}" y="${230 - h}" width="140" height="${h}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${110 + i * 170}" y="${230 - h + 30}" text-anchor="middle" font-size="16" font-weight="900" class="on-color">${a}</text><text x="${110 + i * 170}" y="${230 - h + 54}" text-anchor="middle" font-size="12" class="on-color">${b}</text>`).join('')}
        <text x="195" y="256" text-anchor="middle" font-size="13" font-weight="900">長期主要來自這兩項</text>
        <text x="450" y="256" text-anchor="middle" font-size="13" font-weight="900">短期主要來自這項</text>
      </svg>`,
      caption: '高度是示意。短期的股價漲跌大多是評價變化（市場情緒）；拉長到十年、二十年，企業本身的獲利與股利才是主角。',
    },
    define: [
      { term: '投資', en: 'investing', def: '分享資產產生的價值。', example: '持有企業股份。' },
      { term: '投機', en: 'speculation', def: '靠價差、而非資產產生的價值。', example: '追題材。' },
      { term: '報酬', en: 'return', def: '價值變化加現金收入。', example: '7%。' },
    ],
    examples: {
      blocks: [
        { type: 'heading', id: 'three', text: '儲蓄、投資、投機' },
        { type: 'table', head: ['', '儲蓄', '投資', '投機'], rows: [
          ['錢交給誰', '銀行', '企業、借款人、資產', '下一個買家'],
          ['報酬從哪裡來', '利息', '獲利、股利、利息、租金', '價差'],
          ['主要風險', '通膨侵蝕購買力', '價格波動、企業經營', '價格可能沒有支撐'],
          ['時間的角色', '時間越長越被通膨吃', '時間讓價值累積', '時間不一定有幫助'],
          ['在這個系列', '第一部（預備金）', '這一卷、第四部', '第六部（心理）'],
        ] },
        { type: 'heading', id: 'sources', text: '投資報酬的三個來源' },
        '一檔股票的長期報酬，可以拆成三塊：企業獲利的成長、發給股東的股利，以及市場願意為每一元獲利付多少價格（本益比）的變化。前兩者來自企業真的創造了價值；第三者來自市場情緒與利率環境，會來回擺盪，長期大致相互抵銷。',
        { type: 'widget', name: 'knobs', props: { title: '拆開股票的長期報酬（實際計算）', sliders: [
          { id: 'g', label: '企業獲利每年成長', min: -5, max: 15, step: 0.5, value: 5, unit: '%' },
          { id: 'd', label: '股利殖利率', min: 0, max: 8, step: 0.25, value: 2.5, unit: '%' },
          { id: 'pe0', label: '買進時的本益比', min: 5, max: 50, step: 1, value: 18, unit: '倍' },
          { id: 'pe1', label: '賣出時的本益比', min: 5, max: 50, step: 1, value: 18, unit: '倍' },
          { id: 'years', label: '持有年數', min: 1, max: 40, step: 1, value: 10, unit: '年' },
        ], compute: (v) => {
          const val = ((v.pe1 / v.pe0) ** (1 / v.years) - 1) * 100;
          const total = ((1 + v.g / 100) * (1 + v.d / 100) * (1 + val / 100) - 1) * 100;
          return { rows: [
            { label: '獲利成長的貢獻', value: `${v.g.toFixed(1)}%／年`, ratio: Math.min(1, Math.abs(v.g) / 15) },
            { label: '股利的貢獻', value: `${v.d.toFixed(2)}%／年`, ratio: Math.min(1, v.d / 15) },
            { label: '評價變化的貢獻', value: `${val.toFixed(2)}%／年`, ratio: Math.min(1, Math.abs(val) / 15) },
            { label: '年化總報酬（約）', value: `${total.toFixed(2)}%`, ratio: Math.min(1, Math.abs(total) / 20) },
          ], note: '把持有年數設成 1 年、本益比從 18 降到 14：評價變化一年就是 −22%，獲利再好都救不了。拉到 20 年，同樣的本益比變化每年只有約 −1.2%。時間讓報酬回到企業本身。' };
        } } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 230" role="img" aria-label="理財系列六卷的順序：第一部個人財務與第二部風險保障是地基，這一卷第三部投資核心講觀念，第四部配置與稅費講怎麼做，第五部財報與估值是選個股才需要，第六部投資心理貫穿全部">
          ${[['第一部', '地基', 'm0'], ['第二部', '保障', 'm1'], ['第三部', '觀念（這卷）', 'm2'], ['第四部', '配置、稅費', 'm3'], ['第五部', '選個股才需要', 'm5']].map(([a, b, c], i) => `<rect x="${12 + i * 110}" y="${150 - i * 26}" width="100" height="${60 + i * 26}" style="fill:var(--${c})" class="stroke-ink" stroke-width="3"/><text x="${62 + i * 110}" y="${176 - i * 26}" text-anchor="middle" font-size="14" font-weight="900" class="on-color">${a}</text><text x="${62 + i * 110}" y="${198 - i * 26}" text-anchor="middle" font-size="11" class="on-color">${b}</text>`).join('')}
          <rect x="12" y="20" width="540" height="30" style="fill:var(--m4)" class="stroke-ink" stroke-width="3"/><text x="282" y="41" text-anchor="middle" font-size="13" font-weight="900" class="on-color">第六部 投資心理：每一層都會遇到</text>
        </svg>`, caption: '開始投資之前，第一部的預備金與高利債、第二部的基本保障最好已經處理好（7-1 會再檢查一次）。' },
        { type: 'callout', variant: 'tip', title: '這一卷不做的事', body: ['不推薦任何個股、基金或 ETF；提到的指數與 ETF 只是用來說明原理。', '歷史報酬不代表未來；所有試算都是假設情境，用來理解機制，不是預測。'] },
        { type: 'heading', id: 'positive-sum', text: '深入：投資為什麼是正和遊戲' },
        '短線交易很接近零和：你賺的價差，就是另一個人少賺或賠掉的；扣掉手續費與稅，整體甚至是負和。長期持有企業則不同：企業用資本雇人、生產、賣出商品，創造出原本不存在的利潤，股東分到的是這份新創造的價值。所以長期投資整體是正和的，投機整體是零和或負和的。',
        { type: 'table', head: ['', '長期持有整個市場', '短線交易'], rows: [
          ['報酬從哪裡來', '企業創造的利潤', '其他交易者的損失'],
          ['整體而言', '正和', '零和（扣成本後為負和）'],
          ['需要贏過誰', '不需要贏過任何人', '要贏過對手，包括專業機構'],
          ['時間的角色', '時間讓利潤累積', '時間不一定有幫助'],
        ] },
        { type: 'heading', id: 'warning', text: '深入：三個投機的訊號' },
        { type: 'list', items: [
          '**說不出報酬從哪裡來**：只知道「會漲」，不知道是獲利成長、利息還是租金。',
          '**持有期間取決於價格**：「漲到某個價位就賣」，而不是「需要用錢時才賣」。',
          '**資訊來自「明牌」或社群熱度**：買的理由是別人在買。',
        ] },
        '出現這些訊號不代表一定會虧，但代表你在做的是投機，風險與報酬的邏輯和這一卷講的不同（第六部會談背後的心理）。',
      ],
    },
    mistakes: [
      { wrong: '把投資當成猜明天漲跌。', why: '短期漲跌主要來自情緒，很難預測。', right: '把重點放在長期的獲利與股利。' },
      { wrong: '覺得儲蓄就夠了。', why: '長期下來利息常追不上通膨（2-1）。', right: '預備金以外、長期不用的錢，才拿去投資。' },
      { wrong: '還沒有預備金、還有卡債就開始投資。', why: '一有意外就被迫在低點賣出。', right: '先完成第一、二部的地基。' },
    ],
    keypoints: [
      '儲蓄借錢給銀行，投資分享資產創造的價值。',
      '長期報酬 ≈ 獲利成長 ＋ 股利 ＋ 評價變化。',
      '時間越長，評價變化的影響越小。',
    ],
    sources: ['ubs-2026', 'fsc-moneywise'],
  },
});
</script>
