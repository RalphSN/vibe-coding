<script>
/* ==========================================================================
   模組 3：比較與轉型
   ========================================================================== */
defineTerms({
  '型別轉換': { en: 'type coercion', def: '運算時，JavaScript 自動把一個型別的值轉成另一個型別。', example: '`"5" * "2"` 先把兩個字串轉成數字，得到 10。' },
  '寬鬆相等': { en: 'loose equality', def: '`==`：型別不同時先依規則轉型，再比較。', example: '`0 == ""` 是 true。' },
  '嚴格相等': { en: 'strict equality', def: '`===`：不轉型，型別和值都相同才是 true。', example: '`0 === ""` 是 false。' },
  'NaN': { en: 'Not a Number', def: '無效的數字計算結果，例如把 "abc" 轉成數字。它是唯一不等於自己的值。', example: '`NaN === NaN` 是 false，要用 `Number.isNaN`。' },
  'truthy': { en: 'truthy', def: '放在 if、||、&& 這類需要真假的地方時，會被當成 true 的值。', example: '`"0"`、`[]`、`{}` 都是 truthy。' },
  'falsy': { en: 'falsy', def: '會被當成 false 的值，只有八個：false、0、-0、0n、""、null、undefined、NaN。', example: '`if (0)` 不會進去。' },
  '空值合併': { en: 'nullish coalescing', def: '`??`：左邊是 null 或 undefined 才用右邊。', example: '`0 ?? 50` 是 0。' },
  '可選串連': { en: 'optional chaining', def: '`?.`：左邊是 null 或 undefined 時直接得到 undefined，不拋錯。', example: '`user.profile?.name`。' },
  '短路求值': { en: 'short-circuit evaluation', def: '`||`、`&&`、`??` 一旦能決定結果就停止，並回傳最後看到的那個值，而不一定是 true／false。', example: '`0 || "x"` 回傳 "x"；`1 && 2 && 3` 回傳 3。' },
});

const COERCE_EQUALITY = [
  { expr: "1 == '1'", steps: ['左邊是 number，右邊是 string：**把字串轉成數字**。', "`Number('1')` 是 `1`。", '變成 `1 == 1`。'], result: 'true' },
  { expr: "0 == ''", steps: ['number 遇到 string：把字串轉成數字。', "`Number('')` 是 `0`（空字串轉成 0）。", '變成 `0 == 0`。'], result: 'true' },
  { expr: "'' == '0'", steps: ['兩邊**都是字串**：不轉型，直接比內容。', "空字串和 `'0'` 內容不同。"], result: 'false' },
  { expr: 'null == 0', steps: ['`null` 在 `==` 下有特別規則：**只等於 null 和 undefined**。', '不會被轉成數字 0。'], result: 'false' },
  { expr: 'null == undefined', steps: ['特別規則：null 與 undefined 在 `==` 下互相相等。'], result: 'true' },
  { expr: 'NaN == NaN', steps: ['NaN 不等於任何值，**包括自己**。', '判斷 NaN 要用 `Number.isNaN(x)` 或 `Object.is(x, NaN)`。'], result: 'false' },
  { expr: '[] == false', steps: ['有一邊是 boolean：先把 `false` 轉成數字 `0`，變成 `[] == 0`。', '物件遇到數字：把 `[]` 轉成原始值，得到空字串 `\'\'`，變成 `\'\' == 0`。', '字串遇到數字：`Number(\'\')` 是 0，變成 `0 == 0`。'], result: 'true' },
];

const COERCE_PLUS = [
  { expr: "'5' + 2", steps: ['`+` 只要有一邊是**字串**，就變成字串相接。', '`2` 轉成 `\'2\'`，相接得到 `\'52\'`。'], result: "'52'" },
  { expr: "'5' * '2'", steps: ['`*`、`-`、`/` 一律把兩邊**轉成數字**。', '`5 * 2`。'], result: '10' },
  { expr: "5 + 2 + '3'", steps: ['由左往右：先算 `5 + 2`，兩邊都是數字，得到 `7`。', '再算 `7 + \'3\'`，有字串，相接得到 `\'73\'`。'], result: "'73'" },
  { expr: "'3' + 5 + 2", steps: ['由左往右：`\'3\' + 5` 有字串，得到 `\'35\'`。', '`\'35\' + 2` 還是字串相接，得到 `\'352\'`。'], result: "'352'" },
  { expr: "'10' - 3", steps: ['`-` 把兩邊轉成數字：`10 - 3`。'], result: '7' },
  { expr: 'true + 1', steps: ['`true` 轉成數字是 `1`。', '`1 + 1`。'], result: '2' },
  { expr: "'3' * 'a'", steps: ['`Number(\'a\')` 是 `NaN`。', '任何數字和 NaN 運算，結果都是 NaN。'], result: 'NaN' },
];

defineLessons({
  '3-1': {
    goals: [
      '說出 `==` 與 `===` 的差別',

    analogy: {
      text: ['手搖飲店點餐：隨和的店員聽到「大冰奶」「冰奶茶大杯」「L 的冰奶」都會先在腦中翻成同一個品項再比對（`==`）；收銀機掃的是條碼，一個字元都不能差（`===`）。隨和很方便，但偶爾會翻錯：有人說「去冰」，她聽成「微冰」，覺得差不多就做成同一杯。'],
      limit: ['店員的翻譯靠經驗、因人而異；JavaScript 的轉型規則是寫死在規格裡的，完全可以預測，只是規則多到沒人想背。這也是實務上直接用 `===` 的原因：不是 `==` 不可預測，而是預測它的成本太高。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 300" role="img" aria-label="比較流程：用三個等號時，型別不同直接是 false；用兩個等號時，型別不同要先轉型：數字遇到字串把字串轉成數字，遇到布林把布林轉成數字，null 和 undefined 只等於彼此">

        <text x="135" y="140" text-anchor="middle" font-size="17" class="on-color">直接 false</text>
        <text x="135" y="200" text-anchor="middle" font-size="17" class="on-color">型別相同？</text>
        <text x="135" y="230" text-anchor="middle" font-size="17" class="on-color">比較值</text>
        <rect x="290" y="10" width="260" height="280" style="fill:var(--neutral)" class="stroke-ink" stroke-width="4"/>
        <text x="420" y="50" text-anchor="middle" font-size="24" font-weight="900" class="mono on-color">==</text>
        <text x="310" y="100" font-size="16" class="on-color">數字 vs 字串</text>
        <text x="310" y="124" font-size="16" class="on-color">→ 字串轉數字</text>
        <text x="310" y="164" font-size="16" class="on-color">有布林</text>
        <text x="310" y="188" font-size="16" class="on-color">→ 布林轉數字</text>
        <text x="310" y="228" font-size="16" class="on-color">null、undefined</text>
        <text x="310" y="252" font-size="16" class="on-color">→ 只等於彼此</text>
      </svg>`,
      caption: '`===` 只有一條規則；`==` 有一串規則，而且還有例外。',
      blocks: [
        '[[嚴格相等]] `===` 不做任何[[型別轉換]]；[[寬鬆相等]] `==` 會在型別不同時先轉型。另外 [[NaN]] 是唯一不等於自己的值，`===` 也判斷不了它；用 `Number.isNaN(x)`。`Object.is` 和 `===` 幾乎一樣，只差兩點：`Object.is(NaN, NaN)` 是 true、`Object.is(0, -0)` 是 false。',
        { type: 'widget', name: 'coerce', props: { presets: COERCE_EQUALITY } },
      ],
    },
    define: [
      { term: '嚴格相等', en: 'strict equality', def: '`===` 與 `!==`，不轉型。', example: '`1 === "1"` 是 false。' },
      { term: '寬鬆相等', en: 'loose equality', def: '`==` 與 `!=`，型別不同時先轉型。', example: '`1 == "1"` 是 true。' },
      { term: 'Number.isNaN', en: 'Number.isNaN', def: '只在值真的是 NaN 時回傳 true。', example: "`Number.isNaN('abc')` 是 false；舊的 `isNaN('abc')` 會先轉型而得到 true。" },
    ],
    examples: {
      compare: [{
        title: '檢查使用者有沒有輸入數量',
        kind: '== vs ===',
        code: true,
        badLabel: '用 ==',
        goodLabel: '用 ===',
        bad: "const qty = input.value; // 使用者沒填：''\nif (qty {{1:==}} 0) {\n  alert('數量不能是 0');\n}",
        good: "const qty = input.value;\nif (qty === '') alert('請輸入數量');\nelse if (Number(qty) {{1:===}} 0) alert('數量不能是 0');",

        why: ['`\'\' == 0` 是 true：空字串會被轉成 0'],
      }],
      blocks: [
        { type: 'widget', name: 'runner', props: {
          code: "console.log(1 == '1', 1 === '1');\nconsole.log(0 == '', 0 === '');\nconsole.log(NaN === NaN, Number.isNaN(NaN));\nconsole.log(Number.isNaN('abc'), isNaN('abc'));",
        } },
        { type: 'svg', svg: `<svg viewBox="0 0 560 220" role="img" aria-label="實務規則：比較一律用三個等號；唯一常見例外是 x 雙等號 null，它剛好等於 x 是 null 或 undefined；判斷 NaN 用 Number.isNaN">
          <rect x="10" y="10" width="170" height="200" style="fill:var(--m3)" class="stroke-ink" stroke-width="4"/>
          <text x="95" y="56" text-anchor="middle" font-size="22" font-weight="900" class="mono on-color">===</text>
          <text x="95" y="110" text-anchor="middle" font-size="16" class="on-color">一律用這個</text>
          <rect x="195" y="10" width="170" height="200" style="fill:var(--m0)" class="stroke-ink" stroke-width="4"/>
          <text x="280" y="56" text-anchor="middle" font-size="20" font-weight="900" class="mono on-color">x == null</text>
          <text x="280" y="110" text-anchor="middle" font-size="16" class="on-color">唯一常見例外</text>
          <text x="280" y="140" text-anchor="middle" font-size="16" class="on-color">null 或 undefined</text>
          <rect x="380" y="10" width="170" height="200" style="fill:var(--m2)" class="stroke-ink" stroke-width="4"/>
          <text x="465" y="56" text-anchor="middle" font-size="18" font-weight="900" class="mono on-color">Number.isNaN</text>
          <text x="465" y="110" text-anchor="middle" font-size="16" class="on-color">判斷 NaN</text>
        </svg>`, caption: '三條實務規則。很多團隊用 lint 規則（例如 ESLint 的 eqeqeq）強制只用 `===`。' },
        { type: 'heading', id: 'deep-equality', text: '深入：規格裡其實有四種「相等」' },
        'ECMAScript 規格定義了四種比較演算法，不同的 API 各用一種。最容易踩到的是 `includes` 和 `indexOf`：兩個看起來都在「找有沒有」，對 NaN 的答案卻相反。',
        { type: 'table', head: ['演算法', '誰在用', 'NaN 等於 NaN？', '0 等於 -0？'], rows: [
          ['IsStrictlyEqual', '`===`、`indexOf`、`switch`', '否', '是'],
          ['IsLooselyEqual', '`==`', '否', '是'],
          ['SameValue', '`Object.is`、React 判斷 state 有沒有變', '是', '否'],
          ['SameValueZero', '`includes`、Map 與 Set 的鍵', '是', '是'],
        ] },
        '物件和原始值用 `==` 比較時，物件會先被轉成原始值（先試 `valueOf`，再試 `toString`），這就是 `[] == false` 一路轉成 `0 == 0` 的原因。理解它能幫你讀懂舊程式，但不是讓你在新程式裡用 `==` 的理由。',
      ],
    },
    mistakes: [
      { wrong: '用 `x === NaN` 檢查計算失敗。', why: 'NaN 不等於任何值，這個條件永遠是 false。', right: '用 `Number.isNaN(x)`。' },
      { wrong: '用舊的 `isNaN("abc")` 判斷是不是數字。', why: '`isNaN` 會先把參數轉成數字，非數字字串都會得到 true，語意混亂。', right: '先 `Number(x)` 再 `Number.isNaN`，意圖清楚。' },
      { wrong: '覺得 `==` 比較寬容、比較方便。', why: '它的例外（例如 `null == 0` 是 false、`"" == 0` 是 true）會在你沒想到的地方出錯。', right: '一律 `===`；只有 `x == null` 這個慣用寫法例外。' },
    ],
    practice: [
      { level: '深入思考', type: 'reveal', q: ['React 判斷 state 有沒有變化，用的是 `Object.is` 而不是 `===`。舉出一個這兩者結果不同、而且對 React 有意義的例子。'], answer: [
        '`NaN`：如果 state 是 NaN、又設成 NaN，`===` 會說「不相等」（NaN !== NaN），React 就會白白重新渲染；`Object.is(NaN, NaN)` 是 true，正確地判斷「沒變」。',
        '另一個差異是 `0` 與 `-0`：`Object.is` 認為不同，`===` 認為相同；實務上很少遇到。',
      ] },
    ],
    keypoints: [
      '`===` 不轉型、型別不同就是 false；`==` 會先依一串規則轉型，實務上一律用 `===`。',
      'null 在 `==` 下只等於 null 與 undefined；`x == null` 是唯一常見的 `==` 用法。',
      'NaN 不等於自己，判斷要用 `Number.isNaN`。',

    sources: ['mdn-equality'],
  },

  '3-2': {
    goals: [
      '說出八個 falsy 值',
      '分清 `||` 與 `??` 在 0、空字串時的差別',

    ],
    analogy: {
      text: ['門口的保全有兩種：一種只要你「看起來不像客人」就攔下來，包括拿著空購物袋、口袋裡零元的人（`||` 把所有 falsy 都當成「沒有」）；另一種只攔「根本沒人」的情況（`??` 只把 null、undefined 當成「沒有」）。'],
      limit: ['保全會看情況放行，運算子不會：`||` 遇到 0 一定換成右邊，就算 0 是使用者故意設定的值。'],
    },
    model: {
      svg: `<svg viewBox="0 0 560 300" role="img" aria-label="八個 falsy 值：false、0、負 0、0n、空字串、null、undefined、NaN；其他全部是 truthy，包括字串 0、字串 false、空陣列、空物件">
        <rect x="10" y="10" width="270" height="280" style="fill:var(--danger-soft)" class="stroke-ink" stroke-width="4"/>
        <text x="145" y="46" text-anchor="middle" font-size="22" font-weight="900" class="on-color">falsy（只有 8 個）</text>
        <text x="30" y="92" font-size="18" class="mono on-color">false　0　-0</text>
        <text x="30" y="136" font-size="18" class="mono on-color">0n　''</text>
        <text x="30" y="180" font-size="18" class="mono on-color">null</text>
        <text x="30" y="224" font-size="18" class="mono on-color">undefined</text>

      blocks: [
