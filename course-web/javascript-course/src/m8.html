<script>

defineTerms({
  'DOM': { en: 'Document Object Model', def: '瀏覽器把 HTML 讀進來後建立的物件樹；JavaScript 改它，畫面就跟著變。', example: '`document.querySelector(\'h1\')` 拿到標題那個節點。' },
