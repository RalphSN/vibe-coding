const TIMER_CORE = `function createTimer({ work, rest, sets }, onChange, tickMs = 1000) {
  let phase = 'idle', set = 0, left = 0, timerId = null;
  const emit = () => onChange({ phase, set, left });
  function enter(next) {
    phase = next;
    left = next === 'work' ? work : rest;
    if (next === 'work') set++;
    emit();
  }
  function tick() {
    left--;
    if (left > 0) return emit();
    if (phase === 'work' && set === sets) { pause(); phase = 'done'; return emit(); }
    enter(phase === 'work' ? 'rest' : 'work');
  }
  function start() {
    if (timerId) return;
    if (phase === 'idle' || phase === 'done') { set = 0; enter('work'); }
    timerId = setInterval(tick, tickMs);
  }
  function pause() { clearInterval(timerId); timerId = null; }
  function reset() { pause(); phase = 'idle'; set = 0; left = 0; emit(); }
  return { start, pause, reset };
}`;

const TIMER_MAIN = `import { loadSettings, saveSettings } from './settings.js';
import { createTimer } from './timer.js';

const PHASE_LABEL = { idle: '準備', work: '練習', rest: '休息', done: '完成' };
const form = document.querySelector('#settings');
const phaseEl = document.querySelector('#phase');
const leftEl = document.querySelector('#left');

let settings = loadSettings();
let timer = makeTimer();

function makeTimer() {
  return createTimer(settings, ({ phase, set, left }) => {
    phaseEl.textContent = phase === 'idle' || phase === 'done'
      ? PHASE_LABEL[phase]
      : \`第 \${set} / \${settings.sets} 組・\${PHASE_LABEL[phase]}\`;
    leftEl.textContent = String(left);
  });
}

function fillForm() {
  for (const [key, value] of Object.entries(settings)) form.elements[key].value = value;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = Object.fromEntries(new FormData(form));
  const next = { work: Number(raw.work), rest: Number(raw.rest), sets: Number(raw.sets) };
  saveSettings(next);
  settings = loadSettings(); // 不合法就會回到預設值
  timer.reset();
  timer = makeTimer();
  fillForm();
});

document.querySelector('#controls').addEventListener('click', (e) => {
  const action = e.target.closest('[data-action]')?.dataset.action;
  if (action) timer[action]();
});

fillForm();`;
